<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Éditeur de la page</title>
  <style>
    :root{
      --bg:#f4f4f6; --panneau:#ffffff; --ligne:#e4e4e9; --txt:#17171c; --doux:#6b6b76;
      --prim:#1f6feb; --prim-txt:#fff; --ok:#1a7f37; --err:#cf222e; --r:12px;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0e0f12; --panneau:#17181d; --ligne:#2a2c33; --txt:#ececf1; --doux:#9a9aa6; --prim:#4c8dff; }
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
    button,input,select,textarea{font:inherit;color:inherit}
    .cache{display:none !important}

    /* ---------- Connexion ---------- */
    #connexion{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .boite{width:100%;max-width:360px;background:var(--panneau);border:1px solid var(--ligne);border-radius:18px;padding:28px 22px}
    .boite h1{font-size:1.3rem;margin:0 0 6px}
    .boite p{margin:0 0 20px;color:var(--doux)}
    .champ{display:block;margin-bottom:14px}
    .champ > span{display:block;font-size:.82rem;font-weight:600;color:var(--doux);margin-bottom:5px}
    input[type=text],input[type=password],input[type=url],input[type=tel],select,textarea{
      width:100%;padding:11px 12px;border:1px solid var(--ligne);border-radius:10px;background:var(--bg);outline:none;min-height:44px}
    textarea{resize:vertical;min-height:64px}
    input:focus,select:focus,textarea:focus{border-color:var(--prim);box-shadow:0 0 0 3px color-mix(in srgb,var(--prim) 22%,transparent)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;
      border:1px solid var(--ligne);background:var(--panneau);cursor:pointer;font-weight:600}
    .btn-prim{background:var(--prim);border-color:var(--prim);color:var(--prim-txt)}
    .btn-plein{width:100%}
    .btn:disabled{opacity:.55;cursor:default}
    .btn-mini{min-height:36px;padding:6px 10px;font-size:.88rem}
    .msg{font-size:.9rem;margin-top:10px;min-height:1.2em}
    .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
    .case{display:flex;align-items:center;gap:8px;margin:4px 0 16px;color:var(--doux);font-size:.9rem}

    /* ---------- Éditeur ---------- */
    #editeur{min-height:100dvh;display:flex;flex-direction:column}
    .barre{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;
      background:var(--panneau);border-bottom:1px solid var(--ligne)}
    .barre h1{font-size:1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .onglets{display:flex;background:var(--bg);border-radius:10px;padding:3px}
    .onglets button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--doux);cursor:pointer}
    .onglets button.actif{background:var(--panneau);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .corps{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
    .col-edit{padding:16px 16px 110px;max-width:640px;width:100%;margin:0 auto}
    .col-apercu{padding:0 0 90px}
    .cadre{min-height:calc(100dvh - 150px);display:flex}
    .cadre > .qp{min-height:inherit}
    .choix-apercu{display:flex;gap:4px;margin:10px auto;padding:3px;width:max-content;background:var(--bg);border:1px solid var(--ligne);border-radius:10px}
    .choix-apercu.cache{display:none}
    .choix-apercu button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:.86rem;color:var(--doux);cursor:pointer}
    .choix-apercu button.actif{background:var(--panneau);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .cadre.mode-home{height:calc(100dvh - 200px);min-height:0}
    .cadre > .qh{height:100%}
    @media (max-width:899px){
      body[data-vue=edit] .col-apercu{display:none}
      body[data-vue=apercu] .col-edit{display:none}
    }
    @media (min-width:900px){
      .onglets{display:none}
      .corps{grid-template-columns:minmax(380px,1fr) 440px}
      .col-apercu{position:sticky;top:57px;height:calc(100dvh - 57px);padding:4px 20px 20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
      .choix-apercu{margin:8px auto 12px}
      .cadre,.cadre.mode-home{width:390px;height:calc(100dvh - 190px);min-height:0;max-height:800px;border-radius:36px;overflow:auto;
        border:10px solid #111;box-shadow:0 20px 60px rgba(0,0,0,.25)}
      .cadre > .qp{min-height:100%}
    }

    .section{background:var(--panneau);border:1px solid var(--ligne);border-radius:16px;margin-bottom:14px;overflow:hidden}
    .section > summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:700;display:flex;align-items:center;gap:10px}
    .section > summary::-webkit-details-marker{display:none}
    .section > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--doux);border-bottom:2px solid var(--doux);transform:rotate(45deg);transition:transform .15s}
    .section[open] > summary::after{transform:rotate(-135deg)}
    .section-corps{padding:2px 16px 16px}
    .grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:520px){ .bouton-carte .grille2{grid-template-columns:1fr} }

    .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:16px}
    .theme{border:2px solid var(--ligne);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;background:none;text-align:left}
    .theme.actif{border-color:var(--prim)}
    .theme .ech{height:42px;display:flex;align-items:flex-end;padding:6px}
    .theme .ech i{display:block;width:100%;height:10px;border-radius:5px}
    .theme b{display:block;font-size:.8rem;padding:5px 7px}

    .couleurs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .coul{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--ligne);border-radius:10px;background:var(--bg);font-size:.85rem}
    input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer;flex-shrink:0}
    input[type=color]::-webkit-color-swatch-wrapper{padding:0}
    input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.15);border-radius:8px}

    .segments{display:flex;background:var(--bg);border:1px solid var(--ligne);border-radius:10px;padding:3px;margin-bottom:14px}
    .segments button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-weight:600;font-size:.88rem;color:var(--doux);cursor:pointer}
    .segments button.actif{background:var(--panneau);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .etiq{display:block;font-size:.82rem;font-weight:600;color:var(--doux);margin:2px 0 6px}
    .bascule{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ligne)}
    .bascule input{width:22px;height:22px}

    .image-ligne{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .vignette{width:64px;height:64px;border-radius:12px;border:1px dashed var(--ligne);background:var(--bg) center/cover no-repeat;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;color:var(--doux);font-size:.75rem}
    .vignette img{max-width:100%;max-height:100%}
    input[type=range]{width:100%}

    .bouton-carte{border:1px solid var(--ligne);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--bg)}
    .bouton-carte.masque{opacity:.55}
    .modale-fond{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
    @media (min-width:700px){.modale-fond{align-items:center}}
    .modale{width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;background:var(--panneau);color:var(--txt);
      border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
    @media (min-width:700px){.modale{border-radius:20px}}
    .modale-tete{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--ligne)}
    .modale-corps{padding:14px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
    .opt{margin-bottom:14px}
    .puces{display:flex;flex-wrap:wrap;gap:6px}
    .puce{border:1px solid var(--ligne);background:var(--bg);color:var(--txt);border-radius:999px;padding:8px 13px;font-weight:600;font-size:.86rem;cursor:pointer}
    .puce.actif{background:var(--prim);border-color:var(--prim);color:#fff}
    .alerte{background:color-mix(in srgb,#f0a020 14%,var(--bg));border:1px solid color-mix(in srgb,#f0a020 45%,var(--ligne));border-radius:12px;padding:12px;margin:6px 0 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    .fond-vign{height:110px;border-radius:12px;background:#111 center/cover no-repeat}
    .logo-scene{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ligne)}
    .damier{display:flex;align-items:center;justify-content:center;border-radius:10px;background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px}
    .damier.grand{width:min(200px,44vw);aspect-ratio:1}
    .damier img{width:90%;height:90%;object-fit:contain}
    .logo-apercu{display:block}
    .motifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin:6px 0 14px}
    .motif-v{border:2px solid var(--ligne);border-radius:12px;background:var(--bg);padding:5px;cursor:pointer;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:4px}
    .motif-v .damier{width:100%;aspect-ratio:1}
    .motif-v b{font-size:.7rem;text-align:center}
    .motif-v.actif{border-color:var(--prim)}
    .motif-plus .plus{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--prim);border:1px dashed var(--prim);border-radius:10px}
    .ia-boite{border:1px solid color-mix(in srgb,var(--prim) 35%,var(--ligne));background:color-mix(in srgb,var(--prim) 5%,var(--bg));border-radius:14px;padding:14px;margin:6px 0 18px}
    .ia-titre{display:block;font-size:1rem}
    .ia-relecture{margin-top:14px;padding-top:12px;border-top:1px dashed var(--ligne)}
    .ia-art{background:var(--panneau);border:1px solid var(--ligne);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
    .ia-art input{font-weight:700}
    .g-apercu{background:#fff;color:#202124;border:1px solid var(--ligne);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-family:Arial,sans-serif}
    .g-url{font-size:.78rem;color:#4d5156;margin-bottom:3px;word-break:break-all}
    .g-titre{font-size:1.1rem;color:#1a0dab;line-height:1.3;margin-bottom:4px}
    .g-desc{font-size:.86rem;color:#4d5156;line-height:1.45}
    .ia-seo{border-color:color-mix(in srgb,var(--ok) 40%,var(--ligne))}
    .ia-seo textarea{font-weight:400}
    .ia-compte{font-size:.75rem;color:var(--doux);text-align:right;margin-top:-4px}
    .ia-actions{display:flex;gap:8px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
    .article-carte .ac-tete{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .article-carte .ac-tete b{flex:1}
    .ajout-article{width:100%}
    .qr-bloc{display:flex;flex-direction:column;align-items:center;gap:10px}
    .qr-apercu{width:200px;height:200px;border-radius:14px;border:1px solid var(--ligne)}
    .qr-url{font-size:.82rem;color:var(--doux);word-break:break-all;text-align:center}
    .qr-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .carte-zone{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .carte-apercu{width:100%;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
    .modeles-carte{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .modele-carte{border:2px solid var(--ligne);border-radius:12px;padding:6px;background:var(--bg);cursor:pointer;color:var(--txt);display:flex;flex-direction:column;gap:6px}
    .modele-carte img{width:100%;aspect-ratio:2008/1300;object-fit:contain;border-radius:6px;display:block;background:color-mix(in srgb,var(--txt) 6%,transparent)}
    .modele-carte b{font-size:.8rem}
    .modele-carte.actif{border-color:var(--prim);background:color-mix(in srgb,var(--prim) 8%,var(--bg))}
    .dispos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
    .dispo{border:2px solid var(--ligne);border-radius:14px;background:var(--bg);padding:8px 6px 6px;cursor:pointer;color:var(--txt);
      display:flex;flex-direction:column;align-items:center;gap:6px}
    .dispo svg{width:54px;height:90px;border:1px solid var(--ligne);border-radius:8px;background:var(--panneau)}
    .dispo b{font-size:.76rem;line-height:1.2;text-align:center}
    .dispo.actif{border-color:var(--prim);background:color-mix(in srgb,var(--prim) 8%,var(--bg))}
    .afficher{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem;min-height:36px}
    .afficher input,.rs-tete input[type=checkbox]{width:20px;height:20px}
    .bloc-rs{border-style:dashed}
    .rs-titre{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .aide-inline{font-size:.8rem;color:var(--doux)}
    .rs-ligne{padding:10px 0;border-top:1px solid var(--ligne)}
    .rs-ligne.off input[type=text]{display:none}
    .rs-ligne.off .rs-ico,.rs-ligne.off b{opacity:.45}
    .rs-tete{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .rs-ligne.off .rs-tete{margin-bottom:0}
    .rs-tete .esp{flex:1}
    .rs-ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .rs-ico i{width:15px;height:15px;-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
    .bc-haut{display:flex;gap:8px;margin-bottom:10px}
    .bc-haut .ico{width:56px;text-align:center;font-size:1.2rem;padding:8px 4px}
    .bc-actions{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .bc-actions .esp{flex:1}
    .bc-coul{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--doux)}
    .aide{font-size:.78rem;color:var(--doux);margin:-8px 0 10px}
    .ajout{display:flex;gap:8px}
    .ajout select{flex:1}

    .pied-barre{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:12px;
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panneau);border-top:1px solid var(--ligne)}
    .pied-barre .etat{flex:1;font-size:.86rem;color:var(--doux);line-height:1.3}
    .pied-barre .etat.ok{color:var(--ok)} .pied-barre .etat.err{color:var(--err)}
    .pied-barre .btn-prim{min-width:130px}
    a.lien{color:var(--prim);font-weight:600;text-decoration:none}
  </style>
</head>
<body data-vue="edit">

<!-- ================= Connexion ================= -->
<div id="connexion">
  <form class="boite" id="form-connexion">
    <h1>Modifier la page</h1>
    <p>Entrez le mot de passe pour accéder à l'éditeur.</p>
    <label class="champ"><span>Mot de passe</span>
      <input type="password" id="mdp" autocomplete="current-password" required>
    </label>
    <label class="case"><input type="checkbox" id="rester"> Rester connecté sur cet appareil</label>
    <button class="btn btn-prim btn-plein" id="btn-connexion">Se connecter</button>
    <div class="msg" id="msg-connexion"></div>
  </form>
</div>

<!-- ================= Éditeur ================= -->
<div id="editeur" class="cache">
  <div class="barre">
    <h1>Éditeur</h1>
    <div class="onglets">
      <button type="button" data-vue="edit" class="actif">Modifier</button>
      <button type="button" data-vue="apercu">Aperçu</button>
    </div>
    <button type="button" class="btn btn-mini" id="btn-deconnexion">Quitter</button>
  </div>

  <div class="corps">
    <div class="col-edit" id="formulaire"></div>
    <div class="col-apercu"><div class="choix-apercu" id="choix-apercu"><button type="button" data-p="contact" class="actif">Page contact</button><button type="button" data-p="home">Page Home</button></div><div class="cadre" id="apercu"></div></div>
  </div>

  <div class="pied-barre">
    <div class="etat" id="etat">Aucune modification</div>
    <button type="button" class="btn btn-prim" id="btn-enregistrer" disabled>Enregistrer</button>
  </div>
</div>

<script src="commun.js"></script>
<script src="qrcode.js"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const CLE_STOCK = 'qp-jeton';

  let depot = depotDepuisURL();
  let gh = null;
  let cfg = null;
  let shaConfig = null;
  let modifie = false;
  let imagesLocales = {};    // chemin -> dataURL (aperçu immédiat)
  let imagesAEnvoyer = {};   // chemin -> base64
  let secrets = { github: '', anthropic: '' };
  let proposition = null;    // articles proposés par l'IA, en attente de validation
  let propositionSeo = null; // titre et description Google proposés

  /* ---------------- Connexion ---------------- */
  async function lireAuth() {
    const r = await fetch('auth.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Installation non terminée : ouvrez d\'abord setup.html.');
    const a = await r.json();
    if (a.owner && a.repo) depot = { owner: a.owner, repo: a.repo, branche: a.branche || 'main' };
    return a;
  }

  async function demarrer(jeton) {
    gh = clientGitHub(jeton, depot);
    await gh.verifier();
    const f = await gh.lire('config.json');
    shaConfig = f ? f.sha : null;
    cfg = normaliser(fusion(CONFIG_DEFAUT, f ? JSON.parse(f.texte) : {}));
    $('#connexion').classList.add('cache');
    $('#editeur').classList.remove('cache');
    construireFormulaire();
    majApercu();
  }

  $('#form-connexion').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('#msg-connexion'), btn = $('#btn-connexion');
    msg.className = 'msg'; msg.textContent = 'Vérification…'; btn.disabled = true;
    try {
      const auth = await lireAuth();
      let brut;
      try { brut = await dechiffrerJeton(auth, $('#mdp').value); }
      catch (err) { throw new Error('Mot de passe incorrect.'); }
      secrets = lireSecret(brut);
      await demarrer(secrets.github);
      try {
        sessionStorage.setItem(CLE_STOCK, brut);
        if ($('#rester').checked) localStorage.setItem(CLE_STOCK, brut);
      } catch (err) {}
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.status === 401 ? 'Accès refusé : le jeton GitHub a expiré ou a été révoqué.' : err.message;
    } finally { btn.disabled = false; }
  });

  $('#btn-deconnexion').addEventListener('click', () => {
    if (modifie && !confirm('Des modifications ne sont pas enregistrées. Se déconnecter quand même ?')) return;
    try { sessionStorage.removeItem(CLE_STOCK); localStorage.removeItem(CLE_STOCK); } catch (e) {}
    modifie = false;
    location.reload();
  });

  (async function auto() {
    let j = null;
    try { j = sessionStorage.getItem(CLE_STOCK) || localStorage.getItem(CLE_STOCK); } catch (e) {}
    if (!j) return;
    try { await lireAuth(); secrets = lireSecret(j); await demarrer(secrets.github); }
    catch (e) { try { sessionStorage.removeItem(CLE_STOCK); localStorage.removeItem(CLE_STOCK); } catch (x) {} }
  })();

  /* ---------------- Onglets mobile ---------------- */
  // Mémorise la position de défilement de chaque onglet (Modifier / Aperçu)
  const positionsVue = { edit: 0, apercu: 0 };
  document.querySelectorAll('.onglets button').forEach(b => b.addEventListener('click', () => {
    const avant = document.body.dataset.vue;
    if (avant === b.dataset.vue) return;
    positionsVue[avant] = window.scrollY;
    document.body.dataset.vue = b.dataset.vue;
    document.querySelectorAll('.onglets button').forEach(x => x.classList.toggle('actif', x === b));
    const cible = positionsVue[b.dataset.vue] || 0;
    window.scrollTo(0, cible);
    requestAnimationFrame(() => window.scrollTo(0, cible)); // après la remise en page
  }));

  /* ---------------- Aperçu ---------------- */
  let minuterie = null;
  let vueApercu = 'contact';
  function choisirApercu(v) {
    if (v === vueApercu) return;
    vueApercu = v;
    majApercu();
  }
  document.querySelectorAll('#choix-apercu button').forEach(b => b.addEventListener('click', () => choisirApercu(b.dataset.p)));

  function majApercu() {
    clearTimeout(minuterie);
    minuterie = setTimeout(() => {
      const cadre = $('#apercu');

  // Dessine le QR code sur un contexte 2D (zone carrée x, y, taille)
  function dessinerQR(ctx, texte, x, y, taille, couleur) {
    const qr = qrcode(0, 'M');
    qr.addData(texte);
    qr.make();
    const n = qr.getModuleCount();
    const m = taille / n;
    ctx.fillStyle = couleur || '#000';
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(Math.floor(x + c * m), Math.floor(y + r * m), Math.ceil(m), Math.ceil(m));
  }

  function canvasQR(taillePx) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = taillePx;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, taillePx, taillePx);
    const marge = Math.round(taillePx * 0.08);
    dessinerQR(ctx, URL_PUBLIQUE, marge, marge, taillePx - 2 * marge);
    return cv;
  }

  function telecharger(cv, nom, type, qualite) {

  }

  function chargerImage(src) {
    return new Promise((ok, ko) => {
      if (!src) return ok(null);
      const im = new Image();
      if (/^https?:/i.test(src)) im.crossOrigin = 'anonymous';
      im.onload = () => ok(im);
      im.onerror = () => ok(null);
      im.src = src;
    });
  }

  function formaterNumero(v) {
    const n = numeroInternational(v);
    if (/^33\d{9}$/.test(n)) return '+33 ' + n[2] + ' ' + n.slice(3).match(/../g).join(' ');
    return '+' + n;

  // Coordonnées à imprimer, tirées des boutons visibles
  function coordonnees() {
    const lignes = [];
    const vus = {};
    const ajout = (etiq, val) => { if (val && !vus[val]) { vus[val] = 1; lignes.push([etiq, val]); } };
    const btns = cfg.boutons.filter(b => b && !b.masque && b.type !== 'reseaux' && String(b.valeur || '').trim());

    if (tel && wa && numeroInternational(tel.valeur) === numeroInternational(wa.valeur)) ajout('Tél. / WhatsApp', formaterNumero(tel.valeur));
    else { if (tel) ajout('Tél.', formaterNumero(tel.valeur)); if (wa) ajout('WhatsApp', formaterNumero(wa.valeur)); }
    btns.filter(b => b.type === 'email').forEach(b => ajout('E-mail', b.valeur.trim()));
    const mail = cfg.reseaux.find(r => r.id === 'email' && r.actif && String(r.valeur || '').trim());
    if (mail) ajout('E-mail', String(mail.valeur).trim().replace(/^mailto:/i, ''));
    const site = cfg.reseaux.find(r => r.id === 'site' && r.actif && String(r.valeur || '').trim());
    const lienWeb = site ? site.valeur : (btns.find(b => b.type === 'lien') || {}).valeur;
    if (lienWeb) ajout('Web', String(lienWeb).trim().replace(/^https?:\/\//i, '').replace(/\/$/, ''));
    const insta = cfg.reseaux.find(r => r.id === 'instagram' && r.actif && String(r.valeur || '').trim());
    if (insta && lignes.length < 4) ajout('Instagram', '@' + String(insta.valeur).trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/\/.*$/, ''));
    return lignes.slice(0, 4);
  }

  // Ajuste la taille de police pour tenir dans une largeur
  function policeAjustee(ctx, texte, poids, tailleMax, tailleMin, largeur, famille) {
    let t = tailleMax;
    do { ctx.font = poids + ' ' + t + 'px ' + famille; t -= 4; } while (ctx.measureText(texte).width > largeur && t > tailleMin);
    return ctx.font;
  }

  function coupeLignes(ctx, texte, largeur, max) {
    const mots = String(texte).split(/\s+/), lignes = [];
    let l = '';
    mots.forEach(m => {
      const essai = l ? l + ' ' + m : m;
      if (ctx.measureText(essai).width > largeur && l) { lignes.push(l); l = m; } else l = essai;
    });
    if (l) lignes.push(l);
    if (lignes.length > max) { lignes.length = max; lignes[max - 1] = lignes[max - 1].replace(/\s*\S*$/, '') + '…'; }
    return lignes;
  }

  function rectArrondi(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function luminance(hex) {
    const rgb = hexVersRgb(hex) || [0, 0, 0];
    const [r, g, b] = rgb.map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  async function preparerCarte() {

    return {

      fam: (FONTS[d.police] || FONTS.moderne).css,
      fondImg: await chargerImage(d.imageFond ? res(d.imageFond) : ''),
      logo: await chargerImage(cfg.logo ? res(cfg.logo) : ''),
      coords: coordonnees()
    };
  }

  function couvrir(ctx, img, x, y, w, h) {
    const k = Math.max(w / img.width, h / img.height);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, x + (w - img.width * k) / 2, y + (h - img.height * k) / 2, img.width * k, img.height * k);
    ctx.restore();
  }

  function dessinerLogo(ctx, D, x, y, T) {
    const logo = D.logo; if (!logo) return 0;
    if (D.d.logoRond) {
      ctx.save(); ctx.beginPath(); ctx.arc(x + T / 2, y + T / 2, T / 2, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
      const k = Math.max(T / logo.width, T / logo.height);
      ctx.drawImage(logo, x + (T - logo.width * k) / 2, y + (T - logo.height * k) / 2, logo.width * k, logo.height * k);
      ctx.restore();
    } else {
      const k = Math.min(T / logo.width, T / logo.height);
      ctx.drawImage(logo, x + (T - logo.width * k) / 2, y + (T - logo.height * k) / 2, logo.width * k, logo.height * k);
    }
    return T;
  }

  // Bloc QR (fond blanc arrondi, légende facultative) ; renvoie la hauteur
  function dessinerBlocQR(ctx, D, x, y, taille, legende, ombre) {
    const m = Math.round(taille * 0.085);
    const h = taille + (legende ? Math.round(taille * 0.17) : 0);
    ctx.save();
    if (ombre) { ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 10; }
    ctx.fillStyle = '#ffffff'; rectArrondi(ctx, x, y, taille, h, Math.round(taille * 0.07)); ctx.fill();
    ctx.restore();
    dessinerQR(ctx, URL_PUBLIQUE, x + m, y + m, taille - 2 * m, '#111');
    if (legende) {
      ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '700 ' + Math.round(taille * 0.075) + 'px ' + D.fam;
      ctx.fillText(legende, x + taille / 2, y + h - Math.round(taille * 0.065));
      ctx.textAlign = 'left';
    }
    return h;
  }

  // Titre + sous-titre + trait + coordonnées ; align 'left' ou 'center'
  function dessinerTextes(ctx, D, x, y, largeur, c, align) {
    const cfgT = cfg, fam = D.fam;
    const ax = align === 'center' ? x + largeur / 2 : x;
    ctx.textAlign = align; ctx.textBaseline = 'top';
    if (cfgT.titre) {
      ctx.fillStyle = c.texte;
      ctx.font = policeAjustee(ctx, cfgT.titre, '800', c.titre || 124, 60, largeur, fam);
      const t = parseInt(ctx.font.match(/(\d+)px/)[1], 10);
      ctx.fillText(cfgT.titre, ax, y); y += t * 1.18;
    }
    if (cfgT.sousTitre) {
      ctx.font = '400 ' + (c.sous || 54) + 'px ' + fam; ctx.fillStyle = c.texte; ctx.globalAlpha = 0.8;
      coupeLignes(ctx, cfgT.sousTitre, largeur, 2).forEach(l => { ctx.fillText(l, ax, y); y += (c.sous || 54) * 1.26; });
      ctx.globalAlpha = 1;
    }
    y += 30;
    ctx.fillStyle = c.accent; ctx.fillRect(align === 'center' ? ax - 65 : x, y, 130, 8); y += 56;
    if (c.enLigne) {
      const ligne = D.coords.slice(0, 2).map(l => l[1]).join('   ·   ');
      ctx.font = policeAjustee(ctx, ligne, '600', 52, 34, largeur, fam);
      ctx.fillStyle = c.texte;
      ctx.fillText(ligne, ax, y);
      y += 70;
    } else {
      D.coords.forEach(([etiq, val]) => {
        ctx.font = '700 40px ' + fam; ctx.fillStyle = c.accent; ctx.fillText(etiq.toUpperCase(), ax, y);
        ctx.fillStyle = c.texte; ctx.font = policeAjustee(ctx, val, '600', 56, 34, largeur, fam);
        ctx.fillText(val, ax, y + 46); y += 128;
      });
    }
    ctx.textAlign = 'left';
    return y;
  }

  function dessinerPied(ctx, D, x, y, couleur, align) {
    if (!cfg.pied) return;
    ctx.font = '500 40px ' + D.fam; ctx.fillStyle = couleur; ctx.globalAlpha = .7;
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = align || 'left';
    ctx.fillText(String(cfg.pied).split('\n')[0], x, y);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function fondPage(ctx, D, x, y, w, h, voileMin) {
    if (D.fondImg) {
      couvrir(ctx, D.fondImg, x, y, w, h);
      ctx.fillStyle = 'rgba(0,0,0,' + Math.max(voileMin, (Number(D.d.voile) || 0) / 100) + ')';
      ctx.fillRect(x, y, w, h);
      return '#ffffff';
    }
    const g = ctx.createLinearGradient(x, y, x + w * 0.4, y + h);
    g.addColorStop(0, D.d.fond); g.addColorStop(1, D.d.fond2 || D.d.fond);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    return D.d.texte;
  }

  // Liste des coordonnées seule (étiquette + valeur)
  function dessinerCoords(ctx, D, x, y, largeur, c, align) {
    const ax = align === 'center' ? x + largeur / 2 : x;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
    D.coords.forEach(([etiq, val]) => {
      ctx.font = '700 ' + (c.etiq || 40) + 'px ' + D.fam; ctx.fillStyle = c.accent; ctx.fillText(etiq.toUpperCase(), ax, y);
      ctx.fillStyle = c.texte; ctx.font = policeAjustee(ctx, val, '600', c.val || 56, 30, largeur, D.fam);
      ctx.fillText(val, ax, y + (c.etiq || 40) + 6); y += (c.pas || 128);
    });
    ctx.textAlign = 'left';
    return y;
  }

  function fondAccent(ctx, D, x, y, w, h) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, D.d.accent); g.addColorStop(1, D.d.fond2 && D.d.fond2 !== D.d.fond ? D.d.fond2 : D.d.accent);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  }

  const DESSINS_CARTE = {
    photo(ctx, D) {
      const { W, H, P } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      const q = 600, bx = W - P - q;
      dessinerBlocQR(ctx, D, bx, (H - q * 1.17) / 2, q, 'Scannez-moi', true);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 230) + 60 : 40);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte, accent: D.d.accent }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, texte);
    },
    epure(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      ctx.fillStyle = accent; ctx.fillRect(0, H - 26, W, 26);
      const q = 520, bx = W - P - q;
      dessinerQR(ctx, URL_PUBLIQUE, bx, (H - q) / 2 - 30, q, '#111');
      ctx.fillStyle = '#777'; ctx.textAlign = 'center'; ctx.font = '600 40px ' + D.fam; ctx.textBaseline = 'top';
      ctx.fillText('Scannez-moi', bx + q / 2, (H + q) / 2 - 10); ctx.textAlign = 'left';
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 200) + 56 : 40);
      dessinerTextes(ctx, D, P, y, bx - P - 110, { texte: '#1a1a1a', accent }, 'left');
      dessinerPied(ctx, D, P, H - P + 20, '#1a1a1a');
    },
    luxe(ctx, D) {
      const { W, H, P } = D;
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#151515'); g.addColorStop(1, '#050505');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const or = luminance(D.d.accent) < 0.12 || luminance(D.d.accent) > 0.85 ? '#c9a45c' : D.d.accent;
      ctx.strokeStyle = or; ctx.lineWidth = 4; ctx.strokeRect(46, 46, W - 92, H - 92);
      const q = 520, bx = W - P - 40 - q;
      dessinerBlocQR(ctx, D, bx, (H - q * 1.17) / 2, q, 'Scannez-moi', false);
      let y = P + 40 + (D.logo ? dessinerLogo(ctx, D, P + 40, P + 40, 200) + 56 : 30);
      dessinerTextes(ctx, D, P + 40, y, bx - P - 140, { texte: '#f5efe0', accent: or }, 'left');
      dessinerPied(ctx, D, P + 40, H - P - 10, '#f5efe0');
    },
    bandeau(ctx, D) {
      const { W, H, P } = D;
      const B = 760;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      if (D.fondImg) fondPage(ctx, D, 0, 0, B, H, 0.45);
      else {
        const g = ctx.createLinearGradient(0, 0, B, H);
        g.addColorStop(0, D.d.accent); g.addColorStop(1, D.d.fond2 || D.d.accent);
        ctx.fillStyle = g; ctx.fillRect(0, 0, B, H);
      }
      let y = 120;
      if (D.logo) { dessinerLogo(ctx, D, (B - 220) / 2, y, 220); y += 220 + 60; }
      const q = D.logo ? 440 : 560;
      dessinerBlocQR(ctx, D, (B - q) / 2, y + (H - y - q * 1.17 - 110) / 2, q, 'Scannez-moi', true);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      const x = B + 120;
      dessinerTextes(ctx, D, x, 170, W - x - P, { texte: '#1a1a1a', accent, titre: 110 }, 'left');
      dessinerPied(ctx, D, x, H - P + 20, '#1a1a1a');
    },
    centre(ctx, D) {
      const { W, H, P } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      let y = 100;
      if (D.logo) { dessinerLogo(ctx, D, (W - 200) / 2, y, 200); y += 200 + 50; } else y += 120;
      const q = 300;
      dessinerTextes(ctx, D, P + q, y, W - 2 * (P + q), { texte, accent: D.d.accent, enLigne: true, titre: 120 }, 'center');
      dessinerBlocQR(ctx, D, W - P - q + 40, H - P - q * 1.17 + 40, q, 'Scannez', true);
      dessinerPied(ctx, D, P - 20, H - P + 40, texte);
    },
    couleur(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = D.d.accent; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W * 0.2, H * 0.1, 50, W * 0.5, H * 0.5, W * 0.9);
      g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const texte = couleurIcone(D.d.accent);
      const q = 560, bx = W - P - q;
      dessinerBlocQR(ctx, D, bx, (H - q * 1.17) / 2, q, 'Scannez-moi', true);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 210) + 56 : 40);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte, accent: texte }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, texte);
    },
    diagonale(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const xa = W * 0.5, xb = W * 0.36;
      ctx.save(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(xa, 0); ctx.lineTo(xb, H); ctx.lineTo(0, H); ctx.closePath(); ctx.clip();
      if (D.fondImg) fondPage(ctx, D, 0, 0, xa, H, 0.35); else fondAccent(ctx, D, 0, 0, xa, H);
      ctx.restore();
      ctx.strokeStyle = D.d.accent; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(xa + 22, 0); ctx.lineTo(xb + 22, H); ctx.stroke();
      const q = 460;
      let y = 110;
      if (D.logo) { dessinerLogo(ctx, D, 110, y, 190); y += 190 + 50; }
      dessinerBlocQR(ctx, D, 110, D.logo ? y : (H - q * 1.17) / 2, q, 'Scannez-moi', true);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      const x = xa + 90;
      dessinerTextes(ctx, D, x, 150, W - x - P + 20, { texte: '#1a1a1a', accent, titre: 104, sous: 48 }, 'left');
      dessinerPied(ctx, D, x, H - P + 20, '#1a1a1a');
    },
    cadre(ctx, D) {
      const { W, H } = D;
      fondPage(ctx, D, 0, 0, W, H, 0.25);
      const m = 80;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 12;
      ctx.fillStyle = 'rgba(255,255,255,.95)'; rectArrondi(ctx, m, m, W - 2 * m, H - 2 * m, 50); ctx.fill(); ctx.restore();
      const P = m + 90;
      const q = 480, bx = W - P - q;
      dessinerQR(ctx, URL_PUBLIQUE, bx, (H - q) / 2 - 24, q, '#111');
      ctx.fillStyle = '#666'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '600 38px ' + D.fam;
      ctx.fillText('Scannez-moi', bx + q / 2, (H + q) / 2 - 4); ctx.textAlign = 'left';
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      let y = P - 10 + (D.logo ? dessinerLogo(ctx, D, P, P - 10, 170) + 44 : 20);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte: '#1a1a1a', accent, titre: 100, sous: 46 }, 'left');
    },
    photoHaut(ctx, D) {
      const { W, H, P } = D;
      const Hh = Math.round(H * 0.5);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      if (D.fondImg) fondPage(ctx, D, 0, 0, W, Hh, 0.4); else fondAccent(ctx, D, 0, 0, W, Hh);
      const blanc = D.fondImg ? '#ffffff' : couleurIcone(D.d.accent);
      const q = 470, qx = W - P - q, qy = Hh - 120;
      let x = P;
      if (D.logo) { dessinerLogo(ctx, D, P, Hh - 250, 200); x = P + 250; }
      const Lt = qx - x - 50;
      ctx.fillStyle = blanc; ctx.textBaseline = 'alphabetic';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '800', 112, 52, Lt, D.fam);
      ctx.fillText(cfg.titre || '', x, Hh - (cfg.sousTitre ? 130 : 70));
      if (cfg.sousTitre) {
        ctx.font = policeAjustee(ctx, cfg.sousTitre, '400', 50, 28, Lt, D.fam); ctx.globalAlpha = .85;
        ctx.fillText(cfg.sousTitre, x, Hh - 64); ctx.globalAlpha = 1;
      }
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      dessinerBlocQR(ctx, D, qx, qy, q, '', true);
      const coords = D.coords.slice(0, 3);
      dessinerCoords(ctx, Object.assign({}, D, { coords }), P, Hh + 80, qx - P - 80, { texte: '#1a1a1a', accent, val: 52, pas: 116 }, 'left');
      dessinerPied(ctx, D, P, H - 70, '#1a1a1a');
    },
    minimal(ctx, D) {
      const { W, H } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      let y = 110;
      if (D.logo) { dessinerLogo(ctx, D, (W - 170) / 2, y, 170); y += 170 + 40; } else y += 60;
      ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '300', 104, 56, W - 300, D.fam);
      ctx.fillText(cfg.titre || '', W / 2, y); y += 130;
      ctx.fillStyle = accent; ctx.fillRect(W / 2 - 50, y, 100, 5); y += 40;
      const ligne = D.coords.slice(0, 2).map(l => l[1]).join('   ·   ');
      ctx.fillStyle = '#444'; ctx.font = policeAjustee(ctx, ligne, '500', 48, 30, W - 300, D.fam);
      ctx.fillText(ligne, W / 2, y); y += 90;
      const q = Math.min(440, H - y - 90);
      dessinerQR(ctx, URL_PUBLIQUE, (W - q) / 2, y, q, '#111');
      ctx.textAlign = 'left';
    },
    vertical(ctx, D) {
      const { W, H } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      let y = 130;
      if (D.logo) { dessinerLogo(ctx, D, (W - 280) / 2, y, 280); y += 280 + 60; } else y += 80;
      y = dessinerTextes(ctx, D, 110, y, W - 220, { texte, accent: D.d.accent, titre: 116, enLigne: false }, 'center');
      const q = 560;
      dessinerBlocQR(ctx, D, (W - q) / 2, Math.max(y + 10, H - 110 - q * 1.17), q, 'Scannez-moi', true);
    },
    verso(ctx, D) {
      const { W, H } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.55);
      const q = 760;
      dessinerBlocQR(ctx, D, (W - q) / 2, 110, q, '', true);
      ctx.fillStyle = texte; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '800', 96, 50, W - 300, D.fam);
      ctx.fillText(cfg.titre || '', W / 2, 110 + q + 70);
      ctx.font = '500 50px ' + D.fam; ctx.globalAlpha = .8;
      ctx.fillText('Scannez pour réserver, appeler ou laisser un avis', W / 2, 110 + q + 190);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
  };

  async function genererCarte(modele, D) {
    D = D || await preparerCarte();
    if (TAILLES_CARTE[modele]) D = Object.assign({}, D, TAILLES_CARTE[modele]);
    else D = Object.assign({}, D, { W: 2008, H: 1300 });
    const cv = document.createElement('canvas');
    cv.width = D.W; cv.height = D.H;
    (DESSINS_CARTE[modele] || DESSINS_CARTE.photo)(cv.getContext('2d'), D);
    return cv;
  }

  function nomFichierCarte(modele) {
    const base = (cfg.titre || 'page').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return 'carte-' + base + '-' + modele + '.jpg';
  }

  function sectionPartage() {
    const apercuQR = canvasQR(480);
    apercuQR.className = 'qr-apercu';
    const lien = el('div', { class: 'qr-url', text: URL_PUBLIQUE });
    const btnQR = el('button', { type: 'button', class: 'btn btn-mini', text: '⬇ QR code (PNG)', onclick: () => telecharger(canvasQR(1200), 'qr-code.png', 'image/png') });
    const btnCopier = el('button', { type: 'button', class: 'btn btn-mini', text: 'Copier le lien' });
    btnCopier.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(URL_PUBLIQUE); btnCopier.textContent = '✓ Copié'; }
      catch (e) { prompt('Lien de la page :', URL_PUBLIQUE); }
      setTimeout(() => (btnCopier.textContent = 'Copier le lien'), 2000);
    });

    const zoneCarte = el('div', { class: 'carte-zone' });
    const grilleModeles = el('div', { class: 'modeles-carte' });
    let choisi = 'photo', donnees = null;

    async function afficherChoisi() {
      zoneCarte.innerHTML = '';
      const cv = await genererCarte(choisi, donnees);
      zoneCarte.append(
        el('img', { class: 'carte-apercu', alt: 'Carte de visite', src: cv.toDataURL('image/jpeg', 0.85) }),
        el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: '⬇ Télécharger « ' + MODELES_CARTE[choisi] + ' » (JPEG)', onclick: () => telecharger(cv, nomFichierCarte(choisi), 'image/jpeg', 0.95) }),
        el('div', { class: 'aide', style: 'margin:4px 0 0', text: (choisi === 'vertical' ? 'Format 55 × 85 mm (vertical)' : 'Format 85 × 55 mm') + ', 600 dpi, prêt pour l’imprimeur. Astuce : « Verso QR » fait un beau dos de carte.' }));
    }

    const btnCarte = el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: 'Voir les modèles de carte' });
    btnCarte.addEventListener('click', async () => {
      btnCarte.disabled = true; btnCarte.textContent = 'Préparation des modèles…';
      try {
        donnees = await preparerCarte();
        grilleModeles.innerHTML = '';
        for (const k of Object.keys(MODELES_CARTE)) {
          const cv = await genererCarte(k, donnees);
          const mini = document.createElement('canvas');
          const ech = Math.min(502 / cv.width, 325 / cv.height);
          mini.width = Math.round(cv.width * ech); mini.height = Math.round(cv.height * ech);
          mini.getContext('2d').drawImage(cv, 0, 0, mini.width, mini.height);
          const b = el('button', { type: 'button', class: 'modele-carte' + (k === choisi ? ' actif' : '') }, [
            el('img', { src: mini.toDataURL('image/jpeg', 0.8), alt: '' }), el('b', { text: MODELES_CARTE[k] })]);
          b.addEventListener('click', async () => {
            choisi = k;
            grilleModeles.querySelectorAll('.modele-carte').forEach(x => x.classList.toggle('actif', x === b));
            await afficherChoisi();
            zoneCarte.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
          grilleModeles.appendChild(b);
        }
        await afficherChoisi();
      } catch (e) { alert('Impossible de créer la carte : ' + e.message); }
      btnCarte.disabled = false; btnCarte.textContent = 'Actualiser les modèles';
    });

    return section('partage', 'QR code et carte de visite', false, [
      el('div', { class: 'qr-bloc' }, [apercuQR, lien, el('div', { class: 'qr-actions' }, [btnQR, btnCopier])]),
      el('div', { style: 'height:16px' }),
      el('span', { class: 'etiq', text: 'Carte de visite' }),
      el('div', { class: 'aide', style: 'margin:0 0 10px', text: 'Créée à partir de la page telle qu’elle est affichée : fond, logo, nom, coordonnées des boutons et QR code.' }),
      btnCarte, grilleModeles, zoneCarte
    ]);
  }

  function miniature(k) {
    const L = 'currentColor', A = 'var(--prim)';
    const logo = (x, y, r) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + L + '" opacity=".35"/>';
    const barre = (x, y, w, h, o) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + (h || 4) + '" rx="2" fill="' + L + '" opacity="' + (o || .55) + '"/>';
    const pts = (pos) => pos.map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (p[2] || 5) + '" fill="' + A + '"/>').join('');
    const grille = (x0, y0, n, pas) => { const a = []; for (let i = 0; i < n; i++) a.push([x0 + (i % 3) * pas, y0 + Math.floor(i / 3) * pas]); return a; };
    const col = (x, y0, n, pas) => { const a = []; for (let i = 0; i < n; i++) a.push([x, y0 + i * pas]); return a; };
    let c = '';
    switch (k) {
      case 'haut':    c = pts(grille(18, 14, 3, 12)) + logo(30, 48, 7) + barre(16, 60, 28) + barre(20, 67, 20, 3, .35); break;
      case 'bas':     c = logo(30, 26, 7) + barre(16, 38, 28) + barre(20, 45, 20, 3, .35) + pts(grille(18, 72, 6, 12)); break;
      case 'gauche':  c = pts(col(11, 26, 5, 12)) + logo(38, 36, 7) + barre(26, 48, 24) + barre(29, 55, 18, 3, .35); break;
      case 'droite':  c = pts(col(49, 26, 5, 12)) + logo(22, 36, 7) + barre(10, 48, 24) + barre(13, 55, 18, 3, .35); break;
      case 'carte':   c = logo(15, 30, 7) + barre(26, 26, 26) + barre(26, 33, 18, 3, .35) + pts(grille(14, 52, 6, 12).map(p => [p[0], p[1], 4.5])); break;
      case 'affiche': c = '<rect x="0" y="0" width="60" height="100" fill="' + L + '" opacity=".08"/>' + logo(13, 50, 5) + barre(8, 60, 40, 7, .7) + barre(8, 71, 30, 3, .35) + pts([[13, 84], [26, 84], [39, 84]]); break;
      case 'hautbas': c = pts([[18, 14], [30, 14], [42, 14]]) + logo(30, 42, 7) + barre(16, 54, 28) + barre(20, 61, 20, 3, .35) + pts([[18, 86], [30, 86], [42, 86]]); break;
      case 'cotes':   c = pts(col(9, 32, 3, 12)) + pts(col(51, 32, 3, 12)) + logo(30, 40, 7) + barre(19, 52, 22) + barre(22, 59, 16, 3, .35); break;
      default:        c = logo(30, 26, 8) + barre(16, 40, 28) + barre(20, 47, 20, 3, .35) + pts(grille(18, 62, 6, 12));
    }
    return '<svg viewBox="0 0 60 100" aria-hidden="true">' + c + '</svg>';
  }

  async function redigerAvecIA(brief) {
    const systeme = [
      'Tu es rédacteur web. Tu écris les pancartes de la page d’accueil mobile d’une petite entreprise.',
      'Chaque pancarte occupe tout l’écran d’un téléphone : un titre court et un texte bref.',
      'Règles :',
      '- Écris dans la langue de la description fournie par le client.',
      '- N’invente aucun fait vérifiable absent des informations : prix, chiffres, années d’expérience, labels, certifications, diplômes, noms, adresses, horaires, avis clients, garanties, marques. Si une information manque, reste général.',
      '- Titre : 2 à 6 mots, 40 caractères maximum, sans point final.',
      '- Texte : 2 à 4 phrases, 380 caractères maximum. Un seul retour à la ligne autorisé.',
      '- Pas d’emoji, pas de hashtag, pas de superlatif creux (« le meilleur », « n°1 », « incontournable »).',
      '- Chaque pancarte traite un sujet différent, sans répétition d’une pancarte à l’autre.',
      '- S’il y a plusieurs pancartes : la première présente l’entreprise, la dernière invite à prendre contact en citant les moyens de contact disponibles.',
      '',
      'Référencement Google (SEO local) :',
      '- Choisis un mot-clé principal = activité + ville principale de la zone (ex. « chauffeur privé Paris »), et 3 à 6 mots-clés secondaires = services précis + lieux de la zone (ex. « transfert aéroport Orly », « chauffeur Disneyland Paris »).',
      '- Le mot-clé principal figure dans le titre de la première pancarte et dans sa première phrase, puis revient naturellement 2 à 3 fois sur l’ensemble des pancartes.',
      '- Chaque autre pancarte cible un mot-clé secondaire : il apparaît dans son titre et une fois dans son texte.',
      '- Varie avec des synonymes et des formes proches (ex. chauffeur privé, VTC, transport avec chauffeur) et cite les villes et lieux de la zone d’action, répartis sur les pancartes.',
      '- Densité naturelle : un même mot-clé au plus 2 fois par pancarte. Jamais de liste de mots-clés ni de répétition forcée : Google pénalise le bourrage de mots-clés, le texte doit rester agréable à lire pour un humain.',
      '- Rédige aussi un titre Google (55 à 60 caractères, mot-clé principal en tête, nom de l’entreprise à la fin) et une description Google (140 à 155 caractères, mot-clé principal, un service, la zone et une incitation à réserver ou contacter).',
      '- Corrige silencieusement les fautes de frappe évidentes de la description (ex. « 24/14 » pour « 24/24 », « passages » pour « passagers »).',
      '- Respecte exactement le nombre de pancartes demandé.',
      '- Réponds uniquement en appelant l’outil proposer_articles, sans texte autour.'
    ].join('\n');
    const infos = [
      'Nom de l’entreprise : ' + (cfg.titre || '(non précisé)'),
      cfg.sousTitre ? 'Accroche actuelle : ' + cfg.sousTitre : '',
      cfg.pied ? 'Mention en bas de page : ' + cfg.pied : '',
      'Description par le client : ' + brief.description,
      'Zone d’action : ' + (brief.zone || '(non précisée)'),
      'Moyens de contact disponibles : ' + (moyensDeContact().join(', ') || '(non précisés)'),
      'Ton souhaité : ' + (TONS_IA[brief.ton] || TONS_IA.pro),
      'Nombre de pancartes : ' + brief.nombre
    ].filter(Boolean).join('\n');

    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': secrets.anthropic,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODELE_IA,
        max_tokens: 3000,
        system: systeme,
        tools: [{
          name: 'proposer_articles',
          description: 'Renvoie les pancartes rédigées, dans l’ordre d’affichage.',
          input_schema: {
            type: 'object',
            properties: {
              articles: {
                type: 'array',
                items: {
                  type: 'object',
                  properties: { titre: { type: 'string' }, texte: { type: 'string' } },
                  required: ['titre', 'texte']
                }
              },
              seo: {
                type: 'object',
                properties: {
                  titre: { type: 'string', description: 'Balise title, 55 à 60 caractères' },
                  description: { type: 'string', description: 'Meta description, 140 à 155 caractères' },
                  motCle: { type: 'string', description: 'Mot-clé principal' },
                  motsCles: { type: 'array', items: { type: 'string' }, description: 'Mots-clés secondaires' }
                },
                required: ['titre', 'description', 'motCle']
              }
            },
            required: ['articles', 'seo']
          }
        }],
        tool_choice: { type: 'auto' },
        messages: [{ role: 'user', content: infos }]
      })
    });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      const m = (j && j.error && j.error.message) || r.statusText;
      if (r.status === 401) throw new Error('Clé API refusée. Vérifiez-la ou remplacez-la.');
      if (r.status === 429) throw new Error('Trop de demandes. Réessayez dans une minute.');
      if (r.status === 529 || r.status >= 500) throw new Error('Le service IA est surchargé. Réessayez dans un instant.');
      if (/credit|balance/i.test(m)) throw new Error('Crédit API épuisé : rechargez le compte sur console.anthropic.com.');
      throw new Error(m);
    }
    const blocs = j.content || [];
    const outil = blocs.find(c => c.type === 'tool_use' && c.input);
    let liste = outil && Array.isArray(outil.input.articles) ? outil.input.articles : [];
    let seo = outil && outil.input.seo ? outil.input.seo : null;
    if (!liste.length) {
      // Secours : JSON renvoyé en texte
      const texte = blocs.filter(c => c.type === 'text').map(c => c.text).join('\n');
      const m = texte.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
      if (m) {
        try { const o = JSON.parse(m[0]); liste = Array.isArray(o) ? o : (o.articles || []); if (!Array.isArray(o) && o.seo) seo = o.seo; } catch (e) {}
      }
    }
    const propre = liste.filter(a => a && (a.titre || a.texte)).slice(0, brief.nombre)
      .map(a => ({ titre: String(a.titre || '').trim(), texte: String(a.texte || '').trim() }));
    if (!propre.length) throw new Error('Réponse vide de l’IA. Réessayez.');
    propositionSeo = seo && (seo.titre || seo.description) ? {
      titre: String(seo.titre || '').trim(), description: String(seo.description || '').trim(),
      motCle: String(seo.motCle || '').trim(), motsCles: Array.isArray(seo.motsCles) ? seo.motsCles.map(String) : []
    } : null;
    return propre;
  }

  const LOGO_EFFETS = { mat: 'Mat', brillant: 'Brillant', metal: 'Métallique', neon: 'Néon', ombre: 'Ombre' };

  const xml = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function melanger(hex, cible, t) {
    const a = hexVersRgb(hex) || [0, 0, 0], b = hexVersRgb(cible) || [255, 255, 255];
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  const eclaircir = (h, t) => melanger(h, '#ffffff', t), assombrir = (h, t) => melanger(h, '#000000', t);
  function initiales(nom) {
    const mots = String(nom || '').trim().split(/[\s\-']+/).filter(m => m && !/^(de|du|des|la|le|les|et|d|l|&)$/i.test(m));
    return (mots.slice(0, 3).map(m => m[0]).join('') || '?').toUpperCase();
  }

  /* Motif IA : on garde le contenu du SVG, tout en couleur courante */
  function nettoyerMotif(t) {
    const m = String(t || '').match(/<svg\b([^>]*)>([\s\S]*?)<\/svg>/i);
    if (!m) return null;
    const vb = (m[1].match(/viewBox\s*=\s*["']([^"']+)["']/i) || [])[1] || '0 0 512 512';
    let c = m[2]
      .replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, '')
      .replace(/<image\b[^>]*>/gi, '').replace(/<text[\s\S]*?<\/text>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '')
      .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*')/gi, '').replace(/\sstyle\s*=\s*("[^"]*"|'[^']*')/gi, '')
      .replace(/(xlink:href|href)\s*=\s*("|')(?!#)[^"']*\2/gi, '')
      .replace(/\s(fill|stroke)\s*=\s*("|')(?!none|currentColor|url)[^"']*\2/gi, ' $1="currentColor"');
    if (c.length > 20000 || !/<(path|circle|rect|polygon|ellipse|line|polyline)\b/i.test(c)) return null;
    return { type: 'ia', vb, c };
  }

  /* Assemble le logo final en SVG à partir du motif et des réglages */
  function composerLogo(o, motif) {
    const pal = o.palette === 'perso' ? [o.cFond, o.cMotif, o.cTexte]
      : o.palette === 'theme' ? [cfg.design.fond, cfg.design.accent, cfg.design.accent] : LOGO_PALETTES[o.palette].c;
    const [cFond, cMotif, cTexte] = pal;
    const forme = o.forme, plein = forme !== 'aucune' && !o.transparent;
    const pol = LOGO_POLICES[o.police] || LOGO_POLICES.elegante;
    const defs = [];
    const peinture = (id, c) => {
      if (o.effet === 'brillant') { defs.push('<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + eclaircir(c, .4) + '"/><stop offset=".55" stop-color="' + c + '"/><stop offset="1" stop-color="' + assombrir(c, .2) + '"/></linearGradient>'); return 'url(#' + id + ')'; }
      if (o.effet === 'metal') { defs.push('<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' + [[0, assombrir(c, .45)], [.3, eclaircir(c, .6)], [.5, assombrir(c, .15)], [.72, eclaircir(c, .45)], [1, assombrir(c, .5)]].map(s => '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>').join('') + '</linearGradient>'); return 'url(#' + id + ')'; }
      return c;
    };
    let filtre = '';
    if (o.effet === 'neon') { defs.push('<filter id="lueur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'); filtre = ' filter="url(#lueur)"'; }
    if (o.effet === 'ombre') { defs.push('<filter id="ombre" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>'); filtre = ' filter="url(#ombre)"'; }

    const formeEl = (attrs) => ({
      rond: '<circle cx="256" cy="256" r="246"' + attrs + '/>',
      carre: '<rect x="10" y="10" width="492" height="492" rx="96"' + attrs + '/>',
      blason: '<path d="M40 22H472V244C472 380 378 456 256 500C134 456 40 380 40 244Z"' + attrs + '/>',
      hexagone: '<polygon points="256,10 469,133 469,379 256,502 43,379 43,133"' + attrs + '/>'
    })[forme] || '';

    const parts = [];
    const ep = o.bordure === 'epaisse' ? 22 : o.bordure === 'fine' ? 10 : 0;
    const avecBord = ep > 0 && forme !== 'aucune';
    const echBord = 246 / (246 + ep / 2);                       // bordure collée au bord extérieur
    const echInt = avecBord ? echBord * (246 - ep / 2 + 1) / 246 : 1; // intérieur de la bordure (léger recouvrement)
    const autour = e => 'translate(256 256) scale(' + e.toFixed(4) + ') translate(-256 -256)';
    if (forme !== 'aucune') defs.push('<clipPath id="forme">' + formeEl(' transform="' + autour(echInt) + '"') + '</clipPath>');
    if (plein) {
      const fondPaint = o.effet === 'neon' ? assombrir(cFond, .35) : cFond;
      parts.push('<g transform="' + autour(echInt) + '">' + formeEl(' fill="' + fondPaint + '"') + '</g>');
      if (o.effet === 'brillant' || o.effet === 'metal') {
        defs.push('<radialGradient id="reflet" cx=".5" cy=".12" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>');
        parts.push('<g clip-path="url(#forme)"><rect width="512" height="512" fill="url(#reflet)"/></g>');
      }
    }

    // Texte et emplacement du motif
    const texte = o.texte === 'nom' ? String(o.nom || '').trim() : o.texte === 'initiales' ? initiales(o.nom) : '';
    const arc = !!texte && o.position === 'arc' && (forme === 'rond' || forme === 'aucune');
    const k = (Number(o.taille) || 100) / 100;
    let S, cy;
    if (motif.type === 'photo') { S = 0; cy = 256; }
    else if (!texte) { S = (forme === 'aucune' ? 420 : forme === 'blason' ? 270 : 300) * k; cy = forme === 'blason' ? 236 : 256; }
    else if (arc) { S = 230 * k; cy = 256; }
    else { S = (forme === 'blason' ? 190 : 215) * k; cy = forme === 'blason' ? 195 : 212; }

    // Motif
    if (motif.type === 'photo') {
      const z = k;
      const W = 512 * z, X = 256 - W / 2;
      let filtrePhoto = '';
      if (!o.photoOrigine) {
        const a = hexVersRgb(cFond) || [0, 0, 0], b = hexVersRgb(cMotif) || [255, 255, 255];
        const tv = i => (a[i] / 255).toFixed(3) + ' ' + (b[i] / 255).toFixed(3);
        defs.push('<filter id="bichro" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.5" intercept="-.25"/><feFuncG type="linear" slope="1.5" intercept="-.25"/><feFuncB type="linear" slope="1.5" intercept="-.25"/></feComponentTransfer><feComponentTransfer><feFuncR type="table" tableValues="' + tv(0) + '"/><feFuncG type="table" tableValues="' + tv(1) + '"/><feFuncB type="table" tableValues="' + tv(2) + '"/></feComponentTransfer></filter>');
        filtrePhoto = ' filter="url(#bichro)"';
      }
      const img = '<image href="' + motif.data + '" x="' + X + '" y="' + X + '" width="' + W + '" height="' + W + '" preserveAspectRatio="xMidYMid slice"' + filtrePhoto + '/>';
      parts.push(forme !== 'aucune' ? '<g clip-path="url(#forme)">' + img + '</g>' : img);
      if (texte && !arc) {
        defs.push('<linearGradient id="bande" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + cFond + '" stop-opacity="0"/><stop offset="1" stop-color="' + cFond + '" stop-opacity=".92"/></linearGradient>');
        parts.push('<g' + (forme !== 'aucune' ? ' clip-path="url(#forme)"' : '') + '><rect y="300" width="512" height="212" fill="url(#bande)"/></g>');
      }
    } else if (S > 0) {
      const x = 256 - S / 2, y = cy - S / 2;
      let contenu;
      if (motif.type === 'mono') {
        const ini = initiales(o.nom);
        const fs = Math.min(400, 760 / Math.max(1, ini.length)) ;
        contenu = '<svg x="' + x + '" y="' + y + '" width="' + S + '" height="' + S + '" viewBox="0 0 512 512"><text x="256" y="256" dominant-baseline="central" text-anchor="middle" font-family=\'' + pol.f + '\' font-weight="' + pol.p + '" font-size="' + fs + '" fill="#fff">' + xml(ini) + '</text></svg>';
      } else {
        contenu = '<svg x="' + x + '" y="' + y + '" width="' + S + '" height="' + S + '" viewBox="' + xml(motif.vb) + '" color="#fff" fill="none">' + motif.c + '</svg>';
      }
      defs.push('<mask id="motif" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">' + contenu + '</mask>');
      parts.push('<g' + filtre + '><rect width="512" height="512" fill="' + peinture('pMotif', cMotif) + '" mask="url(#motif)"/></g>');
    }

    // Texte
    if (texte) {
      const peintureTexte = peinture('pTexte', cTexte);
      const attrs = ' font-family=\'' + pol.f + '\' font-weight="' + pol.p + '" fill="' + peintureTexte + '" text-anchor="middle"';
      if (arc) {
        defs.push('<path id="arcHaut" d="M66 256A190 190 0 0 1 446 256"/>');
        const fs = Math.max(22, Math.min(56, 560 / (texte.length * 0.62)));
        parts.push('<g' + filtre + '><text' + attrs + ' font-size="' + fs.toFixed(1) + '" letter-spacing="3"><textPath href="#arcHaut" startOffset="50%">' + xml(texte.toUpperCase()) + '</textPath></text></g>');
      } else {
        const largeur = forme === 'blason' ? 290 : forme === 'aucune' ? 470 : forme === 'rond' || forme === 'hexagone' ? 320 : 390;
        const ini = o.texte === 'initiales';
        const fs = Math.max(24, Math.min(ini ? 110 : 66, largeur / (texte.length * 0.58)));
        const yT = motif.type === 'photo' ? ({ blason: 385, hexagone: 400, rond: 425, carre: 440 }[forme] || 465) : Math.min(470, cy + S / 2 + 26 + fs * 0.78);
        const trop = texte.length * fs * 0.58 > largeur;
        parts.push('<g' + filtre + '><text' + attrs + ' x="256" y="' + yT.toFixed(1) + '" font-size="' + fs.toFixed(1) + '"' + (trop ? ' textLength="' + largeur + '" lengthAdjust="spacingAndGlyphs"' : '') + '>' + xml(texte) + '</text></g>');
      }
    }

    // Bordure
    if (avecBord) {
      parts.push('<g' + filtre + '><g transform="' + autour(echBord) + '">' + formeEl(' fill="none" stroke="' + peinture('pBord', cMotif) + '" stroke-width="' + ep + '"') + '</g></g>');
    }

    return '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512"><defs>' + defs.join('') + '</defs>' + parts.join('') + '</svg>';
  }
  const svgEnURL = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

  function imageEnPNG(src, taille) {
    return new Promise((ok, ko) => {
      const im = new Image();
      im.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = cv.height = taille;
        cv.getContext('2d').drawImage(im, 0, 0, taille, taille);
        try { ok(cv.toDataURL('image/png')); } catch (e) { ko(e); }
      };
      im.onerror = () => ko(new Error('Logo illisible'));
      im.src = src;
    });
  }

  async function imageFondReduite(max, qualite) {
    const src = imagesLocales[cfg.design.imageFond] || cfg.design.imageFond;
    const im = await chargerImage(src);
    if (!im) throw new Error('Image de fond introuvable');
    const k = Math.min(1, max / Math.max(im.width, im.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', qualite || 0.85);
  }

  /* Un seul appel IA : 3 motifs monochromes, réutilisables à volonté */
  async function creerMotifsIA(o, photoB64) {
    const systeme = [
      'Tu dessines des pictogrammes vectoriels destinés à des logos.',
      'Chaque pictogramme est un SVG autonome : <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">.',
      'Il contient UNIQUEMENT le motif, centré, occupant environ 90 % du cadre.',
      'Monochrome : uniquement fill="currentColor" ou stroke="currentColor" (et fill="none" pour les traits).',
      'Interdit : fond, cadre, cercle de bordure, texte, lettres, dégradé, filtre, <image>, <script>, <style>, styles en ligne.',
      'Formes nettes et lisibles même affichées à 40 pixels. Moins de 6 000 caractères par SVG.',
      'Les 3 propositions doivent être nettement différentes (angle, niveau de détail, composition).',
      'Réponds uniquement en appelant l’outil proposer_motifs.'
    ].join('\n');
    const demande = [
      'Entreprise : ' + (cfg.titre || ''),
      cfg.sousTitre ? 'Accroche : ' + cfg.sousTitre : '',
      cfg.home && cfg.home.ia && cfg.home.ia.description ? 'Activité : ' + cfg.home.ia.description : '',
      o.idee ? 'Idée du client : ' + o.idee : '',
      'Style du motif : ' + LOGO_MOTIFS_IA[o.styleMotif].p + '.',
      photoB64 ? 'Dessine une silhouette simplifiée et reconnaissable du sujet principal de la photo jointe (contour, proportions), sans détail photographique.' : '',
      'Propose 3 pictogrammes.'
    ].filter(Boolean).join('\n');
    const contenu = photoB64 ? [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: photoB64 } }, { type: 'text', text: demande }] : demande;
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': secrets.anthropic, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: MODELE_IA, max_tokens: 8000, system: systeme,
        tools: [{ name: 'proposer_motifs', description: 'Renvoie les pictogrammes en SVG.',
          input_schema: { type: 'object', properties: { motifs: { type: 'array', items: { type: 'object', properties: { nom: { type: 'string' }, svg: { type: 'string' } }, required: ['svg'] } } }, required: ['motifs'] } }],
        tool_choice: { type: 'auto' },
        messages: [{ role: 'user', content: contenu }]
      })
    });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      const m = (j && j.error && j.error.message) || r.statusText;
      if (r.status === 401) throw new Error('Clé API refusée.');
      if (r.status === 429) throw new Error('Trop de demandes. Réessayez dans une minute.');
      if (r.status >= 500) throw new Error('Le service IA est surchargé. Réessayez dans un instant.');
      if (/credit|balance/i.test(m)) throw new Error('Crédit API épuisé : rechargez le compte sur console.anthropic.com.');
      throw new Error(m);
    }
    const blocs = j.content || [];
    const outil = blocs.find(c => c.type === 'tool_use' && c.input && Array.isArray(c.input.motifs));
    let bruts = outil ? outil.input.motifs.map(x => x.svg) : [];
    if (!bruts.length) bruts = blocs.filter(c => c.type === 'text').map(c => c.text).join('\n').match(/<svg[\s\S]*?<\/svg>/gi) || [];
    const motifs = [];
    for (const b of bruts) {
      const m = nettoyerMotif(b);
      if (!m) continue;
      try { await imageEnPNG(svgEnURL(composerLogo(Object.assign({}, cfg.logoIA, { texte: 'aucun', forme: 'aucune', palette: 'clair', effet: 'mat' }), m)), 64); motifs.push(m); } catch (e) {}
    }
    if (!motifs.length) throw new Error('Aucun motif exploitable dans la réponse. Réessayez.');
    return motifs;
  }
