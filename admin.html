<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Éditeur de la page</title>
  <style>
    :root{
      --bg:#f4f4f6; --panneau:#ffffff; --ligne:#e4e4e9; --txt:#17171c; --doux:#6b6b76;
      --prim:#1f6feb; --prim-txt:#fff; --ok:#1a7f37; --err:#cf222e; --r:12px;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0e0f12; --panneau:#17181d; --ligne:#2a2c33; --txt:#ececf1; --doux:#9a9aa6; --prim:#4c8dff; }
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
    button,input,select,textarea{font:inherit;color:inherit}
    .cache{display:none !important}
    .abo{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--ligne);color:var(--doux);white-space:nowrap}
    .abo-alerte{color:var(--err);border-color:var(--err)}
    button.abo{cursor:pointer;font-family:inherit;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
    @media (max-width:560px){
      /* téléphone : le badge d'abonnement passe sur sa propre ligne, sous la barre */
      .barre{flex-wrap:wrap;row-gap:8px}
      .barre h1{flex:1 1 0;min-width:0}
      button.abo{order:10;flex:1 1 100%;text-align:center;padding:5px 9px}
    }
    @media (max-width:400px){ .barre h1{display:none} }
    .quota-ia{font-size:.8rem;color:var(--doux);margin:8px 0 0;text-align:center}
    .quota-ia.vide{color:var(--err)}
    .quota-ia button{border:0;background:none;color:var(--prim);font:inherit;font-weight:600;padding:0 0 0 4px;cursor:pointer;text-decoration:underline}
    #fen-abo,#fen-express,    #fen-pages{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
    @media (min-width:640px){#fen-abo,#fen-express,#fen-pages{align-items:center}}
    #fen-abo .fen,#fen-express .fen,    #fen-pages .fen{box-sizing:border-box;background:var(--panneau);color:var(--txt);width:min(100vw,440px);max-width:100%;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
    @media (min-width:640px){#fen-abo .fen,#fen-express .fen,#fen-pages .fen{border-radius:18px}}
    #fen-abo h2,#fen-express h2,    #fen-pages h2{margin:0 0 4px;font-size:1.2rem}
    #fen-abo .sous,#fen-express .sous,    #fen-pages .sous{color:var(--doux);margin:0 0 16px;font-size:.92rem}
    #fen-abo .alerte-abo,#fen-express .alerte-abo,    #fen-pages .alerte-abo{background:var(--bg);border:1px solid var(--err);color:var(--txt);border-radius:12px;padding:12px;margin:0 0 16px;font-size:.92rem}
    #fen-abo .compteur,#fen-express .compteur,    #fen-pages .compteur{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ligne);font-size:.95rem}
    #fen-abo .compteur b,#fen-express .compteur b,    #fen-pages .compteur b{font-variant-numeric:tabular-nums}
    #fen-abo .offre,#fen-express .offre,    #fen-pages .offre{margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--prim);background:var(--bg)}
    #fen-abo .offre .prix,#fen-express .offre .prix,    #fen-pages .offre .prix{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
    #fen-abo .offre ul,#fen-express .offre ul,    #fen-pages .offre ul{margin:8px 0 12px;padding-left:18px;color:var(--doux);font-size:.9rem}
    #fen-abo .ligne-recharge,#fen-express .ligne-recharge,    #fen-pages .ligne-recharge{display:flex;gap:8px;margin-top:10px}
    #fen-abo .ligne-recharge input,#fen-express .ligne-recharge input,    #fen-pages .ligne-recharge input{flex:1;min-width:0}
    #fen-abo .attente,#fen-express .attente,    #fen-pages .attente{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);font-size:.9rem}
    #fen-abo .fermer,#fen-express .fermer,    #fen-pages .fermer{margin-top:14px}
    .pages-bandeau{border:1px solid var(--ligne);background:var(--panneau);border-radius:14px;padding:10px 12px;margin:0 0 12px}
    .pages-bandeau .pb-tete{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
    .pages-bandeau .pb-liste{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .pages-bandeau .pb-page{border:1px solid var(--ligne);background:var(--bg);color:var(--txt);border-radius:999px;padding:6px 11px;font:inherit;font-size:.86rem;cursor:pointer}
    .pages-bandeau .pb-page.actif{border-color:var(--prim);background:color-mix(in srgb,var(--prim) 14%,var(--bg));font-weight:700;cursor:default}
    .pages-bandeau .pb-trad{border-bottom:1px solid var(--ligne);padding:0 0 10px;margin:0 0 10px}
    #fen-pages .choix-ajout{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
    #fen-pages .choix-ajout label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ligne);border-radius:12px;padding:10px 12px;cursor:pointer}
    #fen-pages .choix-ajout label.actif{border-color:var(--prim);background:var(--bg)}
    #fen-pages .choix-ajout label.inactif{opacity:.5;cursor:not-allowed}
    #fen-pages .choix-ajout small{display:block;color:var(--doux);font-size:.84rem;margin-top:2px}
    #fen-pages .zone-ajout{margin:0 0 12px}
    #fen-pages .zone-ajout .adresse{display:flex;align-items:center;gap:4px}
    #fen-pages .zone-ajout .adresse input{flex:1;min-width:0}
    #fen-pages .dispo{font-size:.85rem;margin-top:4px;color:var(--doux)}
    #fen-pages .dispo.ok{color:var(--ok)} #fen-pages .dispo.ko{color:var(--err)}
    #fen-pages .boutons{display:flex;gap:10px;margin-top:6px}
    #fen-pages .boutons .btn{flex:1}
    .express-bandeau{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid color-mix(in srgb,var(--prim) 45%,var(--ligne));background:color-mix(in srgb,var(--prim) 8%,var(--panneau));border-radius:14px;padding:12px 14px;margin:0 0 14px}
    .express-bandeau .btn{flex:none}
    #fen-express ul{margin:0 0 14px;padding-left:18px;font-size:.92rem;line-height:1.45}
    #fen-express li{margin:3px 0}
    #fen-express .cout{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--prim);font-size:.95rem;margin:0 0 14px}
    #fen-express .boutons{display:flex;gap:10px;margin-top:6px}
    #fen-express .boutons .btn{flex:1}
    #fen-express .etapes{list-style:none;padding:0;margin:4px 0 14px}
    #fen-express .etapes li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--ligne)}
    #fen-express .etapes .ic{width:1.3em;flex:none;text-align:center}
    #fen-express .etapes small{color:var(--err);display:block}
    @keyframes qp-pouls{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--prim) 60%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
    .pouls{animation:qp-pouls 1.2s ease-in-out 5}
    .ia-pancarte{margin-top:8px}
    .ia-choix-ligne{display:flex;gap:8px}
    .ia-choix{width:64px;height:96px;border-radius:10px;border:2px solid transparent;background:#222 center/cover no-repeat;cursor:pointer;padding:0}
    .ia-choix.actif{border-color:var(--accent,#2563eb)}
    #fen-cadre{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
    #fen-cadre .fen{background:var(--panneau);color:var(--txt);border-radius:18px;padding:16px;width:min(100%,460px);max-height:100%;overflow:auto;box-sizing:border-box}
    #fen-cadre h2{margin:0 0 4px;font-size:1.1rem}
    #fen-cadre .sous{margin:0 0 12px;color:var(--doux);font-size:.88rem}
    .cadre-zone{position:relative;margin:0 auto;overflow:hidden;border-radius:12px;background:#111;touch-action:none;cursor:grab;user-select:none}
    .cadre-zone img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none}
    .cadre-zone::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);
      background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)) 66.66% 0/1px 100% no-repeat,
      linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)) 0 66.66%/100% 1px no-repeat}
    .cadre-zoom{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
    .cadre-zoom input{flex:1}
    .cadre-voile{position:absolute;inset:0;pointer-events:none}
    .cadre-teinte{display:flex;align-items:center;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
    .cadre-teinte input[type=range]{flex:1;min-width:110px}
    .cadre-teinte .pastille{width:26px;height:26px;border-radius:50%;border:2px solid rgba(128,128,128,.55);padding:0;cursor:pointer}
    .cadre-teinte .pastille.actif{border-color:var(--accent,#5b8cff);box-shadow:0 0 0 2px var(--accent,#5b8cff)}
    .cadre-teinte input[type=color]{width:30px;height:28px;border:0;padding:0;background:none;cursor:pointer}
    #fen-cadre .boutons{display:flex;gap:10px;margin-top:12px}
    #fen-cadre .boutons .btn{flex:1}

    /* ---------- Connexion ---------- */
    #connexion{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .boite{width:100%;max-width:360px;background:var(--panneau);border:1px solid var(--ligne);border-radius:18px;padding:28px 22px}
    .boite h1{font-size:1.3rem;margin:0 0 6px}
    .boite p{margin:0 0 20px;color:var(--doux)}
    .champ{display:block;margin-bottom:14px}
    .champ > span{display:block;font-size:.82rem;font-weight:600;color:var(--doux);margin-bottom:5px}
    input[type=text],input[type=password],input[type=url],input[type=tel],input[type=number],input[type=email],select,textarea{
      width:100%;padding:11px 12px;border:1px solid var(--ligne);border-radius:10px;background:var(--bg);outline:none;min-height:44px}
    textarea{resize:vertical;min-height:64px}
    input:focus,select:focus,textarea:focus{border-color:var(--prim);box-shadow:0 0 0 3px color-mix(in srgb,var(--prim) 22%,transparent)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;
      border:1px solid var(--ligne);background:var(--panneau);cursor:pointer;font-weight:600}
    .btn-prim{background:var(--prim);border-color:var(--prim);color:var(--prim-txt)}
    .btn-plein{width:100%}
    .btn:disabled{opacity:.55;cursor:default}
    .btn-mini{min-height:36px;padding:6px 10px;font-size:.88rem}
    .msg{font-size:.9rem;margin-top:10px;min-height:1.2em}
    .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
    .case{display:flex;align-items:center;gap:8px;margin:4px 0 16px;color:var(--doux);font-size:.9rem}

    /* ---------- Éditeur ---------- */
    #editeur{min-height:100dvh;display:flex;flex-direction:column}
    .barre{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;
      background:var(--panneau);border-bottom:1px solid var(--ligne)}
    .barre h1{font-size:1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .onglets{display:flex;background:var(--bg);border-radius:10px;padding:3px}
    .onglets button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--doux);cursor:pointer}
    .onglets button.actif{background:var(--panneau);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .corps{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
    .col-edit{padding:16px 16px 110px;max-width:640px;width:100%;margin:0 auto}
    .col-apercu{padding:0 0 90px}
    .cadre{min-height:calc(100dvh - 150px);display:flex}
    .cadre > .qp{min-height:inherit}
    .choix-apercu{display:flex;gap:4px;margin:10px auto;padding:3px;width:max-content;background:var(--bg);border:1px solid var(--ligne);border-radius:10px}
    .choix-apercu.cache{display:none}
    .choix-apercu button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:.86rem;color:var(--doux);cursor:pointer}
    .choix-apercu button.actif{background:var(--panneau);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .cadre.mode-home{height:calc(100dvh - 200px);min-height:0}
    .cadre > .qh{height:100%}
    @media (max-width:899px){
      body[data-vue=edit] .col-apercu{display:none}
      body[data-vue=apercu] .col-edit{display:none}
    }
    @media (min-width:900px){
      .onglets{display:none}
      .corps{grid-template-columns:minmax(380px,1fr) 440px}
      .col-apercu{position:sticky;top:57px;height:calc(100dvh - 57px);padding:4px 20px 20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
      .choix-apercu{margin:8px auto 12px}
      .cadre,.cadre.mode-home{width:390px;height:calc(100dvh - 190px);min-height:0;max-height:800px;border-radius:36px;overflow:auto;
        border:10px solid #111;box-shadow:0 20px 60px rgba(0,0,0,.25)}
      .cadre > .qp{min-height:100%}
    }

    .jauge-details{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:.82rem;color:var(--doux)}
    .jd-barre{flex:0 0 90px;height:6px;border-radius:3px;background:var(--ligne);overflow:hidden}
    .jd-barre i{display:block;height:100%;border-radius:3px;background:var(--err);transition:width .2s}
    .jauge-details[data-niveau='1'] .jd-barre i{background:#d9952b}
    .jauge-details[data-niveau='2'] .jd-barre i, .jauge-details[data-niveau='3'] .jd-barre i{background:#2f9e5b}
    .seo-alertes{display:grid;gap:4px;margin:4px 0 10px}
    .seo-alerte{font-size:.84rem;line-height:1.4;color:var(--err)}
    /* ---------- Statistiques ---------- */
    .vue-stats{display:none;padding:16px 16px 60px;max-width:760px;width:100%;margin:0 auto}
    body[data-vue=stats] .vue-stats{display:block}
    body[data-vue=stats] .corps, body[data-vue=stats] .pied-barre{display:none}
    .st-periode{display:flex;gap:4px;padding:3px;background:var(--bg);border:1px solid var(--ligne);border-radius:10px;width:max-content;margin:0 0 14px}
    .st-periode button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:.86rem;color:var(--doux);cursor:pointer}
    .st-periode button.actif{background:var(--panneau);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .st-tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .st-tuile{background:var(--panneau);border:1px solid var(--ligne);border-radius:14px;padding:14px 16px}
    .st-tuile .v{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
    .st-tuile .l{color:var(--doux);font-size:.85rem;margin-top:2px}
    .st-bloc{background:var(--panneau);border:1px solid var(--ligne);border-radius:14px;padding:14px 16px;margin-bottom:14px}
    .st-bloc h3{font-size:.95rem;margin:0 0 10px}
    .st-graph{position:relative}
    .st-graph svg{display:block;width:100%;height:150px;overflow:visible}
    .st-graph rect.b{fill:var(--prim)}
    .st-graph rect.h{fill:transparent;cursor:pointer}
    .st-graph rect.b.sel{fill:var(--txt)}
    .st-graph line{stroke:var(--ligne);stroke-width:1}
    .st-axe{display:flex;justify-content:space-between;color:var(--doux);font-size:.75rem;margin-top:6px}
    .st-info{min-height:1.4em;font-size:.86rem;color:var(--doux);margin-top:6px}
    .st-info b{color:var(--txt)}
    .st-liste{display:grid;gap:8px}
    .st-ligne{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
    .st-ligne .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .st-ligne .barre-st{height:10px;border-radius:0 4px 4px 0;background:var(--prim);min-width:2px}
    .st-ligne .n{font-variant-numeric:tabular-nums;font-weight:600;min-width:2.5em;text-align:right}
    .st-vide{color:var(--doux);font-size:.9rem;margin:0}
    .st-note{color:var(--doux);font-size:.82rem;margin:4px 2px 0}
    @media (max-width:520px){ .onglets .txt-stats{display:none} .onglets button{padding:7px 10px} }
    @media (min-width:900px){
      .onglets{display:flex}
      .onglets button[data-vue=apercu]{display:none}
    }
    .section{background:var(--panneau);border:1px solid var(--ligne);border-radius:16px;margin-bottom:14px;overflow:hidden}
    .section > summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:700;display:flex;align-items:center;gap:10px}
    .section > summary::-webkit-details-marker{display:none}
    .section > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--doux);border-bottom:2px solid var(--doux);transform:rotate(45deg);transition:transform .15s}
    .section[open] > summary::after{transform:rotate(-135deg)}
    .section-corps{padding:2px 16px 16px}
    .grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:520px){ .bouton-carte .grille2{grid-template-columns:1fr} }

    .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:16px}
    .theme{border:2px solid var(--ligne);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;background:none;text-align:left}
    .theme.actif{border-color:var(--prim)}
    .theme .ech{height:42px;display:flex;align-items:flex-end;padding:6px}
    .theme .ech i{display:block;width:100%;height:10px;border-radius:5px}
    .theme b{display:block;font-size:.8rem;padding:5px 7px}

    .couleurs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .coul{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--ligne);border-radius:10px;background:var(--bg);font-size:.85rem}
    input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer;flex-shrink:0}
    input[type=color]::-webkit-color-swatch-wrapper{padding:0}
    input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.15);border-radius:8px}

    .segments{display:flex;background:var(--bg);border:1px solid var(--ligne);border-radius:10px;padding:3px;margin-bottom:14px}
    .segments button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-weight:600;font-size:.88rem;color:var(--doux);cursor:pointer}
    .segments button.actif{background:var(--panneau);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .etiq{display:block;font-size:.82rem;font-weight:600;color:var(--doux);margin:2px 0 6px}
    .bascule{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ligne)}
    .bascule input{width:22px;height:22px}

    .image-ligne{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .vignette{width:64px;height:64px;border-radius:12px;border:1px dashed var(--ligne);background:var(--bg) center/cover no-repeat;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;color:var(--doux);font-size:.75rem}
    .vignette img{max-width:100%;max-height:100%}
    input[type=range]{width:100%}

    .bouton-carte{border:1px solid var(--ligne);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--bg)}
    .bouton-carte.masque{opacity:.55}
    select.choix-langue{width:auto;min-height:36px;padding:6px 8px;border-radius:10px;font-weight:700;font-size:.85rem;background:var(--bg);border:1px solid var(--ligne);color:var(--txt)}
    .modale-fond{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
    @media (min-width:700px){.modale-fond{align-items:center}}
    .modale{width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;background:var(--panneau);color:var(--txt);
      border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
    @media (min-width:700px){.modale{border-radius:20px}}
    .modale-tete{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--ligne)}

    .pied-barre{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:12px;

    .btn-aide{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--ligne);background:var(--bg);font-size:1.25rem;cursor:pointer;position:relative;padding:0}

    .btn-aide.nouveau::after{content:'';position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--prim)}
    .aide-panneau{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;max-width:520px;max-height:min(70vh,620px);
      display:flex;flex-direction:column;background:var(--panneau);border:1px solid var(--ligne);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden}
    .aide-tete{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--ligne)}
    .aide-tete b{flex:1;font-size:.95rem}
    .aide-ico{border:0;background:none;color:var(--txt);font-size:1.05rem;cursor:pointer;padding:6px 8px;border-radius:8px}

    a.lien{color:var(--prim);font-weight:600;text-decoration:none}
  </style>

<body data-vue="edit">

<!-- ================= Connexion ================= -->
<div id="connexion">
  <form class="boite" id="form-connexion">
    <div data-langue style="float:right"></div>
    <h1>Modifier la page</h1>
    <p>Entrez le mot de passe pour accéder à l'éditeur.</p>
    <label class="champ"><span>Mot de passe</span>
      <input type="password" id="mdp" autocomplete="current-password" required>
    </label>
    <label class="case"><input type="checkbox" id="rester"> Rester connecté sur cet appareil</label>
    <button class="btn btn-prim btn-plein" id="btn-connexion">Se connecter</button>
    <div class="msg" id="msg-connexion"></div>
  </form>
</div>

<!-- ================= Éditeur ================= -->
<div id="editeur" class="cache">
  <div class="barre">
    <h1>Éditeur</h1>
    <button type="button" id="abonnement" class="abo cache" title="Mon abonnement"></button>
    <div class="onglets">
      <button type="button" data-vue="edit" class="actif">Modifier</button>
      <button type="button" data-vue="apercu">Aperçu</button>
      <button type="button" data-vue="stats" title="Statistiques"><span aria-hidden="true">📊</span><span class="txt-stats"> Statistiques</span></button>
    </div>
    <span data-langue></span>
    <button type="button" class="btn btn-mini" id="btn-deconnexion">Quitter</button>
  </div>

  <div class="corps">
    <div class="col-edit" id="formulaire"></div>
    <div class="col-apercu"><div class="choix-apercu" id="choix-apercu"><button type="button" data-p="contact" class="actif">Page contact</button><button type="button" data-p="home">Page Home</button></div><div class="cadre" id="apercu"></div></div>
  </div>

  <div id="stats" class="vue-stats"></div>

  <div class="pied-barre">
    <button type="button" class="btn-aide cache" id="btn-aide" title="Assistant" aria-label="Assistant">❓</button>
    <div class="etat" id="etat">Aucune modification</div>
    <button type="button" class="btn btn-prim" id="btn-enregistrer" disabled>Enregistrer</button>
  </div>
  <div class="aide-panneau cache" id="aide-panneau" role="dialog" aria-label="Assistant">
    <div class="aide-tete">
      <b>❓ <span>Assistant</span></b>
      <button type="button" class="aide-ico" id="aide-effacer" title="Nouvelle conversation" aria-label="Nouvelle conversation">🗑</button>
      <button type="button" class="aide-ico" id="aide-reduire" title="Réduire" aria-label="Réduire">▾</button>
    </div>
    <div class="aide-fil" id="aide-fil"></div>
    <form class="aide-saisie" id="aide-form">
      <textarea id="aide-question" rows="1" maxlength="1500" placeholder="Votre question…"></textarea>
      <button type="submit" class="btn btn-prim" id="aide-envoyer" aria-label="Envoyer">➤</button>
    </form>
    <div class="aide-pied" id="aide-pied"></div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="commun.js"></script>
<script src="qrcode.js"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const APP = pageApp();          // ouvert dans l'appli qrbc (qrbc.app/app/<page>/)
  const CLE_STOCK = 'qp-jeton' + (APP ? ':' + APP : '');
  const CF = modeCloudflare();   // nomclient.qrbc.app : tout passe par le Worker
  let jetonCF = null;

  let depot = depotDepuisURL();
  let gh = null;
  let cfg = null;
  let shaConfig = null;
  let modifie = false;
  let imagesLocales = {};    // chemin -> dataURL (aperçu immédiat)
  let imagesAEnvoyer = {};   // chemin -> base64
  let secrets = { github: '', anthropic: '' };
  let proposition = null;    // articles proposés par l'IA, en attente de validation
  let propositionSeo = null; // titre et description Google proposés

  /* ---------------- Connexion ---------------- */
  async function lireAuth() {
    const r = await fetch('auth.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Installation non terminée : ouvrez d\'abord setup.html.');
    const a = await r.json();
    if (a.owner && a.repo) depot = { owner: a.owner, repo: a.repo, branche: a.branche || 'main' };
    return a;
  }

  async function demarrer(jeton) {
    gh = CF ? clientCloudflare(jeton) : clientGitHub(jeton, depot);
    const info = await gh.verifier();
    if (CF) { jetonCF = jeton; aide.activer(); afficherAbonnement(info.compte); setTimeout(retourPaiement, 0); fetch('/api/moi', { credentials: 'include' }).catch(() => {}); }
    const f = await gh.lire('config.json');
    shaConfig = f ? f.sha : null;
    cfg = normaliser(fusion(CONFIG_DEFAUT, f ? JSON.parse(f.texte) : {}));
    $('#connexion').classList.add('cache');
    $('#editeur').classList.remove('cache');
    construireFormulaire();
    majApercu();
    if (CF && compteCF && compteCF.traduction && compteCF.aTraduire) { setTimeout(() => lancerTraduction(true), 300); return; }
    if (!partageAJour() || !iconesAJour()) {
      changement();
      const e = $('#etat'); e.className = 'etat';
      e.textContent = !iconesAJour() ? 'Nouveau : votre page s’installe comme une appli. Cliquez sur Enregistrer pour l’activer.' : 'Nouvelle image d’aperçu des liens (WhatsApp…) : cliquez sur Enregistrer';
    }
  }

  $('#form-connexion').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('#msg-connexion'), btn = $('#btn-connexion');
    msg.className = 'msg'; msg.textContent = 'Vérification…'; btn.disabled = true;
    try {
      if (CF) {
        const r = await appelAPI('connexion', null, { method: 'POST', body: JSON.stringify({ mdp: $('#mdp').value, rester: $('#rester').checked }) });
        const { jeton } = await r.json();
        secrets = { github: '', anthropic: 'serveur' };
        await demarrer(jeton);
        memoriserPageApp();
        try {
          sessionStorage.setItem(CLE_STOCK, jeton);
          if ($('#rester').checked) localStorage.setItem(CLE_STOCK, jeton);
        } catch (err) {}
        return;
      }
      const auth = await lireAuth();
      let brut;
      try { brut = await dechiffrerJeton(auth, $('#mdp').value); }
      catch (err) { throw new Error('Mot de passe incorrect.'); }
      secrets = lireSecret(brut);
      await demarrer(secrets.github);
      try {
        sessionStorage.setItem(CLE_STOCK, brut);
        if ($('#rester').checked) localStorage.setItem(CLE_STOCK, brut);
      } catch (err) {}
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.status === 401 && !CF ? 'Accès refusé : le jeton GitHub a expiré ou a été révoqué.' : err.message;
      if (err.code === 'email_non_confirme') {
        const renvoi = el('button', { type: 'button', class: 'btn btn-mini', style: 'margin-top:8px', text: 'Renvoyer l’e-mail', onclick: async () => {
          renvoi.disabled = true;
          try {
            const r = await appelAPI('email/renvoyer', null, { method: 'POST', body: JSON.stringify({ mdp: $('#mdp').value }) });
            const j = await r.json();
            msg.className = 'msg ok'; msg.textContent = j.dejaConfirme ? t('Adresse déjà confirmée : connectez-vous.') : '✉️ ' + t('Nouveau lien envoyé à ') + j.email;
          } catch (e2) { msg.textContent = e2.message; renvoi.disabled = false; }
        } });
        msg.append(el('br'), renvoi);
      }
    } finally { btn.disabled = false; }
  });

  $('#btn-deconnexion').addEventListener('click', () => {
    if (modifie && !confirm(t('Des modifications ne sont pas enregistrées. Se déconnecter quand même ?'))) return;
    try { sessionStorage.removeItem(CLE_STOCK); localStorage.removeItem(CLE_STOCK); } catch (e) {}
    modifie = false;
    if (APP) location.href = '/app?choisir'; else location.reload();
  });

  (async function auto() {
    let j = null;
    try { j = sessionStorage.getItem(CLE_STOCK) || localStorage.getItem(CLE_STOCK); } catch (e) {}
    if (!j) return;
    try {
      if (CF) { secrets = { github: '', anthropic: 'serveur' }; await demarrer(j); }
      else { await lireAuth(); secrets = lireSecret(j); await demarrer(secrets.github); }
    }
    catch (e) { try { sessionStorage.removeItem(CLE_STOCK); localStorage.removeItem(CLE_STOCK); } catch (x) {} }
  })();

  /* ---------------- Abonnement (mode Cloudflare) ---------------- */
  let compteCF = null;
  const euros = c => ((c || 0) / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
  function afficherAbonnement(c) {
    if (c) compteCF = c;
    c = compteCF;
    const b = $('#abonnement');
    if (!b || !c) return;
    const jours = d => Math.max(0, Math.ceil((Date.parse(d) - Date.now()) / 86400000));
    let txt = '', classe = 'abo';
    if (c.plan === 'essai' && c.actif) { const n = jours(c.finEssai); txt = 'Essai gratuit : ' + n + (n > 1 ? ' jours' : ' jour'); if (n <= 3) classe += ' abo-alerte'; }
    else if (!c.actif) { txt = c.plan === 'essai' ? 'Essai terminé' : 'Abonnement inactif'; classe += ' abo-alerte'; }
    else if (c.plan === 'gratuit') txt = 'Compte offert';
    else if (c.plan === 'payant') txt = 'Abonné' + (c.payeJusqua ? ' · ' + new Date(c.payeJusqua).toLocaleDateString('fr-FR') : '');
    b.textContent = txt;
    b.className = txt ? classe : 'abo cache';
    majQuotas();
  }
  $('#abonnement').addEventListener('click', () => ouvrirAbonnement());

  /* Retour de la page de paiement Stripe : ?paiement=ok&session_id=… ou ?paiement=annule */
  async function retourPaiement() {
    const q = new URLSearchParams(location.search);
    if (q.has('abonnement') && !q.get('paiement')) {       // lien d'un e-mail de rappel
      q.delete('abonnement');
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
      ouvrirAbonnement();
      return;
    }
    const etat = q.get('paiement');
    if (!etat) return;
    history.replaceState(null, '', location.pathname + location.hash);
    if (etat === 'annule') { ouvrirAbonnement(null, 'Paiement annulé : rien n’a été débité.'); return; }
    const id = q.get('session_id') || '';
    for (let essai = 0; essai < 5; essai++) {             // la confirmation de la banque peut prendre quelques secondes
      try {
        const r = await appelAPI('paiement/verifier?session=' + encodeURIComponent(id), jetonCF);
        const j = await r.json();
        afficherAbonnement(j.compte);
        if (j.paye && j.nouvellePage) {                    // page ou langue ajoutée : on l'ouvre
          const f = fenetrePages();
          f.fen.append(el('h2', { text: '✓ ' + t('Paiement reçu, merci !') }), el('p', { class: 'sous', text: t('Ouverture de votre nouvelle page…') }));
          setTimeout(() => basculerVers(j.nouvellePage, true), 900);
          return;
        }
        if (j.paye && j.etat === 'échec') { ouvrirAbonnement(null, t('Paiement reçu, mais la page n’a pas pu être créée (nom pris entre-temps). Nous vous remboursons : écrivez-nous à support@qrbc.app.')); return; }

  /* Ce qu'il reste d'IA pour un type ('texte' ou 'picto') */

    const c = compteCF;

    const q = c.ia[type];
    const inclus = q.inclus == null ? 0 : Math.max(0, q.inclus - q.utilises);
    const parCredit = c.plan === 'payant' ? Math.floor((c.ia.credit || 0) / c.ia.prix[type]) : 0;
    return { inclus, total: q.inclus, parCredit, prix: c.ia.prix[type], credit: c.ia.credit || 0 };
  }
  function texteQuota(type) {
    const r = resteIA(type), c = compteCF;

    const nom = type === 'texte' ? ['rédaction', 'rédactions'] : type === 'fond' ? ['création d’images', 'créations d’images'] : ['création de motifs', 'créations de motifs'];

  function listeStats(titre, donnees, nommer, max) {

    const haut = Math.max(...affichees.map(x => x[1]), reste);

  function grapheJours(s) {
    const jours = [];
    for (let d = new Date(s.debut + 'T12:00:00'); jours.length < s.jours; d.setDate(d.getDate() + 1)) jours.push(new Intl.DateTimeFormat('fr-CA').format(d));
    const vals = jours.map(j => s.parJour[j] || 0), max = Math.max(1, ...vals);
    const W = 600, H = 150, pas = W / jours.length, larg = Math.max(1, pas - Math.min(2, pas * 0.25));
    const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', t('Visites par jour'));
    const ligneBase = document.createElementNS(NS, 'line');
    ligneBase.setAttribute('x1', 0); ligneBase.setAttribute('x2', W); ligneBase.setAttribute('y1', H - .5); ligneBase.setAttribute('y2', H - .5);
    svg.appendChild(ligneBase);
    const info = el('div', { class: 'st-info' });
    const barres = [];
    const montrer = i => {
      barres.forEach((b, k) => b.classList.toggle('sel', k === i));
      info.innerHTML = '';
      info.append(el('span', { text: fmtJour(jours[i], true) + ' · ' }), el('b', { text: fmtNombre(vals[i]) }), el('span', { text: ' ' }), el('span', { text: t('Visites').toLowerCase() }));
    };
    jours.forEach((j, i) => {
      const hb = vals[i] ? Math.max(3, vals[i] / max * (H - 8)) : 0;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('class', 'b'); r.setAttribute('x', i * pas + (pas - larg) / 2); r.setAttribute('width', larg);
      r.setAttribute('y', H - hb); r.setAttribute('height', hb); r.setAttribute('rx', Math.min(4, larg / 2));
      svg.appendChild(r); barres.push(r);
      const zone = document.createElementNS(NS, 'rect');          // zone de survol plus large que la barre
      zone.setAttribute('class', 'h'); zone.setAttribute('x', i * pas); zone.setAttribute('width', pas); zone.setAttribute('y', 0); zone.setAttribute('height', H);
      zone.addEventListener('mouseenter', () => montrer(i)); zone.addEventListener('click', () => montrer(i));
      svg.appendChild(zone);
    });
    const meilleur = vals.indexOf(Math.max(...vals));
    if (vals[meilleur]) setTimeout(() => montrer(meilleur), 0);
    return el('div', { class: 'st-bloc' }, [el('h3', { text: 'Visites par jour' }),
      el('div', { class: 'st-graph' }, [svg]),
      el('div', { class: 'st-axe' }, [el('span', { text: fmtJour(jours[0]) }), el('span', { text: fmtJour(jours[Math.floor(jours.length / 2)]) }), el('span', { text: fmtJour(jours[jours.length - 1]) })]),
      info]);
  }

      else if (attrs[k] === undefined) continue;
      else if (k in n && k !== 'list') { try { n[k] = attrs[k]; } catch (e) { /* propriété en lecture seule */ } }

  /* ---------------- Recadrer et zoomer une image (fond, pancartes) ----------------
     Glisser pour déplacer, pincer / molette / curseur pour zoomer. Le cadre a le format de l'écran
     (ou du bandeau d'image d'une pancarte). Le résultat est une NOUVELLE image : l'originale reste dans « Mes images ». */
  const RATIO_ECRAN = 9 / 19;          // téléphone en portrait (fond, pancarte « photo »)
  const RATIO_BANDEAU = 1;             // pancarte « image au-dessus du texte » (≈ carré sur téléphone)
  async function ouvrirRecadrage(source, ratio, nom, fini) {
    // Image déjà recadrée : on repart de l'ORIGINALE, au dernier cadrage (on peut donc dézoomer)
    cfg.cadres = cfg.cadres || {};
    const prec = cfg.cadres[source];
    const charger = src => new Promise((ok, ko) => { const i = new Image(); i.decoding = 'async'; i.onload = () => ok(i); i.onerror = ko; i.src = imagesLocales[src] || src; });
    let img, origine = source, rect = null, teinte = null;
    if (prec && prec.source) {
      try { img = await charger(prec.source); origine = prec.source; rect = prec.rect; teinte = prec.teinte || { couleur: '#000000', force: 0 }; } catch (e) { img = null; }   // originale supprimée : on garde la copie
    }
    if (!img) {
      try { img = await charger(source); }
      catch (e) { alert(t('Cette image ne peut pas être lue sur cet appareil. Essayez une autre image (JPEG ou PNG de moins de 3 Mo).')); return; }
    }
    const ancien = document.getElementById('fen-cadre'); if (ancien) ancien.remove();
    const fond = el('div', { id: 'fen-cadre', role: 'dialog', 'aria-modal': 'true' });
    const fen = el('div', { class: 'fen' });
    const larg = Math.min(420, window.innerWidth - 60), haut = Math.min(Math.round(larg / ratio), window.innerHeight - 330);
    const FW = Math.round(Math.min(larg, haut * ratio)), FH = Math.round(FW / ratio);
    const zone = el('div', { class: 'cadre-zone', style: 'width:' + FW + 'px;height:' + FH + 'px' });
    const im = el('img', { src: img.src, alt: '' });
    zone.appendChild(im);
    // Assombrir : voile de couleur (noir par défaut) incrusté dans l'image, pour masquer les défauts et faire ressortir le texte
    if (!teinte) teinte = { couleur: '#000000', force: 20 };   // nouvelle image : légèrement assombrie
    const voileCadre = el('div', { class: 'cadre-voile' });
    zone.appendChild(voileCadre);
    const forceVoile = el('input', { type: 'range', min: '0', max: '80', step: '1', value: String(teinte.force), 'aria-label': t('Assombrir') });
    const valeurVoile = el('span', { style: 'min-width:3.2em;text-align:right;font-size:.85rem;color:var(--doux)' });
    const choixCouleur = el('input', { type: 'color', value: teinte.couleur, 'aria-label': t('Autre couleur') });
    const pastilles = ['#000000', '#ffffff', '#0b1f3a', '#3b2a1a'].map(c => el('button', { type: 'button', class: 'pastille', style: 'background:' + c, 'aria-label': c, onclick: () => { teinte.couleur = c; choixCouleur.value = c; majVoile(); } }));
    function majVoile() {
      teinte.force = Number(forceVoile.value);
      voileCadre.style.background = teinte.couleur; voileCadre.style.opacity = String(teinte.force / 100);
      valeurVoile.textContent = teinte.force + ' %';
      pastilles.forEach(b => b.classList.toggle('actif', b.getAttribute('aria-label') === teinte.couleur));
    }
    forceVoile.addEventListener('input', majVoile);
    choixCouleur.addEventListener('input', () => { teinte.couleur = choixCouleur.value; majVoile(); });
    majVoile();
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const base = Math.max(FW / iw, FH / ih);                 // « couvrir » : l'image remplit toujours le cadre
    let z = 1, ox = (FW - iw * base) / 2, oy = (FH - ih * base) / 2;
    if (rect && rect.sw > 0) {                                // reprend le cadrage précédent
      const S = FW / rect.sw; z = Math.min(5, Math.max(1, S / base)); const S2 = base * z;
      ox = -rect.sx * S2; oy = -rect.sy * S2;
    }
    const curseur = el('input', { type: 'range', min: '1', max: '5', step: '0.01', value: '1', 'aria-label': t('Zoom') });
    function borner() {
      const S = base * z;
      ox = Math.min(0, Math.max(FW - iw * S, ox));
      oy = Math.min(0, Math.max(FH - ih * S, oy));
    }
    const flou = el('div', { class: 'aide', style: 'color:var(--alerte);min-height:1.2em;margin:0' });
    function dessiner() {
      borner(); im.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + base * z + ')'; curseur.value = String(z);
      flou.textContent = FW / (base * z) < 420 ? t('Zoom important : l’image risque de paraître floue sur le téléphone.') : '';
    }
    function zoomer(nz, cx, cy) {                             // zoom autour du point (cx, cy) du cadre
      nz = Math.min(5, Math.max(1, nz));
      const S0 = base * z, S1 = base * nz;
      ox = cx - (cx - ox) * S1 / S0; oy = cy - (cy - oy) * S1 / S0; z = nz; dessiner();
    }
    // glisser / pincer
    const doigts = new Map(); let pince = null;
    zone.addEventListener('pointerdown', e => { zone.setPointerCapture(e.pointerId); doigts.set(e.pointerId, { x: e.clientX, y: e.clientY }); zone.style.cursor = 'grabbing';
      if (doigts.size === 2) { const [a, b] = [...doigts.values()]; pince = { d: Math.hypot(a.x - b.x, a.y - b.y), z }; } });
    zone.addEventListener('pointermove', e => {
      const avant = doigts.get(e.pointerId); if (!avant) return;
      const ici = { x: e.clientX, y: e.clientY };
      if (doigts.size === 1) { ox += ici.x - avant.x; oy += ici.y - avant.y; doigts.set(e.pointerId, ici); dessiner(); return; }
      doigts.set(e.pointerId, ici);
      if (doigts.size === 2 && pince) {
        const [a, b] = [...doigts.values()], r = zone.getBoundingClientRect();
        zoomer(pince.z * Math.hypot(a.x - b.x, a.y - b.y) / pince.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
    });
    const lacher = e => { doigts.delete(e.pointerId); if (doigts.size < 2) pince = null; zone.style.cursor = 'grab'; };
    zone.addEventListener('pointerup', lacher); zone.addEventListener('pointercancel', lacher);
    zone.addEventListener('wheel', e => { e.preventDefault(); const r = zone.getBoundingClientRect(); zoomer(z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    curseur.addEventListener('input', () => zoomer(Number(curseur.value), FW / 2, FH / 2));
    const fermer = () => fond.remove();
    fen.append(
      el('h2', { text: '✂ Recadrer et zoomer' }),
      el('p', { class: 'sous', text: 'Faites glisser l’image, pincez ou utilisez le curseur pour zoomer. Le cadre montre ce qui sera visible sur un téléphone.' }),
      zone,
      el('div', { class: 'cadre-zoom' }, [el('span', { text: '−' }), curseur, el('span', { text: '+' })]),
      flou,
      el('div', { class: 'cadre-teinte' }, [el('span', { text: 'Assombrir', style: 'font-size:.9rem' }), forceVoile, valeurVoile]),
      el('div', { class: 'cadre-teinte' }, [el('span', { text: 'Couleur', style: 'font-size:.9rem' }), ...pastilles, choixCouleur]),
      el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Annuler', onclick: fermer }),
        el('button', { type: 'button', class: 'btn', text: 'Recentrer', onclick: () => { z = 1; ox = (FW - iw * base) / 2; oy = (FH - ih * base) / 2; dessiner(); } }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Appliquer', onclick: appliquer })
      ]));
    fond.appendChild(fen);
    fond.addEventListener('click', e => { if (e.target === fond) fermer(); });
    document.body.appendChild(fond);
    dessiner();
    function appliquer() {
      const S = base * z;
      const sx = -ox / S, sy = -oy / S, sw = FW / S, sh = FH / S;
      const maxL = ratio < 1 ? 1080 : 1400;                   // assez net pour un écran de téléphone, léger à charger
      const ow = Math.round(Math.min(sw, maxL)), oh = Math.round(ow / ratio);
      const cv = document.createElement('canvas'); cv.width = ow; cv.height = oh;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, ow, oh);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, ow, oh);
      if (teinte.force > 0) { ctx.globalAlpha = teinte.force / 100; ctx.fillStyle = teinte.couleur; ctx.fillRect(0, 0, ow, oh); ctx.globalAlpha = 1; }
      let data;
      try { data = cv.toDataURL('image/jpeg', 0.86); } catch (e) { alert(t('Cette image ne peut pas être lue sur cet appareil. Essayez une autre image (JPEG ou PNG de moins de 3 Mo).')); return; }
      const chemin = 'images/' + (nom === 'fond' ? 'fond' : 'article') + '-cadre-' + Date.now() + '.jpg';
      imagesLocales[chemin] = data;
      imagesAEnvoyer[chemin] = data.split(',')[1];
      // mémorise l'originale et le cadrage, pour pouvoir recadrer (et dézoomer) plus tard
      cfg.cadres[chemin] = { source: origine, rect: { sx: Math.round(sx), sy: Math.round(sy), sw: Math.round(sw), sh: Math.round(sh) }, teinte: { couleur: teinte.couleur, force: teinte.force } };
      const utiles = new Set(JSON.stringify(Object.assign({}, cfg, { cadres: null })).match(/images\/[\w.-]+/g) || []);
      for (const k in cfg.cadres) if (!utiles.has(k) && k !== chemin) delete cfg.cadres[k];   // pas d'entrées orphelines
      fermer();
      fini(chemin);
    }
  }

  /* ---------------- Atelier « fond par l'IA » (Cloudflare) ---------------- */
  const AMBIANCES_FOND = { photo: 'Photo réaliste', lumineux: 'Lumineux', nuit: 'Ambiance nuit', minimal: 'Minimaliste', aquarelle: 'Aquarelle', luxe: 'Luxe' };
  const etatFond = { ambiance: 'photo', idee: '', enCours: false, message: null };
  function atelierFond() {
    const boite = el('div', { class: 'ia-boite', style: 'margin-top:16px' });

      puces.appendChild(b);
    });
    const idee = el('textarea', { rows: 2, value: etatFond.idee, placeholder: 'Ex. : van noir devant la tour Eiffel au coucher du soleil' });
    idee.addEventListener('input', () => { etatFond.idee = idee.value; });

    if (etatFond.message) { msg.className = 'msg ' + etatFond.message.classe; msg.textContent = etatFond.message.texte; }
    go.addEventListener('click', async () => {
      etatFond.enCours = true; go.disabled = true; go.textContent = 'L’IA peint vos images… (≈ 20 s)'; msg.className = 'msg'; msg.textContent = '';
      try {
        const r = await appelAPI('fond', jetonCF, { method: 'POST', body: JSON.stringify({ ambiance: etatFond.ambiance, idee: etatFond.idee, activite: activiteEnCours() }) });
        const j = await r.json();
        medias = j.medias;
        afficherAbonnement(j.compte);
        etatFond.message = { classe: 'ok', texte: '✓ ' + j.nouvelles.length + (j.nouvelles.length > 1 ? ' nouvelles images ajoutées' : ' nouvelle image ajoutée') + ' dans « Mes images » ci-dessus : touchez-en une pour l’utiliser.' };
      } catch (e) {
        etatFond.message = { classe: 'err', texte: e.message === 'Failed to fetch' ? 'Connexion impossible.' : e.message };
