    if (proposition) zoneRelecture.appendChild(relecture());

    boite.append(
      el('b', { class: 'ia-titre', text: '✨ Rédaction par l’IA' }),
      el('div', { class: 'aide', style: 'margin:4px 0 12px', text: 'Décrivez votre activité : l’IA rédige les pancartes, vous relisez, corrigez si besoin et validez.' }),
      el('label', { class: 'champ' }, [el('span', { text: '1. Votre activité en quelques mots' }), desc]),
      el('label', { class: 'champ' }, [el('span', { text: '2. Zone d’action' }), zone]),
      el('div', { class: 'grille2' }, [
        el('label', { class: 'champ' }, [el('span', { text: '3. Nombre de pancartes' }), nb]),
        el('label', { class: 'champ' }, [el('span', { text: 'Ton' }), ton])
      ]),
      go, msg, zoneRelecture);
    return boite;
  }

  /* Relecture : l'utilisateur corrige puis valide */
  function relecture() {
    const box = el('div', { class: 'ia-relecture' });
    const n = cfg.home.articles.filter(a => !a.masque).length;
    proposition.forEach((a, i) => {
      const t = el('input', { type: 'text', value: a.titre });
      t.addEventListener('input', () => { a.titre = t.value; majApercu(); });
      const x = el('textarea', { rows: 4, value: a.texte });
      x.addEventListener('input', () => { a.texte = x.value; majApercu(); });
      box.appendChild(el('div', { class: 'ia-art' }, [
        el('span', { class: 'etiq', text: 'Pancarte ' + (i + 1) + ' / ' + proposition.length }), t, x,
        el('div', { class: 'ia-compte', text: x.value.length + ' caractères' })
      ]));
      x.addEventListener('input', () => { x.nextSibling.textContent = x.value.length + ' caractères'; });
    });

    if (propositionSeo) {
      const S = propositionSeo;
      const compteur = (champ, min, max) => {
        const c = el('div', { class: 'ia-compte' });
        const maj = () => { const n = champ.value.length; c.textContent = n + ' caractères (idéal ' + min + '–' + max + ')'; c.style.color = n > max ? 'var(--err)' : ''; };
        champ.addEventListener('input', maj); maj();
        return c;
      };
      const t = el('input', { type: 'text', value: S.titre });
      t.addEventListener('input', () => { S.titre = t.value; });
      const d = el('textarea', { rows: 3, value: S.description });
      d.addEventListener('input', () => { S.description = d.value; });
      box.appendChild(el('div', { class: 'ia-art ia-seo' }, [
        el('span', { class: 'etiq', text: 'Référencement Google' }),
        el('div', { class: 'aide', style: 'margin:0', text: 'Mot-clé principal : ' + (S.motCle || '—') + (S.motsCles.length ? ' · secondaires : ' + S.motsCles.join(', ') : '') }),
        el('label', { class: 'champ', style: 'margin:0' }, [el('span', { text: 'Titre dans Google' }), t]), compteur(t, 50, 60),
        el('label', { class: 'champ', style: 'margin:0' }, [el('span', { text: 'Description dans Google' }), d]), compteur(d, 120, 155)
      ]));
    }

    const appliquer = mode => {
      if (propositionSeo) cfg.seo = Object.assign({}, cfg.seo, { titre: propositionSeo.titre, description: propositionSeo.description, motCle: propositionSeo.motCle, motsCles: propositionSeo.motsCles, zone: (cfg.seo && cfg.seo.zone) || (cfg.home.ia && cfg.home.ia.zone) || '' });
      propositionSeo = null;
      const anciens = cfg.home.articles;
      const nouveaux = proposition.map((a, i) => {
        const ref = mode === 'remplacer' ? anciens[i] : null;
        return { titre: a.titre, texte: a.texte, image: ref ? ref.image || '' : '', style: ref ? ref.style || 'texte' : 'texte' };
      });
      if (mode === 'remplacer' && !nouveaux[0].image && cfg.design.imageFond) { nouveaux[0].image = cfg.design.imageFond; nouveaux[0].style = 'photo'; }
      cfg.home.articles = mode === 'remplacer' ? nouveaux : anciens.concat(nouveaux).slice(0, HOME_MAX_ARTICLES);
      cfg.home.actif = true;
      proposition = null;
      vueApercu = 'home';
      construireFormulaire(); changement();
      const e = $('#etat'); e.className = 'etat'; e.textContent = 'Articles validés : cliquez sur Enregistrer pour publier';
    };
    const place = HOME_MAX_ARTICLES - cfg.home.articles.length;
    box.append(
      el('div', { class: 'aide', style: 'margin:6px 0 10px', text: 'Relisez et corrigez directement ci-dessus : l’aperçu se met à jour. Les photos des pancartes actuelles sont conservées.' }),
      el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: '✓ Valider et remplacer les ' + n + ' articles actuels', onclick: () => appliquer('remplacer') }),
      el('div', { class: 'ia-actions' }, [
        el('button', { type: 'button', class: 'btn btn-mini', text: '＋ Ajouter à la suite', disabled: place < proposition.length,
          title: place < proposition.length ? 'Pas assez de place (10 maximum)' : '', onclick: () => appliquer('ajouter') }),
        el('button', { type: 'button', class: 'btn btn-mini', text: '✕ Abandonner', onclick: () => { proposition = null; propositionSeo = null; construireFormulaire(); majApercu(); } })
      ]));
    return box;
  }

  function sectionSEO() {
    cfg.seo = Object.assign({ titre: '', description: '', zone: (cfg.home.ia && cfg.home.ia.zone) || '' }, cfg.seo || {});
    const S = cfg.seo;
    const apT = el('div', { class: 'g-titre' }), apU = el('div', { class: 'g-url', text: URL_PUBLIQUE.replace(/^https?:\/\//, '') }), apD = el('div', { class: 'g-desc' });
    const maj = () => {
      apT.textContent = couper(S.titre || [cfg.titre, cfg.sousTitre].filter(Boolean).join(' – '), 62);
      apD.textContent = couper(S.description || [cfg.sousTitre, cfg.pied].filter(Boolean).join('. '), 158);
    };
    const champ = (etiq, cle, min, max, multi, ph) => {
      const c = el(multi ? 'textarea' : 'input', multi ? { rows: 3, value: S[cle] || '', placeholder: ph } : { type: 'text', value: S[cle] || '', placeholder: ph });
      const cpt = el('div', { class: 'ia-compte' });
      const m2 = () => { const n = c.value.length; cpt.textContent = max ? n + ' caractères (idéal ' + min + '–' + max + ')' : ''; cpt.style.color = max && n > max ? 'var(--err)' : ''; };
      c.addEventListener('input', () => { S[cle] = c.value; m2(); maj(); changement(); });
      m2();
      return el('div', {}, [el('label', { class: 'champ', style: 'margin-bottom:4px' }, [el('span', { text: etiq }), c]), cpt]);
    };
    maj();
    return section('seo', 'Référencement Google', false, [
      el('div', { class: 'aide', style: 'margin:0 0 12px', text: 'À chaque enregistrement, le site publie aussi des pages HTML lisibles directement par Google, la fiche « entreprise locale », et le plan du site (sitemap.xml). La rédaction IA remplit ces champs automatiquement.' }),
      el('span', { class: 'etiq', text: 'Aperçu dans Google' }),
      el('div', { class: 'g-apercu' }, [apU, apT, apD]),
      champ('Titre dans Google', 'titre', 50, 60, false, 'Chauffeur privé Paris – Aéroports, Disneyland | Votre nom'),
      champ('Description dans Google', 'description', 120, 155, true, 'Une ou deux phrases : service, zone, incitation à contacter'),
      champ('Zone desservie (villes séparées par des virgules)', 'zone', 0, 0, false, 'Paris, Île-de-France, Normandie')
    ]);
  }

  function carteArticle(a, i) {
    const n = cfg.home.articles.length;
    const carte = el('div', { class: 'bouton-carte article-carte' + (a.masque ? ' masque' : '') });
    const deplacer = dir => {
      const j = i + dir; if (j < 0 || j >= n) return;
      const L = cfg.home.articles;
      [L[i], L[j]] = [L[j], L[i]];
      construireFormulaire(); changement();
    };
    carte.append(
      el('div', { class: 'ac-tete' }, [el('b', { text: 'Pancarte ' + (i + 1) }), caseAfficher(a, carte)]),
      champTexte('Titre', a, 'titre', { ph: 'Qui sommes-nous ?' }),
      (() => { const c = champTexte('Texte', a, 'texte', { multi: true, ph: 'Votre texte…' }); c.querySelector('textarea').rows = 5; return c; })(),
      segments('Mise en page', HOME_STYLES, a, 'style'),
      choixImage('Image', a, 'image', { nom: 'article', max: 1600, fond: true }),
      el('div', { class: 'bc-actions' }, [
        el('button', { type: 'button', class: 'btn btn-mini', text: '↑', disabled: i === 0, onclick: () => deplacer(-1) }),
        el('button', { type: 'button', class: 'btn btn-mini', text: '↓', disabled: i === n - 1, onclick: () => deplacer(1) }),
        el('span', { class: 'esp' }),
        el('button', { type: 'button', class: 'btn btn-mini', text: '🗑 Supprimer', disabled: n <= 1, onclick: () => {
          if (!confirm('Supprimer la pancarte « ' + (a.titre || 'sans titre') + ' » ?')) return;
          cfg.home.articles.splice(i, 1); construireFormulaire(); changement();
        } })
      ])
    );
    return carte;
  }

  function carteBouton(b, i) {
    if (b.type === 'reseaux') return carteReseaux(b, i);
    const n = cfg.boutons.length;
    const carte = el('div', { class: 'bouton-carte' + (b.masque ? ' masque' : '') });

    const ico = el('input', { type: 'text', class: 'ico', value: b.icone || '', placeholder: '🙂', maxLength: 4 });
    ico.addEventListener('input', () => { b.icone = ico.value; changement(); });
    const txt = el('input', { type: 'text', value: b.texte || '', placeholder: 'Texte du bouton' });
    txt.addEventListener('input', () => { b.texte = txt.value; changement(); });

    const type = el('select', {}, Object.keys(TYPES).map(k => el('option', { value: k, text: TYPES[k].nom, selected: b.type === k })));
    const valeur = el('input', { type: 'text', value: b.valeur || '', placeholder: (TYPES[b.type] || TYPES.lien).aide, autocapitalize: 'off', autocorrect: 'off', spellcheck: false });
    valeur.addEventListener('input', () => { b.valeur = valeur.value; changement(); });
    const zoneMsg = el('div');
    function majMsg() {
      zoneMsg.innerHTML = '';
      if (['whatsapp', 'sms', 'email'].includes(b.type)) {
        const m = el('textarea', { rows: 2, value: b.message || '', placeholder: 'Message pré-rempli (facultatif)' });
        m.addEventListener('input', () => { b.message = m.value; changement(); });
        zoneMsg.appendChild(el('label', { class: 'champ' }, [el('span', { text: 'Message pré-rempli' }), m]));
      }
    }
    type.addEventListener('change', () => {
      b.type = type.value;
      valeur.placeholder = TYPES[b.type].aide;
      aide.textContent = TYPES[b.type].aide;
      majMsg(); changement();
    });
    const aide = el('div', { class: 'aide', text: (TYPES[b.type] || TYPES.lien).aide });
    majMsg();

    const auto = el('input', { type: 'checkbox', checked: !b.couleur });
    const c = el('input', { type: 'color', value: b.couleur || cfg.design.accent || '#000000' });
    c.disabled = !b.couleur;
    auto.addEventListener('change', () => { c.disabled = auto.checked; b.couleur = auto.checked ? '' : c.value; changement(); });
    c.addEventListener('input', () => { b.couleur = c.value; changement(); });

    const deplacer = dir => {
      const j = i + dir; if (j < 0 || j >= n) return;
      [cfg.boutons[i], cfg.boutons[j]] = [cfg.boutons[j], cfg.boutons[i]];
      construireFormulaire(); changement();
    };

    const masquer = caseAfficher(b, carte);

    carte.append(
      el('div', { class: 'bc-haut' }, [ico, txt]),
      el('div', { class: 'grille2' }, [
        el('label', { class: 'champ' }, [el('span', { text: 'Action' }), type]),
        el('label', { class: 'champ' }, [el('span', { text: 'Valeur' }), valeur])
      ]),
      aide, zoneMsg,
      el('div', { class: 'bc-coul' }, [c, el('label', { style: 'display:flex;align-items:center;gap:6px' }, [auto, 'Couleur du thème'])]),
      el('div', { class: 'bc-actions' }, [
        el('button', { type: 'button', class: 'btn btn-mini', text: '↑', disabled: i === 0, onclick: () => deplacer(-1) }),
        el('button', { type: 'button', class: 'btn btn-mini', text: '↓', disabled: i === n - 1, onclick: () => deplacer(1) }),
        masquer,
        el('span', { class: 'esp' }),
        el('button', { type: 'button', class: 'btn btn-mini', text: '🗑 Supprimer', onclick: () => {
          if (!confirm('Supprimer le bouton « ' + (b.texte || 'sans titre') + ' » ?')) return;
          cfg.boutons.splice(i, 1); construireFormulaire(); changement();
        } })
      ])
    );
    return carte;
  }

  /* ---------------- Enregistrement ---------------- */
  $('#btn-enregistrer').addEventListener('click', async () => {
    const btn = $('#btn-enregistrer'), etat = $('#etat');
    btn.disabled = true; etat.className = 'etat'; etat.textContent = 'Enregistrement…';
    try {
      // 1. images d'abord, pour que la page ne pointe jamais vers une image absente
      const chemins = Object.keys(imagesAEnvoyer).filter(p => JSON.stringify(cfg).includes(p));
      for (const p of chemins) {
        etat.textContent = 'Envoi de l’image…';
        await gh.ecrire(p, imagesAEnvoyer[p], 'Image : ' + p, null);
        delete imagesAEnvoyer[p];
      }
      // 2. configuration
      etat.textContent = 'Publication…';
      const contenu = b64.depuisTexte(JSON.stringify(cfg, null, 2) + '\n');
      try {
        shaConfig = await gh.ecrire('config.json', contenu, 'Mise à jour de la page', shaConfig);
      } catch (e) {
        if (e.status !== 409 && e.status !== 422) throw e;
        shaConfig = await gh.ecrire('config.json', contenu, 'Mise à jour de la page'); // sha relu
      }
      // 3. pages fixes pour Google (seulement les fichiers qui changent)
      etat.textContent = 'Mise à jour du référencement…';
      try {
        const fichiers = genererFichiersSite(cfg, URL_PUBLIQUE, document);
        for (const nom of Object.keys(fichiers)) {
          const actuel = await gh.lire(nom);
          const sansDate = t => String(t || '').replace(/<lastmod>[^<]*<\/lastmod>/g, '');
          if (actuel && sansDate(actuel.texte) === sansDate(fichiers[nom])) continue;
          await gh.ecrire(nom, b64.depuisTexte(fichiers[nom]), 'Référencement : ' + nom, actuel ? actuel.sha : null);
        }
      } catch (e) {
        console.warn('Référencement non mis à jour', e);
      }
      modifie = false;
      etat.className = 'etat ok';
      etat.textContent = '✓ Publié. Visible sur la page d’ici 1 à 2 minutes.';
    } catch (e) {
      etat.className = 'etat err';
      etat.textContent = e.status === 401 ? 'Accès refusé : jeton expiré. Prévenez Roman.' : 'Échec : ' + e.message;
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
