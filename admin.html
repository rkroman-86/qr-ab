  function boutonsCarte() { return cfg.boutons.filter(b => b && !b.masque && b.type !== 'reseaux' && String(b.valeur || '').trim()); }
  function defautsCarte() {
    const btns = boutonsCarte();
    const tel = contactPage(cfg, ['tel', 'sms', 'whatsapp']);
    const mail = contactPage(cfg, ['email']);
    const site = cfg.reseaux.find(r => r.id === 'site' && r.actif && String(r.valeur || '').trim());
    const web = (site ? site.valeur : (btns.find(b => b.type === 'lien') || {}).valeur) || URL_PUBLIQUE;   // sinon l'adresse de la page elle-même
    return {
      nom: cfg.titre || '',

  function reglagesCarte() { return cfg.carteInfos && typeof cfg.carteInfos === 'object' ? cfg.carteInfos : {}; }
  // Logo imprimé au recto / au verso (27/11 ; ancien réglage logo: false = sur aucune face) — ne compte pas dans les 5 informations
  function logoFaces() { const r = reglagesCarte(), non = r.logo === false; return { recto: !!cfg.logo && !non && r.logoRecto !== false, verso: !!cfg.logo && !non && r.logoVerso !== false }; }
  function logoSurCarte() { const l = logoFaces(); return l.recto || l.verso; }
  function persoCarte() { const p = reglagesCarte().perso; return Array.isArray(p) ? p.filter(x => x && x.id) : []; }
  function modifierCarte(f) { cfg.carteInfos = Object.assign({}, reglagesCarte(), { choix: choixCarte() }); f(cfg.carteInfos); changement(); }
  function valeursCarte() {
    const d = defautsCarte(), r = reglagesCarte(), v = {};
    CHAMPS_CARTE.forEach(([k]) => { v[k] = String(r[k] || '').trim() || d[k]; });

  // Ordre complet (27/11) : nom, slogan et coordonnées. Les champs perso peuvent monter au-dessus du nom ou entre le nom et le slogan ;
  // téléphone, e-mail et site restent sous le slogan. Ancien réglage (sans « nom ») : nom et slogan en tête.
  function ordreCompletCarte() {
    const coords = ['tel', 'email', 'site'].concat(persoCarte().map(p => p.id));
    let o = (Array.isArray(reglagesCarte().ordre) ? reglagesCarte().ordre : []).filter((k, i, a) => (k === 'nom' || k === 'slogan' || coords.includes(k)) && a.indexOf(k) === i);
    if (!o.includes('nom')) o = ['nom'].concat(o);
    if (!o.includes('slogan')) o.splice(o.indexOf('nom') + 1, 0, 'slogan');
    if (o.indexOf('slogan') < o.indexOf('nom')) { o = o.filter(k => k !== 'slogan'); o.splice(o.indexOf('nom') + 1, 0, 'slogan'); }
    const hautStd = o.slice(0, o.indexOf('slogan')).filter(k => ['tel', 'email', 'site'].includes(k));
    o = o.filter(k => !hautStd.includes(k));
    o.splice(o.indexOf('slogan') + 1, 0, ...hautStd);

  function ordreCoordsCarte() { return ordreCompletCarte().filter(k => k !== 'nom' && k !== 'slogan'); }
  // Informations cochées pour une face (recto : choix ; verso : choixVerso, sinon les mêmes que le recto)
  function choixCarte(v, face) {
    const r = reglagesCarte(), cles = ordreCompletCarte();
    if (face === 'verso' && Array.isArray(r.choixVerso)) return cles.filter(k => r.choixVerso.includes(k)).slice(0, MAX_INFOS_CARTE);
    if (Array.isArray(r.choix)) return cles.filter(k => r.choix.includes(k)).slice(0, MAX_INFOS_CARTE);
    v = v || valeursCarte();
    return cles.filter(k => v[k]).slice(0, MAX_INFOS_CARTE);   // par défaut : tout ce qui est rempli
  }
  function infosCarte(face) {
    const v = valeursCarte(), ch = choixCarte(v, face), coords = [], coordsCles = [], avant = [], avantCles = [], entre = [], entreCles = [];
    const perso = {}; persoCarte().forEach(p => { perso[p.id] = p; });
    const complet = ordreCompletCarte(), iNom = complet.indexOf('nom'), iSlogan = complet.indexOf('slogan');
    complet.filter(k => k !== 'nom' && k !== 'slogan' && ch.includes(k)).forEach(k => {
      const i = complet.indexOf(k);
      // champ perso placé au-dessus du nom ou entre le nom et le slogan
      const [L, LC] = i < iNom ? [avant, avantCles] : i < iSlogan ? [entre, entreCles] : [coords, coordsCles];
      if (!String(v[k] || '').trim()) { L.push(['', '']); LC.push(k); return; }   // champ coché mais vide : un espace sur la carte
      const p = perso[k], type = p ? p.type : k;
      let val = v[k], etiq = p ? (String(p.etiq || '').trim() || tc(ETIQ_TYPE_CARTE[type] || '')) : tc(ETIQ_TYPE_CARTE[type]);
      if (type === 'tel') {
        if (!p) { const n = numeroInternational(val), wa = contactPage(cfg, ['whatsapp']); if (wa && n && numeroInternational(wa.valeur) === n) etiq = tc('Tél. / WhatsApp'); }
        if (String(val).replace(/\D/g, '').length >= 6) val = formaterNumero(val);
      } else if (type === 'site') val = val.replace(/^https?:\/\//i, '').replace(/\/$/, '');
      L.push([etiq, val]); LC.push(k);
    });
    return { nom: ch.includes('nom') ? v.nom : '', slogan: ch.includes('slogan') ? v.slogan : '', coords, coordsCles, avant, avantCles, entre, entreCles };
  }
  // Réglage dans la section « QR code et carte de visite »
  function blocInfosCarte(rafraichir) {
    const bloc = el('div', { class: 'infos-carte' });
    const dessiner = () => {
      bloc.innerHTML = '';
      const d = defautsCarte(), r = reglagesCarte(), ch = choixCarte(), chV = choixCarte(undefined, 'verso');
      const choixDe = face => face === 'verso' ? chV : ch;
      const pleinDe = face => choixDe(face).length >= MAX_INFOS_CARTE, plein = pleinDe('recto') || pleinDe('verso');
      const coche = k => ch.includes(k) || chV.includes(k);
      const persos = persoCarte(), ordre = ordreCompletCarte(), estStd = k => ['tel', 'email', 'site'].includes(k);
      const refaire = () => { dessiner(); rafraichir(); };
      bloc.append(el('span', { class: 'etiq', text: 'Informations sur la carte' }),
        el('div', { class: 'aide', style: 'margin:0 0 8px', text: 'Cochez les informations à imprimer : R au recto, V au verso (5 au plus par face). Elles sont reprises de votre page ; modifiez-les ici si vous voulez imprimer un autre numéro ou un autre e-mail (votre page ne change pas). ↑ ↓ changent l’ordre : un champ perso peut monter entre le nom et le slogan, ou au-dessus du nom.' }),
        blocQRFaces(rafraichir));
      // une case par face (5 informations au plus sur chaque face) ; le verso suit le recto tant qu'on ne l'a pas changé
      const caseFace = (k, face) => {
        const c = el('input', { type: 'checkbox', title: face === 'recto' ? t('Au recto') : t('Au verso') });
        c.checked = choixDe(face).includes(k); c.disabled = !c.checked && pleinDe(face);
        c.addEventListener('change', () => {
          const avantR = choixCarte(), avantV = choixCarte(undefined, 'verso');
          const n = (face === 'verso' ? avantV : avantR).filter(x => x !== k); if (c.checked) n.push(k);
          modifierCarte(o => {
            if (face === 'recto') { o.choix = n; o.choixVerso = avantV; } else o.choixVerso = n;
            if (o.choixVerso.slice().sort().join() === o.choix.slice().sort().join()) delete o.choixVerso;
          });
          refaire();
        });
        return el('label', { class: 'case-face' }, [c, el('span', { text: face === 'recto' ? t('R') : t('V') })]);
      };
      const caseCoche = k => el('span', { class: 'cases-faces' }, [caseFace(k, 'recto'), caseFace(k, 'verso')]);
      const fleches = k => {
        const i = ordre.indexOf(k);
        const bouger = dir => modifierCarte(o => { const n = ordre.slice(); [n[i], n[i + dir]] = [n[i + dir], n[i]]; o.ordre = n; }) || refaire();

      // Deux « Aa » par information : « Aa R » (recto) et « Aa V » (verso), chacun avec ses réglages

          el('div', { class: 'case-info' }, [caseCoche(k), el('span', { text: lib })]), input,

            perso ? el('button', { type: 'button', class: 'btn btn-mini', title: d[k], text: '↺ ' + t('Reprendre la page'), onclick: () => { modifierCarte(o => { delete o[k]; }); refaire(); } }) : null])),

      const lignePerso = p => {

          });
          if (cfg.typo) { delete cfg.typo[cleTypoCarte(p.id)]; delete cfg.typo[cleTypoCarte(p.id, 'verso')]; if (!Object.keys(cfg.typo).length) delete cfg.typo; }

      ordre.forEach(k => { const p = persos.find(x => x.id === k); bloc.append(p ? lignePerso(p) : ligneStd(k)); });
      const ajouter = el('button', { type: 'button', class: 'btn btn-mini', style: 'margin-top:4px', text: '＋ ' + t('Ajouter un champ'), disabled: persos.length >= MAX_PERSO_CARTE, onclick: () => {
        const id = 'p' + Date.now().toString(36);
        modifierCarte(o => {
          o.perso = persoCarte().concat([{ id, type: 'tel', etiq: '', valeur: '' }]);
          if (o.choix.length < MAX_INFOS_CARTE) o.choix = o.choix.concat([id]);
          if (Array.isArray(o.choixVerso) && o.choixVerso.length < MAX_INFOS_CARTE) o.choixVerso = o.choixVerso.concat([id]);
          o.ordre = ordreCompletCarte().filter(x => x !== id).concat([id]);
        });
        refaire();
        const lignes = bloc.querySelectorAll('.info-carte.perso'), champ = lignes.length && lignes[lignes.length - 1].querySelector('.perso-champs input:last-child');
        if (champ && !champ.disabled) champ.focus();
      } });
      bloc.append(ajouter, el('div', { class: 'aide', style: 'margin:4px 0 0', text: plein ? t('5 informations cochées sur une face : décochez-en une pour en afficher une autre.') : t('Champ perso : un 2e numéro, un autre e-mail, des horaires… Un champ coché laissé vide fait un espace sur la carte.') }));
    };
    dessiner();
    return bloc;
  }

  // Ajuste la taille de police pour tenir dans une largeur
  function policeAjustee(ctx, texte, poids, tailleMax, tailleMin, largeur, famille) {
    let t = tailleMax;
    do { ctx.font = poids + ' ' + t + 'px ' + famille; t -= 4; } while (ctx.measureText(texte).width > largeur && t > tailleMin);
    return ctx.font;
  }

  function coupeLignes(ctx, texte, largeur, max) {
    const mots = String(texte).split(/\s+/), lignes = [];
    let l = '';
    mots.forEach(m => {
      const essai = l ? l + ' ' + m : m;
      if (ctx.measureText(essai).width > largeur && l) { lignes.push(l); l = m; } else l = essai;
    });
    if (l) lignes.push(l);
    if (lignes.length > max) { lignes.length = max; lignes[max - 1] = lignes[max - 1].replace(/\s*\S*$/, '') + '…'; }
    return lignes;
  }

  // Coordonnées « en ligne » : les 2 premières sur une ligne, les suivantes par deux sur des lignes un peu plus petites
  // Une coordonnée par ligne, jamais deux à la suite (28/11 : « · » faisait déborder sur le QR ou les filets)
  function lignesCoords(coords) { return coords.map(x => String(x[1] || '')); }
  function rectArrondi(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* ---------- Cartes de visite : 85 × 55 mm à 600 dpi ---------- */
  const MODELES_CARTE = {
    photo:   'Photo',
    epure:   'Épuré',
    luxe:    'Luxe',
    bandeau: 'Bandeau',
    centre:  'Centré',
    couleur: 'Couleur',
    diagonale: 'Diagonale',
    cadre:   'Cadre',
    photoHaut: 'Photo en haut',
    minimal: 'Minimal',
    ticket:  'Ticket',
    qrXL:    'QR géant',
    vague:   'Vague',
    pastille: 'Pastille',
    nuit:    'Nuit',
    monogramme: 'Monogramme',
    viseur:  'Viseur',
    kraft:   'Kraft',
    vertical: 'Vertical',
    verticalEpure: 'Vertical épuré',
    droite:  'Droite épuré',
    droitePhoto: 'Droite photo',
    droiteColonne: 'Droite colonne',
    droitePrestige: 'Droite prestige',
    verso:   'Verso QR',
    versoCouleur: 'Verso couleur'
  };
  const TAILLES_CARTE = { vertical: { W: 1300, H: 2008 }, verticalEpure: { W: 1300, H: 2008 } };

  function luminance(hex) {
    const rgb = hexVersRgb(hex) || [0, 0, 0];
    const [r, g, b] = rgb.map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  async function preparerCarte() {
    const d = cfg.design;
    const res = p => imagesLocales[p] || p;
    return {
      W: 2008, H: 1300, P: 110, d,
      fam: await (async () => {                          // polices hébergées (Playfair, Lora, Nunito) chargées avant de dessiner
        const fam = (FONTS[d.police] || FONTS.moderne).css;
        const fams = [fam].concat(Object.values(typoCarte()).concat(Object.values(typoCarte('verso'))).filter(x => x.p && FONTS[x.p]).map(x => FONTS[x.p].css));
        try { if (document.fonts) await Promise.all([].concat(...fams.map(f => ['400', '700', 'italic 400', 'italic 700'].map(w => document.fonts.load(w + ' 40px ' + f))))); } catch (e) {}
        return fam;
      })(),
      typo: typoCarte(),
      fondImg: await chargerImageCadree(d.imageFond, d.imageFondCadre, res),
      // fonds choisis pour le recto / le verso (vide : image de fond de la page contact)
      fondsCarte: await (async () => {
        const r = reglagesCarte(), m = {};
        for (const [c, cad] of [[r.fondRecto, r.fondRectoCadre], [r.fondVerso, r.fondVersoCadre]]) if (c && typeof c === 'string' && !(c in m)) m[c] = await chargerImageCadree(c, cad, res);
        return m;
      })(),
      logo: await chargerImage(cfg.logo && logoSurCarte() ? res(cfg.logo) : ''),
      ...infosCarte('recto'),
      infos: { recto: Object.assign(infosCarte('recto'), { typo: typoCarte() }), verso: Object.assign(infosCarte('verso'), { typo: typoCarte('verso') }) }      // informations et « Aa » propres à chaque face
    };
  }

  function couvrir(ctx, img, x, y, w, h) {
    const k = Math.max(w / img.width, h / img.height);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, x + (w - img.width * k) / 2, y + (h - img.height * k) / 2, img.width * k, img.height * k);
    ctx.restore();
  }

  function dessinerLogo(ctx, D, x, y, T) {
    const logo = D.logo; if (!logo) return 0;
    if (D.d.logoRond) {
      ctx.save(); ctx.beginPath(); ctx.arc(x + T / 2, y + T / 2, T / 2, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
      const k = Math.max(T / logo.width, T / logo.height);
      ctx.drawImage(logo, x + (T - logo.width * k) / 2, y + (T - logo.height * k) / 2, logo.width * k, logo.height * k);
      ctx.restore();
    } else {
      const k = Math.min(T / logo.width, T / logo.height);
      ctx.drawImage(logo, x + (T - logo.width * k) / 2, y + (T - logo.height * k) / 2, logo.width * k, logo.height * k);
    }
    return T;
  }

  // Bloc QR (fond blanc arrondi, légende facultative) ; renvoie la hauteur
  function dessinerBlocQR(ctx, D, x, y, taille, legende, ombre) {
    const m = Math.round(taille * 0.085);
    const h = taille + (legende ? Math.round(taille * 0.17) : 0);
    if (qrCarteMasque) return h;
    ctx.save();
    if (ombre) { ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 10; }
    ctx.fillStyle = '#ffffff'; rectArrondi(ctx, x, y, taille, h, Math.round(taille * 0.07)); ctx.fill();
    ctx.restore();
    dessinerQR(ctx, URL_QR, x + m, y + m, taille - 2 * m, '#111');
    if (legende) {
      ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '700 ' + Math.round(taille * 0.075) + 'px ' + D.fam;
      ctx.fillText(tc(legende), x + taille / 2, y + h - Math.round(taille * 0.065));
      ctx.textAlign = 'left';
    }
    return h;
  }

  /* Lignes de champs perso placées au-dessus du nom ou entre le nom et le slogan : « ÉTIQUETTE valeur » sur une ligne.
     x, largeur = bloc de texte ; renvoie le y suivant. */
  function lignesInfos(ctx, D, liste, x, y, largeur, align, couleur, accent, taille) {
    if (!liste || !liste.length) return y;
    taille = taille || 46;
    const av = { a: ctx.textAlign, b: ctx.textBaseline, f: ctx.fillStyle, g: ctx.globalAlpha, p: ctx.font };
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.globalAlpha = 1;
    liste.forEach(([etiq, val]) => {
      if (val) {
        const E = Math.round(taille * 0.72), te = etiq ? String(etiq).toUpperCase() : '';
        let we = 0;
        if (te) { ctx.font = '700 ' + E + 'px ' + D.fam; we = ctx.measureText(te).width + Math.round(taille * 0.35); }
        const fv = policeAjustee(ctx, val, '600', taille, Math.min(28, taille), Math.max(120, largeur - we), D.fam);
        ctx.font = fv;
        const wv = ctx.measureText(val).width;
        const x0 = align === 'center' ? x + (largeur - we - wv) / 2 : align === 'right' ? x + largeur - we - wv : x;
        if (te) { ctx.font = '700 ' + E + 'px ' + D.fam; ctx.fillStyle = accent || couleur; ctx.fillText(te, x0, y + Math.round((taille - E) * 0.55)); }
        ctx.font = fv; ctx.fillStyle = couleur; ctx.fillText(val, x0 + we, y);
      }
      y += Math.round(taille * 1.3);
    });
    ctx.textAlign = av.a; ctx.textBaseline = av.b; ctx.fillStyle = av.f; ctx.globalAlpha = av.g; ctx.font = av.p;
    return y;
  }
  const hauteurInfos = (liste, taille) => (liste || []).length * Math.round((taille || 46) * 1.3);

  // Titre + sous-titre + trait + coordonnées ; align 'left' ou 'center'
  function dessinerTextes(ctx, D, x, y, largeur, c, align) {
    const cfgT = { titre: D.nom, sousTitre: D.slogan }, fam = D.fam;
    const ax = align === 'center' ? x + largeur / 2 : align === 'right' ? x + largeur : x;
    ctx.textAlign = align; ctx.textBaseline = 'top';
    if (D.avant && D.avant.length) { y = lignesInfos(ctx, D, D.avant, x, y, largeur, align, c.texte, c.accent, 46) + 8; ctx.textAlign = align; ctx.textBaseline = 'top'; }
    if (cfgT.titre) {
      ctx.fillStyle = c.texte;
      ctx.font = policeAjustee(ctx, cfgT.titre, '800', c.titre || 124, 60, largeur, fam);
      let t = parseInt(ctx.font.match(/(\d+)px/)[1], 10);
      if (ctx.measureText(cfgT.titre).width <= largeur) { ctx.fillText(cfgT.titre, ax, y); y += t * 1.18; }
      else {
        // trop long même en petit : deux lignes plutôt qu'un titre qui déborde sur le QR ou hors de la carte
        let lignes;
        t = Math.min(c.titre || 124, 100);
        do { ctx.font = '800 ' + t + 'px ' + fam; lignes = coupeLignes(ctx, cfgT.titre, largeur, 2); t -= 4; }
        while (lignes.some(l => ctx.measureText(l).width > largeur) && t > 40);
        t += 4;
        lignes.forEach(l => { ctx.fillText(l, ax, y); y += t * 1.12; });
        y += t * 0.08;
      }
    }
    if (D.entre && D.entre.length) { y = lignesInfos(ctx, D, D.entre, x, y, largeur, align, c.texte, c.accent, 46) + 4; ctx.textAlign = align; ctx.textBaseline = 'top'; }
    if (cfgT.sousTitre) {
      ctx.font = '400 ' + (c.sous || 54) + 'px ' + fam; ctx.fillStyle = c.texte; ctx.globalAlpha = 0.8;
      coupeLignes(ctx, sansLiens(cfgT.sousTitre), largeur, 2).forEach(l => { ctx.fillText(l, ax, y); y += (c.sous || 54) * 1.26; });
      ctx.globalAlpha = 1;
    }
    y += 30;
    ctx.fillStyle = c.accent; ctx.fillRect(align === 'center' ? ax - 65 : align === 'right' ? ax - 130 : x, y, 130, 8); y += 56;
    if (c.enLigne) {
      // une coordonnée par ligne, toutes à la même taille (celle qui fait tenir la plus longue dans la largeur)
      const lignes = lignesCoords(D.coords);
      let tl = lignes.length > 3 ? 46 : 52;
      lignes.forEach(l => { if (l) { ctx.font = policeAjustee(ctx, l, '600', tl, 24, largeur, fam); tl = Math.min(tl, parseInt(ctx.font.match(/(\d+)px/)[1], 10)); } });
      ctx.fillStyle = c.texte;
      lignes.forEach(l => {
        ctx.font = '600 ' + tl + 'px ' + fam;
        if (l) ctx.fillText(l, ax, y);
        y += Math.round(tl * 1.32);
      });
      y += 8;
    } else {
      D.coords.forEach(([etiq, val]) => {
        ctx.font = '700 40px ' + fam; ctx.fillStyle = c.accent; ctx.fillText(etiq.toUpperCase(), ax, y);
        ctx.fillStyle = c.texte; ctx.font = policeAjustee(ctx, val, '600', 56, 24, largeur, fam);
        ctx.fillText(val, ax, y + 46); y += 128;
      });
    }
    ctx.textAlign = 'left';
    return y;
  }

  /* Textes centrés verticalement entre haut et bas : hauteur mesurée sur une carte brouillon (mêmes réglages « Aa »), puis dessin */
  function textesAuMilieu(ctx, D, x, largeur, c, align, haut, bas) {
    const cv = document.createElement('canvas'); cv.width = D.W; cv.height = D.H;
    const h = dessinerTextes(contexteTypo(cv.getContext('2d'), D), D, x, 0, largeur, c, align) - (c.enLigne ? 20 : 30);
    return dessinerTextes(ctx, D, x, Math.round(haut + Math.max(0, (bas - haut - h) / 2)), largeur, c, align);
  }
  /* Colonne de gauche des modèles « texte à droite » : logo au-dessus du QR, le tout centré verticalement.
     Sans QR : logo seul, plus grand. Renvoie rien. */
  function colonneLogoQR(ctx, D, x, largeur, o) {
    const { H } = D, ecart = 50;
    const q = qrCarteMasque ? 0 : Math.min(o.q || 470, largeur);
    const T = D.logo ? (q ? (o.logo || 170) : Math.min(o.logoSeul || 340, largeur)) : 0;
    const hq = q ? Math.round(q * (o.legende ? 1.17 : 1)) + (o.sousQR ? 64 : 0) : 0;
    const total = T + hq + (T && hq ? ecart : 0);
    let y = Math.round((H - total) / 2);
    if (T) { dessinerLogo(ctx, D, x + (largeur - T) / 2, y, T); y += T + ecart; }
    if (!q) return;
    const qx = Math.round(x + (largeur - q) / 2);
    if (o.nu) dessinerQR(ctx, URL_QR, qx, y, q, '#111');
    else dessinerBlocQR(ctx, D, qx, y, q, o.legende ? 'Scannez-moi' : '', !!o.ombre);
    if (o.sousQR) legendeQR(ctx, D, 'Scannez-moi', qx + q / 2, y + q + 22, o.sousQR, 40);
  }

  function dessinerPied(ctx, D, x, y, couleur, align) {
    if (!cfg.pied) return;
    ctx.font = '500 40px ' + D.fam; ctx.fillStyle = couleur; ctx.globalAlpha = .7;
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = align || 'left';
    ctx.fillText(sansLiens(cfg.pied).split('\n')[0], x, y);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function fondPage(ctx, D, x, y, w, h, voileMin) {
    if (D.fondImg) {
      couvrir(ctx, D.fondImg, x, y, w, h);
      ctx.fillStyle = 'rgba(0,0,0,' + Math.max(voileMin, (Number(D.d.voile) || 0) / 100) + ')';
      ctx.fillRect(x, y, w, h);
      return '#ffffff';
    }
    const g = ctx.createLinearGradient(x, y, x + w * 0.4, y + h);
    g.addColorStop(0, D.d.fond); g.addColorStop(1, D.d.fond2 || D.d.fond);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    return D.d.texte;
  }

  // Liste des coordonnées seule (étiquette + valeur)
  function dessinerCoords(ctx, D, x, y, largeur, c, align) {
    const ax = align === 'center' ? x + largeur / 2 : x;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
    const k = c.hauteur && D.coords.length ? Math.max(0.62, Math.min(1, c.hauteur / (D.coords.length * (c.pas || 128)))) : 1;   // 4–5 lignes : resserré
    const E = Math.round((c.etiq || 40) * k), V = Math.round((c.val || 56) * k), pas = Math.round((c.pas || 128) * k);
    D.coords.forEach(([etiq, val]) => {
      if (etiq) { ctx.font = '700 ' + E + 'px ' + D.fam; ctx.fillStyle = c.accent; ctx.fillText(etiq.toUpperCase(), ax, y); }

      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      const x = xa + 90;
      dessinerTextes(ctx, D, x, 150, W - x - P + 20, { texte: '#1a1a1a', accent, titre: 104, sous: 48 }, 'left');
      dessinerPied(ctx, D, x, H - P + 20, '#1a1a1a');
    },
    cadre(ctx, D) {
      const { W, H } = D;
      fondPage(ctx, D, 0, 0, W, H, 0.25);
      const m = 80;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 12;
      ctx.fillStyle = 'rgba(255,255,255,.95)'; rectArrondi(ctx, m, m, W - 2 * m, H - 2 * m, 50); ctx.fill(); ctx.restore();
      const P = m + 90;
      const q = 480, bx = W - P - q;
      dessinerQR(ctx, URL_QR, bx, (H - q) / 2 - 24, q, '#111');
      ctx.fillStyle = '#666'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '600 38px ' + D.fam;
      ctx.fillText(tc('Scannez-moi'), bx + q / 2, (H + q) / 2 - 4); ctx.textAlign = 'left';
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      let y = P - 10 + (D.logo ? dessinerLogo(ctx, D, P, P - 10, 170) + 44 : 20);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte: '#1a1a1a', accent, titre: 100, sous: 46 }, 'left');
    },
    photoHaut(ctx, D) {
      const { W, H, P } = D;
      const Hh = Math.round(H * 0.5);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      if (D.fondImg) fondPage(ctx, D, 0, 0, W, Hh, 0.4); else fondAccent(ctx, D, 0, 0, W, Hh);
      const blanc = D.fondImg ? '#ffffff' : couleurIcone(D.d.accent);
      const q = 470, qx = W - P - q, qy = Hh - 120;
      let x = P;
      if (D.logo) { dessinerLogo(ctx, D, P, Hh - 250, 200); x = P + 250; }
      const Lt = qx - x - 50;
      const hE = hauteurInfos(D.entre, 40), yNom = Hh - (D.slogan ? 130 : 70) - hE;
      lignesInfos(ctx, D, D.avant, x, yNom - 104 - hauteurInfos(D.avant, 40), Lt, 'left', blanc, blanc, 40);
      lignesInfos(ctx, D, D.entre, x, yNom + 18, Lt, 'left', blanc, blanc, 40);
      ctx.fillStyle = blanc; ctx.textBaseline = 'alphabetic';
      ctx.font = policeAjustee(ctx, D.nom || '', '800', 112, 52, Lt, D.fam);
      ctx.fillText(D.nom || '', x, yNom);
      if (D.slogan) {
        ctx.font = policeAjustee(ctx, sansLiens(D.slogan), '400', 50, 28, Lt, D.fam); ctx.globalAlpha = .85;
        ctx.fillText(sansLiens(D.slogan), x, Hh - 64); ctx.globalAlpha = 1;
      }
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      dessinerBlocQR(ctx, D, qx, qy, q, '', true);
      dessinerCoords(ctx, D, P, Hh + 80, qx - P - 80, { texte: '#1a1a1a', accent, val: 52, pas: 116, hauteur: H - (cfg.pied ? 120 : 60) - Hh - 80 }, 'left');
      dessinerPied(ctx, D, P, H - 70, '#1a1a1a');
    },
    minimal(ctx, D) {
      const { W, H } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      let y = 110;
      if (D.logo) { dessinerLogo(ctx, D, (W - 170) / 2, y, 170); y += 170 + 40; } else y += 60;
      y = lignesInfos(ctx, D, D.avant, 150, y, W - 300, 'center', '#444', accent, 40);
      ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = policeAjustee(ctx, D.nom || '', '300', 104, 56, W - 300, D.fam);
      ctx.fillText(D.nom || '', W / 2, y); y += 130;
      if (D.entre && D.entre.length) { y = lignesInfos(ctx, D, D.entre, 150, y - 10, W - 300, 'center', '#444', accent, 40) + 10; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; }
      ctx.fillStyle = accent; ctx.fillRect(W / 2 - 50, y, 100, 5); y += 40;
      const lignes = lignesCoords(D.coords);
      ctx.fillStyle = '#444'; ctx.font = policeAjustee(ctx, lignes[0] || '', '500', 48, 30, W - 300, D.fam);
      if (lignes[0]) ctx.fillText(lignes[0], W / 2, y);
      y += 90;
      lignes.slice(1).forEach(l => { ctx.font = policeAjustee(ctx, l, '500', 42, 28, W - 300, D.fam); if (l) ctx.fillText(l, W / 2, y - 22); y += 50; });
      const q = Math.min(440, H - y - 90);
      dessinerQR(ctx, URL_QR, (W - q) / 2, y, q, '#111');
      ctx.textAlign = 'left';
    },
    vertical(ctx, D) {
      const { W, H } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      let y = 130;
      if (D.logo) { dessinerLogo(ctx, D, (W - 280) / 2, y, 280); y += 280 + 60; } else y += 80;
      y = dessinerTextes(ctx, D, 110, y, W - 220, { texte, accent: D.d.accent, titre: 116, enLigne: false }, 'center');
      const q = 560;
      dessinerBlocQR(ctx, D, (W - q) / 2, Math.max(y + 10, H - 110 - q * 1.17), q, 'Scannez-moi', true);
    },
    /* Textes au milieu à droite — Épuré : fond blanc, QR et logo à gauche, filet de couleur sur le bord droit */
    droite(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = accentLisible(D);
      ctx.fillStyle = accent; ctx.fillRect(W - 26, 0, 26, H);
      const col = 560;
      colonneLogoQR(ctx, D, P, col, { q: 480, logo: 170, nu: true, sousQR: '#777' });
      const x = P + col + 110, L = W - 26 - P - x;
      textesAuMilieu(ctx, D, x, L, { texte: '#1a1a1a', accent, enLigne: true, titre: 112 }, 'right', 70, H - (cfg.pied ? 130 : 70));
      dessinerPied(ctx, D, W - 26 - P, H - 70, '#1a1a1a', 'right');
    },
    /* Textes au milieu à droite — Photo : image de fond (ou couleurs de la page), QR dans un cadre blanc à gauche */
    droitePhoto(ctx, D) {
      const { W, H, P } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.45);
      const col = 540;
      colonneLogoQR(ctx, D, P, col, { q: 470, logo: 180, legende: true, ombre: true });
      const x = P + col + 110, L = W - P - x;
      textesAuMilieu(ctx, D, x, L, { texte, accent: accentSurFond(D, texte), titre: 116 }, 'right', 70, H - (cfg.pied ? 130 : 70));
      dessinerPied(ctx, D, W - P, H - 70, texte, 'right');
    },
    /* Textes au milieu à droite — Colonne : bande de couleur (ou photo) à gauche avec logo et QR, textes sur blanc */
    droiteColonne(ctx, D) {
      const { W, H, P } = D;
      const B = 720;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      if (D.fondImg) fondPage(ctx, D, 0, 0, B, H, 0.4); else fondAccent(ctx, D, 0, 0, B, H);
      colonneLogoQR(ctx, D, 90, B - 180, { q: 460, logo: 180, logoSeul: 380, legende: true, ombre: true });
      const accent = accentLisible(D), x = B + 110, L = W - P - x;
      textesAuMilieu(ctx, D, x, L, { texte: '#1a1a1a', accent, titre: 108, sous: 50 }, 'right', 70, H - (cfg.pied ? 130 : 70));
      dessinerPied(ctx, D, W - P, H - 70, '#1a1a1a', 'right');
    },
    /* Textes au milieu à droite — Prestige : fond noir, filets dorés, QR à gauche */
    droitePrestige(ctx, D) {
      const { W, H, P } = D;
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#161616'); g.addColorStop(1, '#060606');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const or = luminance(D.d.accent) < 0.12 || luminance(D.d.accent) > 0.85 ? '#c9a45c' : D.d.accent;
      ctx.fillStyle = or; ctx.fillRect(0, 70, W, 4); ctx.fillRect(0, H - 74, W, 4);
      const col = 520;
      colonneLogoQR(ctx, D, P, col, { q: 460, logo: 170, legende: true });
      if (!qrCarteMasque || D.logo) { ctx.fillStyle = or; ctx.globalAlpha = .6; ctx.fillRect(P + col + 55, 190, 3, H - 380); ctx.globalAlpha = 1; }
      const x = P + col + 120, L = W - P - x;
      textesAuMilieu(ctx, D, x, L, { texte: '#f5efe0', accent: or, enLigne: true, titre: 112 }, 'right', 110, H - 110);
    },
    verso(ctx, D) {
      const { W, H } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.55);
      const q = 760;
      dessinerBlocQR(ctx, D, (W - q) / 2, 110, q, '', true);
      let yv = lignesInfos(ctx, D, D.avant, 150, 110 + q + 60, W - 300, 'center', texte, texte, 42);
      ctx.fillStyle = texte; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = policeAjustee(ctx, D.nom || '', '800', 96, 50, W - 300, D.fam);
      ctx.fillText(D.nom || '', W / 2, yv + (D.avant && D.avant.length ? 0 : 10)); yv += 120;
      yv = lignesInfos(ctx, D, D.entre, 150, yv, W - 300, 'center', texte, texte, 42);
      ctx.fillStyle = texte; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = '500 50px ' + D.fam; ctx.globalAlpha = .8;
      ctx.fillText(tc('Scannez pour réserver, appeler ou laisser un avis'), W / 2, Math.max(110 + q + 190, yv + 10));
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
  };

  // opt : { qr, logo } pour une face (true / false seul = QR ; par défaut : QR + logo du recto)
  async function genererCarte(modele, D, opt) {
    D = D || await preparerCarte();
    const parDefaut = () => ({ qr: true, logo: logoFaces().recto, fond: reglagesFaces().recto.fond });
    opt = typeof opt === 'boolean' ? Object.assign(parDefaut(), { qr: opt }) : Object.assign(parDefaut(), opt || {});
    const avecQR = opt.qr;
    if (!opt.logo && D.logo) D = Object.assign({}, D, { logo: null });
    if (opt.fond && D.fondsCarte && D.fondsCarte[opt.fond]) D = Object.assign({}, D, { fondImg: D.fondsCarte[opt.fond] });
    if (opt.cote && D.infos && D.infos[opt.cote]) D = Object.assign({}, D, D.infos[opt.cote]);
    if (TAILLES_CARTE[modele]) D = Object.assign({}, D, TAILLES_CARTE[modele]);
    else D = Object.assign({}, D, { W: 2008, H: 1300 });
    const cv = document.createElement('canvas');
    cv.width = D.W; cv.height = D.H;
    let ctx = contexteTypo(cv.getContext('2d'), D);
    if (avecQR === false) {
      // textes d'invitation à scanner écrits par les modèles eux-mêmes : retirés avec le QR
      const invit = ['Scannez-moi', 'Scannez-moi →', 'Scannez'].map(tc), phrase = tc('Scannez pour réserver, appeler ou laisser un avis');
      const brut = ctx;
      ctx = new Proxy(brut, {
        get(o, nom) {
          if (nom === 'fillText') return (t, ...a) => { const x = String(t || '').trim(); if (invit.includes(x) || (x.length > 3 && phrase.includes(x))) return; return o.fillText(t, ...a); };
          const v = o[nom];
          return typeof v === 'function' ? v.bind(o) : v;
        },
        set(o, nom, v) { o[nom] = v; return true; }
      });
    }
    qrCarteMasque = avecQR === false;
    try { (DESSINS_CARTE[modele] || DESSINS_CARTE.photo)(ctx, D); }
    finally { qrCarteMasque = false; }
    return cv;
  }
  // QR imprimé au recto / au verso (cfg.carteInfos.qrRecto / qrVerso, oui par défaut)
  function qrFaces() { const r = reglagesCarte(); return { recto: r.qrRecto !== false, verso: r.qrVerso !== false }; }
  // Réglages de chaque face (QR, logo) et faces différentes ou non
  function reglagesFaces() {
    const q = qrFaces(), l = logoFaces();
    const r = reglagesCarte(), fond = c => (typeof c === 'string' && c) || '';
    const recto = { cote: 'recto', qr: q.recto, logo: l.recto, fond: fond(r.fondRecto) }, verso = { cote: 'verso', qr: q.verso, logo: l.verso, fond: fond(r.fondVerso) };
    const memeInfos = choixCarte(undefined, 'recto').join() === choixCarte(undefined, 'verso').join() && JSON.stringify(typoCarte()) === JSON.stringify(typoCarte('verso'));
    return { recto, verso, differentes: recto.qr !== verso.qr || recto.logo !== verso.logo || recto.fond !== verso.fond || !memeInfos };
  }

  /* Réglages « Aa » des cartes appliqués sans toucher aux 26 modèles : chaque texte mesuré ou écrit est reconnu
     (nom, slogan, téléphone, e-mail, site — entier, une de ses lignes, ou en majuscules) et reçoit police, style,
     taille et couleur choisies. La mesure aussi : les ajustements « tenir dans la largeur » des modèles en tiennent compte. */
  const TAILLES_CARTE_TYPO = { xs: 0.8, s: 0.9, l: 1.12, xl: 1.25 };
  function contexteTypo(ctx, D) {
    const ty = D.typo || {};
    if (!Object.keys(ty).length) return ctx;
    const norm = x => String(x || '').toLowerCase().replace(/…$/, '').trim();
    const vals = {}; ['nom', 'slogan'].forEach(k => { if (D[k]) vals[k] = norm(sansLiens(D[k])); });
    (D.coords || []).forEach(([, val], i) => { const k = (D.coordsCles || [])[i]; if (k) vals[k] = norm(val); });
    (D.avant || []).forEach(([, val], i) => { const k = (D.avantCles || [])[i]; if (k) vals[k] = norm(val); });
    (D.entre || []).forEach(([, val], i) => { const k = (D.entreCles || [])[i]; if (k) vals[k] = norm(val); });
    function categorie(texte) {
      const x = norm(texte); if (!x) return null;
      for (const k in vals) if (vals[k] === x) return k;
      if (/\s·\s/.test(x)) { const a = x.split(/\s+·\s+/)[0]; for (const k in vals) if (vals[k] === a) return k; }   // coordonnées sur une ligne
      if (x.length < 2) return null;
      const dedans = Object.keys(vals).filter(k => vals[k].includes(x));
      if (dedans.length <= 1) return dedans[0] || null;
      const gras = /^(italic\s+)?([6-9]00|bold)/.test(ctx.font);                   // ambigu : titre en gras, slogan léger
      return dedans.includes(gras ? 'nom' : 'slogan') ? (gras ? 'nom' : 'slogan') : dedans[0];
    }
    function police(f, r) {
      const m = /^(?:(italic|normal)\s+)?(?:(\d{3}|bold|normal)\s+)?([\d.]+)px\s+(.+)$/.exec(f);
      if (!m) return f;
      let italique = m[1] === 'italic', poids = m[2] || '400';
      if (r.g) { poids = /gras/.test(r.g) ? '800' : '400'; italique = /italique/.test(r.g); }
      const taille = Math.round(parseFloat(m[3]) * (TAILLES_CARTE_TYPO[r.t] || 1));
      return (italique ? 'italic ' : '') + poids + ' ' + taille + 'px ' + (r.p && FONTS[r.p] ? FONTS[r.p].css : m[4]);
    }
    function avec(texte, couleur, fn) {
      const k = categorie(texte), r = k && ty[k];
      if (!r) return fn();
      const f0 = ctx.font, s0 = ctx.fillStyle;
      ctx.font = police(f0, r);
      if (couleur && /^#[0-9a-f]{6}$/i.test(r.c || '')) ctx.fillStyle = r.c;
      try { return fn(); } finally { ctx.font = f0; ctx.fillStyle = s0; }
    }
    return new Proxy(ctx, {
      get(o, nom) {
        if (nom === 'fillText') return (t, ...a) => avec(t, true, () => o.fillText(t, ...a));
        if (nom === 'strokeText') return (t, ...a) => avec(t, false, () => o.strokeText(t, ...a));
        if (nom === 'measureText') return t => avec(t, false, () => o.measureText(t));
        const v = o[nom];
        return typeof v === 'function' ? v.bind(o) : v;
      },
      set(o, nom, v) { o[nom] = v; return true; }
    });
  }

  // Cases « QR code au recto / au verso » (section QR code et carte de visite)
  function blocQRFaces(rafraichir) {
    const q = qrFaces(), l = logoFaces();
    const caseFace = (cleRecto, cleVerso, etat, face, lib, inactif) => {
      const cle = face === 'recto' ? cleRecto : cleVerso;
      const c = el('input', { type: 'checkbox' }); c.checked = etat[face]; c.disabled = !!inactif;
      c.addEventListener('change', () => {
        modifierCarte(o => {
          if (cle === 'logoRecto' || cle === 'logoVerso') {      // ancien réglage « logo sur aucune face » converti en deux cases
            if (o.logo === false) { delete o.logo; o.logoRecto = false; o.logoVerso = false; }
          }
          if (c.checked) delete o[cle]; else o[cle] = false;
        });
        majAide(); rafraichir();
      });
      return el('label', { class: 'case-info' }, [c, el('span', { text: lib })]);
    };
    const aide = el('div', { class: 'aide', style: 'margin:2px 0 0' });
    const majAide = () => {
      const f = reglagesFaces(), x = qrFaces();
      aide.textContent = t(f.differentes ? 'Recto et verso différents : chaque modèle est montré en recto et en verso.'
        : x.recto ? 'Recto et verso identiques : un aperçu par modèle.' : 'Sans QR code : un aperçu par modèle (la place du QR reste vide).');
    };
    majAide();
    return el('div', { class: 'qr-faces' }, [
      el('span', { class: 'etiq', text: 'QR code sur la carte' }),
      el('div', { class: 'qr-faces-cases' }, [caseFace('qrRecto', 'qrVerso', q, 'recto', t('Au recto')), caseFace('qrRecto', 'qrVerso', q, 'verso', t('Au verso'))]),
      el('span', { class: 'etiq', style: 'margin-top:8px', text: 'Logo sur la carte' }),
      el('div', { class: 'qr-faces-cases logo-faces' }, [caseFace('logoRecto', 'logoVerso', l, 'recto', t('Au recto'), !cfg.logo), caseFace('logoRecto', 'logoVerso', l, 'verso', t('Au verso'), !cfg.logo)]),
      cfg.logo ? null : el('div', { class: 'aide', style: 'margin:0', text: t('Pas de logo : ajoutez-en un dans la section Logo.') }),
      el('span', { class: 'etiq', style: 'margin-top:8px', text: 'Image de fond de la carte' }),
      choixFondCarte('recto', rafraichir), choixFondCarte('verso', rafraichir),
      aide]);
  }
  // Image de fond d'une face : « Mes images », galerie du téléphone ou photo ; vide = image de fond de la page contact
  function choixFondCarte(face, rafraichir) {
    const cle = face === 'recto' ? 'fondRecto' : 'fondVerso';
    const obj = {};               // passe-plat vers cfg.carteInfos (recréé par modifierCarte)
    Object.defineProperty(obj, cle, {
      get: () => { const v = reglagesCarte()[cle]; return typeof v === 'string' ? v : ''; },
      set: v => { modifierCarte(o => { if (v) o[cle] = v; else delete o[cle]; }); majResume(); rafraichir(); }
    });
    Object.defineProperty(obj, cle + 'Cadre', {
      get: () => reglagesCarte()[cle + 'Cadre'],
      set: v => { modifierCarte(o => { if (v) o[cle + 'Cadre'] = v; else delete o[cle + 'Cadre']; }); rafraichir(); }
    });
    const resume = el('span', { class: 'fond-resume' });
    const majResume = () => { resume.textContent = obj[cle] ? t('image choisie') : t('celle de la page contact'); };
    majResume();
    return el('details', { class: 'fond-carte' }, [
      el('summary', {}, [el('b', { text: face === 'recto' ? t('Fond du recto') : t('Fond du verso') }), ' : ', resume]),
      el('div', { class: 'aide', style: 'margin:4px 0 6px', text: t('« Retirer » remet l’image de fond de la page contact.') }),
      choixImage(face === 'recto' ? 'Image du recto' : 'Image du verso', obj, cle, { nom: 'fond', max: 1600, fond: true, photo: true, ratio: () => 2008 / 1300, apresImage: () => { majResume(); rafraichir(); } })]);
  }

  function nomFichierCarte(modele) {
    const base = (cfg.titre || 'page').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return 'carte-' + base + '-' + modele + '.jpg';
  }

  function sectionPartage() {
    const apercuQR = canvasQR(480);
    apercuQR.className = 'qr-apercu';
    const lien = el('div', { class: 'qr-url', text: URL_PUBLIQUE });
    const btnQR = el('button', { type: 'button', class: 'btn btn-mini', text: '⬇ QR code (PNG)', onclick: () => telecharger(canvasQR(1200), 'qr-code.png', 'image/png') });
    const btnCopier = el('button', { type: 'button', class: 'btn btn-mini', text: 'Copier le lien' });
    btnCopier.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(URL_PUBLIQUE); btnCopier.textContent = '✓ Copié'; }
      catch (e) { prompt(t('Lien de la page :'), URL_PUBLIQUE); }
      setTimeout(() => (btnCopier.textContent = 'Copier le lien'), 2000);
    });

    const zoneCarte = el('div', { class: 'carte-zone' });
    const grilleModeles = el('div', { class: 'modeles-carte' });
    let choisi = 'photo', choisiFace = 'recto', donnees = null;
    // Faces à montrer : QR identique sur les deux faces → une carte par modèle ; sinon recto ET verso de chaque modèle (2×)
    const facesCarte = () => { const f = reglagesFaces(); return !f.differentes ? [Object.assign({ face: '' }, f.recto)] : [Object.assign({ face: 'recto' }, f.recto), Object.assign({ face: 'verso' }, f.verso)]; };
    const libFace = f => f === 'recto' ? t('Recto') : f === 'verso' ? t('Verso') : '';

    async function afficherChoisi() {
      zoneCarte.innerHTML = '';
      const faces = facesCarte(), f = faces.find(x => x.face === choisiFace) || faces[0];

  /* =============== Commande de cartes imprimées (Cloudprinter, depuis le 19/11/2026) ===============
     Écran : recto (glisser), verso (interrupteur + glisser), quantité, prix produit + livraison ;
     puis adresses (préremplies, mémorisées) ; puis vérification (BAT) et paiement Stripe.
     Le fichier d'impression (PDF 91 × 61 mm = 85 × 55 + 3 mm de fond perdu, 1 ou 2 pages) est fabriqué ici. */
  const FOND_PERDU = 71;                            // 3 mm à 600 dpi
  function versPaysage(cv) {                        // cartes verticales : tournées pour le format paysage de l'imprimeur
    if (cv.width >= cv.height) return cv;
    const r = document.createElement('canvas'); r.width = cv.height; r.height = cv.width;
    const c = r.getContext('2d'); c.translate(r.width, 0); c.rotate(Math.PI / 2); c.drawImage(cv, 0, 0);
    return r;
  }
  function avecFondPerdu(cv) {                      // bords prolongés de 3 mm (étirement du dernier pixel de chaque bord)
    const s = versPaysage(cv), b = FOND_PERDU, W = s.width, H = s.height;
    const r = document.createElement('canvas'); r.width = W + 2 * b; r.height = H + 2 * b;
    const c = r.getContext('2d');
    c.drawImage(s, 0, 0, W, 1, b, 0, W, b); c.drawImage(s, 0, H - 1, W, 1, b, H + b, W, b);
    c.drawImage(s, 0, 0, 1, H, 0, b, b, H); c.drawImage(s, W - 1, 0, 1, H, W + b, b, b, H);
    c.drawImage(s, 0, 0, 1, 1, 0, 0, b, b); c.drawImage(s, W - 1, 0, 1, 1, W + b, 0, b, b);
    c.drawImage(s, 0, H - 1, 1, 1, 0, H + b, b, b); c.drawImage(s, W - 1, H - 1, 1, 1, W + b, H + b, b, b);
    c.drawImage(s, b, b);
    return r;
  }
  async function jpegOctets(cv) {
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.93));

  }
  /* PDF minimal : une page par face, image JPEG pleine page, boîtes de coupe (TrimBox) et de fond perdu (BleedBox) */
  async function pdfCartes(canvases) {
    const mm = v => (v * 72 / 25.4).toFixed(3);
    const W = mm(91), H = mm(61), T = mm(3), TW = mm(88), TH = mm(58);
    const enc = new TextEncoder(), parts = [], offs = [];
    let taille = 0;
    const ajouter = x => { const o = typeof x === 'string' ? enc.encode(x) : x; parts.push(o); taille += o.length; };
    const objet = (n, corps) => { offs[n] = taille; ajouter(n + ' 0 obj\n'); corps.forEach(ajouter); ajouter('\nendobj\n'); };
    ajouter('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const n = canvases.length, kids = [];
    for (let i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
    objet(1, ['<< /Type /Catalog /Pages 2 0 R >>']);
    objet(2, ['<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>']);
    for (let i = 0; i < n; i++) {
      const cv = avecFondPerdu(canvases[i]);
      const img = await jpegOctets(cv);
      const p = 3 + i * 3, im = p + 1, ct = p + 2;
      objet(p, ['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /BleedBox [0 0 ' + W + ' ' + H + '] /TrimBox [' + T + ' ' + T + ' ' + TW + ' ' + TH + '] /Resources << /XObject << /Im' + i + ' ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>']);
      objet(im, ['<< /Type /XObject /Subtype /Image /Width ' + cv.width + ' /Height ' + cv.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.length + ' >>\nstream\n', img, '\nendstream']);
      const flux = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im' + i + ' Do Q';
      objet(ct, ['<< /Length ' + flux.length + ' >>\nstream\n' + flux + '\nendstream']);
    }
    const xref = taille, total = 3 + n * 3;
    let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
    for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    ajouter(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
    const out = new Uint8Array(taille); let o = 0;
    parts.forEach(pt => { out.set(pt, o); o += pt.length; });
    return out;
  }

  function miniature(k) {
    const L = 'currentColor', A = 'var(--prim)';
    const logo = (x, y, r) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + L + '" opacity=".35"/>';
    const barre = (x, y, w, h, o) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + (h || 4) + '" rx="2" fill="' + L + '" opacity="' + (o || .55) + '"/>';
    const pts = (pos) => pos.map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (p[2] || 5) + '" fill="' + A + '"/>').join('');
    const grille = (x0, y0, n, pas) => { const a = []; for (let i = 0; i < n; i++) a.push([x0 + (i % 3) * pas, y0 + Math.floor(i / 3) * pas]); return a; };
    const col = (x, y0, n, pas) => { const a = []; for (let i = 0; i < n; i++) a.push([x, y0 + i * pas]); return a; };
    let c = '';
    switch (k) {
      case 'haut':    c = pts(grille(18, 14, 3, 12)) + logo(30, 48, 7) + barre(16, 60, 28) + barre(20, 67, 20, 3, .35); break;
      case 'bas':     c = logo(30, 26, 7) + barre(16, 38, 28) + barre(20, 45, 20, 3, .35) + pts(grille(18, 72, 6, 12)); break;
      case 'gauche':  c = pts(col(11, 26, 5, 12)) + logo(38, 36, 7) + barre(26, 48, 24) + barre(29, 55, 18, 3, .35); break;
      case 'droite':  c = pts(col(49, 26, 5, 12)) + logo(22, 36, 7) + barre(10, 48, 24) + barre(13, 55, 18, 3, .35); break;
      case 'carte':   c = logo(15, 30, 7) + barre(26, 26, 26) + barre(26, 33, 18, 3, .35) + pts(grille(14, 52, 6, 12).map(p => [p[0], p[1], 4.5])); break;
      case 'affiche': c = '<rect x="0" y="0" width="60" height="100" fill="' + L + '" opacity=".08"/>' + logo(13, 50, 5) + barre(8, 60, 40, 7, .7) + barre(8, 71, 30, 3, .35) + pts([[13, 84], [26, 84], [39, 84]]); break;
      case 'hautbas': c = pts([[18, 14], [30, 14], [42, 14]]) + logo(30, 42, 7) + barre(16, 54, 28) + barre(20, 61, 20, 3, .35) + pts([[18, 86], [30, 86], [42, 86]]); break;
      case 'cotes':   c = pts(col(9, 32, 3, 12)) + pts(col(51, 32, 3, 12)) + logo(30, 40, 7) + barre(19, 52, 22) + barre(22, 59, 16, 3, .35); break;
      default:        c = logo(30, 26, 8) + barre(16, 40, 28) + barre(20, 47, 20, 3, .35) + pts(grille(18, 62, 6, 12));
    }
    return '<svg viewBox="0 0 60 100" aria-hidden="true">' + c + '</svg>';

  function choixQR(avecHome) {

    };

    ]);
    Object.keys(options).forEach(v => {
      const b = el('button', { type: 'button', text: options[v], class: actuel() === v ? 'actif' : '' });

        if (v === 'contact' && !avecHome && h.arrivee === 'home') h.arrivee = 'home';   // Home désactivée : son choix d'arrivée reste en réserve

  function dataVersBlob(data) {
    const [ent, b] = data.split(',');
    const bin = atob(b), o = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
    return new Blob([o], { type: (ent.match(/data:([^;]+)/) || [])[1] || 'image/jpeg' });
  }

    return { grande, mini, l: dims[0], h: dims[1] };

      g.photos.forEach((ph, i) => {
        const deplacer = j => { const [x] = g.photos.splice(i, 1); g.photos.splice(j, 0, x); maj(); changement(); };
        grille.appendChild(el('div', { class: 'galp-vign' }, [
          el('img', { src: imagesLocales[ph.mini] || imagesLocales[ph.src] || ph.mini || ph.src, alt: '', loading: 'lazy' }),
          el('button', { type: 'button', class: 'galp-x', text: '✕', title: t('Retirer cette photo'), 'aria-label': t('Retirer cette photo'),
            onclick: () => { g.photos.splice(i, 1); oublier(ph); maj(); changement(); } }),
          el('button', { type: 'button', class: 'galp-g', text: '←', title: t('Déplacer vers la gauche'), disabled: i === 0, onclick: () => deplacer(i - 1) }),
          el('button', { type: 'button', class: 'galp-d', text: '→', title: t('Déplacer vers la droite'), disabled: i === n - 1, onclick: () => deplacer(i + 1) })
        ]));
      });
    }
    fichier.addEventListener('change', async () => {
      const tous = [...fichier.files];
      fichier.value = '';
      const place = GALERIE_MAX - g.photos.length;
      const liste = tous.slice(0, Math.max(0, place));
      if (!liste.length) { etat.textContent = t('La galerie est pleine (' + GALERIE_MAX + ' photos maximum).'); return; }
      enCours = true; maj();
      let echecs = 0;
      for (let k = 0; k < liste.length; k++) {
        etat.textContent = t('Préparation des photos ' + (k + 1) + ' / ' + liste.length + '…');
        try {
          const r = await preparerPhotoGalerie(liste[k]);
          const base = 'images/galerie-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
          const src = base + '.jpg', mini = base + '-m.jpg';
          imagesLocales[src] = r.grande; imagesAEnvoyer[src] = r.grande.split(',')[1];
          imagesLocales[mini] = r.mini; imagesAEnvoyer[mini] = r.mini.split(',')[1];
          g.photos.push({ src, mini, l: r.l, h: r.h });
        } catch (e) { echecs++; }
        if (k % 4 === 3) maj();
      }
      enCours = false;
      const msgs = [];
      if (liste.length - echecs) msgs.push(t((liste.length - echecs) + ' photo(s) ajoutée(s). Enregistrez pour les publier.'));
      if (echecs) msgs.push(t(echecs + ' photo(s) illisible(s), ignorée(s).'));
      if (tous.length > liste.length) msgs.push(t((tous.length - liste.length) + ' photo(s) en trop : ' + GALERIE_MAX + ' photos maximum.'));
      etat.textContent = msgs.join(' ');
      maj(); changement();
    });
    maj();
    corps.append(
      el('div', { class: 'galp-tete' }, [compteur, ajouter]),
      fichier, etat, grille,
      el('p', { class: 'aide', style: 'margin:10px 0 0', text: 'Les photos sont réduites automatiquement pour s’afficher vite et prendre peu de place. Les visiteurs ouvrent la galerie avec le bouton « 📷 » de la page contact (et de la barre de la page Home), puis touchent une photo pour la voir en grand et glissent pour passer à la suivante.' })
    );
    return section('galerie', 'Galerie photos', false, [corps]);
  }

  /* ---------------- Page personnalisée (ex. « Tarifs ») : pancartes comme la page Home ---------------- */
  let pancartePersoActive = 0;
  function sectionPerso() {
    if (!cfg.perso || typeof cfg.perso !== 'object') cfg.perso = { actif: false, titre: '', articles: [] };
    const P = cfg.perso;
    if (!Array.isArray(P.articles)) P.articles = [];
    const corps = el('div');                                 // affichée ou non : case du menu « Pages »
    const n = P.articles.length;
    pancartePersoActive = Math.max(0, Math.min(pancartePersoActive, n - 1));
    const liste = el('div', { class: 'carrousel-pancartes carrousel-perso' });
    const cartes = P.articles.map((a, i) => carteArticle(a, i, 'perso'));
    cartes.forEach(c => liste.appendChild(c));
    const precedente = el('button', { type: 'button', class: 'btn', text: '◀', 'aria-label': t('Pancarte précédente') });
    const suivante = el('button', { type: 'button', class: 'btn', text: '▶', 'aria-label': t('Pancarte suivante') });
    const compteur = el('span');
    function montrer(k, sens) {
      if (!n) return;
      pancartePersoActive = Math.max(0, Math.min(k, n - 1));
      cartes.forEach((c, j) => {
        c.classList.toggle('cache', j !== pancartePersoActive);
        c.classList.toggle('depuis-gauche', sens < 0);
        if (j === pancartePersoActive && sens) { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; }
      });
      compteur.textContent = t('Pancarte ' + (pancartePersoActive + 1) + ' / ' + n);
      precedente.disabled = pancartePersoActive === 0; suivante.disabled = pancartePersoActive === n - 1;
      if (sens) { const c = cartes[pancartePersoActive], r = c.getBoundingClientRect(); if (r.top < 0) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
    precedente.addEventListener('click', () => montrer(pancartePersoActive - 1, -1));
    suivante.addEventListener('click', () => montrer(pancartePersoActive + 1, 1));
    let x0 = null, y0 = 0;
    liste.addEventListener('touchstart', e => {
      const cible = e.target.closest('input, textarea, select, [contenteditable]');
      x0 = cible || e.touches.length > 1 ? null : e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    liste.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) montrer(pancartePersoActive + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    }, { passive: true });
    const nav = el('div', { class: 'nav-pancartes' + (n > 1 ? '' : ' cache') }, [precedente, compteur, suivante]);
    montrer(pancartePersoActive, 0);
    const plein = n >= HOME_MAX_ARTICLES;
    const ajouter = el('button', { type: 'button', class: 'btn ajout-article', disabled: plein,
      text: plein ? 'Maximum atteint (' + HOME_MAX_ARTICLES + ' articles)' : '＋ Ajouter un article (' + n + '/' + HOME_MAX_ARTICLES + ')' });
    ajouter.addEventListener('click', () => {
      if (P.articles.length >= HOME_MAX_ARTICLES) return;
      P.articles.push({ titre: t('Nouvel article'), texte: '', image: '', style: 'texte' });
      pancartePersoActive = P.articles.length - 1; vueApercu = 'perso';
      construireFormulaire(); changement();
      const visible = document.querySelector('.carrousel-perso .article-carte:not(.cache)');
      if (visible) visible.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    corps.append(
      el('span', { class: 'etiq', text: 'Pancartes — une plein écran chacune, comme la page Home ; glissez à gauche ou à droite pour passer de l’une à l’autre' }),
      nav, ajouter, liste,
      el('p', { class: 'aide', style: 'margin:10px 0 0', text: 'Page à part (adresse …/page.html), par exemple vos tarifs, vos prestations ou un menu. Les visiteurs y passent par le coin en haut à droite des autres pages.' })
    );
    return section('perso', 'Page personnalisée', false, [corps]);
  }

  /* ---------------- En-tête (design.entete) : figé ou non, ordre logo / langues / menu, opacité du fond ---------------- */
  function sectionEntete() {
    const d = cfg.design;
    const reg = () => { if (!d.entete || typeof d.entete !== 'object') d.entete = {}; return d.entete; };
    const r = reglagesEntete(d);
    const fige = el('input', { type: 'checkbox', checked: r.fige });

          el('button', { type: 'button', class: 'btn btn-mini', text: '↓', title: t('Descendre'), disabled: i === o.length - 1, onclick: () => bouger(i + 1) })]));

    fond.addEventListener('input', () => { reg().fond = Number(fond.value); val.textContent = fond.value + ' %'; changement(); });

    cNom.addEventListener('input', () => { reg().couleurNom = cNom.value; majDef(); changement(); });
    defNom.addEventListener('click', () => { delete reg().couleurNom; cNom.value = d.texte || '#2b2620'; majDef(); changement(); });
    majDef();
    return section('entete', 'En-tête', false, [
      el('div', { class: 'aide', style: 'margin:0 0 12px', text: 'Barre du haut des pages Home, page personnalisée et Blog (la page contact n’en a pas).' }),
      el('label', { class: 'bascule' }, [el('span', { text: 'Figer l’en-tête pendant le défilement' }), fige]),
      el('div', { class: 'coul-nom' }, [el('label', { class: 'coul' }, [cNom, el('span', { text: 'Couleur du nom' })]), defNom]),
      el('span', { class: 'etiq', style: 'margin-top:12px', text: 'Ordre, de gauche à droite' }), liste,
      el('span', { class: 'etiq', style: 'margin-top:12px' }, [el('span', { text: 'Opacité du fond de l’en-tête' }), ' ', val]), fond,
      el('div', { class: 'aide', style: 'margin:4px 0 0', text: '0 % : en-tête transparent, posé sur la page. 100 % : fond plein.' })
    ]);
  }

  /* ---------------- Menu « Pages » de l'éditeur : Style, Logo, les pages du site, QR et cartes ----------------
     Ne change que l'organisation de l'éditeur : les données (cfg) et les pages publiées restent les mêmes. */
  const VUES_EDITEUR = {
    style: ['design'], logo: ['logo'], entete: ['entete'],
    contact: ['textes', 'boutons', 'dispo', 'fond', 'seo'],
    home: ['home'], perso: ['perso'], galerie: ['galerie'], blog: ['blog'],
    partage: ['partage']
  };
  const CLE_VUE = 'qp-rubrique';
  let vueEdit = (() => { try { const v = localStorage.getItem(CLE_VUE); return VUES_EDITEUR[v] ? v : 'contact'; } catch (e) { return 'contact'; } })();
  let rubriquesOuvert = false;
  function objPage(id) {
    if (id === 'home') return cfg.home;
    if (!PAGES_MENU.includes(id)) return {};                 // Style, Logo, QR : pas des pages (ne jamais écraser cfg.logo)
    if (!cfg[id] || typeof cfg[id] !== 'object') cfg[id] = { actif: false, titre: '', [id === 'galerie' ? 'photos' : 'articles']: [] };
    return cfg[id];
  }
  function pageAffichee(id) { return id === 'contact' || !!objPage(id).actif; }
  function ordrePagesMenu() {
    const ordre = Array.isArray(cfg.ordrePages) ? cfg.ordrePages.filter(x => PAGES_MENU.includes(x)) : [];
    PAGES_MENU.forEach(x => { if (!ordre.includes(x)) ordre.push(x); });
    return ordre;
  }
  // Nom et picto de chaque page (menu des visiteurs) : nom dans les champs existants, picto dans cfg.icosPages
  const ICO_PAGE = { contact: '✉️', home: '🏠', perso: '📄', blog: '📰', galerie: '📷' };
  const TYPE_PAGE = { contact: 'Page contact', home: 'Page Home', perso: 'Page personnalisée', blog: 'Blog', galerie: 'Galerie photos' };
  const CHAMP_NOM_PAGE = {
    contact: () => [cfg.home, 'boutonContact', 'Contact'],
    home: () => [cfg.home, 'lienTexte', 'Découvrir l’entreprise'],
    perso: () => [objPage('perso'), 'titre', 'Tarifs', 'Page personnalisée'],   // vide : « Page personnalisée » dans la liste, « Tarifs » proposé
    blog: () => [objPage('blog'), 'titre', 'Blog'],
    galerie: () => [objPage('galerie'), 'titre', 'Galerie']
  };
  const PICTOS_PAGES = ['✉️', '📞', '💬', '📍', '🏠', '🏢', '🏪', 'ℹ️', '⭐', '❤️', '👥', '🤝',
    '📄', '📋', '📖', '📰', '📝', '❓', '📷', '🖼️', '🎬', '🎵', '💰', '💶',
    '🏷️', '🛒', '🎁', '📅', '⏰', '🍽️', '🍕', '🍷', '☕', '🍰', '🛏️', '🏖️',
    '🚗', '✈️', '🔧', '🛠️', '💇', '💅', '🏋️', '⚽', '🌿', '🐾', '🎓', '💼'];
  function icoPage(id) { const v = cfg.icosPages && cfg.icosPages[id]; return v || ICO_PAGE[id]; }
  function nomPage(id) { const [o, k, ph, vide] = CHAMP_NOM_PAGE[id](); return String(o[k] || '').trim() || t(vide || ph); }
  function infoRubrique(id) {
    if (CHAMP_NOM_PAGE[id]) return [icoPage(id), nomPage(id)];
    return { style: ['🎨', t('Style')], logo: ['🖼️', t('Logo')], entete: ['🔝', t('En-tête')], partage: ['📇', t('QR code et cartes de visite')] }[id];
  }
  function blocNomPage(id) {
    const [o, k, ph] = CHAMP_NOM_PAGE[id]();
    const btnIco = el('button', { type: 'button', class: 'np-ico', text: icoPage(id), title: t('Changer le picto'), 'aria-label': t('Changer le picto') });
    const grille = el('div', { class: 'np-grille cache' });
    const choisir = v => {
      if (!cfg.icosPages || typeof cfg.icosPages !== 'object') cfg.icosPages = {};
      if (!v || v === ICO_PAGE[id]) delete cfg.icosPages[id]; else cfg.icosPages[id] = v;
      if (!Object.keys(cfg.icosPages).length) delete cfg.icosPages;
      construireFormulaire(); changement();
    };
    PICTOS_PAGES.forEach(v => grille.appendChild(el('button', { type: 'button', class: 'np-choix' + (v === icoPage(id) ? ' actif' : ''), text: v, onclick: () => choisir(v) })));
    grille.appendChild(el('button', { type: 'button', class: 'btn btn-mini np-defaut', onclick: () => choisir('') }, [el('span', { text: 'Par défaut' }), ' ' + ICO_PAGE[id]]));
    btnIco.addEventListener('click', () => grille.classList.toggle('cache'));
    const input = el('input', { type: 'text', value: o[k] || '', placeholder: t(ph), maxLength: 40 });
    input.addEventListener('input', () => {
      o[k] = input.value;
      const n = document.querySelector('.rb-cour .rb-nom'); if (n) n.textContent = nomPage(id);
      changement();
    });
    return el('div', { class: 'nom-page' }, [
      el('span', { class: 'etiq', text: 'Nom et picto dans le menu du site' }),
      el('div', { class: 'np-ligne' }, [btnIco, input]),
      grille,
      el('div', { class: 'aide', style: 'margin:6px 0 0', text: 'Touchez le picto pour en choisir un autre. Ex. une galerie de photos du menu d’un restaurant : nom « Tarifs », picto 💰.' })
    ]);
  }
  function activerPage(id, on) {
    const P = objPage(id);
    P.actif = on;
    if (id === 'perso' && on) {
      if (!String(P.titre || '').trim()) P.titre = t('Tarifs');
      if (!Array.isArray(P.articles)) P.articles = [];
      if (!P.articles.length) P.articles.push({ titre: t('Nos tarifs'), texte: '', image: '', style: 'texte' });
    }
    if (id === 'home' && rafraichirQRPartage) rafraichirQRPartage();   // « Page Home » apparaît ou disparaît dans le choix du QR code
    construireFormulaire(); changement();
  }
  function apercuDeRubrique(id) {
    if (id === 'entete') id = ['home', 'perso', 'blog'].find(x => pageAffichee(x)) || 'home';   // en-tête : visible sur ces pages
    if (id === 'home' || id === 'perso' || id === 'blog') { if (id === 'blog') articleApercu = ''; vueApercu = id; }
    else if (id !== 'partage') vueApercu = 'contact';
    majApercu();
  }
  function choisirRubrique(id) {
    vueEdit = id; rubriquesOuvert = false;
    try { localStorage.setItem(CLE_VUE, id); } catch (e) {}
    construireFormulaire();
    apercuDeRubrique(id);
    const m = document.querySelector('.rubriques');
    if (m && m.getBoundingClientRect().top < 0) m.scrollIntoView({ block: 'start' });
  }
  // ouvre une section (ex. « Image de fond ») depuis un autre endroit de l'éditeur
  function allerSection(idSection) {
    const vue = Object.keys(VUES_EDITEUR).find(v => VUES_EDITEUR[v].includes(idSection));
    if (vue && vue !== vueEdit) choisirRubrique(vue);
    const d = document.querySelector('details[data-id=' + idSection + ']');
    if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
  function menuRubriques() {
    const ligne = (id, extra) => {
      const [ico, nom] = infoRubrique(id);
      return el('div', { class: 'rb' + (id === vueEdit ? ' actif' : '') + (extra ? ' ' + extra : ''), onclick: e => { if (e.target.closest('button, input, label')) return; choisirRubrique(id); } }, [
        el('span', { class: 'rb-ico', text: ico }),
        el('span', { class: 'rb-nom', text: nom, 'data-no-i18n': CHAMP_NOM_PAGE[id] ? '' : undefined }),
        CHAMP_NOM_PAGE[id] && nom !== t(TYPE_PAGE[id]) && (id === 'home' || nom !== t(CHAMP_NOM_PAGE[id]()[3] || CHAMP_NOM_PAGE[id]()[2])) ? el('span', { class: 'rb-type', text: t(TYPE_PAGE[id]) }) : null]);   // type rappelé si le nom a changé
    };
    const liste = el('div', { class: 'rb-liste' });
    liste.append(ligne('style'), ligne('logo'), ligne('entete'), el('div', { class: 'rb-sep', text: 'Pages du site' }));
    const ordre = ordrePagesMenu();
    ordre.forEach((id, i) => {
      const r = ligne(id, pageAffichee(id) ? '' : 'masquee');
      const bouger = j => { [ordre[i], ordre[j]] = [ordre[j], ordre[i]]; cfg.ordrePages = ordre.slice(); construireFormulaire(); changement(); };
      const c = el('input', { type: 'checkbox', checked: pageAffichee(id), disabled: id === 'contact' });
      c.addEventListener('change', () => activerPage(id, c.checked));
      r.append(
        el('label', { class: 'rb-case', title: t(id === 'contact' ? 'Page principale : toujours affichée' : 'Afficher cette page sur le site') }, [c]),
        el('button', { type: 'button', class: 'btn btn-mini', text: '↑', title: t('Monter'), 'aria-label': t('Monter'), disabled: i === 0, onclick: () => bouger(i - 1) }),
        el('button', { type: 'button', class: 'btn btn-mini', text: '↓', title: t('Descendre'), 'aria-label': t('Descendre'), disabled: i === ordre.length - 1, onclick: () => bouger(i + 1) }));
      liste.append(r);
    });
    liste.append(el('div', { class: 'rb-sep' }), ligne('partage'));
    const [ico, nom] = infoRubrique(vueEdit);
    const tete = el('button', { type: 'button', class: 'rb-tete', 'aria-expanded': String(rubriquesOuvert), onclick: () => { rubriquesOuvert = !rubriquesOuvert; construireFormulaire(); } }, [
      el('span', { class: 'rb-lib', text: 'Rubrique' }),
      el('span', { class: 'rb-cour' }, [el('span', { class: 'rb-ico', text: ico }), el('span', { class: 'rb-nom', text: nom, 'data-no-i18n': '' }),
        !PAGES_MENU.includes(vueEdit) || pageAffichee(vueEdit) ? null : el('small', { text: t('masquée') })]),
      el('span', { class: 'rb-fleche', text: rubriquesOuvert ? '▴' : '▾' })]);
    return el('div', { class: 'rubriques' + (rubriquesOuvert ? ' ouvert' : '') }, [tete, rubriquesOuvert ? liste : null]);
  }

  /* ---------------- Page Blog ---------------- */
  let articleBlogActif = 0;
  const idArticle = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const aujourdhui = () => new Intl.DateTimeFormat('fr-CA').format(new Date());
  const oublierImages = (...chemins) => chemins.forEach(c => { if (c) { delete imagesAEnvoyer[c]; delete imagesLocales[c]; } });
  function sectionBlog() {
    if (!cfg.blog || typeof cfg.blog !== 'object') cfg.blog = { actif: false, titre: '', articles: [] };
    const B = cfg.blog;
    if (!Array.isArray(B.articles)) B.articles = [];
    B.articles.forEach(a => { if (a && !a.id) a.id = idArticle(); });
    const corps = el('div');                                 // affichée ou non : case du menu « Pages »
    const n = B.articles.length;
    articleBlogActif = Math.max(0, Math.min(articleBlogActif, n - 1));
    const liste = el('div', { class: 'carrousel-pancartes carrousel-blog' });
    const cartes = B.articles.map((a, i) => carteBlog(a, i));
    cartes.forEach(c => liste.appendChild(c));
    const precedent = el('button', { type: 'button', class: 'btn', text: '◀', 'aria-label': t('Article précédent') });
    const suivant = el('button', { type: 'button', class: 'btn', text: '▶', 'aria-label': t('Article suivant') });
    const compteur = el('span');
    function montrer(k, sens) {
      if (!n) return;
      articleBlogActif = Math.max(0, Math.min(k, n - 1));
      cartes.forEach((c, j) => {
        c.classList.toggle('cache', j !== articleBlogActif);
        c.classList.toggle('depuis-gauche', sens < 0);
        if (j === articleBlogActif && sens) { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; }
      });
      compteur.textContent = t('Article ' + (articleBlogActif + 1) + ' / ' + n);
      precedent.disabled = articleBlogActif === 0; suivant.disabled = articleBlogActif === n - 1;
      if (sens) {
        const c = cartes[articleBlogActif], r = c.getBoundingClientRect();
        if (r.top < 0) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (vueApercu === 'blog') { articleApercu = B.articles[articleBlogActif].id; majApercu(); }   // l'aperçu suit l'article affiché
      }
    }

  /* ✨ Texte IA d'un article du blog (décompté comme un texte IA) */
  async function redigerArticleBlog(i) {
    const arts = cfg.blog.articles, a = arts[i], ia = cfg.home.ia || {}, seo = cfg.seo || {};
    const systeme = [
      'Tu es rédacteur web. Tu écris UN article du blog d’une petite entreprise, lu sur téléphone.',
      'Règles :',
      '- Écris dans la langue des textes existants de la page (titre, article, description) ; à défaut, en français.',
      '- Si l’article a déjà un titre ou un texte, garde son sujet : améliore-le, complète-le, rends-le concret et utile pour un client. S’il est vide, choisis un sujet utile lié à l’activité, qui n’est pas déjà traité par les autres articles.',
      '- N’invente aucun fait vérifiable absent des informations : prix, chiffres, années d’expérience, labels, certifications, noms, adresses, horaires, avis clients, garanties, marques. Si une information manque, reste général.',
      '- Titre : 40 à 70 caractères, accrocheur et précis, sans point final.',
      '- Texte : 3 à 6 paragraphes courts séparés par une ligne vide, entre 900 et 1800 caractères. Pas de titres intermédiaires, pas de listes à puces, pas de mise en forme.',
      '- Termine par une phrase qui invite à prendre contact.',
      '- Référencement : si un mot-clé principal ou des lieux sont connus, places-en un naturellement, sans bourrage.',
      '- Pas d’emoji, pas de hashtag, pas de superlatif creux.',
      '- Corrige silencieusement les fautes de frappe évidentes.',
      '- Si le texte actuel contient des liens écrits [mots](cible), garde-les : même cible entre parenthèses, mots entre crochets adaptables.',
      '- Réponds uniquement en appelant l’outil proposer_article.'
    ].join('\n');
    const autres = arts.map((x, k) => k === i || x.masque || !x.titre ? '' : '- ' + x.titre).filter(Boolean);
    const infos = [
      'Nom de l’entreprise : ' + (cfg.titre || '(non précisé)'),
      cfg.sousTitre ? 'Accroche : ' + cfg.sousTitre : '',
      ia.description ? 'Description de l’activité par le client : ' + ia.description : '',
      (ia.zone || seo.zone) ? 'Zone d’action : ' + (ia.zone || seo.zone) : '',
      seo.motCle ? 'Mot-clé principal : ' + seo.motCle : '',
      'Moyens de contact disponibles : ' + (moyensDeContact().join(', ') || '(non précisés)'),
      'Ton souhaité : ' + (TONS_IA[ia.ton] || TONS_IA.pro),
      autres.length ? 'Autres articles du blog (ne pas répéter) :\n' + autres.join('\n') : 'Pas d’autre article pour l’instant.',
      'Titre actuel : ' + (a.titre && a.titre !== t('Nouvel article') ? a.titre : '(vide)'),
      'Texte actuel : ' + (a.texte || '(vide)')
    ].filter(Boolean).join('\n');
    const r = await appelIA({
      model: MODELE_IA, max_tokens: 3000, system: systeme,
      tools: [{ name: 'proposer_article', description: 'Renvoie l’article rédigé.',
        input_schema: { type: 'object', properties: { titre: { type: 'string' }, texte: { type: 'string' } }, required: ['titre', 'texte'] } }],
      tool_choice: { type: 'tool', name: 'proposer_article' },
      messages: [{ role: 'user', content: infos }]
    });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((j && j.error && j.error.message) || (j && j.erreur) || 'Le service IA est surchargé. Réessayez dans un instant.');
    const outil = (j.content || []).find(c => c.type === 'tool_use' && c.input);
    const p = outil && outil.input;
    if (!p || !(p.titre || p.texte)) throw new Error('Réponse vide de l’IA. Réessayez.');
    return { titre: String(p.titre || '').trim().replace(/[.\s]+$/, ''), texte: String(p.texte || '').trim() };
  }

      if (!n) return;

      cartesP.forEach((c, j) => {

    }

    const nav = el('div', { class: 'nav-pancartes' + (n > 1 ? '' : ' cache') }, [precedente, compteur, suivante]);

  const MODELE_IA = 'claude-sonnet-5-5';      // rédaction

  /* GitHub : appel direct avec la clé du client. Cloudflare : le Worker garde la clé.
     express = étape d'une création express déjà réglée (le serveur ne la décompte pas). */
  async function appelIA(corps, express) {
    if (!CF) return fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': secrets.anthropic, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify(corps)
    });
    const entetes = { 'content-type': 'application/json', authorization: 'Bearer ' + jetonCF };
    if (express) entetes['x-qrbc-express'] = '1';
    const r = await fetch(baseAPI() + 'ia', { method: 'POST', headers: entetes, body: JSON.stringify(corps) });
    if (!r.ok) {
      let j = null;
      try { j = await r.clone().json(); } catch (e) {}
      if (j && j.erreur) {                                     // erreur du Worker (session, quota, abonnement)
        if (j.code && !express) ouvrirAbonnement(j.code, j.erreur);
        throw new Error(j.erreur);
      }
    }
    const maj = r.headers.get('x-qrbc-compte');
    if (maj) { try { afficherAbonnement(JSON.parse(decodeURIComponent(maj))); } catch (e) {} }
    return r;
  }

      model: MODELE_IA, max_tokens: 1500, system: systeme,
      tools: [{ name: 'proposer_articles', description: 'Renvoie la pancarte rédigée.',
        input_schema: { type: 'object', properties: { articles: { type: 'array', items: { type: 'object', properties: { titre: { type: 'string' }, texte: { type: 'string' } }, required: ['titre', 'texte'] } } }, required: ['articles'] } }],
      tool_choice: { type: 'tool', name: 'proposer_articles' },
      messages: [{ role: 'user', content: infos }]
    });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((j && j.error && j.error.message) || (j && j.erreur) || 'Le service IA est surchargé. Réessayez dans un instant.');
    const outil = (j.content || []).find(c => c.type === 'tool_use' && c.input);

    if (typeof liste === 'string') { try { liste = JSON.parse(liste); } catch (e) { liste = null; } }

    return { titre: String(p.titre || '').trim().replace(/[.\s]+$/, ''), texte: String(p.texte || '').trim() };
  }

    const infos = [

                  motCle: { type: 'string', description: 'Mot-clé principal' },
                  motsCles: { type: 'array', items: { type: 'string' }, description: 'Mots-clés secondaires' }
                },
                required: ['titre', 'description', 'motCle']

            },

        tool_choice: { type: 'auto' },
        messages: [{ role: 'user', content: infos }]

    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      const m = (j && j.error && j.error.message) || (j && j.erreur) || r.statusText;

      if (r.status === 429) throw new Error('Trop de demandes. Réessayez dans une minute.');
      if (r.status === 529 || r.status >= 500) throw new Error('Le service IA est surchargé. Réessayez dans un instant.');
      if (/credit|balance/i.test(m)) throw new Error('Crédit API épuisé : rechargez le compte sur console.anthropic.com.');
      throw new Error(m);
    }
    const blocs = j.content || [];
    const outil = blocs.find(c => c.type === 'tool_use' && c.input);
    // Le modèle renvoie parfois un tableau sous forme de texte JSON, ou sous un autre nom : on accepte les deux
    const lireJSON = v => { if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch (e) { return v; } };
    const entree = outil ? lireJSON(outil.input) || {} : {};
    let liste = lireJSON(entree.articles);
    if (!Array.isArray(liste)) liste = Object.values(entree).map(lireJSON).find(v => Array.isArray(v) && v.some(a => a && (a.titre || a.texte))) || [];
    let seo = lireJSON(entree.seo);
    if (!seo || typeof seo !== 'object') seo = null;
    if (!liste.length) {
      // Secours : JSON renvoyé en texte
      const texte = blocs.filter(c => c.type === 'text').map(c => c.text).join('\n');
      const m = texte.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
      if (m) {
        try { const o = JSON.parse(m[0]); liste = Array.isArray(o) ? o : (o.articles || []); if (!Array.isArray(o) && o.seo) seo = o.seo; } catch (e) {}
      }
    }
    const propre = liste.filter(a => a && (a.titre || a.texte)).slice(0, brief.nombre)
      .map(a => ({ titre: String(a.titre || '').trim(), texte: String(a.texte || '').trim() }));
    if (!propre.length) throw new Error(j.stop_reason === 'max_tokens' ? 'Réponse de l’IA coupée (trop longue). Réessayez.' : 'Réponse vide de l’IA. Réessayez.');
    const accroche = String(lireJSON(entree.accroche) || '').trim().replace(/[.\s]+$/, '').slice(0, 80);

      titre: String(seo.titre || '').trim(), description: String(seo.description || '').trim(),
      motCle: String(seo.motCle || '').trim(), motsCles: Array.isArray(seo.motsCles) ? seo.motsCles.map(String) : []
    } : null;
    propre.accroche = accroche;               // utilisée par la création express (sous-titre)
    return propre;
  }

  /* =============== Atelier logo : motif (IA, monogramme ou photo) + habillage local =============== */
  const LOGO_FORMES = { rond: 'Rond', carre: 'Carré arrondi', blason: 'Blason', hexagone: 'Hexagone', aucune: 'Sans forme' };
  const LOGO_EFFETS = { mat: 'Mat', brillant: 'Brillant', metal: 'Métallique', neon: 'Néon', ombre: 'Ombre' };
  const LOGO_PALETTES = {

    argent: { nom: 'Argent & bleu nuit', c: ['#0f1b2d', '#c0c6cf', '#c0c6cf'] },
    mono:   { nom: 'Noir & blanc', c: ['#111111', '#ffffff', '#ffffff'] },
    clair:  { nom: 'Blanc & noir', c: ['#ffffff', '#111111', '#111111'] },
    perso:  { nom: 'Personnalisées' }
  };
  const LOGO_POLICES = {
    elegante: { nom: 'Élégante', f: 'Georgia, serif', p: 400 },
    moderne:  { nom: 'Moderne', f: 'Arial, Helvetica, sans-serif', p: 700 },
    classique:{ nom: 'Classique', f: '"Times New Roman", Times, serif', p: 400 },

  };
  const LOGO_MOTIFS_IA = {
