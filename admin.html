    const c = el('input', { type: 'color', value: obj[cle] || '#000000' });
    c.addEventListener('input', () => { obj[cle] = c.value; if (apres) apres(); changement(); });
    return el('label', { class: 'coul' }, [c, el('span', { text: etiquette })]);
  }

  /* Choix d'image : logo ou fond */
  /* ---------------- Médiathèque (mode Cloudflare) ---------------- */
  let medias = null, chargementMedias = null;
  function chargerMedias() {
    if (!CF || medias || chargementMedias) return;
    chargementMedias = appelAPI('medias', jetonCF).then(r => r.json())
      .then(j => { medias = j.medias || []; })
      .catch(() => { medias = []; })
      .finally(() => { chargementMedias = null; construireFormulaire(); });
  }
  function galerieImages(genre, obj, cle, apres) {
    const box = el('div', { class: 'galerie-fonds' });
    // Images partagées par toutes les pages du site (26/11) : fond de la page contact, pancartes Home et page personnalisée,
    // photos de la galerie et du blog ; seuls les logos restent à part.
    const genres = genre === 'logo' ? ['logo'] : ['fond', 'article'];
    const l = (medias || []).filter(x => genres.includes(x.genre));
    // photos chargées mais pas encore enregistrées : visibles tout de suite
    const attente = Object.keys(imagesAEnvoyer).filter(p => genres.includes(genreImage(p)) && !/^images\/(galerie|blog)-/.test(p) && !l.some(x => x.chemin === p));
    const tout = attente.map(p => ({ chemin: p, source: 'photo', attente: true })).concat(l);
    if (genre !== 'logo') {                                   // photos de la galerie et du blog (gérées dans leur section : pas de ×)
      const deja = new Set(tout.map(x => x.chemin));
      const ajout = c => { if (c && !deja.has(c)) { deja.add(c); tout.push({ chemin: c, source: 'photo', fixe: true }); } };
      ((cfg.galerie && cfg.galerie.photos) || []).forEach(ph => ajout(ph.src));
      ((cfg.blog && cfg.blog.articles) || []).forEach(a => ajout(a.image));
    }
    if (!medias) { box.appendChild(el('div', { class: 'aide', text: 'Chargement de vos images…' })); chargerMedias(); return box; }
    if (!tout.length) { box.appendChild(el('div', { class: 'aide', text: 'Vos images (photos, galerie, IA) apparaîtront ici pour être réutilisées.' })); return box; }
    tout.forEach(m => {
      const actif = obj[cle] === m.chemin;
      const v = el('button', { type: 'button', class: 'fond-ia' + (genre === 'logo' ? ' carre' : '') + (actif ? ' actif' : ''), title: actif ? 'Image utilisée' : 'Utiliser cette image' });
      v.style.backgroundImage = 'url("' + (imagesLocales[m.chemin] || m.chemin) + '")';
      v.addEventListener('click', () => { obj[cle] = m.chemin; if (apres) apres(); changement(); construireFormulaire(); });
      if (m.source === 'ia') v.appendChild(el('span', { class: 'fond-badge', text: 'IA' }));
      if (actif) v.appendChild(el('span', { class: 'fond-coche', text: '✓' }));
      if (!m.attente && !m.fixe) {
        const x = el('span', { class: 'fond-suppr', role: 'button', 'aria-label': 'Supprimer de mes images', text: '×' });
        x.addEventListener('click', async e => {
          e.stopPropagation();
          if (!confirm(t(actif ? 'Cette image est utilisée sur votre page. La retirer de « Mes images » ? (elle reste affichée tant que vous ne la changez pas)' : 'Supprimer définitivement cette image ?'))) return;
          try {
            // image utilisée dans l'éditeur (même pas encore enregistrée) : le fichier est gardé sur le serveur
            const r = await appelAPI('medias', jetonCF, { method: 'DELETE', body: JSON.stringify({ chemin: m.chemin, garder: actif || JSON.stringify(cfg).includes(m.chemin) }) });
            medias = (await r.json()).medias;
            construireFormulaire();
          } catch (er) { alert(er.message); }
        });
        v.appendChild(x);
      }
      box.appendChild(v);
    });
    return box;
  }
  function genreImage(chemin) {
    const n = String(chemin).replace(/^images\//, '');
    return /^fond/.test(n) ? 'fond' : /^logo/.test(n) ? 'logo' : /^carte-\d+-/.test(n) ? 'carte' : 'article';
  }

  function choixImage(etiquette, obj, cle, reglages) {
    const vign = el('div', { class: 'vignette' });
    function majVign() {
      vign.innerHTML = '';
      vign.style.backgroundImage = '';
      const v = obj[cle];
      if (!v) { vign.textContent = 'Aucune'; return; }
      const url = imagesLocales[v] || v;
      // image introuvable sur le serveur (supprimée) : on le dit, au lieu d'une vignette vide
      const sonde = new Image();
      sonde.onerror = () => { if (obj[cle] !== v) return; vign.innerHTML = ''; vign.style.backgroundImage = ''; vign.appendChild(el('span', { class: 'vign-absente', text: t('Image introuvable') })); };
      sonde.src = url;
      if (reglages.fond) vign.style.backgroundImage = 'url("' + url + '")';
      else vign.appendChild(el('img', { src: url, alt: '' }));
    }
    const fichier = el('input', { type: 'file', accept: 'image/*', class: 'cache' });
    const camera = el('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'cache' });
    const traiter = async (entree) => {
      const f = entree.files[0]; if (!f) return;
      try {
        const png = !reglages.fond && /png|svg|webp/i.test(f.type);
        const type = png ? 'image/png' : 'image/jpeg';
        const data = await reduireImage(f, reglages.max, type, 0.85);
        const chemin = 'images/' + reglages.nom + '-' + Date.now() + (png ? '.png' : '.jpg');
        imagesLocales[chemin] = data;
        imagesAEnvoyer[chemin] = data.split(',')[1];
        obj[cle] = chemin;
        if (reglages.apresImage) reglages.apresImage();
        majVign(); changement();
        if (CF) construireFormulaire();
      } catch (e) { alert(t(e.message)); }
      entree.value = '';
    };
    fichier.addEventListener('change', () => traiter(fichier));
    camera.addEventListener('change', () => traiter(camera));
    const choisir = el('button', { type: 'button', class: 'btn btn-mini', text: reglages.photo ? '🖼 Galerie…' : 'Choisir…', onclick: () => fichier.click() });
    const prendre = reglages.photo ? el('button', { type: 'button', class: 'btn btn-mini', text: '📷 Prendre une photo', onclick: () => camera.click() }) : null;
    const retirer = el('button', { type: 'button', class: 'btn btn-mini', text: 'Retirer', onclick: () => { obj[cle] = ''; majVign(); changement(); } });
    // ✨ Image IA (pancartes) : 2 images inspirées du titre et du texte ; la 1re est appliquée, on peut choisir l'autre
    const zoneIA = el('div', { class: 'ia-pancarte cache' });
    const imageIA = reglages.ia ? el('button', { type: 'button', class: 'btn btn-mini', text: '✨ Image IA', onclick: async () => {
      const p = reglages.ia();
      if (!String(p.titre || '').trim() && !String(p.texte || '').trim()) { alert(t('Écrivez d’abord le titre ou le texte de la pancarte : l’image s’en inspire.')); return; }
      imageIA.disabled = true; imageIA.textContent = t('L’IA peint… (≈ 20 s)');
      zoneIA.className = 'ia-pancarte'; zoneIA.innerHTML = ''; zoneIA.appendChild(el('div', { class: 'aide', text: 'L’IA crée 2 images à partir du texte de cette pancarte…' }));
      try {
        const r = await appelAPI('fond', jetonCF, { method: 'POST', body: JSON.stringify({ ambiance: etatFond.ambiance, pancarte: p, activite: activiteEnCours() }) });
        const j = await r.json();
        medias = j.medias;
        afficherAbonnement(j.compte);
        obj[cle] = j.nouvelles[0].chemin; if (reglages.apresImage) reglages.apresImage(); majVign(); changement();
        zoneIA.innerHTML = '';
        const vues = j.nouvelles.map(n => {
          const v = el('button', { type: 'button', class: 'ia-choix' + (n.chemin === obj[cle] ? ' actif' : ''), style: 'background-image:url("' + n.chemin + '")', 'aria-label': t('Utiliser cette image') });
          v.addEventListener('click', () => { obj[cle] = n.chemin; majVign(); changement(); vues.forEach(x => x.classList.toggle('actif', x === v)); });
          return v;
        });
        zoneIA.append(el('div', { class: 'aide', style: 'margin:0 0 6px', text: j.nouvelles.length > 1 ? 'Touchez l’image que vous préférez (l’autre reste dans « Mes images ») :' : 'Image créée et appliquée.' }), el('div', { class: 'ia-choix-ligne' }, vues));
      } catch (e) {
        zoneIA.innerHTML = ''; zoneIA.appendChild(el('div', { class: 'msg err', text: e.message === 'Failed to fetch' ? 'Connexion impossible.' : e.message }));
        if (e.status === 402) ouvrirAbonnement('quota', e.message);
      }
      imageIA.disabled = false; imageIA.textContent = t('✨ Image IA');
      majQuotas();
    } }) : null;
    // Recadrer / assombrir : pas de nouveau fichier, seulement les réglages (obj[cle + 'Cadre']) ; l'originale reste intacte
    const recadrer = reglages.fond ? el('button', { type: 'button', class: 'btn btn-mini', text: '✂ Recadrer', onclick: () => {
      if (!obj[cle]) { alert(t('Choisissez d’abord une image.')); return; }
      ouvrirRecadrage(obj[cle], reglages.ratio ? reglages.ratio() : RATIO_ECRAN, reglages.nom, (src, cadre) => {
        obj[cle] = src; obj[cle + 'Cadre'] = cadre;
        if (reglages.apresImage) reglages.apresImage(); majVign(); changement(); if (CF) construireFormulaire();
      }, obj[cle + 'Cadre']);
    } }) : null;
    majVign();
    const genre = reglages.nom === 'fond' ? 'fond' : reglages.nom === 'logo' ? 'logo' : 'article';
    return el('div', {}, [el('span', { class: 'etiq', text: etiquette }),
      el('div', { class: 'image-ligne' }, [vign, el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, [prendre, choisir, imageIA, recadrer, retirer].filter(Boolean)), fichier, camera]),
      zoneIA,
      ...(CF ? [el('details', { class: 'mes-images', open: genre !== 'article' ? true : undefined }, [el('summary', { text: 'Mes images' }), galerieImages(genre, obj, cle, reglages.apresImage)])] : [])]);
  }

  /* ---------------- Recadrer et zoomer une image (fond, pancartes) ----------------
     Glisser pour déplacer, pincer / molette / curseur pour zoomer. Le cadre a le format de l'écran
     (ou du bandeau d'image d'une pancarte). Le résultat est une NOUVELLE image : l'originale reste dans « Mes images ». */
  const RATIO_ECRAN = 9 / 19;          // téléphone en portrait (fond, pancarte « photo »)
  const RATIO_BANDEAU = 1;             // pancarte « image au-dessus du texte » (≈ carré sur téléphone)
  async function ouvrirRecadrage(source, ratio, nom, fini, cadreActuel) {
    // Réglages actuels (cadrage + assombrissement), ou ancienne copie recadrée (cfg.cadres, avant le 28/11) : on repart de l'ORIGINALE
    cfg.cadres = cfg.cadres || {};
    const ca = typeof cadreImage === 'function' ? cadreImage(cadreActuel, source) : null;
    const prec = ca ? { source, rect: { sx: ca.r[0], sy: ca.r[1], sw: ca.r[2], sh: ca.r[3] }, teinte: { couleur: ca.tc || '#000000', force: Number(ca.tf) || 0 } } : cfg.cadres[source];
    const charger = src => new Promise((ok, ko) => { const i = new Image(); i.decoding = 'async'; i.onload = () => ok(i); i.onerror = ko; i.src = imagesLocales[src] || src; });
    let img, origine = source, rect = null, teinte = null;
    if (prec && prec.source) {
      try { img = await charger(prec.source); origine = prec.source; rect = prec.rect; teinte = prec.teinte || { couleur: '#000000', force: 0 }; } catch (e) { img = null; }   // originale supprimée : on garde la copie
    }
    if (!img) {
      try { img = await charger(source); }
      catch (e) { alert(t('Cette image ne peut pas être lue sur cet appareil. Essayez une autre image (JPEG ou PNG de moins de 3 Mo).')); return; }
    }
    const ancien = document.getElementById('fen-cadre'); if (ancien) ancien.remove();
    const fond = el('div', { id: 'fen-cadre', role: 'dialog', 'aria-modal': 'true' });
    const fen = el('div', { class: 'fen' });
    const larg = Math.min(420, window.innerWidth - 60), haut = Math.min(Math.round(larg / ratio), window.innerHeight - 330);
    const FW = Math.round(Math.min(larg, haut * ratio)), FH = Math.round(FW / ratio);
    const zone = el('div', { class: 'cadre-zone', style: 'width:' + FW + 'px;height:' + FH + 'px' });
    const im = el('img', { src: img.src, alt: '' });
    zone.appendChild(im);
    // Assombrir : voile de couleur (noir par défaut) incrusté dans l'image, pour masquer les défauts et faire ressortir le texte
    if (!teinte) teinte = { couleur: '#000000', force: 20 };   // nouvelle image : légèrement assombrie (comme les pancartes)
    // fond de la page contact : un seul réglage d'assombrissement, ici. L'ancien voile de la page (design.voile) est repris
    // dans ce réglage puis incrusté dans l'image à « Appliquer » (le voile de la page repasse alors à 0).
    const pourPage = nom === 'fond' && source === cfg.design.imageFond;
    const voilePage = pourPage ? Math.max(0, Math.min(80, Number(cfg.design.voile) || 0)) : 0;
    if (voilePage) teinte = { couleur: teinte.couleur, force: Math.min(80, Math.round(100 * (1 - (1 - (prec && prec.teinte ? teinte.force : 0) / 100) * (1 - voilePage / 100)))) };
    const voileCadre = el('div', { class: 'cadre-voile' });
    zone.appendChild(voileCadre);
    const forceVoile = el('input', { type: 'range', min: '0', max: '80', step: '1', value: String(teinte.force), 'aria-label': t('Assombrir') });
    const valeurVoile = el('span', { style: 'min-width:3.2em;text-align:right;font-size:.85rem;color:var(--doux)' });
    const choixCouleur = el('input', { type: 'color', value: teinte.couleur, 'aria-label': t('Autre couleur') });
    const pastilles = ['#000000', '#ffffff', '#0b1f3a', '#3b2a1a'].map(c => el('button', { type: 'button', class: 'pastille', style: 'background:' + c, 'aria-label': c, onclick: () => { teinte.couleur = c; choixCouleur.value = c; majVoile(); } }));
    function majVoile() {
      teinte.force = Number(forceVoile.value);
      voileCadre.style.background = teinte.couleur; voileCadre.style.opacity = String(teinte.force / 100);
      valeurVoile.textContent = teinte.force + ' %';
      pastilles.forEach(b => b.classList.toggle('actif', b.getAttribute('aria-label') === teinte.couleur));
    }
    forceVoile.addEventListener('input', majVoile);
    choixCouleur.addEventListener('input', () => { teinte.couleur = choixCouleur.value; majVoile(); });
    majVoile();
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const base = Math.max(FW / iw, FH / ih);                 // « couvrir » : l'image remplit toujours le cadre
    let z = 1, ox = (FW - iw * base) / 2, oy = (FH - ih * base) / 2;
    if (rect && rect.sw > 0) {                                // reprend le cadrage précédent
      const S = FW / rect.sw; z = Math.min(5, Math.max(1, S / base)); const S2 = base * z;
      ox = -rect.sx * S2; oy = -rect.sy * S2;
    }
    const curseur = el('input', { type: 'range', min: '1', max: '5', step: '0.01', value: '1', 'aria-label': t('Zoom') });
    function borner() {
      const S = base * z;
      ox = Math.min(0, Math.max(FW - iw * S, ox));
      oy = Math.min(0, Math.max(FH - ih * S, oy));
    }
    const flou = el('div', { class: 'aide', style: 'color:var(--alerte);min-height:1.2em;margin:0' });
    function dessiner() {
      borner(); im.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + base * z + ')'; curseur.value = String(z);
      flou.textContent = FW / (base * z) < 420 ? t('Zoom important : l’image risque de paraître floue sur le téléphone.') : '';
    }
    function zoomer(nz, cx, cy) {                             // zoom autour du point (cx, cy) du cadre
      nz = Math.min(5, Math.max(1, nz));
      const S0 = base * z, S1 = base * nz;
      ox = cx - (cx - ox) * S1 / S0; oy = cy - (cy - oy) * S1 / S0; z = nz; dessiner();
    }
    // glisser / pincer
    const doigts = new Map(); let pince = null;
    zone.addEventListener('pointerdown', e => { zone.setPointerCapture(e.pointerId); doigts.set(e.pointerId, { x: e.clientX, y: e.clientY }); zone.style.cursor = 'grabbing';
      if (doigts.size === 2) { const [a, b] = [...doigts.values()]; pince = { d: Math.hypot(a.x - b.x, a.y - b.y), z }; } });
    zone.addEventListener('pointermove', e => {
      const avant = doigts.get(e.pointerId); if (!avant) return;
      const ici = { x: e.clientX, y: e.clientY };
      if (doigts.size === 1) { ox += ici.x - avant.x; oy += ici.y - avant.y; doigts.set(e.pointerId, ici); dessiner(); return; }
      doigts.set(e.pointerId, ici);
      if (doigts.size === 2 && pince) {
        const [a, b] = [...doigts.values()], r = zone.getBoundingClientRect();
        zoomer(pince.z * Math.hypot(a.x - b.x, a.y - b.y) / pince.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
    });
    const lacher = e => { doigts.delete(e.pointerId); if (doigts.size < 2) pince = null; zone.style.cursor = 'grab'; };
    zone.addEventListener('pointerup', lacher); zone.addEventListener('pointercancel', lacher);
    zone.addEventListener('wheel', e => { e.preventDefault(); const r = zone.getBoundingClientRect(); zoomer(z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    curseur.addEventListener('input', () => zoomer(Number(curseur.value), FW / 2, FH / 2));
    const fermer = () => fond.remove();
    fen.append(
      el('h2', { text: '✂ Recadrer et zoomer' }),
      el('p', { class: 'sous', text: 'Faites glisser l’image, pincez ou utilisez le curseur pour zoomer. Le cadre montre ce qui sera visible sur un téléphone.' }),
      zone,
      el('div', { class: 'cadre-zoom' }, [el('span', { text: '−' }), curseur, el('span', { text: '+' })]),
      flou,
      el('div', { class: 'cadre-teinte' }, [el('span', { text: 'Assombrir', style: 'font-size:.9rem' }), forceVoile, valeurVoile]),
      el('div', { class: 'cadre-teinte' }, [el('span', { text: 'Couleur', style: 'font-size:.9rem' }), ...pastilles, choixCouleur]),
      el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Annuler', onclick: fermer }),
        el('button', { type: 'button', class: 'btn', text: 'Recentrer', onclick: () => { z = 1; ox = (FW - iw * base) / 2; oy = (FH - ih * base) / 2; dessiner(); } }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Appliquer', onclick: appliquer })
      ]));
    fond.appendChild(fen);
    fond.addEventListener('click', e => { if (e.target === fond) fermer(); });
    document.body.appendChild(fond);
    dessiner();
    function appliquer() {
      const S = base * z;
      const sx = -ox / S, sy = -oy / S, sw = FW / S, sh = FH / S;
      // seulement les réglages : l'originale reste telle quelle, aucun nouveau fichier dans « Mes images »
      const cadre = { src: origine, r: [Math.round(sx), Math.round(sy), Math.round(sw), Math.round(sh)], iw, ih, tc: teinte.couleur, tf: teinte.force };
      if (pourPage) { cfg.design.voile = 0; const fo = document.getElementById('formulaire'); if (fo) fo.style.setProperty('--voile-fond', '0'); }
      fermer();
      fini(origine, cadre);
    }
  }

  /* ---------------- Atelier « fond par l'IA » (Cloudflare) ---------------- */
  const AMBIANCES_FOND = { photo: 'Photo réaliste', lumineux: 'Lumineux', nuit: 'Ambiance nuit', minimal: 'Minimaliste', aquarelle: 'Aquarelle', luxe: 'Luxe' };
  const etatFond = { ambiance: 'photo', idee: '', enCours: false, message: null };
  function atelierFond() {
    const boite = el('div', { class: 'ia-boite', style: 'margin-top:16px' });
    const msg = el('div', { class: 'msg' });

    const puces = el('div', { class: 'puces' });
    Object.keys(AMBIANCES_FOND).forEach(k => {
      const b = el('button', { type: 'button', class: 'puce' + (etatFond.ambiance === k ? ' actif' : ''), text: AMBIANCES_FOND[k] });
      b.addEventListener('click', () => { etatFond.ambiance = k; puces.querySelectorAll('.puce').forEach(x => x.classList.toggle('actif', x === b)); });
      puces.appendChild(b);
    });
    const idee = el('textarea', { rows: 2, value: etatFond.idee, placeholder: 'Ex. : van noir devant la tour Eiffel au coucher du soleil' });
    idee.addEventListener('input', () => { etatFond.idee = idee.value; });
    const go = el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: etatFond.enCours ? 'L’IA peint vos images…' : '✨ Créer 2 images' });
    go.disabled = etatFond.enCours;
    if (etatFond.message) { msg.className = 'msg ' + etatFond.message.classe; msg.textContent = etatFond.message.texte; }
    go.addEventListener('click', async () => {
      etatFond.enCours = true; go.disabled = true; go.textContent = 'L’IA peint vos images… (≈ 20 s)'; msg.className = 'msg'; msg.textContent = '';
      try {
        const r = await appelAPI('fond', jetonCF, { method: 'POST', body: JSON.stringify({ ambiance: etatFond.ambiance, idee: etatFond.idee, activite: activiteEnCours() }) });
        const j = await r.json();
        medias = j.medias;
        afficherAbonnement(j.compte);
        etatFond.message = { classe: 'ok', texte: '✓ ' + j.nouvelles.length + (j.nouvelles.length > 1 ? ' nouvelles images ajoutées' : ' nouvelle image ajoutée') + ' dans « Mes images » ci-dessus : touchez-en une pour l’utiliser.' };
      } catch (e) {
        etatFond.message = { classe: 'err', texte: e.message === 'Failed to fetch' ? 'Connexion impossible.' : e.message };
        if (e.status === 402) ouvrirAbonnement('quota', e.message);
      }
      etatFond.enCours = false;
      construireFormulaire();
    });

    boite.append(
      el('b', { class: 'ia-titre', text: '✨ Créer un fond avec l’IA' }),
      el('div', { class: 'aide', style: 'margin:4px 0 12px', text: 'L’IA crée 2 images à partir de votre activité. Elles s’ajoutent à « Mes images » : choisissez-en une maintenant ou plus tard.' }),
      el('span', { class: 'etiq', text: 'Ambiance' }), puces,
      el('label', { class: 'champ', style: 'margin-top:10px' }, [el('span', { text: 'Votre idée (facultatif)' }), idee]),
      go, quotaIA('fond'), msg
    );
    return boite;
  }

  /* =============== Mes pages : plusieurs pages et langues sur un seul compte =============== */
  let groupe = null;                            // réponse de l'API « pages » (liste, prix d'ajout)
  async function chargerGroupe(forcer) {
    if (!CF || !jetonCF) return null;
    if (groupe && !forcer) return groupe;
    try { groupe = await (await appelAPI('pages', jetonCF)).json(); } catch (e) { groupe = null; }
    return groupe;
  }
  function nomLangue(code) {
    let ui = 'fr';
    try { ui = localStorage.getItem('qp-langue') || document.documentElement.lang || 'fr'; } catch (e) {}
    try { const n = new Intl.DisplayNames([ui], { type: 'language' }).of(code); return n.charAt(0).toUpperCase() + n.slice(1); }
    catch (e) { return String(code).toUpperCase(); }
  }
  function libellePage(p) { return p.traduction ? p.traduction.source + ' · ' + p.traduction.langue.toUpperCase() : p.slug; }

  /* Bandeau « Mes pages ». Les textes sont posés en français, en morceaux séparés : la traduction de l'interface
     (i18n) les traduit et les retraduit à chaque changement de langue, sans recharger la page. */
  const NOMS_PROPRES_LANGUE = { fr: 'Français', en: 'English', ru: 'Русский', es: 'Español', de: 'Deutsch', it: 'Italiano', pt: 'Português',
    nl: 'Nederlands', uk: 'Українська', pl: 'Polski', ro: 'Română', tr: 'Türkçe', zh: '中文', ja: '日本語' };
  let sitesOuvert = null;                       // ligne « Mes sites » dépliée ? (null : dépliée seulement pour un site tout neuf)
  function bandeauPages() {
    if (sitesOuvert === null) sitesOuvert = titreParDefaut();
    const box = el('div', { class: 'pages-bandeau' });
    const boiteTrad = box.boiteTrad = el('div', { class: 'pb-trad-boite' });   // version traduite : hors de la zone figée
    const remplir = () => {
      box.innerHTML = ''; boiteTrad.innerHTML = '';
      const c = compteCF, g = groupe;
      if (c && c.traduction) {
        const L = c.traduction.langue;
        boiteTrad.append(el('div', { class: 'pages-bandeau pb-trad' }, [
          el('b', {}, ['🌐 ', el('span', { 'data-no-i18n': '', text: NOMS_PROPRES_LANGUE[L] || L.toUpperCase() }), ' · ', el('span', { text: 'version traduite' })]),
          el('div', { class: 'aide', style: 'margin:2px 0 8px' }, [el('span', { text: 'Traduction de' }), ' ', el('b', { text: c.traduction.source + '.qrbc.app' }), '. ',
            el('span', { text: 'Vous pouvez la modifier librement : elle est indépendante de la page d’origine.' })]),
          el('button', { type: 'button', class: 'btn btn-mini', onclick: () => lancerTraduction(false) },
            [el('span', {}, ['🔄 ', el('span', { text: 'Retraduire depuis la page d’origine' }), ' (',      // un seul bloc : le bouton est en flex
              ...(c.plan === 'gratuit' ? [el('span', { text: 'offert' })] : [euros(c.offre.prixTraduction) + ' ', el('span', { text: 'HT' })]), ')'])]),
          el('button', { type: 'button', class: 'btn btn-mini pb-synchro', onclick: () => synchroniserVersion() },
            [el('span', {}, ['🎨 ', el('span', { text: 'Reprendre images et style de la page d’origine' }), ' (', el('span', { text: 'gratuit' }), ')'])])
        ]));
      }
      /* Une ligne repliable (28/11), comme « Rubrique » : Mes sites · site ouvert · ▾ ;
         dépliée : la liste numérotée des sites, la Création express, puis « Ajouter un site ou une langue » */
      const pages = (g && g.pages) || [];
      const cour = pages.find(p => p.slug === (g && g.courant)) || pages.find(p => p.slug === (c && c.slug));
      const nomCour = cour ? libellePage(cour) + (cour.principale && pages.length > 1 ? ' ★' : '') : ((c && c.slug) || '');
      box.append(el('button', { type: 'button', class: 'rb-tete pb-tete', 'aria-expanded': String(sitesOuvert), onclick: () => { sitesOuvert = !sitesOuvert; remplir(); } }, [
        el('span', { class: 'rb-lib', text: 'Mes sites' }),
        el('span', { class: 'rb-cour' }, [el('span', { class: 'rb-ico', text: '📄' }), el('span', { class: 'rb-nom', 'data-no-i18n': '', text: nomCour })]),
        el('span', { class: 'rb-fleche', text: sitesOuvert ? '▴' : '▾' })]));
      if (!sitesOuvert) return;
      const liste = el('div', { class: 'pb-liste' });
      pages.forEach((p, i) => {
        const actif = p === cour;
        liste.appendChild(el('button', { type: 'button', class: 'rb pb-page' + (actif ? ' actif' : ''), title: p.adresse, onclick: actif ? () => { sitesOuvert = false; remplir(); } : () => basculerVers(p.slug) }, [
          el('span', { class: 'pb-num', text: String(i + 1) }),
          el('span', { class: 'rb-nom', 'data-no-i18n': '', text: libellePage(p) + (p.principale && pages.length > 1 ? ' ★' : '') }),
          actif ? el('small', { text: t('ouvert') }) : null]));
      });
      if (pages.length) box.append(liste);
      if (!(c && c.traduction)) box.append(bandeauExpress());
      box.append(el('button', { type: 'button', class: 'btn btn-mini pb-ajout', onclick: () => ouvrirAjoutPage() }, [el('span', {}, ['＋ ', el('span', { text: 'Ajouter un site ou une langue' })])]));
    };
    remplir();
    chargerGroupe().then(remplir);
    return box;
  }

  /* Ouvre une autre page du compte (session donnée par le serveur, sans retaper le mot de passe) */
  async function basculerVers(vers, sansQuestion) {
    if (!sansQuestion && modifie && !confirm(t('Des modifications ne sont pas enregistrées. Changer de page quand même ?'))) return;
    try {
      const j = await (await appelAPI('basculer', jetonCF, { method: 'POST', body: JSON.stringify({ vers }) })).json();
      ouvrirPage(j.slug, j.jeton);
    } catch (e) { alert(e.message); }
  }
  function ouvrirPage(slug, jeton) {
    try { localStorage.setItem('qp-jeton:' + slug, jeton); sessionStorage.setItem('qp-jeton:' + slug, jeton); } catch (e) {}
    modifie = false;
    const domaine = APP ? '' : 'https://' + location.hostname.split('.').slice(1).join('.');
    location.href = domaine + '/app/' + slug + '/';
  }

  function fenetrePages() {
    const ancien = document.getElementById('fen-pages'); if (ancien) ancien.remove();
    const fond = el('div', { id: 'fen-pages', role: 'dialog', 'aria-modal': 'true' });
    const fen = el('div', { class: 'fen' });
    fond.appendChild(fen);
    document.body.appendChild(fond);
    return { fond, fen, fermer: () => fond.remove() };
  }

  async function ouvrirAjoutPage() {
    const g = await chargerGroupe(true);
    if (!g) { alert(t('Connexion impossible.')); return; }
    const c = compteCF;
    const { fond, fen, fermer } = fenetrePages();
    fond.addEventListener('click', e => { if (e.target === fond) fermer(); });
    fen.append(el('h2', { text: t('Ajouter un site ou une langue') }));
    if (!g.ajout.possible) {
      fen.append(el('div', { class: 'alerte-abo', text: g.ajout.raison }),
        el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: t('Voir l’abonnement'), onclick: () => { fermer(); ouvrirAbonnement(); } }),
        el('button', { type: 'button', class: 'btn btn-plein fermer', text: t('Fermer'), onclick: fermer }));
      return;
    }
    const ttc = ht => euros(Math.round(ht * (100 + g.tva) / 100));
    const date = d => new Date(d).toLocaleDateString(document.documentElement.lang || 'fr-FR');
    fen.append(el('p', { class: 'sous', text: t('Tout reste sur le même compte : un seul mot de passe, une seule échéance, et vos images partagées entre toutes les pages.') }));

    let type = 'page';
    const peutTraduire = !c.traduction;
    const opt = (val, titre, sous, inactif) => {
      const r = el('input', { type: 'radio', name: 'type-ajout', value: val, disabled: !!inactif });
      if (val === type) r.checked = true;
      const lab = el('label', { class: (val === type ? 'actif' : '') + (inactif ? ' inactif' : '') }, [r, el('span', {}, [el('b', { text: titre }), el('small', { text: sous })])]);
      r.addEventListener('change', () => { type = val; majZones(); });
      return lab;
    };
    const choix = el('div', { class: 'choix-ajout' }, [
      opt('page', t('Un nouveau site'), t('Pour une autre activité : nouveau nom, nouvelle adresse, nouveau QR code.')),
      opt('traduction', t('Une traduction de cette page'), peutTraduire
        ? t('Même adresse et même QR code : la page s’ouvre dans la langue du téléphone du visiteur. Traduction automatique offerte.')
        : t('Ouvrez la page d’origine pour lui ajouter une langue.'), !peutTraduire)
    ]);

    // nouvelle page : nom + disponibilité
    const nom = el('input', { type: 'text', maxLength: 30, placeholder: t('nom-du-site'), autocapitalize: 'none', spellcheck: 'false' });
    const dispo = el('div', { class: 'dispo' });
    let minu = null, libre = false;
    nom.addEventListener('input', () => {
      const v = nom.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (v !== nom.value) nom.value = v;
      libre = false; dispo.className = 'dispo'; dispo.textContent = v ? v + '.qrbc.app' : '';
      clearTimeout(minu);
      if (v.length < 3) return;
      minu = setTimeout(async () => {
        try {
          const j = await (await appelAPI('pages/disponible?nom=' + encodeURIComponent(v), jetonCF)).json();
          if (nom.value !== v) return;
          libre = !!j.disponible;
          dispo.className = 'dispo ' + (libre ? 'ok' : 'ko');
          dispo.textContent = libre ? '✓ ' + v + '.qrbc.app ' + t('est disponible') : (j.raison || t('Ce nom est déjà pris.'));
        } catch (e) {}
      }, 350);
    });
    const zonePage = el('div', { class: 'zone-ajout' }, [el('label', { class: 'champ' }, [el('span', { text: t('Adresse du nouveau site') }),
      el('div', { class: 'adresse' }, [nom, el('em', { text: '.qrbc.app' })])]), dispo]);

    // traduction : langue cible (+ langue actuelle de la page la 1re fois)
    const existantes = new Set([(c.langueSite || '')].concat(c.traductions || []).concat(g.pages.filter(p => p.traduction && p.traduction.source === c.slug).map(p => p.traduction.langue)));
    const selSource = el('select', {}, g.langues.map(l => el('option', { value: l, text: nomLangue(l), selected: l === 'fr' })));
    const selLangue = el('select', {});
    const majLangues = () => {
      const src = c.langueSite || selSource.value;
      selLangue.innerHTML = '';
      g.langues.filter(l => l !== src && !existantes.has(l)).forEach(l => selLangue.appendChild(el('option', { value: l, text: nomLangue(l) })));
    };
    selSource.addEventListener('change', majLangues);
    majLangues();
    const zoneTrad = el('div', { class: 'zone-ajout' }, [
      ...(c.langueSite ? [] : [el('label', { class: 'champ' }, [el('span', { text: t('Langue actuelle de cette page') }), selSource])]),
      el('label', { class: 'champ' }, [el('span', { text: t('Traduire en') }), selLangue])
    ]);
    const majZones = () => {
      zonePage.hidden = type !== 'page'; zoneTrad.hidden = type !== 'traduction';
      choix.querySelectorAll('label').forEach(l => l.classList.toggle('actif', l.querySelector('input').value === type));
    };

    const prix = el('div', { class: 'cout', style: 'padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--prim);font-size:.92rem;margin:0 0 14px' });
    if (g.ajout.gratuit) prix.textContent = '🎁 ' + t('Offert avec votre compte.');
    else if (g.ajout.ligne) prix.append(el('b', { 'data-no-i18n': '', text: '+ ' + euros(g.ajout.prixPeriode) + ' ' + t(g.ajout.formule === 'mensuel' ? 'TTC par mois' : 'TTC par an') }), el('br'),
      document.createTextNode(t('Ajouté à votre abonnement (moitié prix), crédits IA d’un abonnement inclus. Aujourd’hui, seul le prorata jusqu’au ') + date(g.ajout.echeance) + ' ' + t('est prélevé sur votre carte enregistrée.')));
    else prix.append(el('b', { text: euros(g.ajout.prix) + ' ' + t('HT') + ' (' + ttc(g.ajout.prix) + ' ' + t('TTC') + ') ' + t('aujourd’hui') }), el('br'),
      document.createTextNode((g.ajout.echeance ? t('Prix réduit au prorata jusqu’à votre échéance commune du ') + date(g.ajout.echeance) + '. ' : '') +
        t('Ensuite ') + euros(g.prixPage) + ' ' + t('HT') + ' ' + t('par an (moitié prix), renouvelée avec votre abonnement. Crédits IA d’un abonnement inclus.')));
    const msg = el('div', { class: 'msg' });
    const libGo = g.ajout.gratuit ? t('Créer') : g.ajout.ligne ? t('Ajouter à mon abonnement') : t('Payer et créer');
    const go = el('button', { type: 'button', class: 'btn btn-prim', text: libGo });
    go.addEventListener('click', async () => {
      msg.className = 'msg'; msg.textContent = '';
      const corps = type === 'page' ? { type, nom: nom.value.trim() } : { type, langue: selLangue.value, langueSource: c.langueSite || selSource.value };
      if (type === 'page' && !libre) { msg.className = 'msg err'; msg.textContent = t('Choisissez une adresse disponible.'); return; }
      if (type === 'traduction' && !corps.langue) { msg.className = 'msg err'; msg.textContent = t('Toutes les langues proposées existent déjà pour cette page.'); return; }
      if (modifie && !confirm(t('Des modifications ne sont pas enregistrées. Continuer quand même ?'))) return;
      go.disabled = true; go.textContent = t('Un instant…');
      try {
        if (g.ajout.gratuit || g.ajout.ligne) {
          const j = await (await appelAPI('pages/ajouter', jetonCF, { method: 'POST', body: JSON.stringify(corps) })).json();
          ouvrirPage(j.cree, j.jeton);
          return;
        }
        corps.genre = 'page'; corps.retour = location.origin + location.pathname;
        const j = await (await appelAPI('paiement', jetonCF, { method: 'POST', body: JSON.stringify(corps) })).json();
        if (j.url) { modifie = false; location.href = j.url; return; }
      } catch (e) {
        msg.className = 'msg err'; msg.textContent = e.message;
        go.disabled = false; go.textContent = libGo;
      }
    });
    fen.append(choix, zonePage, zoneTrad, prix, msg,
      el('div', { class: 'boutons' }, [el('button', { type: 'button', class: 'btn', text: t('Annuler'), onclick: fermer }), go]));
    if (!g.ajout.gratuit) fen.append(el('div', { class: 'aide', style: 'margin-top:8px;text-align:center', text: '🔒 ' + t(g.ajout.ligne ? 'Paiement sécurisé par Stripe. Résiliable avec votre abonnement.' : 'Paiement sécurisé par Stripe. Facture envoyée par e-mail.') }));
    majZones();
  }

  /* Synchronisation gratuite d'une version traduite : images, style, pages et nombre de pancartes repris de la page d'origine,
     textes de la version gardés (calcul côté serveur, appliqué dans l'éditeur après confirmation ; « Enregistrer » publie) */
  async function synchroniserVersion() {
    const c = compteCF;
    if (!c || !c.traduction) return;
    const { fen, fermer } = fenetrePages();
    fen.append(el('h2', { text: '🎨 ' + t('Reprendre images et style') }), el('p', { class: 'sous', text: t('Comparaison avec la page d’origine…') }));
    let j;
    try { j = await (await appelAPI('synchro', jetonCF, { method: 'POST', body: JSON.stringify({ cfg }) })).json(); }
    catch (e) {
      fen.innerHTML = '';
      fen.append(el('h2', { text: t('Synchronisation impossible') }), el('div', { class: 'alerte-abo', text: e.message === 'Failed to fetch' ? t('Connexion impossible.') : e.message }),
        el('button', { type: 'button', class: 'btn btn-plein fermer', text: t('Fermer'), onclick: fermer }));
      return;
    }
    const r = j.rapport || {}, langue = nomLangue(j.langueSource || 'fr').toLowerCase();
    const NOMS = { home: 'Page Home', perso: nomPage('perso') };
    const alertes = [];
    const ligneNb = (nom, origine, ici, mot) => {
      const diff = origine - ici;
      return el('li', {}, [el('b', { 'data-no-i18n': nom === NOMS.perso ? '' : undefined, text: t(nom) }), ' : ',
        String(origine) + ' ', el('span', { text: mot }), ' ', el('span', { text: 'sur la page d’origine' }), ', ' + ici + ' ', el('span', { text: 'ici' }), ' → ',
        diff > 0 ? el('span', {}, ['+' + diff + ' : ', el('span', { text: 'texte de la page d’origine (en' }), ' ' + langue + '), ', el('span', { text: 'à traduire' })])
                 : el('span', {}, [String(diff) + ' : ', el('span', { text: 'retrait en fin de liste' })])]);
    };
    (r.pancartes || []).forEach(p => alertes.push(ligneNb(NOMS[p.page] || p.page, p.origine, p.ici, 'pancartes')));
    if (r.boutons) alertes.push(ligneNb('Boutons', r.boutons.origine, r.boutons.ici, 'boutons'));
    if (r.blog) alertes.push(el('li', {}, [el('b', { text: t('Blog') }), ' : ',
      ...(r.blog.nouveaux ? ['+' + r.blog.nouveaux + ' ', el('span', { text: 'article(s) : texte de la page d’origine (en' }), ' ' + langue + '), ', el('span', { text: 'à traduire' }), '. '] : []),
      ...(r.blog.retires ? ['−' + r.blog.retires + ' ', el('span', { text: 'article(s) : supprimés comme sur la page d’origine.' })] : [])]));
    const go = el('button', { type: 'button', class: 'btn btn-prim', text: t('Synchroniser') });
    go.addEventListener('click', () => {
      cfg = normaliser(fusion(CONFIG_DEFAUT, j.cfg));
      fermer();
      construireFormulaire(); majApercu(); changement();
      const e = $('#etat'); e.className = 'etat'; e.textContent = t('Images et style repris : vérifiez l’aperçu puis appuyez sur Enregistrer.');
    });
    fen.innerHTML = '';
    fen.append(el('h2', { text: '🎨 ' + t('Reprendre images et style') }),
      el('p', { class: 'sous', text: t('Repris de la page d’origine : design et couleurs, logo, image de fond, numéros et liens des boutons, pages affichées et leur ordre, pictos des pages, images des pancartes et nombre de pancartes.') }),
      el('p', { class: 'sous', text: t('Gardés ici : tous vos textes traduits (titres, pancartes, articles, noms des pages, boutons) et vos cartes de visite.') }),
      alertes.length ? el('div', { class: 'alerte-abo synchro-alerte' }, [el('b', { text: '⚠️ ' + t('Nombres différents de la page d’origine :') }), el('ul', {}, alertes)]) : null,
      el('div', { class: 'boutons' }, [el('button', { type: 'button', class: 'btn', text: t('Annuler'), onclick: fermer }), go]));
  }

  /* Traduction IA de cette version (la 1re, à la création, est offerte) puis publication */
  async function lancerTraduction(auto) {
    const c = compteCF;
    if (!c || !c.traduction) return;
    if (!auto) {
      const prix = c.plan === 'gratuit' ? t('offerte') : euros(c.offre.prixTraduction) + ' ' + t('HT') + ' ' + t('sur votre crédit IA');
      if (!confirm(t('Retraduire remplace tout le contenu de cette version par une nouvelle traduction de la page d’origine (textes, boutons, pancartes, design). Les modifications faites ici seront perdues.') + '\n\n' + t('Prix : ') + prix)) return;
    }
    const { fen, fermer } = fenetrePages();
    fen.append(el('h2', { text: '🌐 ' + t('Traduction en cours') }),
      el('p', { class: 'sous', text: t('L’IA traduit votre page en ') + nomLangue(c.traduction.langue).toLowerCase() + '… (≈ 30 s)' }));
    try {
      const j = await (await appelAPI('traduire', jetonCF, { method: 'POST' })).json();
      afficherAbonnement(j.compte);
      const f = await gh.lire('config.json');
      cfg = normaliser(fusion(CONFIG_DEFAUT, f ? JSON.parse(f.texte) : {}));
      construireFormulaire();
      majApercu();
      fermer();
      changement();
      $('#btn-enregistrer').click();                 // publication immédiate (pages lisibles par Google, icônes, aperçu des liens)
    } catch (e) {
      fen.innerHTML = '';
      fen.append(el('h2', { text: t('Traduction impossible') }), el('div', { class: 'alerte-abo', text: e.message }),
        el('button', { type: 'button', class: 'btn btn-plein fermer', text: t('Fermer'), onclick: fermer }));
      if (e.status === 402) { fermer(); ouvrirAbonnement('quota', e.message); }
    }
  }

  /* =============== Création express : tout le site en une fois =============== */
  const NB_EXPRESS = 5;                         // pancartes de la page Home
  let expressActif = false;                     // une création express tourne (empêche de relancer)
  const titreParDefaut = () => !cfg.titre || cfg.titre === CONFIG_DEFAUT.titre;

  /* Activité en cours de saisie (pas forcément enregistrée) : sert aux images de fond */
  function activiteEnCours() {
    const ia = (cfg.home && cfg.home.ia) || {};
    return { titre: titreParDefaut() ? '' : cfg.titre, sousTitre: cfg.sousTitre || '', description: ia.description || '', zone: ia.zone || '' };
  }

  function bandeauExpress() {
    return el('div', { class: 'express-bandeau' }, [
      el('div', {}, [
        el('b', { text: '⚡ Création express' }),
        el('div', { class: 'aide', style: 'margin:2px 0 0', text: 'Pressé ? Décrivez votre activité : l’IA prépare tout votre site en une minute.' })
      ]),
      el('button', { type: 'button', class: 'btn btn-prim', text: 'Créer mon site', onclick: () => ouvrirExpress() })
    ]);
  }

  function fenetreExpress() {
    const ancien = document.getElementById('fen-express'); if (ancien) ancien.remove();
    const fond = el('div', { id: 'fen-express', role: 'dialog', 'aria-modal': 'true' });
    const fen = el('div', { class: 'fen' });
    fond.appendChild(fen);
    fond.addEventListener('click', e => { if (e.target === fond && !expressActif) fond.remove(); });
    document.body.appendChild(fond);
    return { fond, fen, fermer: () => fond.remove() };
  }

  /* Ce que coûte la création express pour ce compte (texte affiché) */
  function coutExpressTexte(c) {
    const x = c.ia.express || {};
    if (x.enCours) return 'Une création express déjà réglée est en cours : vous pouvez la reprendre sans frais jusqu’à ' +
      new Date(x.enCours.jusqua).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '.';
    if (x.mode === 'offert') return 'Inclus dans votre compte offert.';
    if (x.mode === 'essai') {
      const e = x.essai || {}, p = [];
      if (e.texte) p.push(e.texte + (e.texte > 1 ? ' rédactions' : ' rédaction'));
      if (e.picto) p.push(e.picto + (e.picto > 1 ? ' créations de motifs' : ' création de motifs'));
      if (e.fond) p.push(e.fond + (e.fond > 1 ? ' créations d’images' : ' création d’images'));
      return 'Coût : la moitié de vos créations IA gratuites de l’essai (' + p.join(', ') + ').';
    }
    return 'Coût : ' + euros(x.prix) + ' HT, débités de votre crédit IA (solde : ' + euros(c.ia.credit) + ').';
  }

  /* 1. Consentement : ce qui va se passer et ce que ça coûte */
  async function ouvrirExpress() {
    if (expressActif) return;
    try { const j = await (await appelAPI('compte', jetonCF)).json(); afficherAbonnement(j.compte); } catch (e) {}
    const c = compteCF;
    if (!c || !c.ia) return;
    if (!c.actif) {
      ouvrirAbonnement(c.plan === 'essai' ? 'essai_termine' : 'abonnement_inactif',
        c.plan === 'essai' ? 'Votre essai est terminé : abonnez-vous pour utiliser la création express.' : 'Abonnement inactif : la création express est désactivée.');
      return;
    }
    const x = c.ia.express || {};
    const avecFond = x.enCours ? x.enCours.restant.fond > 0 : !(x.mode === 'essai' && !(x.essai && x.essai.fond));
    const avecPicto = x.enCours ? x.enCours.restant.picto > 0 : !(x.mode === 'essai' && !(x.essai && x.essai.picto));
    const F = fenetreExpress();
    F.fen.append(
      el('h2', { text: '⚡ Création express' }),
      el('p', { class: 'sous', text: 'Un formulaire va s’ouvrir pour créer votre site à partir de la description de votre activité et de votre zone d’action.' }),
      el('ul', {}, [
        'L’IA rédige ' + NB_EXPRESS + ' pancartes sur votre activité pour la page Home, ainsi que le référencement Google.',
        avecPicto ? 'Elle dessine 3 pictogrammes pour votre logo.' : '',
        avecFond ? 'Elle crée 2 images de fond.' : '',
        'E-mail de contact : celui de votre inscription' + (c.email ? ' (' + c.email + ')' : '') + '.',
        'Si vous indiquez un téléphone, les boutons Appeler et WhatsApp sont ajoutés.',
        'Les pancartes de la page Home, l’accroche, le logo et le fond sont remplacés par les nouveaux (avec des couleurs lisibles sur la photo). Vos anciennes images et anciens pictogrammes restent disponibles pour les réutiliser.',
        'Rien n’est publié tant que vous n’appuyez pas sur Enregistrer.'
      ].filter(Boolean).map(t => el('li', { text: t })))
    );
    if (!x.enCours && !x.possible) {
      F.fen.append(el('div', { class: 'alerte-abo', text: x.message || 'La création express n’est pas disponible.' }),
        el('div', { class: 'boutons' }, [
          el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer }),
          el('button', { type: 'button', class: 'btn btn-prim', text: x.code === 'credit_insuffisant' ? 'Recharger' : 'S’abonner',
            onclick: () => { F.fermer(); ouvrirAbonnement(x.code, x.message); } })
        ]));
      return;
    }
    F.fen.append(el('div', { class: 'cout', text: coutExpressTexte(c) }),
      el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Accepter', onclick: () => formulaireExpress(F) })
      ]));
  }

  /* 2. Formulaire : nom, activité, zone, téléphone */
  function formulaireExpress(F) {
    const ia = cfg.home.ia = Object.assign({ description: '', zone: '', nombre: 4, ton: 'pro' }, cfg.home.ia || {});
    const telActuel = (contactPage(cfg, ['tel', 'whatsapp']) || {}).valeur || '';
    const nom = el('input', { type: 'text', value: titreParDefaut() ? '' : cfg.titre, placeholder: 'Ex. : Alex VTC', autocomplete: 'organization' });
    const desc = el('textarea', { rows: 6, value: ia.description, placeholder: t('Ex. : Chauffeur privé avec Mercedes Classe V 7 places. Transferts aéroports Orly, CDG et Beauvais, gares, Disneyland, excursions en Normandie et à Versailles. Disponible 24/24, sièges enfants, je parle français, anglais et arabe. Accueil avec pancarte à l’aéroport.') });
    const zone = el('input', { type: 'text', value: ia.zone, placeholder: 'Ex. : Nice, Monaco, Cannes et toute la Côte d’Azur' });
    const tel = el('input', { type: 'tel', value: telActuel, placeholder: 'Ex. : 06 12 34 56 78 (facultatif)', autocomplete: 'tel' });
    const ton = el('select', {}, Object.keys(TONS_IA).map(k => el('option', { value: k, text: TONS_IA[k], selected: ia.ton === k })));
    const msg = el('div', { class: 'msg' });
    const champ = (etiq, n) => el('label', { class: 'champ' }, [el('span', { text: etiq }), n]);
    F.fen.innerHTML = '';
    F.fen.append(
      el('h2', { text: '⚡ Votre activité' }),
      el('p', { class: 'sous', text: 'Décrivez votre activité avec le plus de détails possible : l’IA s’occupe du reste.' }),
      champ('Nom de l’entreprise', nom),
      el('label', { class: 'champ' }, [el('span', { text: 'Votre activité' }), desc, jaugeDetails(desc)]),
      champ('Zone d’action', zone),
      champ('Téléphone (Appeler et WhatsApp)', tel),
      champ('Ton des textes', ton),
      msg,
      el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Confirmer', onclick: confirmer })
      ]));
    F.fen.addEventListener('input', () => { msg.textContent = ''; });
    nom.focus();
    function confirmer() {
      msg.className = 'msg err';
      if (!nom.value.trim()) { msg.textContent = 'Indiquez le nom de votre entreprise.'; nom.focus(); return; }
      if (desc.value.trim().length < 10) { msg.textContent = 'Décrivez l’activité en quelques mots (10 caractères minimum).'; desc.focus(); return; }
      const chiffres = tel.value.replace(/\D/g, '');
      if (tel.value.trim() && (chiffres.length < 8 || chiffres.length > 15)) { msg.textContent = 'Numéro de téléphone incomplet.'; tel.focus(); return; }
      lancerExpress(F, { nom: nom.value.trim(), description: desc.value.trim(), zone: zone.value.trim(), tel: tel.value.trim(), ton: ton.value });
    }
  }

  /* Boutons de contact : complète un bouton vide existant, sinon en ajoute un */
  function contactExpress(cle, valeur) {
    if (!valeur) return;
    const r = cfg.reseaux.find(x => x.id === cle);           // depuis le 25/11 : appel, WhatsApp, e-mail = pictos
    if (r) { if (!String(r.valeur || '').trim()) r.valeur = valeur; r.actif = true; return; }
    const m0 = MODELES[cle];
    const b = cfg.boutons.find(x => x && x.type === m0.type);
    if (b) { if (!String(b.valeur || '').trim()) b.valeur = valeur; b.masque = false; return; }
    const nouveau = Object.assign({ icone: '', texte: '', type: 'lien', valeur: '', message: '', couleur: '' }, m0,
      { texte: t(m0.texte), valeur }, m0.message ? { message: t(m0.message) } : {});
    const iRes = cfg.boutons.findIndex(x => x && x.type === 'reseaux');     // avant le bloc des réseaux
    if (iRes >= 0) cfg.boutons.splice(iRes, 0, nouveau); else cfg.boutons.push(nouveau);
  }

  /* 3. Réservation (paiement ou crédits d'essai), puis les 3 créations comme dans les menus habituels */
  async function lancerExpress(F, d) {
    expressActif = true;
    F.fen.innerHTML = '';
    const etapes = {
      reserve: { nom: 'Réservation de la création express' },
      texte: { nom: NB_EXPRESS + ' pancartes et référencement Google' },
      picto: { nom: '3 pictogrammes pour le logo' },
      fond: { nom: '2 images de fond' }
    };
    const liste = el('ul', { class: 'etapes' });
    const dessiner = () => {
      liste.innerHTML = '';
      Object.values(etapes).filter(e => !e.ignore).forEach(e => liste.appendChild(el('li', {}, [
        el('span', { class: 'ic', text: e.etat === 'ok' ? '✓' : e.etat === 'err' ? '✕' : e.etat === 'cours' ? '⏳' : '·' }),
        el('span', {}, [document.createTextNode(t(e.nom)), ...(e.erreur ? [el('small', { text: e.erreur })] : [])])
      ])));
    };
    const titre = el('h2', { text: '⚡ Création en cours…' });
    const sous = el('p', { class: 'sous', text: 'Environ une minute. Gardez cette fenêtre ouverte.' });
    const pied = el('div');
    F.fen.append(titre, sous, liste, pied);
    dessiner();

    // Réservation : débite le crédit (abonné) ou la moitié des créations d'essai, une seule fois
    etapes.reserve.etat = 'cours'; dessiner();
    let restant;
    try {
      const j = await (await appelAPI('express', jetonCF, { method: 'POST', body: '{}' })).json();
      afficherAbonnement(j.compte);
      restant = j.express.restant;
      etapes.reserve.etat = 'ok';
      if (j.reprise) etapes.reserve.nom = 'Création express déjà réglée : reprise sans frais';
    } catch (e) {
      expressActif = false;
      etapes.reserve.etat = 'err'; etapes.reserve.erreur = e.message === 'Failed to fetch' ? 'Connexion impossible.' : e.message;
      titre.textContent = 'Création express impossible'; sous.textContent = '';
      dessiner();
      pied.appendChild(el('div', { class: 'boutons' }, [el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer })].concat(e.status === 402
        ? [el('button', { type: 'button', class: 'btn btn-prim', text: 'Mon abonnement', onclick: () => { F.fermer(); ouvrirAbonnement('quota', e.message); } })] : [])));
      return;
    }

    // Informations saisies : nom, description, contacts (avant la rédaction, qui cite les moyens de contact)
    cfg.titre = d.nom;
    cfg.home.actif = true;                                        // la création express remplit la page Home : on l'active
    Object.assign(cfg.home.ia, { description: d.description, zone: d.zone, ton: d.ton, nombre: NB_EXPRESS });
    // Une photo va servir de fond : texte clair et voile sombre, sinon le titre se perd dans l'image
    if (restant.fond && luminance(cfg.design.texte) < 0.5) {
      const k = d.ton === 'luxe' ? 'luxe' : 'nuit', th = THEMES[k];
      Object.assign(cfg.design, { theme: k, fond: th.fond, fond2: th.fond2, texte: th.texte, accent: th.accent });
    }
    if (restant.fond) cfg.design.voile = Math.max(Number(cfg.design.voile) || 0, 45);
    contactExpress('tel', d.tel);
    contactExpress('whatsapp', d.tel);
    contactExpress('email', compteCF.email || '');
    changement();

    const faire = (cle, fn) => {
      if (!restant[cle]) { etapes[cle].ignore = true; return Promise.resolve(); }
      etapes[cle].etat = 'cours'; dessiner();
      return fn().then(() => { etapes[cle].etat = 'ok'; }, e => {
        etapes[cle].etat = 'err'; etapes[cle].erreur = e.message === 'Failed to fetch' ? 'Connexion impossible.' : e.message;
      }).then(dessiner);
    };
    let nouveauxArticles = null;
    const texte = () => faire('texte', async () => {
      const articles = await redigerAvecIA({ description: d.description, zone: d.zone, nombre: NB_EXPRESS, ton: d.ton }, true);
      if (propositionSeo) cfg.seo = Object.assign({}, cfg.seo, { titre: propositionSeo.titre, description: propositionSeo.description, motCle: propositionSeo.motCle, motsCles: propositionSeo.motsCles, zone: d.zone || (cfg.seo && cfg.seo.zone) || '' });
      propositionSeo = null; proposition = null;
      if (articles.accroche) cfg.sousTitre = articles.accroche;
      nouveauxArticles = articles.map(a => ({ titre: a.titre, texte: a.texte, image: '', style: 'texte' }));
      cfg.home.articles = nouveauxArticles;
      cfg.home.actif = true;
    });
    const picto = () => faire('picto', async () => {
      const o = optionsLogo();
      if (!o.nom || o.nom === CONFIG_DEFAUT.titre) o.nom = d.nom;
      const nouveaux = await creerMotifsIA(o, null, true);
      o.motifs = o.motifs.concat(nouveaux).slice(-60);       // même historique que l'atelier logo
      o.choix = 'ia' + (o.motifs.length - nouveaux.length);
      {                                                       // le premier nouveau picto devient le logo (l'ancien reste dans « Mes images »)
        const png = await imageEnPNG(svgEnURL(composerLogo(o, o.motifs[o.motifs.length - nouveaux.length])), 1024);
        const chemin = 'images/logo-' + Date.now() + '.png';
        imagesLocales[chemin] = png;
        imagesAEnvoyer[chemin] = png.split(',')[1];
        cfg.logo = chemin;
        cfg.design.logoRond = false;
      }
    });
    let images = [];
    const fond = () => faire('fond', async () => {
      const r = await appelAPI('fond', jetonCF, { method: 'POST', headers: { 'x-qrbc-express': '1' },
        body: JSON.stringify({ ambiance: d.ton === 'luxe' ? 'luxe' : 'photo', idee: '', activite: activiteEnCours() }) });
      const j = await r.json();
      medias = j.medias;
      afficherAbonnement(j.compte);
      images = j.nouvelles.map(n => n.chemin);
      if (images[0]) cfg.design.imageFond = images[0];   // la nouvelle image devient le fond ; l'ancienne reste dans « Mes images »
    });

    const executer = async () => {
      await texte();                                // d'abord les textes : les dessins s'appuient sur l'activité
      await Promise.all([picto(), fond()]);
      // la première pancarte prend une des nouvelles images en plein écran
      const arts = cfg.home.articles;
      if (nouveauxArticles && arts === nouveauxArticles && arts[0] && !arts[0].image && images.length)
        Object.assign(arts[0], { image: images[1] || images[0], style: 'photo' });
      changement();
      construireFormulaire();
    };
    await executer();
    terminer();

    function terminer() {
      const rates = Object.keys(etapes).filter(k => etapes[k].etat === 'err');
      expressActif = false;
      pied.innerHTML = '';
      if (!rates.length) {
        appelAPI('express/fin', jetonCF, { method: 'POST', body: '{}' }).then(r => r.json()).then(j => afficherAbonnement(j.compte)).catch(() => {});
        titre.textContent = '✓ Votre site est prêt';
        sous.textContent = '';
        pied.append(el('div', { class: 'cout', text: 'Vérifiez tout : textes, boutons, logo et images (l’aperçu est à jour). Puis appuyez sur « Enregistrer » en bas de l’écran pour publier.' }),
          el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: 'Vérifier mon site', onclick: finir }));
        return;
      }
      titre.textContent = 'Presque terminé';
      sous.textContent = 'Une étape n’a pas abouti. Elle est déjà réglée : vous pouvez la relancer sans frais pendant 30 minutes.';
      pied.append(el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Vérifier mon site', onclick: finir }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Réessayer', onclick: async () => {
          expressActif = true; pied.innerHTML = ''; titre.textContent = '⚡ Création en cours…';
          rates.forEach(k => { etapes[k].erreur = ''; });
          if (rates.includes('texte')) await texte();
          await Promise.all([rates.includes('picto') ? picto() : null, rates.includes('fond') ? fond() : null]);
          const arts = cfg.home.articles;
          if (nouveauxArticles && arts === nouveauxArticles && arts[0] && !arts[0].image && images.length)
            Object.assign(arts[0], { image: images[1] || images[0], style: 'photo' });
          changement(); construireFormulaire();
          terminer();
        } })
      ]));
    }
    function finir() {
      F.fermer();
      vueApercu = cfg.home.actif ? 'home' : 'contact';
      majApercu();
      const b = $('#btn-enregistrer');
      b.classList.remove('pouls'); void b.offsetWidth; b.classList.add('pouls');
      const e = $('#etat'); e.className = 'etat'; e.textContent = 'Site créé : vérifiez puis cliquez sur Enregistrer';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  /* ---------------- Assistant « ❓ Aide » ----------------
     Fenêtre réductible au-dessus de la barre du bas : on lit la réponse, on réduit pour appliquer, on rouvre pour relire.
     La conversation est gardée sur l'appareil (par page) jusqu'à « Nouvelle conversation ». */
  const aide = (() => {
    const btn = $('#btn-aide'), pan = $('#aide-panneau'), fil = $('#aide-fil'), form = $('#aide-form'), q = $('#aide-question'), pied = $('#aide-pied');
    let fils = [], restantes = null, enCours = false;
    const cle = () => 'qp-aide:' + (APP || location.hostname);
    const sauver = () => { try { localStorage.setItem(cle(), JSON.stringify(fils.slice(-30))); } catch (e) {} };
    const charger = () => { try { const l = JSON.parse(localStorage.getItem(cle()) || '[]'); fils = Array.isArray(l) ? l : []; } catch (e) { fils = []; } };
    function enrichir(txt) {            // texte simple : échappé, **gras**
      const d = document.createElement('div'); d.textContent = txt;
      return d.innerHTML.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    }
    function bulle(m) {
      const b = el('div', { class: 'aide-msg ' + (m.role === 'user' ? 'q' : 'r') + (m.err ? ' err' : '') });
      if (m.role === 'user') b.textContent = m.content; else if (m.err) b.textContent = t(m.content); else b.innerHTML = enrichir(m.content);
      b.setAttribute('data-no-i18n', '');
      return b;
    }
    function afficher() {
      fil.innerHTML = '';
      fil.appendChild(el('div', { class: 'aide-msg r', text: 'Bonjour ! Posez votre question sur la création de votre page : je vous explique où toucher, étape par étape. Réduisez cette fenêtre pour appliquer, puis rouvrez-la pour relire.' }));
      fils.forEach(m => fil.appendChild(bulle(m)));
      if (enCours) fil.appendChild(el('div', { class: 'aide-msg r', text: '…' }));
      pied.textContent = restantes === null ? '' : t('Questions restantes aujourd’hui :') + ' ' + restantes;
      requestAnimationFrame(() => { fil.scrollTop = fil.scrollHeight; });
    }
    function ouvrir() { pan.classList.remove('cache'); btn.classList.add('actif'); btn.classList.remove('nouveau'); afficher(); setTimeout(() => q.focus(), 50); }
    function reduire() { pan.classList.add('cache'); btn.classList.remove('actif'); }
    function contexte() {
      const d = cfg.design || {};
      return {
        langueEditeur: langueUI(), vueApercu: typeof vueApercu !== 'undefined' ? vueApercu : '', modificationsNonEnregistrees: modifie,
        titre: cfg.titre, sousTitre: cfg.sousTitre, pied: cfg.pied ? 'oui' : 'non', logo: cfg.logo ? 'oui' : 'non',
        design: { theme: d.theme, couleurs: [d.fond, d.fond2, d.texte, d.accent], police: d.police, disposition: d.disposition, forme: d.forme, style: d.style,
          imageFond: d.imageFond ? 'oui' : 'non', voile: d.voile, texteImage: d.texteImage, effetTexte: d.effetTexte, tousRonds: d.tousRonds, installer: d.installer },
        boutons: (cfg.boutons || []).map(b => ({ action: b.type, texte: b.texte, rempli: !!String(b.valeur || '').trim(), masque: !!b.masque })),
        reseaux: (cfg.reseaux || []).filter(x => x.actif && String(x.valeur || '').trim()).map(x => x.id),
        home: cfg.home ? { actif: !!cfg.home.actif, pancartes: (cfg.home.articles || []).map(a => ({ titre: a.titre, style: a.style, image: a.image ? 'oui' : 'non', masque: !!a.masque })) } : null
      };
    }
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const texte = q.value.trim();
      if (!texte || enCours) return;
      fils.push({ role: 'user', content: texte }); q.value = ''; q.style.height = '';
      enCours = true; afficher();
      try {
        const msgs = fils.filter(m => !m.err).map(m => ({ role: m.role, content: m.content }));
        const j = await (await appelAPI('aide', jetonCF, { method: 'POST', body: JSON.stringify({ messages: msgs, contexte: contexte(), langue: langueUI() }) })).json();
        fils.push({ role: 'assistant', content: j.reponse }); restantes = j.restantes;
        if (pan.classList.contains('cache')) btn.classList.add('nouveau');
      } catch (err) {
        fils.push({ role: 'assistant', content: err.message || t('L’assistant ne répond pas pour le moment. Réessayez dans un instant.'), err: true });
        if (err.code === 'aide_quota') restantes = 0;
      }
      enCours = false; sauver(); afficher();
    });
    q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true })); } });
    q.addEventListener('input', () => { q.style.height = ''; q.style.height = Math.min(120, q.scrollHeight) + 'px'; });
    btn.addEventListener('click', () => pan.classList.contains('cache') ? ouvrir() : reduire());
    $('#aide-reduire').addEventListener('click', reduire);
    $('#aide-effacer').addEventListener('click', () => {
      if (!fils.length || !confirm(t('Effacer toute la conversation ?'))) return;
      fils = []; sauver(); afficher(); q.focus();
    });
    return { activer() { if (!CF) return; charger(); btn.classList.remove('cache'); } };
  })();

  /* ---------------- Modèles de boutons ---------------- */
  const MODELES = {
    paiement:  { icone: '💳', texte: 'Payer en ligne', type: 'lien', couleur: '' },
    reserver:  { icone: '📅', texte: 'Réserver en ligne', type: 'lien', couleur: '' },
    avis:      { icone: '⭐', texte: 'Laisser un avis Google', type: 'avis', couleur: '#4285F4' },
    whatsapp:  { icone: '💬', texte: 'Réserver sur WhatsApp', type: 'whatsapp', message: 'Bonjour, je souhaite réserver', couleur: '#25D366' },
    tel:       { icone: '📞', texte: 'Appeler', type: 'tel', couleur: '' },
    site:      { icone: '🌐', texte: 'Notre site', type: 'lien', couleur: '' },
    maps:      { icone: '📍', texte: 'Itinéraire', type: 'maps', couleur: '' },
    email:     { icone: '✉️', texte: 'Nous écrire', type: 'email', couleur: '' },
    menu:      { icone: '📖', texte: 'Voir la carte', type: 'lien', couleur: '' }
  };

  /* ---------------- Formulaire complet ---------------- */
  document.getElementById('formulaire').addEventListener('focusin', e => {
    const sec = e.target.closest('details.section');
    if (!sec || sec.dataset.id === 'partage') return;

  /* Couleurs dominantes du logo (jusqu'à 4), pour la gamme « Couleurs du logo » des pictos : blanc et transparent ignorés */
  async function couleursDuLogo() {
    const im = cfg.logo ? await chargerImage(imagesLocales[cfg.logo] || cfg.logo) : null;
    if (!im) return [];
    const n = 64, cv = document.createElement('canvas'); cv.width = cv.height = n;
    const x = cv.getContext('2d'); x.drawImage(im, 0, 0, n, n);
    let px; try { px = x.getImageData(0, 0, n, n).data; } catch (e) { return []; }
    const cases = {};
    for (let k = 0; k < px.length; k += 4) {
      const r = px[k], g = px[k + 1], b = px[k + 2], a = px[k + 3];
      if (a < 200) continue;                                             // transparent
      const cle = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5);
      const c = cases[cle] || (cases[cle] = { n: 0, r: 0, g: 0, b: 0 });
      c.n++; c.r += r; c.g += g; c.b += b;
    }
    const liste = Object.values(cases).sort((a, b) => b.n - a.n).map(c => [c.r / c.n, c.g / c.n, c.b / c.n].map(Math.round));
    const total = Object.values(cases).reduce((s, c) => s + c.n, 0);
    // 2 couleurs principales : la plus présente, puis la plus contrastée parmi celles qui comptent (≥ 2 % du logo)
    if (!liste.length) return [];
    const principale = liste[0];
    const comptes = Object.values(cases).sort((a, b) => b.n - a.n);
    let seconde = null, dMax = 90;
    comptes.forEach((c, i) => {
      if (i === 0 || c.n < total * 0.02) return;
      const col = liste[i], dist = Math.hypot(col[0] - principale[0], col[1] - principale[1], col[2] - principale[2]);
      if (dist > dMax) { dMax = dist; seconde = col; }
    });
    return [principale].concat(seconde ? [seconde] : []).map(c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''));
  }

  /* Schéma miniature d'une disposition (formes simples) */
  /* =============== QR code et carte de visite =============== */
  const URL_PUBLIQUE = dossierSite();
  // Adresse codée dans les QR (cartes, affiches, PNG) : ?s=qr permet de compter les scans dans les statistiques
  const URL_QR = URL_PUBLIQUE + '?s=qr';

  // Dessine le QR code sur un contexte 2D (zone carrée x, y, taille)
  let qrCarteMasque = false;          // face de carte sans QR (27/11) : QR, cadre blanc et « Scannez-moi » non dessinés, place laissée vide
  function dessinerQR(ctx, texte, x, y, taille, couleur) {
    if (qrCarteMasque) return;
    const qr = qrcode(0, 'M');
    qr.addData(texte);
    qr.make();
    const n = qr.getModuleCount();
    const m = taille / n;
    ctx.fillStyle = couleur || '#000';
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(Math.floor(x + c * m), Math.floor(y + r * m), Math.ceil(m), Math.ceil(m));
  }

  function canvasQR(taillePx) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = taillePx;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, taillePx, taillePx);
    const marge = Math.round(taillePx * 0.08);
    dessinerQR(ctx, URL_QR, marge, marge, taillePx - 2 * marge);
    return cv;
  }

  function telecharger(cv, nom, type, qualite) {
    cv.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: nom });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, type, qualite);
  }

  function partageAJour() { return !(cfg.design.imageFond || cfg.logo) || (cfg.partage && cfg.partage.chemin && cfg.partage.cle === clePartage()); }
  async function preparerImagePartage() {
    if (partageAJour()) { if (!(cfg.design.imageFond || cfg.logo)) delete cfg.partage; return; }
    const d = cfg.design;
    const resoudre = p => imagesLocales[p] || p;
    const cv = document.createElement('canvas');
    cv.width = PARTAGE_L; cv.height = PARTAGE_H;
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, PARTAGE_L, PARTAGE_H);
    g.addColorStop(0, d.fond || '#f5f1ea'); g.addColorStop(1, d.fond2 || d.fond || '#e9e0d2');
    ctx.fillStyle = g; ctx.fillRect(0, 0, PARTAGE_L, PARTAGE_H);
    const fond = await chargerImageCadree(d.imageFond, d.imageFondCadre, resoudre);
    const logo = await chargerImage(cfg.logo ? resoudre(cfg.logo) : '');
    if (fond && fond.width) {
      // recadrage « couvrir », un peu au-dessus du centre (le sujet d'un fond vertical y est souvent)
      const k = Math.max(PARTAGE_L / fond.width, PARTAGE_H / fond.height);
      const w = fond.width * k, h = fond.height * k;
      ctx.drawImage(fond, (PARTAGE_L - w) / 2, Math.max(PARTAGE_H - h, Math.min(0, PARTAGE_H * 0.42 - h * 0.42)), w, h);
    } else if (logo && logo.width) {
      const k = Math.min(440 / logo.width, 440 / logo.height);
      ctx.drawImage(logo, (PARTAGE_L - logo.width * k) / 2, (PARTAGE_H - logo.height * k) / 2, logo.width * k, logo.height * k);
    } else return;                                       // image illisible : on garde l'ancienne
    let data;
    try { data = cv.toDataURL('image/jpeg', 0.84); } catch (e) { return; }
    const chemin = 'images/partage-' + Date.now() + '.jpg';
    imagesLocales[chemin] = data;
    imagesAEnvoyer[chemin] = data.split(',')[1];
    cfg.partage = { chemin, cle: clePartage(), l: PARTAGE_L, h: PARTAGE_H };
  }

  /* Icônes de l'appli (page installable) : 192, 512 et 512 « maskable », à partir du logo ou des initiales */
  function cleIcones() { const d = cfg.design; return [cfg.logo, d.fond, d.accent, cfg.logo ? '' : initiales(cfg.titre), 'v3'].join('|'); }
  function iconesAJour() { return !CF || (cfg.appIcones && cfg.appIcones.i512 && cfg.appIcones.cle === cleIcones()); }
  /* Logo « plein » (photo, carré arrondi, rond… qui touche les bords) : il remplit l'icône, sans marge.
     Fond de l'icône = couleur près du bord du logo (coins d'un carré arrondi), sinon fond de la page. */
  // Zone utile du logo (sans la marge transparente autour) : [sx, sy, sw, sh] dans l'image d'origine
  function zoneUtileLogo(logo) {
    try {
      const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N;
      const ctx = cv.getContext('2d');
      ctx.drawImage(logo, 0, 0, N, N);
      const px = ctx.getImageData(0, 0, N, N).data;
      let x0 = N, y0 = N, x1 = -1, y1 = -1;
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (px[(y * N + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) return [0, 0, logo.width, logo.height];
      const kx = logo.width / N, ky = logo.height / N;
      return [x0 * kx, y0 * ky, (x1 - x0 + 1) * kx, (y1 - y0 + 1) * ky];
    } catch (e) { return [0, 0, logo.width, logo.height]; }
  }
  function analyserBordLogo(logo, zone) {
    try {
      const N = 100, cv = document.createElement('canvas'); cv.width = cv.height = N;
      const ctx = cv.getContext('2d');
      const [sx, sy, sw, sh] = zone || [0, 0, logo.width, logo.height];
      const k = Math.min(N / sw, N / sh), w = sw * k, h = sh * k;
      ctx.drawImage(logo, sx, sy, sw, sh, (N - w) / 2, (N - h) / 2, w, h);
      const px = (x, y) => ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
      // milieu de chaque côté, un peu à l'intérieur (2 à 8 %) : un liseré antialiasé ne fausse pas le résultat
      const milieux = [[[50, 2], [50, 5], [50, 8]], [[50, 97], [50, 94], [50, 91]], [[2, 50], [5, 50], [8, 50]], [[97, 50], [94, 50], [91, 50]]]
        .map(pts => pts.map(([x, y]) => px(x, y)).sort((a, b) => b[3] - a[3])[0]);
      const diag = [[12, 12], [87, 12], [12, 87], [87, 87]].map(([x, y]) => px(x, y));
      const plein = milieux.every(c => c[3] > 200);
      if (!plein) return { plein: false };
      const coins = diag.every(c => c[3] > 200);
      if (!coins) return { plein: true, couleur: null };          // rond : fond de la page dans les coins
      // coins du haut seulement : le bas porte souvent le nom ou un bandeau
      const m = [0, 1, 2].map(i => Math.round((diag[0][i] + diag[1][i]) / 2));
      return { plein: true, couleur: '#' + m.map(v => v.toString(16).padStart(2, '0')).join('') };
    } catch (e) { return { plein: false }; }
  }
  async function preparerIconesAppli() {
    if (iconesAJour()) return;
    const d = cfg.design;
    const logo = await chargerImage(cfg.logo ? (imagesLocales[cfg.logo] || cfg.logo) : '');
    const zone = logo && logo.width ? zoneUtileLogo(logo) : null;
    const bordLogo = logo && logo.width ? analyserBordLogo(logo, zone) : { plein: false };
    const dessiner = (taille, part) => {
      const cv = document.createElement('canvas'); cv.width = cv.height = taille;
      const ctx = cv.getContext('2d');
      if (logo && logo.width) {
        ctx.fillStyle = (bordLogo.plein && bordLogo.couleur) || d.fond || '#ffffff'; ctx.fillRect(0, 0, taille, taille);
        // logo plein : 100 % de l'icône (82 % pour l'icône « maskable », dont Android ne montre que le centre)
        if (bordLogo.plein) part = part < 0.7 ? 0.82 : 1;
        // logo plein : rogné de sa marge transparente ; sinon logo entier (sa marge fait partie du dessin)
        const [sx, sy, sw, sh] = bordLogo.plein && zone ? zone : [0, 0, logo.width, logo.height];
        const k = Math.min(taille * part / sw, taille * part / sh);
        ctx.drawImage(logo, sx, sy, sw, sh, (taille - sw * k) / 2, (taille - sh * k) / 2, sw * k, sh * k);
      } else {
        const fondI = d.accent || '#2b2620';
        ctx.fillStyle = fondI; ctx.fillRect(0, 0, taille, taille);
        const ini = initiales(cfg.titre).slice(0, 2);
        ctx.fillStyle = luminance(fondI) > 0.55 ? '#111111' : '#ffffff';
        ctx.font = '700 ' + Math.round(taille * part * (ini.length > 1 ? 0.5 : 0.62)) + 'px system-ui, -apple-system, Roboto, Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ini, taille / 2, taille / 2 + taille * 0.02);
      }
      return cv.toDataURL('image/png');
    };
    const gen = 'images/app-' + Date.now() + '-';
    const ic = { cle: cleIcones(), i192: gen + '192.png', i512: gen + '512.png', m512: gen + 'm512.png' };
    let images;
    try { images = { [ic.i192]: dessiner(192, 0.84), [ic.i512]: dessiner(512, 0.84), [ic.m512]: dessiner(512, 0.62) }; }
    catch (e) { return; }                        // logo illisible : on garde les icônes précédentes
    for (const ch in images) { imagesLocales[ch] = images[ch]; imagesAEnvoyer[ch] = images[ch].split(',')[1]; }
    cfg.appIcones = ic;
  }

  // Image avec ses réglages de cadrage / assombrissement (sans fichier recadré) : canvas de la zone choisie, voile compris
  async function chargerImageCadree(chemin, cadre, resoudre) {
    const im = await chargerImage(chemin ? (resoudre ? resoudre(chemin) : (imagesLocales[chemin] || chemin)) : '');
    const c = im && cadreImage(cadre, chemin);
    if (!c) return im;
    try {
      const [sx, sy, sw, sh] = c.r, k = Math.min(1, 1600 / Math.max(sw, sh));
      const cv = document.createElement('canvas'); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
      const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high';
      x.drawImage(im, sx * im.naturalWidth / c.iw, sy * im.naturalHeight / c.ih, sw * im.naturalWidth / c.iw, sh * im.naturalHeight / c.ih, 0, 0, cv.width, cv.height);
      const t = teinteImage(c); if (t) { x.fillStyle = t; x.fillRect(0, 0, cv.width, cv.height); }
      return cv;
    } catch (e) { return im; }
  }
  function chargerImage(src) {
    return new Promise((ok, ko) => {
      if (!src) return ok(null);
      const im = new Image();
      if (/^https?:/i.test(src)) im.crossOrigin = 'anonymous';
      im.onload = () => ok(im);
      im.onerror = () => ok(null);
      im.src = src;
    });
  }

  function formaterNumero(v) {

  /* Textes fixes imprimés sur les cartes : dans la langue de la page (cfg.langue, version traduite comprise), pas celle de l'éditeur */

  /* Informations imprimées sur la carte (25–26/11) : nom, slogan, téléphone, e-mail, site + champs perso, 5 au plus.
     Valeur vide = reprise de la page (titre, accroche, boutons).
     cfg.carteInfos = { choix: [clés cochées], nom, slogan, tel, email, site,
                        perso: [{ id: 'p…', type: 'tel'|'email'|'site'|'texte', etiq, valeur }], ordre: [clés des coordonnées] }
     Le nom et le slogan restent en haut de la carte ; l'ordre (↑ ↓) vaut pour les coordonnées. */
  const CHAMPS_CARTE = [['nom', 'Nom de l’entreprise'], ['slogan', 'Slogan'], ['tel', 'Téléphone'], ['email', 'E-mail'], ['site', 'Site web']];
  const TYPES_PERSO_CARTE = { tel: 'Téléphone', email: 'E-mail', site: 'Site web', texte: 'Texte' };
  const ETIQ_TYPE_CARTE = { tel: 'Tél.', email: 'E-mail', site: 'Web', texte: '' };
  const MAX_INFOS_CARTE = 5, MAX_PERSO_CARTE = 5;
  // « Aa » des cartes : cfg.typo.carteNom… et cfg.typo.carteP_<id> (mêmes réglages que les textes de la page : p, g, t, c)
  const CLES_TYPO_CARTE = { nom: 'carteNom', slogan: 'carteSlogan', tel: 'carteTel', email: 'carteEmail', site: 'carteSite' };
  // Verso (28/11) : mêmes clés suivies de « V » (cfg.typo.carteNomV…), réglées à part
  const cleTypoCarte = (k, face) => (CLES_TYPO_CARTE[k] || 'carteP_' + k) + (face === 'verso' ? 'V' : '');
  const clesInfosCarte = () => ['nom', 'slogan', 'tel', 'email', 'site'].concat(persoCarte().map(p => p.id));
  // Anciennes cartes : un seul « Aa » valait pour les deux faces → recopié une fois sur le verso (carteInfos.typoV)
  function typoVersoInit() {

      const r = cfg.typo && cfg.typo[cleTypoCarte(k)], v = cleTypoCarte(k, 'verso');

  function typoCarte(face) {
    if (face === 'verso') typoVersoInit();
    const o = {};
    clesInfosCarte().forEach(k => { const v = typoDe(cfg, cleTypoCarte(k, face)); if (v) o[k] = v; });
