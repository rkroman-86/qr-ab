      el('label', { class: 'champ', style: 'margin-top:10px' }, [el('span', { text: 'Votre idée (facultatif)' }), idee]),
      go, quotaIA('fond'), msg
    );
    return boite;
  }

  /* =============== Mes pages : plusieurs pages et langues sur un seul compte =============== */
  let groupe = null;                            // réponse de l'API « pages » (liste, prix d'ajout)
  async function chargerGroupe(forcer) {
    if (!CF || !jetonCF) return null;
    if (groupe && !forcer) return groupe;
    try { groupe = await (await appelAPI('pages', jetonCF)).json(); } catch (e) { groupe = null; }
    return groupe;
  }
  function nomLangue(code) {
    let ui = 'fr';
    try { ui = localStorage.getItem('qp-langue') || document.documentElement.lang || 'fr'; } catch (e) {}
    try { const n = new Intl.DisplayNames([ui], { type: 'language' }).of(code); return n.charAt(0).toUpperCase() + n.slice(1); }
    catch (e) { return String(code).toUpperCase(); }
  }
  function libellePage(p) { return p.traduction ? p.traduction.source + ' · ' + p.traduction.langue.toUpperCase() : p.slug; }

  /* Bandeau « Mes pages ». Les textes sont posés en français, en morceaux séparés : la traduction de l'interface
     (i18n) les traduit et les retraduit à chaque changement de langue, sans recharger la page. */
  const NOMS_PROPRES_LANGUE = { fr: 'Français', en: 'English', ru: 'Русский', es: 'Español', de: 'Deutsch', it: 'Italiano', pt: 'Português',
    nl: 'Nederlands', uk: 'Українська', pl: 'Polski', ro: 'Română', tr: 'Türkçe', zh: '中文', ja: '日本語' };
  function bandeauPages() {
    const box = el('div', { class: 'pages-bandeau' });
    const remplir = () => {
      box.innerHTML = '';
      const c = compteCF, g = groupe;
      if (c && c.traduction) {
        const L = c.traduction.langue;
        box.append(el('div', { class: 'pb-trad' }, [
          el('b', {}, ['🌐 ', el('span', { 'data-no-i18n': '', text: NOMS_PROPRES_LANGUE[L] || L.toUpperCase() }), ' · ', el('span', { text: 'version traduite' })]),
          el('div', { class: 'aide', style: 'margin:2px 0 8px' }, [el('span', { text: 'Traduction de' }), ' ', el('b', { text: c.traduction.source + '.qrbc.app' }), '. ',
            el('span', { text: 'Vous pouvez la modifier librement : elle est indépendante de la page d’origine.' })]),
          el('button', { type: 'button', class: 'btn btn-mini', onclick: () => lancerTraduction(false) },
            [el('span', {}, ['🔄 ', el('span', { text: 'Retraduire depuis la page d’origine' }), ' (',      // un seul bloc : le bouton est en flex
              ...(c.plan === 'gratuit' ? [el('span', { text: 'offert' })] : [euros(c.offre.prixTraduction) + ' ', el('span', { text: 'HT' })]), ')'])])
        ]));
      }
      const plusieurs = g && g.pages.length > 1;
      box.append(el('div', { class: 'pb-tete' }, [
        el('b', {}, ['📄 ', el('span', { text: plusieurs ? 'Mes pages' : 'Une autre activité ou une autre langue ?' })]),
        el('button', { type: 'button', class: 'btn btn-mini', onclick: () => ouvrirAjoutPage() }, [el('span', {}, ['＋ ', el('span', { text: 'Ajouter une page ou une langue' })])])
      ]));
      if (plusieurs) {
        const liste = el('div', { class: 'pb-liste', 'data-no-i18n': '' });
        g.pages.forEach(p => {
          const actif = p.slug === g.courant;
          liste.appendChild(el('button', { type: 'button', class: 'pb-page' + (actif ? ' actif' : ''), text: libellePage(p) + (p.principale ? ' ★' : ''),
            title: p.adresse, onclick: actif ? null : () => basculerVers(p.slug) }));
        });
        box.append(liste);
      }
    };
    remplir();
    chargerGroupe().then(remplir);
    return box;
  }

  /* Ouvre une autre page du compte (session donnée par le serveur, sans retaper le mot de passe) */
  async function basculerVers(vers, sansQuestion) {
    if (!sansQuestion && modifie && !confirm(t('Des modifications ne sont pas enregistrées. Changer de page quand même ?'))) return;
    try {
      const j = await (await appelAPI('basculer', jetonCF, { method: 'POST', body: JSON.stringify({ vers }) })).json();
      ouvrirPage(j.slug, j.jeton);
    } catch (e) { alert(e.message); }
  }
  function ouvrirPage(slug, jeton) {
    try { localStorage.setItem('qp-jeton:' + slug, jeton); sessionStorage.setItem('qp-jeton:' + slug, jeton); } catch (e) {}
    modifie = false;
    const domaine = APP ? '' : 'https://' + location.hostname.split('.').slice(1).join('.');
    location.href = domaine + '/app/' + slug + '/';
  }

  function fenetrePages() {
    const ancien = document.getElementById('fen-pages'); if (ancien) ancien.remove();
    const fond = el('div', { id: 'fen-pages', role: 'dialog', 'aria-modal': 'true' });
    const fen = el('div', { class: 'fen' });
    fond.appendChild(fen);
    document.body.appendChild(fond);
    return { fond, fen, fermer: () => fond.remove() };
  }

  async function ouvrirAjoutPage() {
    const g = await chargerGroupe(true);
    if (!g) { alert(t('Connexion impossible.')); return; }
    const c = compteCF;
    const { fond, fen, fermer } = fenetrePages();
    fond.addEventListener('click', e => { if (e.target === fond) fermer(); });
    fen.append(el('h2', { text: t('Ajouter une page ou une langue') }));
    if (!g.ajout.possible) {
      fen.append(el('div', { class: 'alerte-abo', text: g.ajout.raison }),
        el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: t('Voir l’abonnement'), onclick: () => { fermer(); ouvrirAbonnement(); } }),
        el('button', { type: 'button', class: 'btn btn-plein fermer', text: t('Fermer'), onclick: fermer }));
      return;
    }
    const ttc = ht => euros(Math.round(ht * (100 + g.tva) / 100));
    const date = d => new Date(d).toLocaleDateString(document.documentElement.lang || 'fr-FR');
    fen.append(el('p', { class: 'sous', text: t('Tout reste sur le même compte : un seul mot de passe, une seule échéance, et vos images partagées entre toutes les pages.') }));

    let type = 'page';
    const peutTraduire = !c.traduction;
    const opt = (val, titre, sous, inactif) => {
      const r = el('input', { type: 'radio', name: 'type-ajout', value: val, disabled: !!inactif });
      if (val === type) r.checked = true;
      const lab = el('label', { class: (val === type ? 'actif' : '') + (inactif ? ' inactif' : '') }, [r, el('span', {}, [el('b', { text: titre }), el('small', { text: sous })])]);
      r.addEventListener('change', () => { type = val; majZones(); });
      return lab;
    };
    const choix = el('div', { class: 'choix-ajout' }, [
      opt('page', t('Une nouvelle page'), t('Pour une autre activité : nouveau nom, nouvelle adresse, nouveau QR code.')),
      opt('traduction', t('Une traduction de cette page'), peutTraduire
        ? t('Même adresse et même QR code : la page s’ouvre dans la langue du téléphone du visiteur. Traduction automatique offerte.')
        : t('Ouvrez la page d’origine pour lui ajouter une langue.'), !peutTraduire)
    ]);

    // nouvelle page : nom + disponibilité
    const nom = el('input', { type: 'text', maxLength: 30, placeholder: t('nom-de-la-page'), autocapitalize: 'none', spellcheck: 'false' });
    const dispo = el('div', { class: 'dispo' });
    let minu = null, libre = false;
    nom.addEventListener('input', () => {
      const v = nom.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (v !== nom.value) nom.value = v;
      libre = false; dispo.className = 'dispo'; dispo.textContent = v ? v + '.qrbc.app' : '';
      clearTimeout(minu);
      if (v.length < 3) return;
      minu = setTimeout(async () => {
        try {
          const j = await (await appelAPI('pages/disponible?nom=' + encodeURIComponent(v), jetonCF)).json();
          if (nom.value !== v) return;
          libre = !!j.disponible;
          dispo.className = 'dispo ' + (libre ? 'ok' : 'ko');
          dispo.textContent = libre ? '✓ ' + v + '.qrbc.app ' + t('est disponible') : (j.raison || t('Ce nom est déjà pris.'));
        } catch (e) {}
      }, 350);
    });
    const zonePage = el('div', { class: 'zone-ajout' }, [el('label', { class: 'champ' }, [el('span', { text: t('Adresse de la nouvelle page') }),
      el('div', { class: 'adresse' }, [nom, el('em', { text: '.qrbc.app' })])]), dispo]);

    // traduction : langue cible (+ langue actuelle de la page la 1re fois)
    const existantes = new Set([(c.langueSite || '')].concat(c.traductions || []).concat(g.pages.filter(p => p.traduction && p.traduction.source === c.slug).map(p => p.traduction.langue)));
    const selSource = el('select', {}, g.langues.map(l => el('option', { value: l, text: nomLangue(l), selected: l === 'fr' })));
    const selLangue = el('select', {});
    const majLangues = () => {
      const src = c.langueSite || selSource.value;
      selLangue.innerHTML = '';
      g.langues.filter(l => l !== src && !existantes.has(l)).forEach(l => selLangue.appendChild(el('option', { value: l, text: nomLangue(l) })));
    };
    selSource.addEventListener('change', majLangues);
    majLangues();
    const zoneTrad = el('div', { class: 'zone-ajout' }, [
      ...(c.langueSite ? [] : [el('label', { class: 'champ' }, [el('span', { text: t('Langue actuelle de cette page') }), selSource])]),
      el('label', { class: 'champ' }, [el('span', { text: t('Traduire en') }), selLangue])
    ]);
    const majZones = () => {
      zonePage.hidden = type !== 'page'; zoneTrad.hidden = type !== 'traduction';
      choix.querySelectorAll('label').forEach(l => l.classList.toggle('actif', l.querySelector('input').value === type));
    };

    const prix = el('div', { class: 'cout', style: 'padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--prim);font-size:.92rem;margin:0 0 14px' });
    if (g.ajout.gratuit) prix.textContent = '🎁 ' + t('Offert avec votre compte.');
    else prix.append(el('b', { text: euros(g.ajout.prix) + ' ' + t('HT') + ' (' + ttc(g.ajout.prix) + ' ' + t('TTC') + ') ' + t('aujourd’hui') }), el('br'),
      document.createTextNode((g.ajout.echeance ? t('Prix réduit au prorata jusqu’à votre échéance commune du ') + date(g.ajout.echeance) + '. ' : '') +
        t('Ensuite ') + euros(g.prixPage) + ' ' + t('HT') + ' ' + t('par an (moitié prix), renouvelée avec votre abonnement. Crédits IA d’un abonnement inclus.')));
    const msg = el('div', { class: 'msg' });
    const go = el('button', { type: 'button', class: 'btn btn-prim', text: g.ajout.gratuit ? t('Créer') : t('Payer et créer') });
    go.addEventListener('click', async () => {
      msg.className = 'msg'; msg.textContent = '';
      const corps = type === 'page' ? { type, nom: nom.value.trim() } : { type, langue: selLangue.value, langueSource: c.langueSite || selSource.value };
      if (type === 'page' && !libre) { msg.className = 'msg err'; msg.textContent = t('Choisissez une adresse disponible.'); return; }
      if (type === 'traduction' && !corps.langue) { msg.className = 'msg err'; msg.textContent = t('Toutes les langues proposées existent déjà pour cette page.'); return; }
      if (modifie && !confirm(t('Des modifications ne sont pas enregistrées. Continuer quand même ?'))) return;
      go.disabled = true; go.textContent = t('Un instant…');
      try {
        if (g.ajout.gratuit) {
          const j = await (await appelAPI('pages/ajouter', jetonCF, { method: 'POST', body: JSON.stringify(corps) })).json();
          ouvrirPage(j.cree, j.jeton);
          return;
        }
        corps.genre = 'page'; corps.retour = location.origin + location.pathname;
        const j = await (await appelAPI('paiement', jetonCF, { method: 'POST', body: JSON.stringify(corps) })).json();
        if (j.url) { modifie = false; location.href = j.url; return; }
      } catch (e) {
        msg.className = 'msg err'; msg.textContent = e.message;
        go.disabled = false; go.textContent = g.ajout.gratuit ? t('Créer') : t('Payer et créer');
      }
    });
    fen.append(choix, zonePage, zoneTrad, prix, msg,
      el('div', { class: 'boutons' }, [el('button', { type: 'button', class: 'btn', text: t('Annuler'), onclick: fermer }), go]));
    if (!g.ajout.gratuit) fen.append(el('div', { class: 'aide', style: 'margin-top:8px;text-align:center', text: '🔒 ' + t('Paiement sécurisé par Stripe. Facture envoyée par e-mail.') }));
    majZones();
  }

  /* Traduction IA de cette version (la 1re, à la création, est offerte) puis publication */
  async function lancerTraduction(auto) {
    const c = compteCF;
    if (!c || !c.traduction) return;
    if (!auto) {
      const prix = c.plan === 'gratuit' ? t('offerte') : euros(c.offre.prixTraduction) + ' ' + t('HT') + ' ' + t('sur votre crédit IA');
      if (!confirm(t('Retraduire remplace tout le contenu de cette version par une nouvelle traduction de la page d’origine (textes, boutons, pancartes, design). Les modifications faites ici seront perdues.') + '\n\n' + t('Prix : ') + prix)) return;
    }
    const { fen, fermer } = fenetrePages();
    fen.append(el('h2', { text: '🌐 ' + t('Traduction en cours') }),
      el('p', { class: 'sous', text: t('L’IA traduit votre page en ') + nomLangue(c.traduction.langue).toLowerCase() + '… (≈ 30 s)' }));
    try {
      const j = await (await appelAPI('traduire', jetonCF, { method: 'POST' })).json();
      afficherAbonnement(j.compte);
      const f = await gh.lire('config.json');
      cfg = normaliser(fusion(CONFIG_DEFAUT, f ? JSON.parse(f.texte) : {}));
      construireFormulaire();
      majApercu();
      fermer();
      changement();
      $('#btn-enregistrer').click();                 // publication immédiate (pages lisibles par Google, icônes, aperçu des liens)
    } catch (e) {
      fen.innerHTML = '';
      fen.append(el('h2', { text: t('Traduction impossible') }), el('div', { class: 'alerte-abo', text: e.message }),
        el('button', { type: 'button', class: 'btn btn-plein fermer', text: t('Fermer'), onclick: fermer }));
      if (e.status === 402) { fermer(); ouvrirAbonnement('quota', e.message); }
    }
  }

  /* =============== Création express : tout le site en une fois =============== */
  const NB_EXPRESS = 5;                         // pancartes de la page Home
  let expressActif = false;                     // une création express tourne (empêche de relancer)
  const titreParDefaut = () => !cfg.titre || cfg.titre === CONFIG_DEFAUT.titre;

  /* Activité en cours de saisie (pas forcément enregistrée) : sert aux images de fond */
  function activiteEnCours() {
    const ia = (cfg.home && cfg.home.ia) || {};
    return { titre: titreParDefaut() ? '' : cfg.titre, sousTitre: cfg.sousTitre || '', description: ia.description || '', zone: ia.zone || '' };
  }

  function bandeauExpress() {
    return el('div', { class: 'express-bandeau' }, [
      el('div', {}, [
        el('b', { text: '⚡ Création express' }),
        el('div', { class: 'aide', style: 'margin:2px 0 0', text: 'Pressé ? Décrivez votre activité : l’IA prépare tout votre site en une minute.' })
      ]),
      el('button', { type: 'button', class: 'btn btn-prim', text: 'Créer mon site', onclick: () => ouvrirExpress() })
    ]);
  }

  function fenetreExpress() {
    const ancien = document.getElementById('fen-express'); if (ancien) ancien.remove();
    const fond = el('div', { id: 'fen-express', role: 'dialog', 'aria-modal': 'true' });
    const fen = el('div', { class: 'fen' });
    fond.appendChild(fen);
    fond.addEventListener('click', e => { if (e.target === fond && !expressActif) fond.remove(); });
    document.body.appendChild(fond);
    return { fond, fen, fermer: () => fond.remove() };
  }

  /* Ce que coûte la création express pour ce compte (texte affiché) */
  function coutExpressTexte(c) {
    const x = c.ia.express || {};
    if (x.enCours) return 'Une création express déjà réglée est en cours : vous pouvez la reprendre sans frais jusqu’à ' +
      new Date(x.enCours.jusqua).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '.';
    if (x.mode === 'offert') return 'Inclus dans votre compte offert.';
    if (x.mode === 'essai') {
      const e = x.essai || {}, p = [];
      if (e.texte) p.push(e.texte + (e.texte > 1 ? ' rédactions' : ' rédaction'));
      if (e.picto) p.push(e.picto + (e.picto > 1 ? ' créations de motifs' : ' création de motifs'));
      if (e.fond) p.push(e.fond + (e.fond > 1 ? ' créations d’images' : ' création d’images'));
      return 'Coût : la moitié de vos créations IA gratuites de l’essai (' + p.join(', ') + ').';
    }
    return 'Coût : ' + euros(x.prix) + ' HT, débités de votre crédit IA (solde : ' + euros(c.ia.credit) + ').';
  }

  /* 1. Consentement : ce qui va se passer et ce que ça coûte */
  async function ouvrirExpress() {
    if (expressActif) return;
    try { const j = await (await appelAPI('compte', jetonCF)).json(); afficherAbonnement(j.compte); } catch (e) {}
    const c = compteCF;
    if (!c || !c.ia) return;
    if (!c.actif) {
      ouvrirAbonnement(c.plan === 'essai' ? 'essai_termine' : 'abonnement_inactif',
        c.plan === 'essai' ? 'Votre essai est terminé : abonnez-vous pour utiliser la création express.' : 'Abonnement inactif : la création express est désactivée.');
      return;
    }
    const x = c.ia.express || {};
    const avecFond = x.enCours ? x.enCours.restant.fond > 0 : !(x.mode === 'essai' && !(x.essai && x.essai.fond));
    const avecPicto = x.enCours ? x.enCours.restant.picto > 0 : !(x.mode === 'essai' && !(x.essai && x.essai.picto));
    const F = fenetreExpress();
    F.fen.append(
      el('h2', { text: '⚡ Création express' }),
      el('p', { class: 'sous', text: 'Un formulaire va s’ouvrir pour créer votre site à partir de la description de votre activité et de votre zone d’action.' }),
      el('ul', {}, [
        'L’IA rédige ' + NB_EXPRESS + ' pancartes sur votre activité pour la page Home, ainsi que le référencement Google.',
        avecPicto ? 'Elle dessine 3 pictogrammes pour votre logo.' : '',
        avecFond ? 'Elle crée 2 images de fond.' : '',
        'E-mail de contact : celui de votre inscription' + (c.email ? ' (' + c.email + ')' : '') + '.',
        'Si vous indiquez un téléphone, les boutons Appeler et WhatsApp sont ajoutés.',
        'Les pancartes de la page Home, l’accroche, le logo et le fond sont remplacés par les nouveaux (avec des couleurs lisibles sur la photo). Vos anciennes images et anciens pictogrammes restent disponibles pour les réutiliser.',
        'Rien n’est publié tant que vous n’appuyez pas sur Enregistrer.'
      ].filter(Boolean).map(t => el('li', { text: t })))
    );
    if (!x.enCours && !x.possible) {
      F.fen.append(el('div', { class: 'alerte-abo', text: x.message || 'La création express n’est pas disponible.' }),
        el('div', { class: 'boutons' }, [
          el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer }),
          el('button', { type: 'button', class: 'btn btn-prim', text: x.code === 'credit_insuffisant' ? 'Recharger' : 'S’abonner',
            onclick: () => { F.fermer(); ouvrirAbonnement(x.code, x.message); } })
        ]));
      return;
    }
    F.fen.append(el('div', { class: 'cout', text: coutExpressTexte(c) }),
      el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Accepter', onclick: () => formulaireExpress(F) })
      ]));
  }

  /* 2. Formulaire : nom, activité, zone, téléphone */
  function formulaireExpress(F) {
    const ia = cfg.home.ia = Object.assign({ description: '', zone: '', nombre: 4, ton: 'pro' }, cfg.home.ia || {});
    const telActuel = (cfg.boutons.find(b => b && (b.type === 'tel' || b.type === 'whatsapp') && String(b.valeur || '').trim()) || {}).valeur || '';
    const nom = el('input', { type: 'text', value: titreParDefaut() ? '' : cfg.titre, placeholder: 'Ex. : Alex VTC', autocomplete: 'organization' });
    const desc = el('textarea', { rows: 6, value: ia.description, placeholder: t('Ex. : Chauffeur privé avec Mercedes Classe V 7 places. Transferts aéroports Orly, CDG et Beauvais, gares, Disneyland, excursions en Normandie et à Versailles. Disponible 24/24, sièges enfants, je parle français, anglais et arabe. Accueil avec pancarte à l’aéroport.') });
    const zone = el('input', { type: 'text', value: ia.zone, placeholder: 'Ex. : Nice, Monaco, Cannes et toute la Côte d’Azur' });
    const tel = el('input', { type: 'tel', value: telActuel, placeholder: 'Ex. : 06 12 34 56 78 (facultatif)', autocomplete: 'tel' });
    const ton = el('select', {}, Object.keys(TONS_IA).map(k => el('option', { value: k, text: TONS_IA[k], selected: ia.ton === k })));
    const msg = el('div', { class: 'msg' });
    const champ = (etiq, n) => el('label', { class: 'champ' }, [el('span', { text: etiq }), n]);
    F.fen.innerHTML = '';
    F.fen.append(
      el('h2', { text: '⚡ Votre activité' }),
      el('p', { class: 'sous', text: 'Décrivez votre activité avec le plus de détails possible : l’IA s’occupe du reste.' }),
      champ('Nom de l’entreprise', nom),
      el('label', { class: 'champ' }, [el('span', { text: 'Votre activité' }), desc, jaugeDetails(desc)]),
      champ('Zone d’action', zone),
      champ('Téléphone (Appeler et WhatsApp)', tel),
      champ('Ton des textes', ton),
      msg,
      el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Confirmer', onclick: confirmer })
      ]));
    F.fen.addEventListener('input', () => { msg.textContent = ''; });
    nom.focus();
    function confirmer() {
      msg.className = 'msg err';
      if (!nom.value.trim()) { msg.textContent = 'Indiquez le nom de votre entreprise.'; nom.focus(); return; }
      if (desc.value.trim().length < 10) { msg.textContent = 'Décrivez l’activité en quelques mots (10 caractères minimum).'; desc.focus(); return; }
      const chiffres = tel.value.replace(/\D/g, '');
      if (tel.value.trim() && (chiffres.length < 8 || chiffres.length > 15)) { msg.textContent = 'Numéro de téléphone incomplet.'; tel.focus(); return; }
      lancerExpress(F, { nom: nom.value.trim(), description: desc.value.trim(), zone: zone.value.trim(), tel: tel.value.trim(), ton: ton.value });
    }
  }

  /* Boutons de contact : complète un bouton vide existant, sinon en ajoute un */
  function contactExpress(cle, valeur) {
    if (!valeur) return;
    const m0 = MODELES[cle];
    const b = cfg.boutons.find(x => x && x.type === m0.type);
    if (b) { if (!String(b.valeur || '').trim()) b.valeur = valeur; b.masque = false; return; }
    const nouveau = Object.assign({ icone: '', texte: '', type: 'lien', valeur: '', message: '', couleur: '' }, m0,
      { texte: t(m0.texte), valeur }, m0.message ? { message: t(m0.message) } : {});
    const iRes = cfg.boutons.findIndex(x => x && x.type === 'reseaux');     // avant le bloc des réseaux
    if (iRes >= 0) cfg.boutons.splice(iRes, 0, nouveau); else cfg.boutons.push(nouveau);
  }

  /* 3. Réservation (paiement ou crédits d'essai), puis les 3 créations comme dans les menus habituels */
  async function lancerExpress(F, d) {
    expressActif = true;
    F.fen.innerHTML = '';
    const etapes = {
      reserve: { nom: 'Réservation de la création express' },
      texte: { nom: NB_EXPRESS + ' pancartes et référencement Google' },
      picto: { nom: '3 pictogrammes pour le logo' },
      fond: { nom: '2 images de fond' }
    };
    const liste = el('ul', { class: 'etapes' });
    const dessiner = () => {
      liste.innerHTML = '';
      Object.values(etapes).filter(e => !e.ignore).forEach(e => liste.appendChild(el('li', {}, [
        el('span', { class: 'ic', text: e.etat === 'ok' ? '✓' : e.etat === 'err' ? '✕' : e.etat === 'cours' ? '⏳' : '·' }),
        el('span', {}, [document.createTextNode(t(e.nom)), ...(e.erreur ? [el('small', { text: e.erreur })] : [])])
      ])));
    };
    const titre = el('h2', { text: '⚡ Création en cours…' });
    const sous = el('p', { class: 'sous', text: 'Environ une minute. Gardez cette fenêtre ouverte.' });
    const pied = el('div');
    F.fen.append(titre, sous, liste, pied);
    dessiner();

    // Réservation : débite le crédit (abonné) ou la moitié des créations d'essai, une seule fois
    etapes.reserve.etat = 'cours'; dessiner();
    let restant;
    try {
      const j = await (await appelAPI('express', jetonCF, { method: 'POST', body: '{}' })).json();
      afficherAbonnement(j.compte);
      restant = j.express.restant;
      etapes.reserve.etat = 'ok';
      if (j.reprise) etapes.reserve.nom = 'Création express déjà réglée : reprise sans frais';
    } catch (e) {
      expressActif = false;
      etapes.reserve.etat = 'err'; etapes.reserve.erreur = e.message === 'Failed to fetch' ? 'Connexion impossible.' : e.message;
      titre.textContent = 'Création express impossible'; sous.textContent = '';
      dessiner();
      pied.appendChild(el('div', { class: 'boutons' }, [el('button', { type: 'button', class: 'btn', text: 'Fermer', onclick: F.fermer })].concat(e.status === 402
        ? [el('button', { type: 'button', class: 'btn btn-prim', text: 'Mon abonnement', onclick: () => { F.fermer(); ouvrirAbonnement('quota', e.message); } })] : [])));
      return;
    }

    // Informations saisies : nom, description, contacts (avant la rédaction, qui cite les moyens de contact)
    cfg.titre = d.nom;
    cfg.home.actif = true;                                        // la création express remplit la page Home : on l'active
    Object.assign(cfg.home.ia, { description: d.description, zone: d.zone, ton: d.ton, nombre: NB_EXPRESS });
    // Une photo va servir de fond : texte clair et voile sombre, sinon le titre se perd dans l'image
    if (restant.fond && luminance(cfg.design.texte) < 0.5) {
      const k = d.ton === 'luxe' ? 'luxe' : 'nuit', th = THEMES[k];
      Object.assign(cfg.design, { theme: k, fond: th.fond, fond2: th.fond2, texte: th.texte, accent: th.accent });
    }
    if (restant.fond) cfg.design.voile = Math.max(Number(cfg.design.voile) || 0, 45);
    contactExpress('tel', d.tel);
    contactExpress('whatsapp', d.tel);
    contactExpress('email', compteCF.email || '');
    changement();

    const faire = (cle, fn) => {
      if (!restant[cle]) { etapes[cle].ignore = true; return Promise.resolve(); }
      etapes[cle].etat = 'cours'; dessiner();
      return fn().then(() => { etapes[cle].etat = 'ok'; }, e => {
        etapes[cle].etat = 'err'; etapes[cle].erreur = e.message === 'Failed to fetch' ? 'Connexion impossible.' : e.message;
      }).then(dessiner);
    };
    let nouveauxArticles = null;
    const texte = () => faire('texte', async () => {
      const articles = await redigerAvecIA({ description: d.description, zone: d.zone, nombre: NB_EXPRESS, ton: d.ton }, true);
      if (propositionSeo) cfg.seo = Object.assign({}, cfg.seo, { titre: propositionSeo.titre, description: propositionSeo.description, motCle: propositionSeo.motCle, motsCles: propositionSeo.motsCles, zone: d.zone || (cfg.seo && cfg.seo.zone) || '' });
      propositionSeo = null; proposition = null;
      if (articles.accroche) cfg.sousTitre = articles.accroche;
      nouveauxArticles = articles.map(a => ({ titre: a.titre, texte: a.texte, image: '', style: 'texte' }));
      cfg.home.articles = nouveauxArticles;
      cfg.home.actif = true;
    });
    const picto = () => faire('picto', async () => {
      const o = optionsLogo();
      if (!o.nom || o.nom === CONFIG_DEFAUT.titre) o.nom = d.nom;
      const nouveaux = await creerMotifsIA(o, null, true);
      o.motifs = o.motifs.concat(nouveaux).slice(-60);       // même historique que l'atelier logo
      o.choix = 'ia' + (o.motifs.length - nouveaux.length);
      {                                                       // le premier nouveau picto devient le logo (l'ancien reste dans « Mes images »)
        const png = await imageEnPNG(svgEnURL(composerLogo(o, o.motifs[o.motifs.length - nouveaux.length])), 1024);
        const chemin = 'images/logo-' + Date.now() + '.png';
        imagesLocales[chemin] = png;
        imagesAEnvoyer[chemin] = png.split(',')[1];
        cfg.logo = chemin;
        cfg.design.logoRond = false;
      }
    });
    let images = [];
    const fond = () => faire('fond', async () => {
      const r = await appelAPI('fond', jetonCF, { method: 'POST', headers: { 'x-qrbc-express': '1' },
        body: JSON.stringify({ ambiance: d.ton === 'luxe' ? 'luxe' : 'photo', idee: '', activite: activiteEnCours() }) });
      const j = await r.json();
      medias = j.medias;
      afficherAbonnement(j.compte);
      images = j.nouvelles.map(n => n.chemin);
      if (images[0]) cfg.design.imageFond = images[0];   // la nouvelle image devient le fond ; l'ancienne reste dans « Mes images »
    });

    const executer = async () => {
      await texte();                                // d'abord les textes : les dessins s'appuient sur l'activité
      await Promise.all([picto(), fond()]);
      // la première pancarte prend une des nouvelles images en plein écran
      const arts = cfg.home.articles;
      if (nouveauxArticles && arts === nouveauxArticles && arts[0] && !arts[0].image && images.length)
        Object.assign(arts[0], { image: images[1] || images[0], style: 'photo' });
      changement();
      construireFormulaire();
    };
    await executer();
    terminer();

    function terminer() {
      const rates = Object.keys(etapes).filter(k => etapes[k].etat === 'err');
      expressActif = false;
      pied.innerHTML = '';
      if (!rates.length) {
        appelAPI('express/fin', jetonCF, { method: 'POST', body: '{}' }).then(r => r.json()).then(j => afficherAbonnement(j.compte)).catch(() => {});
        titre.textContent = '✓ Votre site est prêt';
        sous.textContent = '';
        pied.append(el('div', { class: 'cout', text: 'Vérifiez tout : textes, boutons, logo et images (l’aperçu est à jour). Puis appuyez sur « Enregistrer » en bas de l’écran pour publier.' }),
          el('button', { type: 'button', class: 'btn btn-prim btn-plein', text: 'Vérifier mon site', onclick: finir }));
        return;
      }
      titre.textContent = 'Presque terminé';
      sous.textContent = 'Une étape n’a pas abouti. Elle est déjà réglée : vous pouvez la relancer sans frais pendant 30 minutes.';
      pied.append(el('div', { class: 'boutons' }, [
        el('button', { type: 'button', class: 'btn', text: 'Vérifier mon site', onclick: finir }),
        el('button', { type: 'button', class: 'btn btn-prim', text: 'Réessayer', onclick: async () => {
          expressActif = true; pied.innerHTML = ''; titre.textContent = '⚡ Création en cours…';
          rates.forEach(k => { etapes[k].erreur = ''; });
          if (rates.includes('texte')) await texte();
          await Promise.all([rates.includes('picto') ? picto() : null, rates.includes('fond') ? fond() : null]);
          const arts = cfg.home.articles;
          if (nouveauxArticles && arts === nouveauxArticles && arts[0] && !arts[0].image && images.length)
            Object.assign(arts[0], { image: images[1] || images[0], style: 'photo' });
          changement(); construireFormulaire();
          terminer();
        } })
      ]));
    }
    function finir() {
      F.fermer();
      vueApercu = cfg.home.actif ? 'home' : 'contact';
      majApercu();
      const b = $('#btn-enregistrer');
      b.classList.remove('pouls'); void b.offsetWidth; b.classList.add('pouls');
      const e = $('#etat'); e.className = 'etat'; e.textContent = 'Site créé : vérifiez puis cliquez sur Enregistrer';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  /* ---------------- Assistant « ❓ Aide » ----------------
     Fenêtre réductible au-dessus de la barre du bas : on lit la réponse, on réduit pour appliquer, on rouvre pour relire.
     La conversation est gardée sur l'appareil (par page) jusqu'à « Nouvelle conversation ». */
  const aide = (() => {
    const btn = $('#btn-aide'), pan = $('#aide-panneau'), fil = $('#aide-fil'), form = $('#aide-form'), q = $('#aide-question'), pied = $('#aide-pied');
    let fils = [], restantes = null, enCours = false;
    const cle = () => 'qp-aide:' + (APP || location.hostname);
    const sauver = () => { try { localStorage.setItem(cle(), JSON.stringify(fils.slice(-30))); } catch (e) {} };
    const charger = () => { try { const l = JSON.parse(localStorage.getItem(cle()) || '[]'); fils = Array.isArray(l) ? l : []; } catch (e) { fils = []; } };
    function enrichir(txt) {            // texte simple : échappé, **gras**
      const d = document.createElement('div'); d.textContent = txt;
      return d.innerHTML.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    }
    function bulle(m) {
      const b = el('div', { class: 'aide-msg ' + (m.role === 'user' ? 'q' : 'r') + (m.err ? ' err' : '') });
      if (m.role === 'user') b.textContent = m.content; else if (m.err) b.textContent = t(m.content); else b.innerHTML = enrichir(m.content);
      b.setAttribute('data-no-i18n', '');
      return b;
    }
    function afficher() {
      fil.innerHTML = '';
      fil.appendChild(el('div', { class: 'aide-msg r', text: 'Bonjour ! Posez votre question sur la création de votre page : je vous explique où toucher, étape par étape. Réduisez cette fenêtre pour appliquer, puis rouvrez-la pour relire.' }));
      fils.forEach(m => fil.appendChild(bulle(m)));
      if (enCours) fil.appendChild(el('div', { class: 'aide-msg r', text: '…' }));
      pied.textContent = restantes === null ? '' : t('Questions restantes aujourd’hui : ') + restantes;
      requestAnimationFrame(() => { fil.scrollTop = fil.scrollHeight; });
    }
    function ouvrir() { pan.classList.remove('cache'); btn.classList.add('actif'); btn.classList.remove('nouveau'); afficher(); setTimeout(() => q.focus(), 50); }
    function reduire() { pan.classList.add('cache'); btn.classList.remove('actif'); }
    function contexte() {
      const d = cfg.design || {};
      return {
        langueEditeur: langueUI(), vueApercu: typeof vueApercu !== 'undefined' ? vueApercu : '', modificationsNonEnregistrees: modifie,
        titre: cfg.titre, sousTitre: cfg.sousTitre, pied: cfg.pied ? 'oui' : 'non', logo: cfg.logo ? 'oui' : 'non',
        design: { theme: d.theme, couleurs: [d.fond, d.fond2, d.texte, d.accent], police: d.police, disposition: d.disposition, forme: d.forme, style: d.style,
          imageFond: d.imageFond ? 'oui' : 'non', voile: d.voile, texteImage: d.texteImage, effetTexte: d.effetTexte, tousRonds: d.tousRonds, installer: d.installer },
        boutons: (cfg.boutons || []).map(b => ({ action: b.type, texte: b.texte, rempli: !!String(b.valeur || '').trim(), masque: !!b.masque })),
        reseaux: (cfg.reseaux || []).filter(x => x.actif && String(x.valeur || '').trim()).map(x => x.id),
        home: cfg.home ? { actif: !!cfg.home.actif, pancartes: (cfg.home.articles || []).map(a => ({ titre: a.titre, style: a.style, image: a.image ? 'oui' : 'non', masque: !!a.masque })) } : null
      };
    }
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const texte = q.value.trim();
      if (!texte || enCours) return;
      fils.push({ role: 'user', content: texte }); q.value = ''; q.style.height = '';
      enCours = true; afficher();
      try {
        const msgs = fils.filter(m => !m.err).map(m => ({ role: m.role, content: m.content }));
        const j = await (await appelAPI('aide', jetonCF, { method: 'POST', body: JSON.stringify({ messages: msgs, contexte: contexte(), langue: langueUI() }) })).json();
        fils.push({ role: 'assistant', content: j.reponse }); restantes = j.restantes;
        if (pan.classList.contains('cache')) btn.classList.add('nouveau');
      } catch (err) {
        fils.push({ role: 'assistant', content: err.message || t('L’assistant ne répond pas pour le moment. Réessayez dans un instant.'), err: true });
        if (err.code === 'aide_quota') restantes = 0;
      }
      enCours = false; sauver(); afficher();
    });
    q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true })); } });
    q.addEventListener('input', () => { q.style.height = ''; q.style.height = Math.min(120, q.scrollHeight) + 'px'; });
    btn.addEventListener('click', () => pan.classList.contains('cache') ? ouvrir() : reduire());
    $('#aide-reduire').addEventListener('click', reduire);
    $('#aide-effacer').addEventListener('click', () => { fils = []; sauver(); afficher(); q.focus(); });
    return { activer() { if (!CF) return; charger(); btn.classList.remove('cache'); } };
  })();

  /* ---------------- Modèles de boutons ---------------- */
  const MODELES = {
    avis:      { icone: '⭐', texte: 'Laisser un avis Google', type: 'avis', couleur: '#4285F4' },
    whatsapp:  { icone: '💬', texte: 'Réserver sur WhatsApp', type: 'whatsapp', message: 'Bonjour, je souhaite réserver', couleur: '#25D366' },
    tel:       { icone: '📞', texte: 'Appeler', type: 'tel', couleur: '' },
    site:      { icone: '🌐', texte: 'Notre site', type: 'lien', couleur: '' },
    maps:      { icone: '📍', texte: 'Itinéraire', type: 'maps', couleur: '' },
    email:     { icone: '✉️', texte: 'Nous écrire', type: 'email', couleur: '' },
    menu:      { icone: '📖', texte: 'Voir la carte', type: 'lien', couleur: '' }
  };

  /* ---------------- Formulaire complet ---------------- */
  document.getElementById('formulaire').addEventListener('focusin', e => {
    const sec = e.target.closest('details.section');
    if (!sec || sec.dataset.id === 'partage') return;
    choisirApercu(sec.dataset.id === 'home' && (cfg.home.actif || proposition) ? 'home' : 'contact');
  });

  function construireFormulaire() {
    const f = $('#formulaire');
    const defil = window.scrollY;
    f.innerHTML = '';
    requestAnimationFrame(() => window.scrollTo(0, defil));
    const d = cfg.design;
    if (CF) f.appendChild(bandeauPages());
    if (CF && !(compteCF && compteCF.traduction)) f.appendChild(bandeauExpress());

    /* Textes */
    f.appendChild(section('textes', 'Textes', true, [
      champTexte('Titre', cfg, 'titre', { ph: 'Nom de l’établissement' }),
      champTexte('Sous-titre', cfg, 'sousTitre', { ph: 'Merci de votre visite !', multi: true }),
      champTexte('Texte en bas de page', cfg, 'pied', { ph: 'Adresse, horaires…', multi: true })
    ]));

    /* Boutons */
    const liste = el('div');
    cfg.boutons.forEach((b, i) => liste.appendChild(carteBouton(b, i)));
    const choixAjout = el('select', {}, [el('option', { value: '', text: 'Ajouter un bouton…' })]
      .concat(Object.keys(MODELES).map(k => el('option', { value: k, text: MODELES[k].icone + ' ' + MODELES[k].texte })))
      .concat([el('option', { value: 'vide', text: '➕ Bouton vide' })]));
    choixAjout.addEventListener('change', () => {
      const k = choixAjout.value; if (!k) return;
      const m0 = k === 'vide' ? { icone: '', texte: 'Nouveau bouton', type: 'lien', couleur: '' } : MODELES[k];
      const m = Object.assign({}, m0, { texte: t(m0.texte) }, m0.message ? { message: t(m0.message) } : {});
      cfg.boutons.push(Object.assign({ icone: '', texte: '', type: 'lien', valeur: '', message: '', couleur: '' }, m));
      construireFormulaire(); changement();
      const cartes = document.querySelectorAll('.bouton-carte');
      if (cartes.length) cartes[cartes.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    f.appendChild(section('boutons', 'Boutons et réseaux', true, [liste, el('div', { class: 'ajout' }, [choixAjout])]));

    /* Page Home */
    f.appendChild(sectionHome());

    /* Disposition */
    const dispos = el('div', { class: 'dispos' });
    Object.keys(DISPOSITIONS).forEach(k => {
      const b = el('button', { type: 'button', class: 'dispo' + ((d.disposition || 'centre') === k ? ' actif' : '') });
      b.innerHTML = miniature(k);
      b.appendChild(el('b', { text: DISPOSITIONS[k].nom }));
      b.addEventListener('click', () => {
        d.disposition = k;
        dispos.querySelectorAll('.dispo').forEach(x => x.classList.toggle('actif', x === b));
        changement();
      });
      dispos.appendChild(b);
    });

  /* Schéma miniature d'une disposition (formes simples) */
  /* =============== QR code et carte de visite =============== */
  const URL_PUBLIQUE = dossierSite();
  // Adresse codée dans les QR (cartes, affiches, PNG) : ?s=qr permet de compter les scans dans les statistiques
  const URL_QR = URL_PUBLIQUE + '?s=qr';

  // Dessine le QR code sur un contexte 2D (zone carrée x, y, taille)
  function dessinerQR(ctx, texte, x, y, taille, couleur) {
    const qr = qrcode(0, 'M');
    qr.addData(texte);
    qr.make();
    const n = qr.getModuleCount();
    const m = taille / n;
    ctx.fillStyle = couleur || '#000';
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(Math.floor(x + c * m), Math.floor(y + r * m), Math.ceil(m), Math.ceil(m));
  }

  function canvasQR(taillePx) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = taillePx;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, taillePx, taillePx);
    const marge = Math.round(taillePx * 0.08);
    dessinerQR(ctx, URL_QR, marge, marge, taillePx - 2 * marge);
    return cv;
  }

  function telecharger(cv, nom, type, qualite) {
    cv.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: nom });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, type, qualite);
  }

  /* Image d'aperçu des liens (WhatsApp, Facebook, SMS…) : 1200×630, JPEG léger.
     Les messageries ignorent les images lourdes ou très hautes : on n'envoie jamais le fond brut. */
  const PARTAGE_L = 1200, PARTAGE_H = 630;
  function clePartage() {
    const d = cfg.design;
    return [d.imageFond, cfg.logo, d.fond, d.fond2].join('|');
  }
  function partageAJour() { return !(cfg.design.imageFond || cfg.logo) || (cfg.partage && cfg.partage.chemin && cfg.partage.cle === clePartage()); }
  async function preparerImagePartage() {
    if (partageAJour()) { if (!(cfg.design.imageFond || cfg.logo)) delete cfg.partage; return; }
    const d = cfg.design;
    const resoudre = p => imagesLocales[p] || p;
    const cv = document.createElement('canvas');
    cv.width = PARTAGE_L; cv.height = PARTAGE_H;
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, PARTAGE_L, PARTAGE_H);
    g.addColorStop(0, d.fond || '#f5f1ea'); g.addColorStop(1, d.fond2 || d.fond || '#e9e0d2');
    ctx.fillStyle = g; ctx.fillRect(0, 0, PARTAGE_L, PARTAGE_H);
    const fond = await chargerImage(d.imageFond ? resoudre(d.imageFond) : '');
    const logo = await chargerImage(cfg.logo ? resoudre(cfg.logo) : '');
    if (fond && fond.width) {
      // recadrage « couvrir », un peu au-dessus du centre (le sujet d'un fond vertical y est souvent)
      const k = Math.max(PARTAGE_L / fond.width, PARTAGE_H / fond.height);
      const w = fond.width * k, h = fond.height * k;
      ctx.drawImage(fond, (PARTAGE_L - w) / 2, Math.max(PARTAGE_H - h, Math.min(0, PARTAGE_H * 0.42 - h * 0.42)), w, h);
    } else if (logo && logo.width) {
      const k = Math.min(440 / logo.width, 440 / logo.height);
      ctx.drawImage(logo, (PARTAGE_L - logo.width * k) / 2, (PARTAGE_H - logo.height * k) / 2, logo.width * k, logo.height * k);
    } else return;                                       // image illisible : on garde l'ancienne
    let data;
    try { data = cv.toDataURL('image/jpeg', 0.84); } catch (e) { return; }
    const chemin = 'images/partage-' + Date.now() + '.jpg';
    imagesLocales[chemin] = data;
    imagesAEnvoyer[chemin] = data.split(',')[1];
    cfg.partage = { chemin, cle: clePartage(), l: PARTAGE_L, h: PARTAGE_H };
  }

  /* Icônes de l'appli (page installable) : 192, 512 et 512 « maskable », à partir du logo ou des initiales */
  function cleIcones() { const d = cfg.design; return [cfg.logo, d.fond, d.accent, cfg.logo ? '' : initiales(cfg.titre)].join('|'); }
  function iconesAJour() { return !CF || (cfg.appIcones && cfg.appIcones.i512 && cfg.appIcones.cle === cleIcones()); }
  async function preparerIconesAppli() {
    if (iconesAJour()) return;
    const d = cfg.design;
    const logo = await chargerImage(cfg.logo ? (imagesLocales[cfg.logo] || cfg.logo) : '');
    const dessiner = (taille, part) => {
      const cv = document.createElement('canvas'); cv.width = cv.height = taille;
      const ctx = cv.getContext('2d');
      if (logo && logo.width) {
        ctx.fillStyle = d.fond || '#ffffff'; ctx.fillRect(0, 0, taille, taille);
        const k = Math.min(taille * part / logo.width, taille * part / logo.height);
        ctx.drawImage(logo, (taille - logo.width * k) / 2, (taille - logo.height * k) / 2, logo.width * k, logo.height * k);
      } else {
        const fondI = d.accent || '#2b2620';
        ctx.fillStyle = fondI; ctx.fillRect(0, 0, taille, taille);
        const ini = initiales(cfg.titre).slice(0, 2);
        ctx.fillStyle = luminance(fondI) > 0.55 ? '#111111' : '#ffffff';
        ctx.font = '700 ' + Math.round(taille * part * (ini.length > 1 ? 0.5 : 0.62)) + 'px system-ui, -apple-system, Roboto, Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ini, taille / 2, taille / 2 + taille * 0.02);
      }
      return cv.toDataURL('image/png');
    };
    const gen = 'images/app-' + Date.now() + '-';
    const ic = { cle: cleIcones(), i192: gen + '192.png', i512: gen + '512.png', m512: gen + 'm512.png' };
    let images;
    try { images = { [ic.i192]: dessiner(192, 0.84), [ic.i512]: dessiner(512, 0.84), [ic.m512]: dessiner(512, 0.62) }; }
    catch (e) { return; }                        // logo illisible : on garde les icônes précédentes
    for (const ch in images) { imagesLocales[ch] = images[ch]; imagesAEnvoyer[ch] = images[ch].split(',')[1]; }
    cfg.appIcones = ic;
  }

  function chargerImage(src) {
    return new Promise((ok, ko) => {
      if (!src) return ok(null);
      const im = new Image();
      if (/^https?:/i.test(src)) im.crossOrigin = 'anonymous';
      im.onload = () => ok(im);
      im.onerror = () => ok(null);
      im.src = src;
    });
  }

  function formaterNumero(v) {
    const n = numeroInternational(v);
    if (/^33\d{9}$/.test(n)) return '+33 ' + n[2] + ' ' + n.slice(3).match(/../g).join(' ');
    return '+' + n;
  }

  // Coordonnées à imprimer, tirées des boutons visibles
  function coordonnees() {
    const lignes = [];
    const vus = {};
    const ajout = (etiq, val) => { if (val && !vus[val]) { vus[val] = 1; lignes.push([etiq, val]); } };
    const btns = cfg.boutons.filter(b => b && !b.masque && b.type !== 'reseaux' && String(b.valeur || '').trim());
    const tel = btns.find(b => b.type === 'tel') || btns.find(b => b.type === 'sms'), wa = btns.find(b => b.type === 'whatsapp');
    if (tel && wa && numeroInternational(tel.valeur) === numeroInternational(wa.valeur)) ajout('Tél. / WhatsApp', formaterNumero(tel.valeur));
    else { if (tel) ajout('Tél.', formaterNumero(tel.valeur)); if (wa) ajout('WhatsApp', formaterNumero(wa.valeur)); }
    btns.filter(b => b.type === 'email').forEach(b => ajout('E-mail', b.valeur.trim()));
    const mail = cfg.reseaux.find(r => r.id === 'email' && r.actif && String(r.valeur || '').trim());
    if (mail) ajout('E-mail', String(mail.valeur).trim().replace(/^mailto:/i, ''));
    const site = cfg.reseaux.find(r => r.id === 'site' && r.actif && String(r.valeur || '').trim());
    const lienWeb = site ? site.valeur : (btns.find(b => b.type === 'lien') || {}).valeur;
    if (lienWeb) ajout('Web', String(lienWeb).trim().replace(/^https?:\/\//i, '').replace(/\/$/, ''));
    const insta = cfg.reseaux.find(r => r.id === 'instagram' && r.actif && String(r.valeur || '').trim());
    if (insta && lignes.length < 4) ajout('Instagram', '@' + String(insta.valeur).trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/\/.*$/, ''));
    return lignes.slice(0, 4);
  }

  // Ajuste la taille de police pour tenir dans une largeur
  function policeAjustee(ctx, texte, poids, tailleMax, tailleMin, largeur, famille) {
    let t = tailleMax;
    do { ctx.font = poids + ' ' + t + 'px ' + famille; t -= 4; } while (ctx.measureText(texte).width > largeur && t > tailleMin);
    return ctx.font;
  }

  function coupeLignes(ctx, texte, largeur, max) {
    const mots = String(texte).split(/\s+/), lignes = [];
    let l = '';
    mots.forEach(m => {
      const essai = l ? l + ' ' + m : m;
      if (ctx.measureText(essai).width > largeur && l) { lignes.push(l); l = m; } else l = essai;
    });
    if (l) lignes.push(l);
    if (lignes.length > max) { lignes.length = max; lignes[max - 1] = lignes[max - 1].replace(/\s*\S*$/, '') + '…'; }
    return lignes;
  }

  function rectArrondi(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* ---------- Cartes de visite : 85 × 55 mm à 600 dpi ---------- */
  const MODELES_CARTE = {
    photo:   'Photo',
    epure:   'Épuré',
    luxe:    'Luxe',
    bandeau: 'Bandeau',
    centre:  'Centré',
    couleur: 'Couleur',
    diagonale: 'Diagonale',
    cadre:   'Cadre',
    photoHaut: 'Photo en haut',
    minimal: 'Minimal',
    ticket:  'Ticket',
    qrXL:    'QR géant',
    vague:   'Vague',
    pastille: 'Pastille',
    nuit:    'Nuit',
    monogramme: 'Monogramme',
    viseur:  'Viseur',
    kraft:   'Kraft',
    vertical: 'Vertical',
    verticalEpure: 'Vertical épuré',
    verso:   'Verso QR',
    versoCouleur: 'Verso couleur'
  };
  const TAILLES_CARTE = { vertical: { W: 1300, H: 2008 }, verticalEpure: { W: 1300, H: 2008 } };

  function luminance(hex) {
    const rgb = hexVersRgb(hex) || [0, 0, 0];
    const [r, g, b] = rgb.map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  async function preparerCarte() {
    const d = cfg.design;
    const res = p => imagesLocales[p] || p;
    return {
      W: 2008, H: 1300, P: 110, d,
      fam: (FONTS[d.police] || FONTS.moderne).css,
      fondImg: await chargerImage(d.imageFond ? res(d.imageFond) : ''),
      logo: await chargerImage(cfg.logo ? res(cfg.logo) : ''),
      coords: coordonnees()
    };
  }

  function couvrir(ctx, img, x, y, w, h) {
    const k = Math.max(w / img.width, h / img.height);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, x + (w - img.width * k) / 2, y + (h - img.height * k) / 2, img.width * k, img.height * k);
    ctx.restore();
  }

  function dessinerLogo(ctx, D, x, y, T) {
    const logo = D.logo; if (!logo) return 0;
    if (D.d.logoRond) {
      ctx.save(); ctx.beginPath(); ctx.arc(x + T / 2, y + T / 2, T / 2, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
      const k = Math.max(T / logo.width, T / logo.height);
      ctx.drawImage(logo, x + (T - logo.width * k) / 2, y + (T - logo.height * k) / 2, logo.width * k, logo.height * k);
      ctx.restore();
    } else {
      const k = Math.min(T / logo.width, T / logo.height);
      ctx.drawImage(logo, x + (T - logo.width * k) / 2, y + (T - logo.height * k) / 2, logo.width * k, logo.height * k);
    }
    return T;
  }

  // Bloc QR (fond blanc arrondi, légende facultative) ; renvoie la hauteur
  function dessinerBlocQR(ctx, D, x, y, taille, legende, ombre) {
    const m = Math.round(taille * 0.085);
    const h = taille + (legende ? Math.round(taille * 0.17) : 0);
    ctx.save();
    if (ombre) { ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 10; }
    ctx.fillStyle = '#ffffff'; rectArrondi(ctx, x, y, taille, h, Math.round(taille * 0.07)); ctx.fill();
    ctx.restore();
    dessinerQR(ctx, URL_QR, x + m, y + m, taille - 2 * m, '#111');
    if (legende) {
      ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '700 ' + Math.round(taille * 0.075) + 'px ' + D.fam;
      ctx.fillText(legende, x + taille / 2, y + h - Math.round(taille * 0.065));
      ctx.textAlign = 'left';
    }
    return h;
  }

  // Titre + sous-titre + trait + coordonnées ; align 'left' ou 'center'
  function dessinerTextes(ctx, D, x, y, largeur, c, align) {
    const cfgT = cfg, fam = D.fam;
    const ax = align === 'center' ? x + largeur / 2 : x;
    ctx.textAlign = align; ctx.textBaseline = 'top';
    if (cfgT.titre) {
      ctx.fillStyle = c.texte;
      ctx.font = policeAjustee(ctx, cfgT.titre, '800', c.titre || 124, 60, largeur, fam);
      let t = parseInt(ctx.font.match(/(\d+)px/)[1], 10);
      if (ctx.measureText(cfgT.titre).width <= largeur) { ctx.fillText(cfgT.titre, ax, y); y += t * 1.18; }
      else {
        // trop long même en petit : deux lignes plutôt qu'un titre qui déborde sur le QR ou hors de la carte
        let lignes;
        t = Math.min(c.titre || 124, 100);
        do { ctx.font = '800 ' + t + 'px ' + fam; lignes = coupeLignes(ctx, cfgT.titre, largeur, 2); t -= 4; }
        while (lignes.some(l => ctx.measureText(l).width > largeur) && t > 40);
        t += 4;
        lignes.forEach(l => { ctx.fillText(l, ax, y); y += t * 1.12; });
        y += t * 0.08;
      }
    }
    if (cfgT.sousTitre) {
      ctx.font = '400 ' + (c.sous || 54) + 'px ' + fam; ctx.fillStyle = c.texte; ctx.globalAlpha = 0.8;
      coupeLignes(ctx, cfgT.sousTitre, largeur, 2).forEach(l => { ctx.fillText(l, ax, y); y += (c.sous || 54) * 1.26; });
      ctx.globalAlpha = 1;
    }
    y += 30;
    ctx.fillStyle = c.accent; ctx.fillRect(align === 'center' ? ax - 65 : x, y, 130, 8); y += 56;
    if (c.enLigne) {
      const ligne = D.coords.slice(0, 2).map(l => l[1]).join('   ·   ');
      ctx.font = policeAjustee(ctx, ligne, '600', 52, 34, largeur, fam);
      ctx.fillStyle = c.texte;
      ctx.fillText(ligne, ax, y);
      y += 70;
    } else {
      D.coords.forEach(([etiq, val]) => {
        ctx.font = '700 40px ' + fam; ctx.fillStyle = c.accent; ctx.fillText(etiq.toUpperCase(), ax, y);
        ctx.fillStyle = c.texte; ctx.font = policeAjustee(ctx, val, '600', 56, 34, largeur, fam);
        ctx.fillText(val, ax, y + 46); y += 128;
      });
    }
    ctx.textAlign = 'left';
    return y;
  }

  function dessinerPied(ctx, D, x, y, couleur, align) {
    if (!cfg.pied) return;
    ctx.font = '500 40px ' + D.fam; ctx.fillStyle = couleur; ctx.globalAlpha = .7;
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = align || 'left';
    ctx.fillText(String(cfg.pied).split('\n')[0], x, y);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function fondPage(ctx, D, x, y, w, h, voileMin) {
    if (D.fondImg) {
      couvrir(ctx, D.fondImg, x, y, w, h);
      ctx.fillStyle = 'rgba(0,0,0,' + Math.max(voileMin, (Number(D.d.voile) || 0) / 100) + ')';
      ctx.fillRect(x, y, w, h);
      return '#ffffff';
    }
    const g = ctx.createLinearGradient(x, y, x + w * 0.4, y + h);
    g.addColorStop(0, D.d.fond); g.addColorStop(1, D.d.fond2 || D.d.fond);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    return D.d.texte;
  }

  // Liste des coordonnées seule (étiquette + valeur)
  function dessinerCoords(ctx, D, x, y, largeur, c, align) {
    const ax = align === 'center' ? x + largeur / 2 : x;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
    D.coords.forEach(([etiq, val]) => {
      ctx.font = '700 ' + (c.etiq || 40) + 'px ' + D.fam; ctx.fillStyle = c.accent; ctx.fillText(etiq.toUpperCase(), ax, y);
      ctx.fillStyle = c.texte; ctx.font = policeAjustee(ctx, val, '600', c.val || 56, 30, largeur, D.fam);
      ctx.fillText(val, ax, y + (c.etiq || 40) + 6); y += (c.pas || 128);
    });
    ctx.textAlign = 'left';
    return y;
  }

  function fondAccent(ctx, D, x, y, w, h) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, D.d.accent); g.addColorStop(1, D.d.fond2 && D.d.fond2 !== D.d.fond ? D.d.fond2 : D.d.accent);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  }

  /* Petits outils des nouveaux modèles */
  const accentLisible = D => luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;      // accent lisible sur fond clair
  function contraste(a, b) { const la = luminance(a), lb = luminance(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }
  // Accent sur le fond du thème (sans photo) : s'il ressort trop peu, on prend la couleur du texte
  const accentSurFond = (D, texte) => D.fondImg ? texte : (contraste(D.d.accent, D.d.fond) >= 2.2 ? D.d.accent : D.d.texte);
  function aleatoire(graine) { let x = graine >>> 0 || 1; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }
  function legendeQR(ctx, D, texte, cx, y, couleur, taille) {
    ctx.save(); ctx.fillStyle = couleur; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = '700 ' + (taille || 40) + 'px ' + D.fam; ctx.fillText(texte, cx, y); ctx.restore();
  }

  const DESSINS_CARTE = {
    /* Ticket : souche détachable avec le QR, perforation et encoches */
    ticket(ctx, D) {
      const { W, H, P } = D;
      const xs = W - 690;
      const texte = fondPage(ctx, D, 0, 0, xs, H, 0.45);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(xs, 0, W - xs, H);
      ctx.save(); ctx.strokeStyle = '#b9b9c2'; ctx.lineWidth = 7; ctx.setLineDash([26, 22]);
      ctx.beginPath(); ctx.moveTo(xs, 70); ctx.lineTo(xs, H - 70); ctx.stroke(); ctx.restore();
      ctx.fillStyle = '#ececf1';
      [0, H].forEach(cy => { ctx.beginPath(); ctx.arc(xs, cy, 62, 0, Math.PI * 2); ctx.fill(); });
      const q = 470, qx = xs + (W - xs - q) / 2, qy = (H - q) / 2 - 50;
      dessinerQR(ctx, URL_QR, qx, qy, q, '#111');
      legendeQR(ctx, D, 'Scannez-moi', xs + (W - xs) / 2, qy + q + 40, accentLisible(D), 44);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 210) + 56 : 50);
      dessinerTextes(ctx, D, P, y, xs - P - 110, { texte, accent: accentSurFond(D, texte) }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, texte);
    },
    /* QR géant : lisible de loin (comptoir, vitrine, véhicule) */
    qrXL(ctx, D) {
      const { W, H } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = accentLisible(D);
      const q = H - 170, qx = W - 85 - q, qy = 85;
      dessinerQR(ctx, URL_QR, qx, qy, q, '#111');
      ctx.fillStyle = accent; ctx.fillRect(qx - 70, 110, 10, H - 220);
      const L = qx - 70 - 100 - 60;
      let y = 100;
      if (D.logo) { dessinerLogo(ctx, D, 100, y, 170); y += 170 + 46; } else y += 30;
      ctx.textBaseline = 'top'; ctx.fillStyle = '#111';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '800', 92, 44, L, D.fam);
      coupeLignes(ctx, cfg.titre || '', L, 2).forEach(l => { ctx.fillText(l, 100, y); y += parseInt(ctx.font.match(/(\d+)px/)[1], 10) * 1.12; });
      if (cfg.sousTitre) {
        ctx.font = '400 42px ' + D.fam; ctx.fillStyle = '#555';
        coupeLignes(ctx, cfg.sousTitre, L, 2).forEach(l => { ctx.fillText(l, 100, y + 6); y += 54; });
      }
      y += 40;
      dessinerCoords(ctx, Object.assign({}, D, { coords: D.coords.slice(0, 3) }), 100, y, L, { texte: '#111', accent, etiq: 32, val: 44, pas: 98 }, 'left');
      ctx.fillStyle = accent; ctx.textBaseline = 'alphabetic'; ctx.font = '800 48px ' + D.fam;
      ctx.fillText('Scannez-moi →', 100, H - 95);
    },
    /* Vague : bas de carte ondulé aux couleurs du thème */
    vague(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const vague = (y0, amp) => {
        ctx.beginPath(); ctx.moveTo(0, y0);
        ctx.bezierCurveTo(W * 0.3, y0 - amp, W * 0.55, y0 + amp, W, y0 - amp * 0.6);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      };
      ctx.save(); vague(H * 0.70, 110); ctx.clip(); ctx.globalAlpha = 0.35; fondAccent(ctx, D, 0, 0, W, H); ctx.restore();
      ctx.save(); vague(H * 0.78, 90); ctx.clip();
      if (D.fondImg) fondPage(ctx, D, 0, 0, W, H, 0.35); else fondAccent(ctx, D, 0, 0, W, H);
      ctx.restore();
      const q = 470, qx = W - P - q, qy = 120;
      dessinerBlocQR(ctx, D, qx, qy, q, 'Scannez-moi', true);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 190) + 50 : 30);
      dessinerTextes(ctx, D, P, y, qx - P - 90, { texte: '#1a1a1a', accent: accentLisible(D), enLigne: true, titre: 112 }, 'left');
      dessinerPied(ctx, D, P, H - 70, D.fondImg ? '#ffffff' : couleurIcone(D.d.accent));
    },
    /* Pastille : le QR dans un grand disque de couleur */
    pastille(ctx, D) {
      const { W, H, P } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      const r = 450, cx = W - 470, cy = H / 2;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 12;
      ctx.fillStyle = D.d.accent; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, r - 26, 0, Math.PI * 2); ctx.stroke();
      const q = 500, hb = Math.round(q * 1.17);
      dessinerBlocQR(ctx, D, cx - q / 2, cy - hb / 2, q, 'Scannez-moi', false);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 210) + 56 : 40);
      dessinerTextes(ctx, D, P, y, cx - r - P - 70, { texte, accent: accentSurFond(D, texte) }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, texte);
    },
    /* Nuit : fond sombre, lueur néon de la couleur du thème */
    nuit(ctx, D) {
      const { W, H, P } = D;
      const neon = luminance(D.d.accent) < 0.12 ? '#5ad1ff' : D.d.accent;
      if (D.fondImg) { couvrir(ctx, D.fondImg, 0, 0, W, H); ctx.fillStyle = 'rgba(5,7,14,.78)'; ctx.fillRect(0, 0, W, H); }
      else { const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0b0d14'); g.addColorStop(1, '#1b2030'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
      const halo = ctx.createRadialGradient(W * 0.18, H * 1.05, 40, W * 0.18, H * 1.05, W * 0.75);
      const rgb = hexVersRgb(neon) || [90, 209, 255];
      halo.addColorStop(0, 'rgba(' + rgb.join(',') + ',.38)'); halo.addColorStop(1, 'rgba(' + rgb.join(',') + ',0)');
      ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.strokeStyle = neon; ctx.lineWidth = 6; ctx.shadowColor = neon; ctx.shadowBlur = 30;
      rectArrondi(ctx, 44, 44, W - 88, H - 88, 46); ctx.stroke(); ctx.restore();
      const q = 520, qx = W - P - 40 - q, hb = Math.round(q * 1.17), qy = (H - hb) / 2;
      ctx.save(); ctx.shadowColor = neon; ctx.shadowBlur = 70; ctx.fillStyle = '#fff'; rectArrondi(ctx, qx, qy, q, hb, 36); ctx.fill(); ctx.restore();
      dessinerBlocQR(ctx, D, qx, qy, q, 'Scannez-moi', false);
      let y = P + 40 + (D.logo ? dessinerLogo(ctx, D, P + 40, P + 40, 200) + 56 : 30);
      ctx.save(); ctx.shadowColor = neon; ctx.shadowBlur = 24;
      dessinerTextes(ctx, D, P + 40, y, qx - P - 140, { texte: '#f2f5ff', accent: neon }, 'left');
      ctx.restore();
      dessinerPied(ctx, D, P + 40, H - P - 10, '#f2f5ff');
    },
    /* Monogramme : les initiales de l'activité en grand filigrane */
    monogramme(ctx, D) {
      const { W, H, P } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      const mono = initiales(cfg.titre);
      ctx.save(); ctx.globalAlpha = D.fondImg ? 0.18 : 0.13; ctx.fillStyle = D.fondImg ? '#ffffff' : D.d.accent;
      ctx.textBaseline = 'alphabetic'; ctx.font = policeAjustee(ctx, mono, '900', 980, 300, W * 0.72, D.fam);
      ctx.fillText(mono, -30, H + 150); ctx.restore();
      const q = 540, bx = W - P - q;
      dessinerBlocQR(ctx, D, bx, (H - q * 1.17) / 2, q, 'Scannez-moi', true);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 200) + 56 : 40);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte, accent: accentSurFond(D, texte) }, 'left');
    },
    /* Viseur : coins d'appareil photo autour du QR */
    viseur(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = accentLisible(D);
      ctx.fillStyle = accent; ctx.fillRect(0, 0, W, 22);
      const q = 500, qx = W - P - 40 - q, qy = (H - q) / 2 - 40;
      dessinerQR(ctx, URL_QR, qx, qy, q, '#111');
      const e = 70, L = 120, ep = 16;
      ctx.fillStyle = accent;
      [[qx - e, qy - e, 1, 1], [qx + q + e, qy - e, -1, 1], [qx - e, qy + q + e, 1, -1], [qx + q + e, qy + q + e, -1, -1]].forEach(([x, y, sx, sy]) => {
        ctx.fillRect(sx > 0 ? x : x - L, sy > 0 ? y : y - ep, L, ep);
        ctx.fillRect(sx > 0 ? x : x - ep, sy > 0 ? y : y - L, ep, L);
      });
      legendeQR(ctx, D, 'Scannez-moi', qx + q / 2, qy + q + e + 30, accent, 40);
      let y = P + 20 + (D.logo ? dessinerLogo(ctx, D, P, P + 20, 190) + 52 : 30);
      dessinerTextes(ctx, D, P, y, qx - e - P - 100, { texte: '#1a1a1a', accent }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, '#1a1a1a');
    },
    /* Kraft : papier recyclé, encre foncée, QR façon tampon */
    kraft(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#e6d6b8'; ctx.fillRect(0, 0, W, H);
      const rnd = aleatoire(7);
      for (let i = 0; i < 9000; i++) {
        const v = rnd();
        ctx.fillStyle = v < 0.5 ? 'rgba(120,90,50,' + (0.05 + rnd() * 0.08) + ')' : 'rgba(255,250,235,' + (0.05 + rnd() * 0.1) + ')';
        ctx.fillRect(rnd() * W, rnd() * H, 2 + rnd() * 5, 2 + rnd() * 5);
      }
      const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.75);
      vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(70,45,15,.22)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
      const encre = '#2a2016';
      const accent = luminance(D.d.accent) < 0.25 ? D.d.accent : '#7a3b1d';
      const q = 480, qx = W - P - 20 - q, qy = (H - q) / 2 - 30;
      ctx.save(); ctx.strokeStyle = encre; ctx.lineWidth = 6; ctx.setLineDash([18, 12]);
      rectArrondi(ctx, qx - 40, qy - 40, q + 80, q + 140, 26); ctx.stroke(); ctx.restore();
      dessinerQR(ctx, URL_QR, qx, qy, q, encre);
      legendeQR(ctx, D, 'Scannez-moi', qx + q / 2, qy + q + 26, encre, 38);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 190) + 52 : 40);
      dessinerTextes(ctx, D, P, y, qx - 40 - P - 90, { texte: encre, accent }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, encre);
    },
    /* Vertical épuré : fond blanc, format portrait */
    verticalEpure(ctx, D) {
      const { W, H } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = accentLisible(D);
      ctx.fillStyle = accent; ctx.fillRect(0, H - 30, W, 30);
      let y = 140;
      if (D.logo) { dessinerLogo(ctx, D, (W - 240) / 2, y, 240); y += 240 + 56; } else y += 60;
      y = dessinerTextes(ctx, D, 110, y, W - 220, { texte: '#1a1a1a', accent, titre: 110, enLigne: true }, 'center');
      const bas = H - 110;                                   // au-dessus du liseré, légende comprise
      const q = Math.min(640, bas - y - 160);
      const qy = y + Math.max(30, (bas - y - q - 90) / 2);
      dessinerQR(ctx, URL_QR, (W - q) / 2, qy, q, '#111');
      legendeQR(ctx, D, 'Scannez-moi', W / 2, qy + q + 34, '#777', 44);
    },
    /* Verso couleur : dos de carte aux couleurs du thème */
    versoCouleur(ctx, D) {
      const { W, H } = D;
      ctx.fillStyle = D.d.accent; ctx.fillRect(0, 0, W, H);
      const texte = couleurIcone(D.d.accent);
      ctx.save(); ctx.globalAlpha = 0.09; ctx.strokeStyle = texte; ctx.lineWidth = 18;
      for (let x = -H; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + H, 0); ctx.stroke(); }
      ctx.restore();
      const q = 820, qx = 150, qy = (H - q) / 2;
      dessinerBlocQR(ctx, D, qx, qy, q, '', true);
      const x = qx + q + 110, L = W - x - 120;
      let y = 260;
      if (D.logo) { dessinerLogo(ctx, D, x, y - 60, 170); y += 170; }
      ctx.fillStyle = texte; ctx.textBaseline = 'top';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '800', 96, 46, L, D.fam);
      coupeLignes(ctx, cfg.titre || '', L, 2).forEach(l => { ctx.fillText(l, x, y); y += parseInt(ctx.font.match(/(\d+)px/)[1], 10) * 1.12; });
      y += 30; ctx.fillRect(x, y, 120, 8); y += 50;
      ctx.font = '500 48px ' + D.fam; ctx.globalAlpha = 0.9;
      coupeLignes(ctx, 'Scannez pour réserver, appeler ou laisser un avis', L, 3).forEach(l => { ctx.fillText(l, x, y); y += 62; });
      ctx.globalAlpha = 1;
    },

    photo(ctx, D) {
      const { W, H, P } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      const q = 600, bx = W - P - q;
      dessinerBlocQR(ctx, D, bx, (H - q * 1.17) / 2, q, 'Scannez-moi', true);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 230) + 60 : 40);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte, accent: D.d.accent }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, texte);
    },
    epure(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      ctx.fillStyle = accent; ctx.fillRect(0, H - 26, W, 26);
      const q = 520, bx = W - P - q;
      dessinerQR(ctx, URL_QR, bx, (H - q) / 2 - 30, q, '#111');
      ctx.fillStyle = '#777'; ctx.textAlign = 'center'; ctx.font = '600 40px ' + D.fam; ctx.textBaseline = 'top';
      ctx.fillText('Scannez-moi', bx + q / 2, (H + q) / 2 - 10); ctx.textAlign = 'left';
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 200) + 56 : 40);
      dessinerTextes(ctx, D, P, y, bx - P - 110, { texte: '#1a1a1a', accent }, 'left');
      dessinerPied(ctx, D, P, H - P + 20, '#1a1a1a');
    },
    luxe(ctx, D) {
      const { W, H, P } = D;
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#151515'); g.addColorStop(1, '#050505');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const or = luminance(D.d.accent) < 0.12 || luminance(D.d.accent) > 0.85 ? '#c9a45c' : D.d.accent;
      ctx.strokeStyle = or; ctx.lineWidth = 4; ctx.strokeRect(46, 46, W - 92, H - 92);
      const q = 520, bx = W - P - 40 - q;
      dessinerBlocQR(ctx, D, bx, (H - q * 1.17) / 2, q, 'Scannez-moi', false);
      let y = P + 40 + (D.logo ? dessinerLogo(ctx, D, P + 40, P + 40, 200) + 56 : 30);
      dessinerTextes(ctx, D, P + 40, y, bx - P - 140, { texte: '#f5efe0', accent: or }, 'left');
      dessinerPied(ctx, D, P + 40, H - P - 10, '#f5efe0');
    },
    bandeau(ctx, D) {
      const { W, H, P } = D;
      const B = 760;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      if (D.fondImg) fondPage(ctx, D, 0, 0, B, H, 0.45);
      else {
        const g = ctx.createLinearGradient(0, 0, B, H);
        g.addColorStop(0, D.d.accent); g.addColorStop(1, D.d.fond2 || D.d.accent);
        ctx.fillStyle = g; ctx.fillRect(0, 0, B, H);
      }
      let y = 120;
      if (D.logo) { dessinerLogo(ctx, D, (B - 220) / 2, y, 220); y += 220 + 60; }
      const q = D.logo ? 440 : 560;
      dessinerBlocQR(ctx, D, (B - q) / 2, y + (H - y - q * 1.17 - 110) / 2, q, 'Scannez-moi', true);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      const x = B + 120;
      dessinerTextes(ctx, D, x, 170, W - x - P, { texte: '#1a1a1a', accent, titre: 110 }, 'left');
      dessinerPied(ctx, D, x, H - P + 20, '#1a1a1a');
    },
    centre(ctx, D) {
      const { W, H, P } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      let y = 100;
      if (D.logo) { dessinerLogo(ctx, D, (W - 200) / 2, y, 200); y += 200 + 50; } else y += 120;
      const q = 300;
      dessinerTextes(ctx, D, P + q, y, W - 2 * (P + q), { texte, accent: D.d.accent, enLigne: true, titre: 120 }, 'center');
      dessinerBlocQR(ctx, D, W - P - q + 40, H - P - q * 1.17 + 40, q, 'Scannez', true);
      dessinerPied(ctx, D, P - 20, H - P + 40, texte);
    },
    couleur(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = D.d.accent; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W * 0.2, H * 0.1, 50, W * 0.5, H * 0.5, W * 0.9);
      g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const texte = couleurIcone(D.d.accent);
      const q = 560, bx = W - P - q;
      dessinerBlocQR(ctx, D, bx, (H - q * 1.17) / 2, q, 'Scannez-moi', true);
      let y = P + (D.logo ? dessinerLogo(ctx, D, P, P, 210) + 56 : 40);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte, accent: texte }, 'left');
      dessinerPied(ctx, D, P, H - P + 30, texte);
    },
    diagonale(ctx, D) {
      const { W, H, P } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const xa = W * 0.5, xb = W * 0.36;
      ctx.save(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(xa, 0); ctx.lineTo(xb, H); ctx.lineTo(0, H); ctx.closePath(); ctx.clip();
      if (D.fondImg) fondPage(ctx, D, 0, 0, xa, H, 0.35); else fondAccent(ctx, D, 0, 0, xa, H);
      ctx.restore();
      ctx.strokeStyle = D.d.accent; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(xa + 22, 0); ctx.lineTo(xb + 22, H); ctx.stroke();
      const q = 460;
      let y = 110;
      if (D.logo) { dessinerLogo(ctx, D, 110, y, 190); y += 190 + 50; }
      dessinerBlocQR(ctx, D, 110, D.logo ? y : (H - q * 1.17) / 2, q, 'Scannez-moi', true);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      const x = xa + 90;
      dessinerTextes(ctx, D, x, 150, W - x - P + 20, { texte: '#1a1a1a', accent, titre: 104, sous: 48 }, 'left');
      dessinerPied(ctx, D, x, H - P + 20, '#1a1a1a');
    },
    cadre(ctx, D) {
      const { W, H } = D;
      fondPage(ctx, D, 0, 0, W, H, 0.25);
      const m = 80;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 12;
      ctx.fillStyle = 'rgba(255,255,255,.95)'; rectArrondi(ctx, m, m, W - 2 * m, H - 2 * m, 50); ctx.fill(); ctx.restore();
      const P = m + 90;
      const q = 480, bx = W - P - q;
      dessinerQR(ctx, URL_QR, bx, (H - q) / 2 - 24, q, '#111');
      ctx.fillStyle = '#666'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '600 38px ' + D.fam;
      ctx.fillText('Scannez-moi', bx + q / 2, (H + q) / 2 - 4); ctx.textAlign = 'left';
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      let y = P - 10 + (D.logo ? dessinerLogo(ctx, D, P, P - 10, 170) + 44 : 20);
      dessinerTextes(ctx, D, P, y, bx - P - 90, { texte: '#1a1a1a', accent, titre: 100, sous: 46 }, 'left');
    },
    photoHaut(ctx, D) {
      const { W, H, P } = D;
      const Hh = Math.round(H * 0.5);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      if (D.fondImg) fondPage(ctx, D, 0, 0, W, Hh, 0.4); else fondAccent(ctx, D, 0, 0, W, Hh);
      const blanc = D.fondImg ? '#ffffff' : couleurIcone(D.d.accent);
      const q = 470, qx = W - P - q, qy = Hh - 120;
      let x = P;
      if (D.logo) { dessinerLogo(ctx, D, P, Hh - 250, 200); x = P + 250; }
      const Lt = qx - x - 50;
      ctx.fillStyle = blanc; ctx.textBaseline = 'alphabetic';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '800', 112, 52, Lt, D.fam);
      ctx.fillText(cfg.titre || '', x, Hh - (cfg.sousTitre ? 130 : 70));
      if (cfg.sousTitre) {
        ctx.font = policeAjustee(ctx, cfg.sousTitre, '400', 50, 28, Lt, D.fam); ctx.globalAlpha = .85;
        ctx.fillText(cfg.sousTitre, x, Hh - 64); ctx.globalAlpha = 1;
      }
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      dessinerBlocQR(ctx, D, qx, qy, q, '', true);
      const coords = D.coords.slice(0, 3);
      dessinerCoords(ctx, Object.assign({}, D, { coords }), P, Hh + 80, qx - P - 80, { texte: '#1a1a1a', accent, val: 52, pas: 116 }, 'left');
      dessinerPied(ctx, D, P, H - 70, '#1a1a1a');
    },
    minimal(ctx, D) {
      const { W, H } = D;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      const accent = luminance(D.d.accent) > 0.6 ? '#1a1a1a' : D.d.accent;
      let y = 110;
      if (D.logo) { dessinerLogo(ctx, D, (W - 170) / 2, y, 170); y += 170 + 40; } else y += 60;
      ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '300', 104, 56, W - 300, D.fam);
      ctx.fillText(cfg.titre || '', W / 2, y); y += 130;
      ctx.fillStyle = accent; ctx.fillRect(W / 2 - 50, y, 100, 5); y += 40;
      const ligne = D.coords.slice(0, 2).map(l => l[1]).join('   ·   ');
      ctx.fillStyle = '#444'; ctx.font = policeAjustee(ctx, ligne, '500', 48, 30, W - 300, D.fam);
      ctx.fillText(ligne, W / 2, y); y += 90;
      const q = Math.min(440, H - y - 90);
      dessinerQR(ctx, URL_QR, (W - q) / 2, y, q, '#111');
      ctx.textAlign = 'left';
    },
    vertical(ctx, D) {
      const { W, H } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.5);
      let y = 130;
      if (D.logo) { dessinerLogo(ctx, D, (W - 280) / 2, y, 280); y += 280 + 60; } else y += 80;
      y = dessinerTextes(ctx, D, 110, y, W - 220, { texte, accent: D.d.accent, titre: 116, enLigne: false }, 'center');
      const q = 560;
      dessinerBlocQR(ctx, D, (W - q) / 2, Math.max(y + 10, H - 110 - q * 1.17), q, 'Scannez-moi', true);
    },
    verso(ctx, D) {
      const { W, H } = D;
      const texte = fondPage(ctx, D, 0, 0, W, H, 0.55);
      const q = 760;
      dessinerBlocQR(ctx, D, (W - q) / 2, 110, q, '', true);
      ctx.fillStyle = texte; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = policeAjustee(ctx, cfg.titre || '', '800', 96, 50, W - 300, D.fam);
      ctx.fillText(cfg.titre || '', W / 2, 110 + q + 70);
      ctx.font = '500 50px ' + D.fam; ctx.globalAlpha = .8;
      ctx.fillText('Scannez pour réserver, appeler ou laisser un avis', W / 2, 110 + q + 190);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
  };

  async function genererCarte(modele, D) {
    D = D || await preparerCarte();
    if (TAILLES_CARTE[modele]) D = Object.assign({}, D, TAILLES_CARTE[modele]);
    else D = Object.assign({}, D, { W: 2008, H: 1300 });
    const cv = document.createElement('canvas');
    cv.width = D.W; cv.height = D.H;
    (DESSINS_CARTE[modele] || DESSINS_CARTE.photo)(cv.getContext('2d'), D);
    return cv;
  }

  function nomFichierCarte(modele) {
    const base = (cfg.titre || 'page').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  }

    }
