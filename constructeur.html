<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Constructeur du site qrbc.app</title>
<link rel="icon" href="/favicon.png">
<style>
  :root{--bg:#f6f4ef;--panneau:#fff;--ligne:#e3dfd6;--txt:#1b1a17;--doux:#6a665d;--prim:#1b1a17;--prim-txt:#f6f4ef;--accent:#d9572b;--ok:#1a7f37;--err:#cf222e}
  *{box-sizing:border-box}
  [hidden],.cache{display:none !important}
  html,body{margin:0;height:100%}
  body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  button,input,select,textarea{font:inherit;color:inherit}
  .btn{padding:9px 14px;border:1px solid var(--ligne);border-radius:10px;background:var(--panneau);cursor:pointer;font-weight:600;white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-prim{background:var(--prim);color:var(--prim-txt);border-color:var(--prim)}
  .btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-mini{padding:5px 9px;font-size:.85rem;border-radius:8px}
  .btn-danger{color:var(--err)}
  input[type=text],input[type=url],input[type=date],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ligne);border-radius:9px;background:var(--bg);outline:none}
  textarea{resize:vertical;min-height:70px}
  textarea.code{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto;tab-size:2;background:#1e1e1e;color:#e6e6e6;border-color:#1e1e1e}
  .langues-code{display:flex;gap:6px;margin:0 0 8px}
  .langues-code .actif{background:var(--prim);color:var(--prim-txt)}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  label.champ{display:block;margin:0 0 12px}
  label.champ>span,.etiq{display:block;font-size:.78rem;font-weight:700;color:var(--doux);margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
  .aide{font-size:.8rem;color:var(--doux);margin:-6px 0 12px}
  .case{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-weight:600}
  /* connexion */
  #connexion{max-width:380px;margin:12vh auto;padding:26px;background:var(--panneau);border:1px solid var(--ligne);border-radius:18px}
  #connexion h1{margin:0 0 6px;font-size:1.3rem}
  .msg{font-size:.9rem;margin-top:10px;min-height:1.2em}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  /* éditeur */
  #editeur{display:flex;flex-direction:column;height:100%}
  .barre{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--panneau);border-bottom:1px solid var(--ligne)}
  .barre .marque{font-weight:800;font-size:1.05rem;margin-right:6px}
  .barre .marque span{color:var(--accent)}
  .barre .esp{flex:1}
  .langues{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--ligne);border-radius:10px;overflow:hidden}
  .langues button{border:0;background:none;padding:7px 12px;font-weight:700;cursor:pointer}
  .langues button.actif{background:var(--prim);color:var(--prim-txt)}
  .langues button.plus{color:var(--accent);font-size:1.05rem;padding:7px 11px}
  .menu-langues{position:fixed;z-index:60;background:#fff;border:1px solid var(--ligne);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:2px;width:280px}
  .menu-langues button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
  .menu-langues button:hover{background:var(--bg)}
  .menu-langues small{color:var(--doux);font-weight:400;margin-left:4px}
  #etat{font-size:.85rem;color:var(--doux)}
  #etat.modif{color:var(--accent);font-weight:700}
  .corps{flex:1;display:flex;min-height:0}
  .col-gauche{width:470px;max-width:100%;overflow-y:auto;padding:14px;border-right:1px solid var(--ligne)}
  .col-droite{flex:1;display:flex;flex-direction:column;min-width:0;background:#e9e6df}
  .apercu-barre{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:.85rem;color:var(--doux)}
  .apercu-cadre{flex:1;display:flex;justify-content:center;padding:0 12px 12px;min-height:0}
  #apercu{width:100%;height:100%;border:0;border-radius:12px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);transition:width .2s}
  .apercu-cadre.mobile #apercu{width:390px}
  .onglets-mobile{display:none}
  @media (max-width:999px){
    .col-droite{display:none}
    .col-gauche{width:100%;border-right:0}
    .onglets-mobile{display:inline-flex}
    body.vue-apercu .col-gauche{display:none}
    body.vue-apercu .col-droite{display:flex}
  }
  .carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:14px;padding:14px;margin:0 0 14px}
  .carte h2{font-size:1rem;margin:0 0 10px}
  .liste-pages{display:flex;flex-direction:column;gap:6px}
  .lp{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ligne);border-radius:10px;background:var(--bg);cursor:pointer}
  .lp.actif{border-color:var(--accent);background:#fff4ef}
  .lp .ico{width:22px;text-align:center}
  .lp .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .lp .chemin{color:var(--doux);font-size:.8rem}
  .lp .btn-mini{padding:3px 7px}
  .menu-ajout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .menu-ajout button{text-align:left;padding:10px;border:1px solid var(--ligne);border-radius:10px;background:var(--panneau);cursor:pointer}
  .menu-ajout b{display:block}
  .menu-ajout small{color:var(--doux)}
  .nav-cartes{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
  .bloc{border:1px solid var(--ligne);border-radius:12px;padding:12px;margin:0 0 12px;background:var(--bg)}
  .bloc.masque{opacity:.6}
  .bloc-tete{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .bloc-tete b{flex:1}
  .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .actions .esp{flex:1}
  .item{border:1px dashed var(--ligne);border-radius:10px;padding:8px;margin:0 0 8px;background:var(--panneau)}
  .item .actions{margin-top:4px}
  .lien-choix{display:flex;gap:6px}
  .lien-choix select{flex:0 0 46%}
  .vign{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .vign .ph{border:1px solid var(--ligne);border-radius:10px;overflow:hidden;background:var(--panneau);font-size:.8rem}
  .vign img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .vign .ph>div{padding:6px;display:flex;flex-direction:column;gap:4px}
  .vign input,.vign select{padding:5px 6px;font-size:.8rem}
  .img-champ{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
  .img-champ img{width:96px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--ligne);background:#fff}
  .outil-lien{position:relative;margin:-6px 0 12px}
  .menu-lien{margin-top:6px;padding:10px;border:1px solid var(--ligne);border-radius:10px;background:var(--panneau);display:flex;flex-direction:column;gap:6px}
  .menu-lien .pages{display:flex;flex-wrap:wrap;gap:6px}
  .trad-ligne{margin:0 0 12px}
  .trad-ligne .fr{font-size:.8rem;color:var(--doux);margin:0 0 4px;white-space:pre-wrap}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--bg);border:1px solid var(--ligne)}
  .badge.ok{color:var(--ok)} .badge.ko{color:var(--accent)}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--prim);color:var(--prim-txt);padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="connexion">
  <h1>Constructeur du site</h1>
  <p class="aide" style="margin:0 0 14px">qrbc.app — même mot de passe que /gestion.</p>
  <form id="f-cnx">
    <label class="champ"><span>Mot de passe de gestion</span><input type="password" id="jeton" autocomplete="current-password" required></label>
    <button class="btn btn-prim" style="width:100%">Entrer</button>
    <div class="msg" id="msg-cnx"></div>
  </form>
</div>

<div id="editeur" hidden>
  <div class="barre">
    <div class="marque">qrbc<span>.</span> constructeur</div>
    <div class="langues" id="langues" title="Langue modifiée">
      <button type="button" data-l="fr" class="actif">FR</button>
    </div>
    <div class="langues onglets-mobile" id="onglets"><button type="button" data-v="modif" class="actif">Modifier</button><button type="button" data-v="apercu">Aperçu</button></div>
    <span class="esp"></span>
    <span id="etat">Brouillon enregistré</span>
    <button type="button" class="btn" id="btn-enr">Enregistrer</button>
    <button type="button" class="btn btn-accent" id="btn-pub">Publier</button>
    <a class="btn" href="/" target="_blank" rel="noopener" id="lien-site">↗ Site</a>
    <a class="btn" href="/gestion">Gestion</a>
  </div>
  <div class="corps">
    <div class="col-gauche" id="gauche"></div>
    <div class="col-droite">
      <div class="apercu-barre">
        <b>Aperçu</b><span id="apercu-page"></span><span class="esp" style="flex:1"></span>
        <button type="button" class="btn btn-mini" id="taille-apercu">📱 Téléphone</button>
      </div>
      <div class="apercu-cadre" id="cadre"><iframe id="apercu" title="Aperçu"></iframe></div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function el(tag, attrs, enfants) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (k === 'value') e.value = v;
      else if (k === 'checked') e.checked = !!v;
      else e.setAttribute(k, v === true ? '' : v);
    });
    (enfants || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  var jeton = '';
  try { jeton = sessionStorage.getItem('qrbc-gestion') || ''; } catch (e) {}
  var cfg = null, actif = false, dejaPublie = false, reserves = [], languesDispo = {}, reseauxPied = {};
  var pageSel = null, langue = 'fr', modifie = false, articleApercu = '';
  var carteSel = {};                       // section / article affiché par page (carrousel)

  function toast(t) { var z = $('#toast'); z.textContent = t; z.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { z.hidden = true; }, 2600); }
  async function api(action, corps, methode) {
    var r = await fetch('/api/gestion/' + action, { method: methode || (corps ? 'POST' : 'GET'), headers: Object.assign({ authorization: 'Bearer ' + jeton }, corps ? { 'content-type': 'application/json' } : {}), body: corps ? JSON.stringify(corps) : undefined });
    var j = null; try { j = await r.json(); } catch (e) {}
    if (r.status === 401) { deconnecter(); throw new Error('Mot de passe refusé.'); }
    if (!r.ok) throw new Error((j && j.erreur) || ('Erreur ' + r.status));
    return j;
  }
  function deconnecter() { try { sessionStorage.removeItem('qrbc-gestion'); } catch (e) {} $('#editeur').hidden = true; $('#connexion').hidden = false; }

  /* ---------- Textes à traduire (même calcul que worker/site.js) ---------- */
  var CLES_TEXTE = { titre: 1, texte: 1, note: 1, legende: 1, alt: 1, intro: 1, description: 1, nomMenu: 1 };
  var CLES_IGNOREES = { id: 1, type: 1, genre: 1, chemin: 1, src: 1, mini: 1, image: 1, lien: 1, slug: 1, date: 1, source: 1, position: 1, masque: 1, menu: 1, avecInscription: 1, actif: 1, fichiers: 1, l: 1, h: 1 };
  function textesPage(page) {
    var out = {};
    (function parcourir(o, ch) {
      if (Array.isArray(o)) { o.forEach(function (x, i) { parcourir(x, ch + i + '.'); }); return; }
      if (!o || typeof o !== 'object') return;
      Object.keys(o).forEach(function (k) {
        var v = o[k];
        if (CLES_IGNOREES[k]) return;
        if (typeof v === 'string') { if (CLES_TEXTE[k] && v.trim()) out[ch + k] = v; }
        else parcourir(v, ch + k + '.');
      });
    })(page, '');
    return out;
  }
  function empreinte(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  function lireChemin(o, cle) { return cle.split('.').reduce(function (a, k) { return a == null ? a : a[/^\d+$/.test(k) ? Number(k) : k]; }, o); }
  function ecrireChemin(o, cle, v) { var p = cle.split('.'); for (var i = 0; i < p.length - 1; i++) { var k = /^\d+$/.test(p[i]) ? Number(p[i]) : p[i]; if (o[k] == null) o[k] = /^\d+$/.test(p[i + 1]) ? [] : {}; o = o[k]; } o[p[p.length - 1]] = v; }

  /* ---------- Connexion ---------- */
  $('#f-cnx').addEventListener('submit', async function (e) {
    e.preventDefault();
    jeton = $('#jeton').value.trim();
    try { await charger(); try { sessionStorage.setItem('qrbc-gestion', jeton); } catch (x) {} }
    catch (er) { $('#msg-cnx').className = 'msg err'; $('#msg-cnx').textContent = er.message; }
  });
  async function charger() {
    var j = await api('site');
    cfg = j.cfg; actif = j.actif; dejaPublie = j.publie; reserves = j.reserves || []; languesDispo = j.languesDispo || {}; reseauxPied = j.reseauxPied || {};
    $('#connexion').hidden = true; $('#editeur').hidden = false;
    pageSel = cfg.pages[0].id;
    majBoutons(); dessiner(); apercu();
  }
  if (jeton) charger().catch(function () { $('#connexion').hidden = false; });

  function changement(sansRedessiner) {
    modifie = true; majBoutons();
    if (!sansRedessiner) dessiner();
    clearTimeout(changement.t); changement.t = setTimeout(apercu, 700);
  }
  function majBoutons() {
    var e = $('#etat');
    e.className = modifie ? 'modif' : '';
    e.textContent = modifie ? 'Modifications non enregistrées' : (actif ? 'En ligne' : 'Brouillon (pas encore en ligne)');
    $('#btn-pub').textContent = actif ? 'Publier' : 'Mettre en ligne';
  }
  window.addEventListener('beforeunload', function (e) { if (modifie) { e.preventDefault(); e.returnValue = ''; } });
  async function enregistrer() {
    var j = await api('site', { cfg: cfg });
    cfg = j.cfg; modifie = false; majBoutons(); dessiner();
  }
  $('#btn-enr').addEventListener('click', async function () {
    var b = this; b.disabled = true;
    try { await enregistrer(); toast('Brouillon enregistré'); } catch (e) { alert(e.message); }
    b.disabled = false;
  });
  $('#btn-pub').addEventListener('click', async function () {
    if (!actif && !confirm('Le site construit va remplacer l’accueil actuel de qrbc.app (les adresses /cgv, /generateur-qr-code, /app… ne changent pas). Mettre en ligne ?')) return;
    var b = this; b.disabled = true;
    try { var j = await api('site-publier', { cfg: cfg }); cfg = j.cfg; actif = true; modifie = false; majBoutons(); dessiner(); toast('Site publié sur qrbc.app'); }
    catch (e) { alert(e.message); }
    b.disabled = false;
  });

  /* ---------- Langue modifiée / onglets mobile / taille de l'aperçu ---------- */
  // langues du site : FR (base) + langues ajoutées ; « + » pour en ajouter une, « Retirer » dans la carte de traduction
  function langs() { return ['fr'].concat(cfg.langues || ['en', 'ru']); }
  function nomLangue(l) { return l === 'fr' ? 'Français' : (languesDispo[l] || l.toUpperCase()); }
  function dessinerLangues() {
    var z = $('#langues'); z.innerHTML = '';
    if (langs().indexOf(langue) < 0) langue = 'fr';
    langs().forEach(function (l) { z.append(el('button', { type: 'button', 'data-l': l, class: l === langue ? 'actif' : '', title: nomLangue(l), text: l.toUpperCase() })); });
    if (Object.keys(languesDispo).some(function (l) { return langs().indexOf(l) < 0; }))
      z.append(el('button', { type: 'button', class: 'plus', 'data-plus': '1', title: 'Ajouter une langue', text: '+' }));
  }
  function fermerMenuLangues() { var m = $('.menu-langues'); if (m) m.remove(); }
  function ouvrirMenuLangues(b) {
    if ($('.menu-langues')) { fermerMenuLangues(); return; }
    var r = b.getBoundingClientRect();
    var m = el('div', { class: 'menu-langues' }, Object.keys(languesDispo).filter(function (l) { return langs().indexOf(l) < 0; }).map(function (l) {
      return el('button', { type: 'button', onclick: function () { fermerMenuLangues(); ajouterLangue(l); } }, [l.toUpperCase(), el('small', { text: languesDispo[l] })]);
    }));
    m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 290)) + 'px';
    document.body.append(m);
  }
  document.addEventListener('click', function (e) { if (!e.target.closest('.menu-langues') && !e.target.closest('[data-plus]')) fermerMenuLangues(); });
  async function ajouterLangue(l) {
    cfg.langues = langs().slice(1).concat([l]);
    cfg.traductions = cfg.traductions || {}; cfg.traductions[l] = cfg.traductions[l] || {};
    langue = l; changement(); apercu();
    if (l === 'en' || l === 'ru') return;
    toast('Préparation de la langue ' + nomLangue(l) + '…');
    try { await api('site-langue', { lang: l }); toast(nomLangue(l) + ' ajouté : traduisez maintenant chaque page'); apercu(); }
    catch (e) { alert('Les textes fixes (menu, formulaire, pied de page) n’ont pas pu être traduits : ' + e.message + '\nIls s’afficheront en anglais. Vous pouvez retirer puis rajouter la langue pour réessayer.'); }
  }
  function retirerLangue(l) {
    if (!confirm('Retirer la langue ' + nomLangue(l) + ' du site ? Ses traductions et retouches seront effacées à l’enregistrement.')) return;
    cfg.langues = langs().slice(1).filter(function (x) { return x !== l; });
    if (cfg.traductions) delete cfg.traductions[l];
    langue = 'fr'; changement(); apercu(); toast(nomLangue(l) + ' retiré (enregistrez ou publiez pour confirmer)');
  }
  $('#langues').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.plus) { ouvrirMenuLangues(b); return; }
    langue = b.dataset.l;
    dessiner(); apercu();
  });
  $('#onglets').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    [].forEach.call(this.children, function (x) { x.classList.toggle('actif', x === b); });
    document.body.classList.toggle('vue-apercu', b.dataset.v === 'apercu');
    if (b.dataset.v === 'apercu') apercu();
  });
  $('#taille-apercu').addEventListener('click', function () {
    var c = $('#cadre'); c.classList.toggle('mobile');
    this.textContent = c.classList.contains('mobile') ? '🖥 Ordinateur' : '📱 Téléphone';
  });

  /* ---------- Aperçu ---------- */
  var numApercu = 0;
  async function apercu() {
    if (!cfg) return;
    var n = ++numApercu;
    var p = page();
    $('#apercu-page').textContent = ' · ' + (p.chemin ? '/' + p.chemin : '/') + (articleApercu ? '/' + articleApercu : '') + (langue !== 'fr' ? ' (' + langue.toUpperCase() + ')' : '');
    try {
      var j = await api('site-apercu', { cfg: cfg, page: p.id, lang: langue, article: articleApercu });
      if (n === numApercu) $('#apercu').srcdoc = j.html;
    } catch (e) { if (n === numApercu) $('#apercu').srcdoc = '<p style="font:15px system-ui;padding:20px;color:#cf222e">' + e.message + '</p>'; }
  }
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || !d.qrbcApercu) return;
    if (d.externe) { window.open(d.externe, '_blank', 'noopener'); return; }
    if (d.page) { pageSel = d.page; articleApercu = d.article || ''; dessiner(); apercu(); }
  });

  /* ---------- Outils ---------- */
  function page() { return cfg.pages.find(function (p) { return p.id === pageSel; }) || cfg.pages[0]; }
  function idNeuf() { return Math.random().toString(36).slice(2, 8); }
  var ICONES = { articles: '📝', galerie: '📷', blog: '📰', contact: '✉️', pied: '🦶' };
  var vuePied = false;                     // pied de page affiché à la place des réglages de la page
  var NOMS_TYPES = { articles: 'Articles', galerie: 'Galerie', blog: 'Blog', contact: 'Contact' };
  function champ(lib, obj, cle, opts) {
    opts = opts || {};
    var inp = opts.multi ? el('textarea', { rows: opts.rows || 4, placeholder: opts.ph || '' }) : el('input', { type: 'text', placeholder: opts.ph || '' });
    inp.value = obj[cle] || '';
    inp.addEventListener('input', function () { obj[cle] = inp.value; changement(true); });
    var l = el('label', { class: 'champ' }, [el('span', { text: lib }), inp]);
    if (!opts.liens) return l;
    return el('div', {}, [l, outilLien(inp)]);
  }

      f.push(champ('Titre', s, 'titre'), champ('Texte', s, 'texte', { multi: true, rows: 6, liens: true }), champImage('Image (facultative)', s, 'image'));
      if (s.image) {
        var pos = el('select', {}, [['droite', 'À droite du texte'], ['gauche', 'À gauche du texte'], ['dessus', 'Au-dessus du texte']].map(function (o) { return el('option', { value: o[0], text: o[1] }); }));
        pos.value = s.position || 'droite'; pos.addEventListener('change', function () { s.position = pos.value; changement(true); });
        f.push(el('label', { class: 'champ' }, [el('span', { text: 'Position de l’image (sur ordinateur)' }), pos]), champ('Description de l’image (Google, malvoyants)', s, 'alt'));
      }
      f.push(editeurBouton(s));
    } else if (G === 'cartes') {
      f.push(champ('Titre', s, 'titre'), champ('Introduction', s, 'texte', { multi: true, rows: 2, liens: true }), editeurItems(s, 'Titre de la carte', 'Texte', true), editeurBouton(s));
    } else if (G === 'etiquettes') {
      f.push(champ('Titre', s, 'titre'), champ('Introduction', s, 'texte', { multi: true, rows: 2, liens: true }), editeurItems(s, 'Étiquette', '', false));
    } else if (G === 'faq') {
      f.push(champ('Titre', s, 'titre'), editeurItems(s, 'Question', 'Réponse', true));
    } else if (G === 'inscription') {
      f.push(champ('Titre (facultatif)', s, 'titre'), champ('Texte (facultatif)', s, 'texte', { multi: true, rows: 2, liens: true }),
        el('p', { class: 'aide', text: 'Le formulaire d’essai gratuit (activité + e-mail). Un seul par page.' }));
    } else if (G === 'bouton') {
      f.push(editeurBouton(s, 'Bouton'));
    } else if (G === 'code') {
      s.code = s.code || { fr: '', en: '', ru: '' };
      var lc = carteSel['code-' + s.id] || 'fr';
      var zone = el('textarea', { class: 'code', rows: 22, spellcheck: 'false', placeholder: lc === 'fr' ? '<section>\n  <h2>Mon outil</h2>\n  …\n</section>\n<script>…<\/script>' : 'Vide = le code français est utilisé' });
      zone.value = s.code[lc] || '';
      zone.addEventListener('input', function () { s.code[lc] = zone.value; changement(true); });
      zone.addEventListener('keydown', function (e) {               // Tab = indentation
        if (e.key !== 'Tab') return; e.preventDefault();
        var a = zone.selectionStart; zone.setRangeText('  ', a, zone.selectionEnd, 'end'); zone.dispatchEvent(new Event('input'));
      });
      f.push(el('div', { class: 'langues-code' }, langs().map(function (l) {
        return el('button', { type: 'button', class: 'btn btn-mini' + (l === lc ? ' actif' : ''), text: l.toUpperCase() + (l !== 'fr' && !(s.code[l] || '').trim() ? ' (= FR)' : ''), onclick: function () { carteSel['code-' + s.id] = l; dessiner(); } });
      })), zone,
        el('p', { class: 'aide', text: 'HTML, <style> et <script> collés tels quels, entre l’en-tête et le pied de page du site. Une seule section « Code » = une page entièrement libre. EN / RU vides : le code français est affiché (il peut lire document.documentElement.lang). Ce code n’est pas traduit par l’IA. Scripts utiles déjà en ligne : /qrcode.js.' }));
    } else if (G === 'image') {
      f.push(champImage('Image', s, 'image'), champ('Description de l’image (Google, malvoyants)', s, 'alt'), champ('Légende (facultative)', s, 'texte', { liens: true }));
    }
    return el('div', { class: 'bloc' + (s.masque ? ' masque' : '') }, [
      el('div', { class: 'bloc-tete' }, [el('b', { text: 'Section ' + (i + 1) }), genre])
    ].concat(f, [actionsCarte(p, p.sections, i, 'cette section')]));
  }

  /* --- Galerie --- */
  function editeurGalerie(p) {
    var c = el('div', { class: 'carte' }, [el('h2', { text: '📷 Photos (' + p.photos.length + ')' }), champ('Introduction (facultative)', p, 'intro', { multi: true, rows: 2, liens: true })]);
    var f = el('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });
    var etat = el('p', { class: 'aide', style: 'margin:6px 0' });
    f.addEventListener('change', async function () {
      var l = [].slice.call(f.files); f.value = '';
      for (var i = 0; i < l.length; i++) {
        etat.textContent = 'Envoi ' + (i + 1) + ' / ' + l.length + '…';
        try { var r = await envoyerImage(l[i], 1600, 480); p.photos.push({ src: r.src, mini: r.mini, l: r.l, h: r.h, legende: '', lien: '' }); }
        catch (e) { etat.textContent = e.message; }
      }
      changement();
    });
    c.append(el('button', { type: 'button', class: 'btn', text: '＋ Ajouter des photos', onclick: function () { f.click(); } }), f, etat);
    var g = el('div', { class: 'vign' });
    p.photos.forEach(function (ph, i) {
      g.append(el('div', { class: 'ph' }, [el('img', { src: ph.mini || ph.src, alt: '' }), el('div', {}, [
        (function () { var x = el('input', { type: 'text', placeholder: 'Légende', value: ph.legende || '' }); x.addEventListener('input', function () { ph.legende = x.value; changement(true); }); return x; })(),
        el('span', { class: 'etiq', style: 'margin:2px 0 0', text: 'Lien au clic' }), choixLien(ph, 'lien'),
        el('div', { class: 'actions' }, [
          el('button', { type: 'button', class: 'btn btn-mini', text: '←', disabled: i === 0, onclick: function () { p.photos.splice(i - 1, 0, p.photos.splice(i, 1)[0]); changement(); } }),
          el('button', { type: 'button', class: 'btn btn-mini', text: '→', disabled: i === p.photos.length - 1, onclick: function () { p.photos.splice(i + 1, 0, p.photos.splice(i, 1)[0]); changement(); } }),
          el('span', { class: 'esp' }),
          el('button', { type: 'button', class: 'btn btn-mini btn-danger', text: '✕', onclick: function () { p.photos.splice(i, 1); changement(); } })])
      ])]));
    });
    c.append(g, el('p', { class: 'aide', style: 'margin:10px 0 0', text: 'Sans lien, la photo s’ouvre en grand (glisser pour la suivante). Avec un lien, elle mène à la page ou à l’adresse choisie.' }));
    return c;
  }

  /* --- Blog --- */
  function editeurBlog(p) {
    var c = el('div', { class: 'carte' }, [el('h2', { text: '📰 Articles (' + p.articles.length + ')' }), champ('Introduction (facultative)', p, 'intro', { multi: true, rows: 2, liens: true }),
      el('button', { type: 'button', class: 'btn', text: '＋ Nouvel article', onclick: function () {
        p.articles.unshift({ id: idNeuf(), slug: '', titre: 'Nouvel article', date: new Date().toISOString().slice(0, 10), image: '', mini: '', texte: '', description: '' });
        carteSel[p.id] = 0; changement();
      } })]);
    c.append(carrousel(p, p.articles, function (a, i) {
      var date = el('input', { type: 'date', value: a.date });
      date.addEventListener('change', function () { a.date = date.value; changement(true); });
      return el('div', { class: 'bloc' + (a.masque ? ' masque' : '') }, [
        champ('Titre', a, 'titre'),
        el('label', { class: 'champ' }, [el('span', { text: 'Date' }), date]),
        champ('Adresse (vide = d’après le titre)', a, 'slug', { ph: 'ex. qr-code-avis-google' }),
        el('p', { class: 'aide', text: 'qrbc.app/' + p.chemin + '/' + (a.slug || '…') + ' — l’adresse se met à jour à l’enregistrement.' }),
        champ('Description pour Google', a, 'description', { multi: true, rows: 2 }),
        champImage('Photo', a, 'image', { mini: 'mini', maxMini: 640 }),
        champ('Texte', a, 'texte', { multi: true, rows: 12, liens: true }),
        el('button', { type: 'button', class: 'btn btn-mini', text: '👁 Voir dans l’aperçu', onclick: function () { articleApercu = a.slug; apercu(); } }),
        actionsCarte(p, p.articles, i, 'cet article')]);
    }, 'Article'));
    return c;
  }

  /* --- Contact --- */
  function editeurContact(p) {
    return el('div', { class: 'carte' }, [el('h2', { text: '✉️ Page contact' }),
      champ('Adresse du site client à afficher', p, 'source', { ph: 'qrbc01' }),
      el('p', { class: 'aide', text: 'Nom d’un de vos sites qrbc (ex. qrbc01 pour qrbc01.qrbc.app) : sa page contact s’affiche ici telle quelle. Modifiez-la dans son éditeur habituel.' }),
      champ('Texte au-dessus (facultatif)', p, 'intro', { multi: true, rows: 2, liens: true })]);
  }

  /* ---------- Pied de page (commun à toutes les pages) ---------- */
  function cartePied() {
    var d = cfg.pied;
    d.reseaux = d.reseaux || []; d.liens = d.liens || [];
    var c = el('div', { class: 'carte' }, [el('h2', { text: '🦶 Pied de page' }),
      el('p', { class: 'aide', style: 'margin:0 0 12px', text: 'Le même sur toutes les pages du site. La dernière ligne (CGV, mentions légales, support@qrbc.app) est obligatoire : elle reste toujours affichée.' }),
      champ('Ligne en gras', d, 'note', { multi: true, rows: 2, liens: true }),
      champ('Ligne de présentation', d, 'texte', { multi: true, rows: 2, liens: true })]);
    // réseaux sociaux
    var zr = el('div');
    d.reseaux.forEach(function (r, i) {
      var type = el('select', {}, Object.keys(reseauxPied).map(function (k) { return el('option', { value: k, text: reseauxPied[k][0] }); }));
      type.value = r.type; type.addEventListener('change', function () { r.type = type.value; changement(true); });
      var url = el('input', { type: 'text', placeholder: 'https://…', value: r.lien || '' });
      url.addEventListener('input', function () { var x = url.value.trim(); if (x && !/^(https?:|mailto:|tel:|\/)/i.test(x)) x = 'https://' + x; r.lien = x; changement(true); });
      var tit = el('input', { type: 'text', placeholder: 'Texte à côté (vide = icône seule)', value: r.titre || '' });
      tit.addEventListener('input', function () { r.titre = tit.value; changement(true); });
      zr.append(el('div', { class: 'item' }, [el('div', { class: 'actions', style: 'margin:0 0 6px' }, [type]), url, el('div', { style: 'height:6px' }), tit,
        el('div', { class: 'actions' }, [
          el('button', { type: 'button', class: 'btn btn-mini', text: '↑', disabled: i === 0, onclick: function () { d.reseaux.splice(i - 1, 0, d.reseaux.splice(i, 1)[0]); changement(); } }),
          el('button', { type: 'button', class: 'btn btn-mini', text: '↓', disabled: i === d.reseaux.length - 1, onclick: function () { d.reseaux.splice(i + 1, 0, d.reseaux.splice(i, 1)[0]); changement(); } }),
          el('span', { class: 'esp' }),
          el('button', { type: 'button', class: 'btn btn-mini btn-danger', text: '✕', onclick: function () { d.reseaux.splice(i, 1); changement(); } })])]));
    });
    zr.append(el('button', { type: 'button', class: 'btn btn-mini', text: '＋ Ajouter un réseau', onclick: function () { d.reseaux.push({ type: 'instagram', lien: '', titre: '' }); changement(); } }));
    c.append(el('span', { class: 'etiq', text: 'Réseaux sociaux' }), zr);
    // liens
    var zl = el('div');
    d.liens.forEach(function (l, i) {
      zl.append(el('div', { class: 'item' }, [champ('Texte du lien', l, 'titre'), el('span', { class: 'etiq', text: 'Il ouvre' }), choixLien(l, 'lien'),
        el('div', { class: 'actions' }, [
          el('button', { type: 'button', class: 'btn btn-mini', text: '↑', disabled: i === 0, onclick: function () { d.liens.splice(i - 1, 0, d.liens.splice(i, 1)[0]); changement(); } }),
          el('button', { type: 'button', class: 'btn btn-mini', text: '↓', disabled: i === d.liens.length - 1, onclick: function () { d.liens.splice(i + 1, 0, d.liens.splice(i, 1)[0]); changement(); } }),
          el('span', { class: 'esp' }),
          el('button', { type: 'button', class: 'btn btn-mini btn-danger', text: '✕', onclick: function () { d.liens.splice(i, 1); changement(); } })])]));
    });
    zl.append(el('button', { type: 'button', class: 'btn btn-mini', text: '＋ Ajouter un lien', onclick: function () { d.liens.push({ titre: '', lien: '' }); changement(); } }));
    c.append(el('span', { class: 'etiq', style: 'margin-top:14px', text: 'Liens (séparés par « · »)' }), zl);
    return c;
  }

  /* ---------- Traductions (EN / RU) ---------- */
  function etatTraduction(p) {
    var t = cfg.traductions[langue] && cfg.traductions[langue][p.id];
    if (!t) return { ok: false, texte: 'à traduire' };
    return empreinte(JSON.stringify(textesPage(p))) === t.source ? { ok: true, texte: 'à jour' } : { ok: false, texte: 'à retraduire' };
  }
  function nomCle(cle) {
    return cle.replace(/^sections\.(\d+)\./, function (x, n) { return 'Section ' + (Number(n) + 1) + ' · '; })
      .replace(/^articles\.(\d+)\./, function (x, n) { return 'Article ' + (Number(n) + 1) + ' · '; })
      .replace(/^photos\.(\d+)\./, function (x, n) { return 'Photo ' + (Number(n) + 1) + ' · '; })
      .replace(/items\.(\d+)\./, function (x, n) { return 'élément ' + (Number(n) + 1) + ' · '; })
      .replace(/^reseaux\.(\d+)\.titre/, function (x, n) { return 'Réseau ' + (Number(n) + 1); })
      .replace(/^liens\.(\d+)\.titre/, function (x, n) { return 'Lien ' + (Number(n) + 1); })
      .replace(/^note$/, 'Ligne en gras').replace(/^texte$/, 'Ligne de présentation')
      .replace(/encart\./, 'encart · ').replace(/bouton\./, 'bouton · ').replace(/seo\./, 'Google · ');
  }
  function carteTraduction(p) {
    cfg.traductions[langue] = cfg.traductions[langue] || {};
    var t = cfg.traductions[langue][p.id], et = etatTraduction(p);
    var estPied = p.type === 'pied';
    var c = el('div', { class: 'carte' }, [el('h2', {}, [ICONES[p.type] + ' ' + (estPied ? 'Pied de page' : p.titre) + ' — ' + langue.toUpperCase() + ' ', el('span', { class: 'badge ' + (et.ok ? 'ok' : 'ko'), text: et.texte })])]);
    var msg = el('div', { class: 'msg' });
    var btn = el('button', { type: 'button', class: 'btn btn-accent', text: t ? '✨ Retraduire depuis le français' : '✨ Traduire depuis le français', onclick: async function () {
      if (t && !confirm('Remplacer la traduction actuelle (et vos retouches) ?')) return;
      btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Traduction en cours…';
      try {
        var j = await api('site-traduire', { page: p, lang: langue });
        // nom dans le menu saisi à la main (vide en français) : gardé
        if (t && t.page && t.page.nomMenu && !j.page.nomMenu) j.page.nomMenu = t.page.nomMenu;
        cfg.traductions[langue][p.id] = { page: j.page, source: j.source, le: j.le };
        changement(); toast('Traduction prête : relisez-la');
      } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; btn.disabled = false; }
    } });
    c.append(el('div', { class: 'actions', style: 'margin:0 0 10px' }, [el('span', { class: 'aide', style: 'margin:0;flex:1', text: nomLangue(langue) }),
      el('button', { type: 'button', class: 'btn btn-mini btn-danger', text: '🗑 Retirer cette langue', onclick: function () { retirerLangue(langue); } })]));
    // titre et nom dans le menu : modifiables à la main, même sans traduction IA (pages en code)
    var fr = textesPage(p);
    var seulNom = Object.keys(fr).every(function (k) { return k === 'titre' || k === 'nomMenu'; });
    function entree() {
      if (!t) { t = cfg.traductions[langue][p.id] = { page: JSON.parse(JSON.stringify(p)), source: '', le: new Date().toISOString() }; }
      return t;
    }
    (estPied ? [] : [['titre', 'Titre de la page', p.titre], ['nomMenu', 'Nom dans le menu', p.nomMenu || p.titre]]).forEach(function (x) {
      var inp = el('input', { type: 'text', placeholder: x[2] });
      inp.value = t && t.page && typeof t.page[x[0]] === 'string' && (x[0] !== 'titre' || t.source) ? t.page[x[0]] : '';
      inp.addEventListener('input', function () {
        var e = entree(); e.page[x[0]] = inp.value || (x[0] === 'titre' ? p.titre : '');
        if (seulNom) e.source = empreinte(JSON.stringify(fr));    // page sans autre texte (code) : traduction à jour
        changement(true);
      });
      c.append(el('div', { class: 'trad-ligne trad-nom' }, [el('span', { class: 'etiq', text: x[1] + ' (' + langue.toUpperCase() + ')' }), el('p', { class: 'fr', text: 'FR : ' + x[2] }), inp]));
    });
    c.append(el('p', { class: 'aide', style: 'margin:10px 0 10px', text: 'La structure (sections, images, liens) vient de la page française. Ici, vous retouchez seulement les textes. Sans traduction, la page s’affiche en français.' }), btn, msg);
    if (!t) return c;
    Object.keys(fr).forEach(function (cle) {
      if (cle === 'titre' || cle === 'nomMenu') return;          // déjà en haut
      var long = fr[cle].length > 70 || /\n/.test(fr[cle]);
      var inp = long ? el('textarea', { rows: Math.min(10, Math.max(2, Math.ceil(fr[cle].length / 60))) }) : el('input', { type: 'text' });
      var v = lireChemin(t.page, cle);
      inp.value = typeof v === 'string' ? v : '';
      inp.addEventListener('input', function () { ecrireChemin(t.page, cle, inp.value); changement(true); });
      c.append(el('div', { class: 'trad-ligne' }, [el('span', { class: 'etiq', text: nomCle(cle) }), el('p', { class: 'fr', text: 'FR : ' + fr[cle] }), inp]));
    });
    return c;
  }
})();
</script>
